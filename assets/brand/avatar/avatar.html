<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Avatar</title>
<style>html,body{margin:0;background:#4C6555;overflow:hidden}svg{display:block}</style>
</head>
<body>
<div id="root"></div>
<script>
// Hand-drawn editorial avatar. ?size=1080&glasses=1
// Drawn in a 1000×1000 space; head and shoulders sit inside the central circle that platforms crop to.
const q = new URLSearchParams(location.search);
const S = +(q.get('size') || 1080);
const GLASSES = q.get('glasses') === '1';
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = mulberry32(1108);
const rr = (a, b) => a + (b - a) * R();

const C = {
  bg: '#4C6555', bgGlow: '#6F8B79', graphite: '#2E2A26',
  skin: '#EFCBAA', skinShade: '#DCAA86', skinDeep: '#C9926E', skinLight: '#F7DCC3', ear: '#E9B394',
  hair: '#231E1B', hairMid: '#3A312C', hairHi: '#5A4A40',
  navy: '#2E3A52', navyShade: '#232C40', navyLight: '#3C4A66', shirt: '#DCE6EF', shirtShade: '#B9C8D6',
  lip: '#C98A78', lipLower: '#D49D8A', iris: '#3A2A22', eyeWhite: '#F6F1E8',
};

// pencil line along a polyline (sampled from a path), with seeded jitter, two passes
function pencilPath(d, { w = 3, op = 0.85, amp = 0.9, step = 6, passes = 2, color = C.graphite } = {}) {
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  p.setAttribute('d', d);
  const L = p.getTotalLength();
  let out = '';
  for (let k = 0; k < passes; k++) {
    let dd = '';
    for (let s = 0; s <= L; s += step) {
      const pt = p.getPointAtLength(s);
      dd += `${s === 0 ? 'M' : 'L'}${(pt.x + rr(-amp, amp)).toFixed(1)},${(pt.y + rr(-amp, amp)).toFixed(1)} `;
    }
    out += `<path d="${dd}" fill="none" stroke="${color}" stroke-width="${(w * (k ? 0.6 : 1)).toFixed(2)}" stroke-linecap="round" stroke-linejoin="round" opacity="${(k ? op * 0.5 : op).toFixed(2)}"/>`;
  }
  return out;
}

// ---------- shapes ----------
// face contour as segments, so the fill and the pencil outline always match
const FACE_TOP_R = 'C565,333 614,352 621,402';
const FACE_SIDES = 'C628,452 628,512 619,562 C609,612 580,650 550,668 C530,681 470,681 450,668 C420,650 391,612 381,562 C372,512 372,452 379,402';
const FACE_TOP_L = 'C386,352 435,333 500,335';
const FACE = `M500,335 ${FACE_TOP_R} ${FACE_SIDES} ${FACE_TOP_L} Z`;
const FACE_OUTLINE = `M621,402 ${FACE_SIDES}`;
const EAR_R = 'M616,452 C644,430 668,452 664,492 C661,530 643,556 617,552 Z';
const EAR_L = 'M384,452 C356,430 332,452 336,492 C339,530 357,556 383,552 Z';
const NECK = 'M442,628 C444,680 440,730 434,772 L566,772 C560,730 556,680 558,628 Z';
const SWEATER = 'M110,1000 C128,885 222,826 356,794 C398,784 428,774 448,764 Q500,792 552,764 C572,774 602,784 644,794 C778,826 872,885 890,1000 Z';
const HAIR = 'M376,432 C366,345 398,258 500,242 C602,258 634,345 624,432 C618,402 608,380 592,364 C568,350 534,344 500,344 C466,344 432,350 408,364 C392,380 382,402 376,432 Z';

let s = '';
s += `<defs>
  <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
    <stop offset="0" stop-color="${C.bgGlow}" stop-opacity="0.9"/><stop offset="1" stop-color="${C.bg}" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="faceG" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="${C.skinLight}"/><stop offset="0.45" stop-color="${C.skin}"/><stop offset="1" stop-color="${C.skinShade}"/>
  </linearGradient>
  <linearGradient id="neckG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="${C.skinDeep}"/><stop offset="0.5" stop-color="${C.skinShade}"/><stop offset="1" stop-color="${C.skin}"/>
  </linearGradient>
  <linearGradient id="sweaterG" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="${C.navyLight}"/><stop offset="0.5" stop-color="${C.navy}"/><stop offset="1" stop-color="${C.navyShade}"/>
  </linearGradient>
  <linearGradient id="hairG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="${C.hairMid}"/><stop offset="1" stop-color="${C.hair}"/>
  </linearGradient>
  <linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="${C.hair}" stop-opacity="0.85"/><stop offset="1" stop-color="${C.hair}" stop-opacity="0.2"/>
  </linearGradient>
  <linearGradient id="fadeR" x1="1" y1="0" x2="0" y2="0">
    <stop offset="0" stop-color="${C.hair}" stop-opacity="0.85"/><stop offset="1" stop-color="${C.hair}" stop-opacity="0.2"/>
  </linearGradient>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
  <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="5"/><feColorMatrix type="saturate" values="0"/>
  </filter>
  <clipPath id="faceClip"><path d="${FACE}"/></clipPath>
</defs>`;

// background
s += `<rect width="1000" height="1000" fill="${C.bg}"/>`;
s += `<rect width="1000" height="1000" fill="url(#glow)"/>`;
// everything below is drawn slightly larger so head and shoulders fill the round crop
s += `<g transform="translate(500 600) scale(1.07) translate(-500 -600)">`;

// shoulders: sweater
s += `<path d="${SWEATER}" fill="url(#sweaterG)"/>`;
for (let i = 0; i < 26; i++) { // knit texture
  const y = rr(820, 995), x = rr(150, 850);
  s += `<path d="M${x.toFixed(0)},${y.toFixed(0)} q6,-7 12,0 q6,7 12,0" fill="none" stroke="#FFFFFF" stroke-width="1.6" opacity="${rr(0.05, 0.11).toFixed(2)}"/>`;
}
s += pencilPath(SWEATER.replace(' Z', ''), { w: 3.2, op: 0.75 });

// neck
s += `<path d="${NECK}" fill="url(#neckG)"/>`;
s += pencilPath('M442,640 C444,680 440,730 434,772', { w: 2.4, op: 0.6 }) + pencilPath('M558,640 C556,680 560,730 566,772', { w: 2.4, op: 0.6 });
// pencil hatching in the shadow under the jaw
for (let x = 446; x < 556; x += 7) s += pencilPath(`M${x},${702 + (x % 3)} L${x + 14},${682}`, { w: 1.3, op: 0.22, amp: 0.5, step: 4, passes: 1 });

// shirt collar band, sweater ribbing, collar points
s += `<path d="M444,736 Q500,764 556,736 L561,772 Q500,804 439,772 Z" fill="${C.shirt}"/>`;
s += `<path d="M444,736 Q500,764 556,736" fill="none" stroke="${C.shirtShade}" stroke-width="3"/>`;
s += `<path d="M420,774 Q500,846 580,774" fill="none" stroke="${C.navyShade}" stroke-width="26" stroke-linecap="round"/>`;
for (let x = 432; x <= 568; x += 9) { const t = (x - 420) / 160, y = 774 + 72 * 4 * t * (1 - t) * 0.5; s += `<line x1="${x}" y1="${(y - 10).toFixed(0)}" x2="${x}" y2="${(y + 10).toFixed(0)}" stroke="#FFFFFF" stroke-width="1.4" opacity="0.08"/>`; }
s += `<path d="M440,770 L497,804 L470,830 Z" fill="${C.shirt}"/><path d="M560,770 L503,804 L530,830 Z" fill="${C.shirt}"/>`;
s += `<path d="M497,804 L470,830" stroke="${C.shirtShade}" stroke-width="3"/><path d="M503,804 L530,830" stroke="${C.shirtShade}" stroke-width="3"/>`;
s += pencilPath('M440,770 L497,804 L470,830 Z', { w: 2, op: 0.55, step: 5 }) + pencilPath('M560,770 L503,804 L530,830 Z', { w: 2, op: 0.55, step: 5 });

// ears (behind the face edge)
[EAR_L, EAR_R].forEach(e => { s += `<path d="${e}" fill="${C.ear}"/>`; });
s += `<path d="M367,467 C353,475 353,505 365,525" fill="none" stroke="${C.skinDeep}" stroke-width="4" stroke-linecap="round" opacity="0.7"/>`;
s += `<path d="M633,467 C647,475 647,505 635,525" fill="none" stroke="${C.skinDeep}" stroke-width="4" stroke-linecap="round" opacity="0.7"/>`;
s += pencilPath('M384,452 C356,430 332,452 336,492 C339,530 357,556 383,552', { w: 2.6, op: 0.75 });
s += pencilPath('M616,452 C644,430 668,452 664,492 C661,530 643,556 617,552', { w: 2.6, op: 0.75 });

// face
s += `<path d="${FACE}" fill="url(#faceG)"/>`;
s += `<g clip-path="url(#faceClip)">
  <ellipse cx="610" cy="520" rx="60" ry="150" fill="${C.skinDeep}" opacity="0.22" filter="url(#soft)"/>
  <ellipse cx="500" cy="690" rx="120" ry="40" fill="${C.skinDeep}" opacity="0.25" filter="url(#soft)"/>
  <ellipse cx="425" cy="545" rx="26" ry="14" fill="#E7A08C" opacity="0.18" filter="url(#soft)"/>
  <ellipse cx="575" cy="545" rx="26" ry="14" fill="#E7A08C" opacity="0.18" filter="url(#soft)"/>
  <ellipse cx="500" cy="385" rx="70" ry="22" fill="${C.skinDeep}" opacity="0.16" filter="url(#soft)"/>
</g>`;
// light stubble on the chin and upper lip
for (let i = 0; i < 90; i++) {
  const a = rr(0, Math.PI), r = rr(0, 1);
  const x = 500 + Math.cos(a) * 62 * r * (R() < 0.5 ? -1 : 1), y = 640 + Math.sin(a) * 38 * r;
  s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${rr(0.7, 1.3).toFixed(2)}" fill="${C.hairMid}" opacity="${rr(0.08, 0.2).toFixed(2)}"/>`;
}
// pencil hatching on the shadow side of the face (light comes from the viewer's left)
let hatch = '';
for (let y = 405; y < 640; y += 8) hatch += pencilPath(`M${600 - (y - 405) * 0.12},${y + 14} L${626},${y - 6}`, { w: 1.3, op: 0.2, amp: 0.5, step: 4, passes: 1 });
s += `<g clip-path="url(#faceClip)">${hatch}</g>`;
// outline follows FACE exactly, minus the top segment hidden under the hair
s += pencilPath(FACE_OUTLINE, { w: 3, op: 0.8 });

// hair: short faded sides, then the spiky top
// short faded sides: a thin, soft band hugging the head above the ears, darker at the top
s += `<g clip-path="url(#faceClip)" filter="url(#soft2)">
  <path d="M376,380 C380,360 392,350 404,348 C400,380 396,420 394,452 L380,452 Z" fill="${C.hair}" opacity="0.32"/>
  <path d="M624,380 C620,360 608,350 596,348 C600,380 604,420 606,452 L620,452 Z" fill="${C.hair}" opacity="0.32"/></g>`;
for (let i = 0; i < 60; i++) {
  const side = R() < 0.5 ? -1 : 1, y = rr(360, 448), x = 500 + side * (rr(106, 116) - (y - 360) * 0.02);
  s += `<line x1="${x.toFixed(1)}" y1="${y.toFixed(1)}" x2="${(x + side * 1.5).toFixed(1)}" y2="${(y - 4).toFixed(1)}" stroke="${C.hair}" stroke-width="1.5" opacity="${(rr(0.2, 0.45) * (1 - (y - 360) / 140)).toFixed(2)}"/>`;
}
// tufts first, rooted inside the hair mass so no gap shows; soft curved strands pushed up and to the viewer's left
const tuft = (bx, by, dir, len, wid, fill) => {
  const nx = Math.cos(dir), ny = -Math.sin(dir), px = -ny, py = nx;
  const tx = bx + nx * len, ty = by + ny * len, bend = rr(-0.25, 0.1) * len;
  const m1x = bx + nx * len * 0.55 + px * (wid * 0.55) + px * bend, m1y = by + ny * len * 0.55 + py * (wid * 0.55) + py * bend;
  const m2x = bx + nx * len * 0.55 - px * (wid * 0.45) + px * bend, m2y = by + ny * len * 0.55 - py * (wid * 0.45) + py * bend;
  return `<path d="M${(bx + px * wid).toFixed(1)},${(by + py * wid).toFixed(1)} Q${m1x.toFixed(1)},${m1y.toFixed(1)} ${tx.toFixed(1)},${ty.toFixed(1)} Q${m2x.toFixed(1)},${m2y.toFixed(1)} ${(bx - px * wid).toFixed(1)},${(by - py * wid).toFixed(1)} Z" fill="${fill}"/>`;
};
let tufts = '';
for (let i = 0; i < 34; i++) {
  const t = i / 33, ang = Math.PI * (0.96 - 0.92 * t);
  const bx = 500 + 104 * Math.cos(ang), by = 352 - 90 * Math.sin(ang);
  const top = Math.sin(Math.PI * t);
  const dir = ang * 0.55 + Math.PI / 2 * 0.45 + 0.18 + rr(-0.12, 0.12);
  tufts += tuft(bx, by, dir, rr(26, 46) * (0.45 + 0.55 * top), rr(13, 19), R() < 0.35 ? C.hairMid : C.hair);
}
s += tufts;
s += `<path d="${HAIR}" fill="url(#hairG)"/>`;
// inner tufts on top of the mass for volume
for (let i = 0; i < 16; i++) {
  const bx = rr(420, 585), by = rr(300, 345);
  s += tuft(bx, by, Math.PI / 2 + 0.25 + rr(-0.2, 0.2), rr(28, 48), rr(8, 12), R() < 0.5 ? C.hairMid : C.hair);
}
// strand highlights
for (let i = 0; i < 46; i++) {
  const x = rr(412, 590), y = rr(258, 345), l = rr(16, 32), a = rr(-1.95, -1.35);
  s += `<path d="M${x.toFixed(1)},${y.toFixed(1)} q${(l * 0.3 * Math.cos(a)).toFixed(1)},${(l * 0.5 * Math.sin(a)).toFixed(1)} ${(l * Math.cos(a)).toFixed(1)},${(l * Math.sin(a)).toFixed(1)}" fill="none" stroke="${C.hairHi}" stroke-width="${rr(1.2, 2.6).toFixed(1)}" stroke-linecap="round" opacity="${rr(0.3, 0.7).toFixed(2)}"/>`;
}
// slightly uneven front hairline over the forehead
let hl = 'M400,380 L404,360';
for (let x = 410; x <= 590; x += 9) hl += ` L${x},${(350 + Math.abs(x - 500) * 0.1 + rr(-2, 5)).toFixed(1)}`;
hl += ' L596,360 L600,380 L592,344 L408,344 Z';
s += `<path d="${hl}" fill="${C.hair}"/>`;
s += pencilPath('M376,432 C366,345 398,258 500,242 C602,258 634,345 624,432', { w: 1.8, op: 0.25 });

// brows: tapered, slightly arched, with drawn hairs
s += `<path d="M408,460 Q428,441 456,438 Q470,437 482,441 L481,451 Q463,448 446,451 Q428,455 411,466 Z" fill="${C.hair}" opacity="0.92"/>`;
s += `<path d="M592,460 Q572,441 544,438 Q530,437 518,441 L519,451 Q537,448 554,451 Q572,455 589,466 Z" fill="${C.hair}" opacity="0.92"/>`;
for (let i = 0; i < 40; i++) {
  const side = i % 2 ? -1 : 1, d = rr(20, 88), x = 500 + side * d, y = 446 + (d - 20) * 0.12 * (d > 50 ? 1.4 : 0.4) + rr(-4, 4);
  s += `<line x1="${x.toFixed(1)}" y1="${y.toFixed(1)}" x2="${(x + side * 7).toFixed(1)}" y2="${(y - 2.5).toFixed(1)}" stroke="${C.hairMid}" stroke-width="1.5" stroke-linecap="round" opacity="0.65"/>`;
}

// eyes: monolid almond shapes
function eye(cx, flip) {
  const f = v => (cx + flip * v).toFixed(1);
  const up = `M${f(-27)},479 Q${f(-2)},462 ${f(27)},475`;
  const low = `M${f(-25)},481 Q${f(0)},492 ${f(26)},477`;
  const shape = `M${f(-27)},479 Q${f(-2)},462 ${f(27)},475 Q${f(0)},492 ${f(-27)},479 Z`;
  const id = `eye${cx}`;
  return `<clipPath id="${id}"><path d="${shape}"/></clipPath>
    <path d="${shape}" fill="${C.eyeWhite}"/>
    <g clip-path="url(#${id})"><circle cx="${f(2)}" cy="478" r="11.5" fill="${C.iris}"/><circle cx="${f(2)}" cy="478" r="5" fill="#140F0C"/>
      <path d="M${f(-27)},470 Q${f(0)},462 ${f(27)},468 L${f(27)},474 Q${f(0)},468 ${f(-27)},476 Z" fill="${C.skinDeep}" opacity="0.35"/></g>
    <circle cx="${f(5)}" cy="474" r="2.6" fill="#FFFFFF" opacity="0.9"/>
    <path d="M${f(-30)},468 Q${f(0)},456 ${f(30)},466" fill="none" stroke="${C.skinDeep}" stroke-width="2.4" opacity="0.35"/>` +
    pencilPath(up, { w: 4.2, op: 0.95, amp: 0.4, step: 4 }) + pencilPath(low, { w: 1.6, op: 0.45, amp: 0.4, step: 4, passes: 1 });
}
s += eye(452, 1) + eye(548, -1);

// nose
s += `<path d="M488,486 C486,510 482,530 478,548" fill="none" stroke="${C.skinDeep}" stroke-width="5" opacity="0.28" filter="url(#soft2)"/>`;
s += `<ellipse cx="500" cy="556" rx="30" ry="15" fill="${C.skinShade}" opacity="0.5" filter="url(#soft2)"/>`;
s += `<ellipse cx="496" cy="547" rx="11" ry="6" fill="${C.skinLight}" opacity="0.65" filter="url(#soft2)"/>`;
s += pencilPath('M463,560 Q466,546 482,553', { w: 2.6, op: 0.75, amp: 0.4, step: 3 });
s += pencilPath('M537,560 Q534,546 518,553', { w: 2.6, op: 0.75, amp: 0.4, step: 3 });
s += pencilPath('M474,567 Q500,578 526,567', { w: 1.8, op: 0.45, amp: 0.4, step: 3, passes: 1 });
s += `<path d="M475,566 Q482,572 489,566" fill="none" stroke="#7A4E3C" stroke-width="3" opacity="0.55"/><path d="M525,566 Q518,572 511,566" fill="none" stroke="#7A4E3C" stroke-width="3" opacity="0.55"/>`;

// mouth: full lips
s += `<path d="M462,612 Q478,598 493,601 Q500,605 507,601 Q522,598 538,612 Q500,617 462,612 Z" fill="${C.lip}"/>`;
s += `<path d="M465,613 Q500,644 535,613 Q500,619 465,613 Z" fill="${C.lipLower}"/>`;
s += `<ellipse cx="503" cy="625" rx="14" ry="4" fill="#E9BCA9" opacity="0.6"/>`;
s += pencilPath('M462,612 Q500,619 538,612', { w: 2.6, op: 0.8, amp: 0.4, step: 3 });
s += `<path d="M494,586 Q500,594 506,586" fill="none" stroke="${C.skinDeep}" stroke-width="2" opacity="0.3"/>`;
s += pencilPath('M470,640 Q500,650 530,640', { w: 1.6, op: 0.3, amp: 0.4, step: 4, passes: 1 });

// optional glasses: rounded rectangles in translucent grey
if (GLASSES) {
  const lens = (x0) => `M${x0 + 14},446 L${x0 + 72},446 Q${x0 + 86},446 ${x0 + 86},460 L${x0 + 86},494 Q${x0 + 86},508 ${x0 + 72},508 L${x0 + 14},508 Q${x0},508 ${x0},494 L${x0},460 Q${x0},446 ${x0 + 14},446 Z`;
  s += `<path d="${lens(404)}" fill="#FFFFFF" opacity="0.07"/><path d="${lens(510)}" fill="#FFFFFF" opacity="0.07"/>`;
  s += `<path d="M412,500 L440,452" stroke="#FFFFFF" stroke-width="6" opacity="0.10"/><path d="M518,500 L546,452" stroke="#FFFFFF" stroke-width="6" opacity="0.10"/>`;
  [lens(404), lens(510)].forEach(d => { s += `<path d="${d}" fill="none" stroke="#7F8994" stroke-width="7" opacity="0.92"/><path d="${d}" fill="none" stroke="#B9C1C9" stroke-width="2" opacity="0.6"/>`; });
  s += `<path d="M490,466 Q500,458 510,466" fill="none" stroke="#7F8994" stroke-width="6"/>`;
  s += `<path d="M404,462 L388,468" stroke="#7F8994" stroke-width="6" stroke-linecap="round"/><path d="M596,462 L612,468" stroke="#7F8994" stroke-width="6" stroke-linecap="round"/>`;
  s += pencilPath(lens(404), { w: 1.6, op: 0.55, amp: 0.5, step: 5, passes: 1 }) + pencilPath(lens(510), { w: 1.6, op: 0.55, amp: 0.5, step: 5, passes: 1 });
}

s += `</g>`;

// paper grain
s += `<rect width="1000" height="1000" filter="url(#grain)" opacity="0.07" style="mix-blend-mode:multiply"/>`;

document.getElementById('root').innerHTML =
  `<svg xmlns="http://www.w3.org/2000/svg" width="${S}" height="${S}" viewBox="0 0 1000 1000">${s}</svg>`;
window.ready = true;
</script>
</body>
</html>
