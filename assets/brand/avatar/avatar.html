<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Avatar</title>
<style>html,body{margin:0;background:#4C6555;overflow:hidden}svg{display:block}</style>
</head>
<body>
<div id="root"></div>
<script>
// Hand-drawn editorial avatar, v2. ?size=1080&glasses=1
// 1000×1000 drawing space; light comes from the viewer's left. Clean shapes with soft cel shading,
// a light pencil outline and grain so it still reads as drawn by hand.
const q = new URLSearchParams(location.search);
const S = +(q.get('size') || 1080);
const GLASSES = q.get('glasses') === '1';
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = mulberry32(2026);
const rr = (a, b) => a + (b - a) * R();

const C = {
  bg: '#4C6555', bgLight: '#6E8B79',
  line: '#3B2A22',
  skin: '#F0CBAA', skinLight: '#F8DDC5', skinShade: '#D9A27E', skinDeep: '#C08262', ear: '#EAB898',
  hair: '#1E1A18', hairMid: '#2E2926', hairHi: '#5B524C', hairRim: '#7C7068',
  navy: '#2C3850', navyShade: '#1F283B', navyLight: '#3B4A68',
  shirt: '#DDE7F0', shirtShade: '#B6C6D6',
  iris: '#2B1E18', white: '#F7F2EA', lip: '#B97C69', lipLight: '#D9A08E',
};

function pencil(d, { w = 2.4, op = 0.7, amp = 0.45, step = 5, passes = 2, color = C.line } = {}) {
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  p.setAttribute('d', d);
  const L = p.getTotalLength();
  let out = '';
  for (let k = 0; k < passes; k++) {
    let dd = '';
    for (let s = 0; s <= L; s += step) {
      const pt = p.getPointAtLength(s);
      dd += `${s === 0 ? 'M' : 'L'}${(pt.x + rr(-amp, amp)).toFixed(1)},${(pt.y + rr(-amp, amp)).toFixed(1)} `;
    }
    out += `<path d="${dd}" fill="none" stroke="${color}" stroke-width="${(w * (k ? 0.55 : 1)).toFixed(2)}" stroke-linecap="round" stroke-linejoin="round" opacity="${(k ? op * 0.45 : op).toFixed(2)}"/>`;
  }
  return out;
}

// ---------- shapes ----------
const FACE_SIDES = 'C622,460 621,515 612,560 C606,592 590,620 564,644 C547,660 528,668 500,669 C472,668 453,660 436,644 C410,620 394,592 388,560 C379,515 378,460 384,410';
const FACE = `M500,338 C562,338 610,360 616,410 ${FACE_SIDES} C390,360 438,338 500,338 Z`;
const FACE_OUTLINE = `M616,410 ${FACE_SIDES}`;
const EAR_L = 'M388,462 C366,448 351,468 355,497 C358,523 370,542 391,540 Z';
const EAR_R = 'M612,462 C634,448 649,468 645,497 C642,523 630,542 609,540 Z';
const NECK = 'M448,628 C450,690 446,738 432,778 L568,778 C554,738 550,690 552,628 Z';
const SWEATER = 'M96,1000 C104,932 150,892 250,868 C340,848 400,826 438,796 Q500,822 562,796 C600,826 660,848 750,868 C850,892 896,932 904,1000 Z';
// textured quiff: volume pushed up and swept toward the viewer's left
const HAIR_BACK = 'M384,418 C372,360 392,296 452,268 C512,244 588,254 618,302 C636,334 630,384 618,418 C612,398 604,384 592,374 C570,360 534,355 500,355 C466,355 430,360 408,374 C396,384 388,398 384,418 Z';
const QUIFF = 'M398,356 C390,314 408,266 456,242 C500,222 558,222 596,244 C622,260 632,288 626,314 C622,334 612,348 598,358 C566,344 530,338 496,340 C458,342 424,348 398,356 Z';

let s = '';
s += `<defs>
  <radialGradient id="bgG" cx="0.5" cy="0.4" r="0.62">
    <stop offset="0" stop-color="${C.bgLight}"/><stop offset="1" stop-color="${C.bg}"/>
  </radialGradient>
  <linearGradient id="skinG" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="${C.skinLight}"/><stop offset="0.5" stop-color="${C.skin}"/><stop offset="1" stop-color="#E8BC98"/>
  </linearGradient>
  <linearGradient id="neckG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="${C.skinDeep}"/><stop offset="0.45" stop-color="${C.skinShade}"/><stop offset="1" stop-color="${C.skin}"/>
  </linearGradient>
  <linearGradient id="sweaterG" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="${C.navyLight}"/><stop offset="0.45" stop-color="${C.navy}"/><stop offset="1" stop-color="${C.navyShade}"/>
  </linearGradient>
  <linearGradient id="hairG" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="${C.hairMid}"/><stop offset="1" stop-color="${C.hair}"/>
  </linearGradient>
  <filter id="b1" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.6"/></filter>
  <filter id="b4" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"/></filter>
  <filter id="b10" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="10"/></filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="5"/><feColorMatrix type="saturate" values="0"/>
  </filter>
  <clipPath id="faceClip"><path d="${FACE}"/></clipPath>
  <clipPath id="neckClip"><path d="${NECK}"/></clipPath>
  <clipPath id="sweaterClip"><path d="${SWEATER}"/></clipPath>
</defs>`;

// ---------- background: green with a soft halo and a faint band of split light ----------
s += `<rect width="1000" height="1000" fill="url(#bgG)"/>`;
s += `<g transform="translate(500 610) scale(1.08) translate(-500 -610)">`;

// ---------- shoulders ----------
s += `<path d="${SWEATER}" fill="url(#sweaterG)"/>`;
s += `<g clip-path="url(#sweaterClip)">
  <path d="M640,830 C720,850 800,880 860,960 L882,1000 L700,1000 C690,930 670,880 640,830 Z" fill="${C.navyShade}" opacity="0.45" filter="url(#b4)"/>
  <path d="M300,880 C330,920 340,960 344,1000" fill="none" stroke="${C.navyShade}" stroke-width="5" opacity="0.5" filter="url(#b1)"/>
  <path d="M700,880 C670,920 660,960 656,1000" fill="none" stroke="${C.navyShade}" stroke-width="5" opacity="0.5" filter="url(#b1)"/>
  <path d="M180,900 C220,870 260,856 300,848" fill="none" stroke="#5A6B8C" stroke-width="3" opacity="0.35"/>
</g>`;
for (let i = 0; i < 34; i++) {
  const y = rr(850, 995), x = rr(160, 840);
  s += `<path d="M${x.toFixed(0)},${y.toFixed(0)} q5,-6 10,0 q5,6 10,0" fill="none" stroke="#FFFFFF" stroke-width="1.4" opacity="${rr(0.04, 0.09).toFixed(2)}"/>`;
}
s += pencil(SWEATER.replace(' Z', ''), { w: 2.6, op: 0.55 });

// ---------- neck ----------
s += `<path d="${NECK}" fill="url(#neckG)"/>`;
s += `<g clip-path="url(#neckClip)">
  <path d="M440,676 C470,706 530,706 560,676 L560,734 C530,750 470,750 440,734 Z" fill="${C.skinDeep}" opacity="0.45" filter="url(#b4)"/>
  <path d="M470,722 C474,742 470,755 462,775" fill="none" stroke="${C.skinDeep}" stroke-width="4" opacity="0.35" filter="url(#b1)"/>
  <path d="M532,722 C528,742 532,755 540,775" fill="none" stroke="${C.skinDeep}" stroke-width="4" opacity="0.35" filter="url(#b1)"/>
</g>`;
s += pencil('M448,640 C450,690 446,738 432,778', { w: 2.2, op: 0.5 }) + pencil('M552,640 C550,690 554,738 568,778', { w: 2.2, op: 0.5 });

// ---------- collar: shirt band, sweater rib, collar points ----------
s += `<path d="M436,752 Q500,780 564,752 L570,790 Q500,824 430,790 Z" fill="${C.shirt}"/>`;
s += `<path d="M436,752 Q500,780 564,752" fill="none" stroke="${C.shirtShade}" stroke-width="3"/>`;
s += `<path d="M412,792 Q500,866 588,792" fill="none" stroke="${C.navyShade}" stroke-width="24" stroke-linecap="round"/>`;
for (let x = 424; x <= 576; x += 8) { const t = (x - 412) / 176, y = 792 + 37 * 4 * t * (1 - t); s += `<line x1="${x}" y1="${(y - 9).toFixed(0)}" x2="${x}" y2="${(y + 9).toFixed(0)}" stroke="#FFFFFF" stroke-width="1.3" opacity="0.07"/>`; }
s += `<path d="M430,788 L497,826 L466,852 Z" fill="${C.shirt}"/><path d="M570,788 L503,826 L534,852 Z" fill="${C.shirt}"/>`;
s += `<path d="M534,852 L503,826 L570,788" fill="none" stroke="${C.shirtShade}" stroke-width="3"/>`;
s += `<path d="M466,852 L470,846 L438,794" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>`;
s += pencil('M430,788 L497,826 L466,852 Z', { w: 1.6, op: 0.45, step: 4, passes: 1 }) + pencil('M570,788 L503,826 L534,852 Z', { w: 1.6, op: 0.45, step: 4, passes: 1 });

s += `<g transform="translate(0 40)">`;
// ---------- ears ----------
s += `<path d="${EAR_L}" fill="${C.ear}"/><path d="${EAR_R}" fill="${C.ear}"/>`;
s += `<path d="${EAR_R}" fill="${C.skinShade}" opacity="0.45"/>`;
s += `<path d="M376,474 C364,482 364,506 374,522" fill="none" stroke="${C.skinDeep}" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>`;
s += `<path d="M624,474 C636,482 636,506 626,522" fill="none" stroke="${C.skinDeep}" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>`;
s += pencil('M388,462 C366,448 351,468 355,497 C358,523 370,542 391,540', { w: 2.2, op: 0.6 });
s += pencil('M612,462 C634,448 649,468 645,497 C642,523 630,542 609,540', { w: 2.2, op: 0.6 });

// ---------- face ----------
s += `<path d="${FACE}" fill="url(#skinG)"/>`;
s += `<g clip-path="url(#faceClip)">
  <!-- shadow side (viewer's right): cheek and jaw -->
  <path d="M600,400 C590,470 594,540 578,600 C566,640 540,668 510,682 L640,700 L640,380 Z" fill="${C.skinShade}" opacity="0.55" filter="url(#b4)"/>
  <!-- cheekbone shading -->
  <path d="M410,560 C428,580 440,600 452,612" fill="none" stroke="${C.skinShade}" stroke-width="10" opacity="0.35" filter="url(#b10)"/>
  <!-- shadow under the hair on the forehead -->
  <path d="M380,360 C440,390 560,390 620,360 L620,330 L380,330 Z" fill="${C.skinDeep}" opacity="0.4" filter="url(#b10)"/>
  <!-- eye sockets -->
  <ellipse cx="452" cy="470" rx="34" ry="16" fill="${C.skinShade}" opacity="0.28" filter="url(#b4)"/>
  <ellipse cx="548" cy="470" rx="34" ry="16" fill="${C.skinShade}" opacity="0.32" filter="url(#b4)"/>
  <!-- chin and jaw definition -->
  <ellipse cx="500" cy="652" rx="34" ry="9" fill="${C.skinLight}" opacity="0.5" filter="url(#b4)"/>
  <!-- cheek warmth -->
  <ellipse cx="428" cy="540" rx="24" ry="12" fill="#E8A08A" opacity="0.18" filter="url(#b10)"/>
  <ellipse cx="572" cy="540" rx="24" ry="12" fill="#E8A08A" opacity="0.14" filter="url(#b10)"/>
</g>`;
// very light stubble on the jaw and chin
for (let i = 0; i < 120; i++) {
  const a = rr(0.15, Math.PI - 0.15), r = rr(0.55, 1);
  const x = 500 + Math.cos(a) * 92 * r * (R() < 0.5 ? -1 : 1) * 0.8, y = 612 + Math.sin(a) * 50 * r;
  s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${rr(0.6, 1.1).toFixed(2)}" fill="${C.hairMid}" opacity="${rr(0.05, 0.13).toFixed(2)}"/>`;
}
// pencil hatching on the shadow side
let hatch = '';
for (let y = 420; y < 650; y += 9) hatch += pencil(`M${598 - (y - 420) * 0.15},${y + 12} L${624},${y - 8}`, { w: 1.1, op: 0.16, amp: 0.4, step: 4, passes: 1 });
s += `<g clip-path="url(#faceClip)">${hatch}</g>`;
s += pencil(FACE_OUTLINE, { w: 2.6, op: 0.65 });

// ---------- hair ----------
// short faded sides above the ears
s += `<g clip-path="url(#faceClip)" filter="url(#b4)">
  <path d="M380,380 C386,364 398,356 410,354 C407,380 403,404 401,428 L380,428 Z" fill="${C.hair}" opacity="0.2"/>
  <path d="M620,380 C614,364 602,356 590,354 C593,380 597,404 599,428 L620,428 Z" fill="${C.hair}" opacity="0.2"/></g>`;
s += `<path d="${HAIR_BACK}" fill="url(#hairG)"/>`;
s += `<path d="${QUIFF}" fill="url(#hairG)"/>`;
// fine textured tips along the top of the quiff, rooted inside it and pushed up and to the viewer's left
const tuft = (bx, by, dir, len, wid, fill) => {
  const nx = Math.cos(dir), ny = -Math.sin(dir), px = -ny, py = nx;
  const tx = bx + nx * len, ty = by + ny * len, bend = rr(-0.2, 0.05) * len;
  const m1x = bx + nx * len * 0.55 + px * (wid * 0.6) + px * bend, m1y = by + ny * len * 0.55 + py * (wid * 0.6) + py * bend;
  const m2x = bx + nx * len * 0.55 - px * (wid * 0.4) + px * bend, m2y = by + ny * len * 0.55 - py * (wid * 0.4) + py * bend;
  return `<path d="M${(bx + px * wid).toFixed(1)},${(by + py * wid).toFixed(1)} Q${m1x.toFixed(1)},${m1y.toFixed(1)} ${tx.toFixed(1)},${ty.toFixed(1)} Q${m2x.toFixed(1)},${m2y.toFixed(1)} ${(bx - px * wid).toFixed(1)},${(by - py * wid).toFixed(1)} Z" fill="${fill}"/>`;
};
const qp = document.createElementNS('http://www.w3.org/2000/svg', 'path');
qp.setAttribute('d', QUIFF);
const QL = qp.getTotalLength();
for (let k = 0; k < 52; k++) {
  const pt = qp.getPointAtLength(((k + rr(0, 0.7)) / 52) * QL);
  if (pt.y > 318) continue;
  const dir = Math.PI / 2 + 0.32 - (pt.x - 505) * 0.0022 + rr(-0.14, 0.14);
  s += tuft(pt.x, pt.y + 7, dir, rr(14, 30), rr(6, 10), R() < 0.4 ? C.hairMid : C.hair);
}
// strands following the flow, and a soft highlight across the quiff
s += `<path d="M432,272 C470,240 540,232 598,254" fill="none" stroke="${C.hairRim}" stroke-width="12" opacity="0.28" filter="url(#b4)"/>`;
for (let i = 0; i < 36; i++) {
  const x = rr(412, 598), y = rr(250, 345), l = rr(24, 42), a = -Math.PI / 2 - 0.3 + (x - 505) * 0.003 + rr(-0.12, 0.12);
  const ex = x + l * Math.cos(a), ey = y + l * Math.sin(a);
  s += `<path d="M${x.toFixed(1)},${y.toFixed(1)} Q${(x + (ex - x) * 0.5 - 6).toFixed(1)},${(y + (ey - y) * 0.5).toFixed(1)} ${ex.toFixed(1)},${ey.toFixed(1)}" fill="none" stroke="${R() < 0.6 ? C.hairHi : C.hairRim}" stroke-width="${rr(1.2, 2.4).toFixed(1)}" stroke-linecap="round" opacity="${rr(0.3, 0.6).toFixed(2)}"/>`;
}
// clean front hairline with a few short strands
for (let x = 410; x <= 592; x += rr(7, 11)) {
  const y = 352 + Math.abs(x - 500) * 0.07;
  s += tuft(x, y - 4, -Math.PI / 2 - 0.55 + rr(-0.15, 0.15), rr(8, 17), rr(2.5, 4.5), R() < 0.5 ? C.hair : C.hairMid);
}
s += pencil('M384,418 C372,360 392,296 452,268', { w: 1.6, op: 0.22 }) + pencil('M618,302 C636,334 630,384 618,418', { w: 1.6, op: 0.22 });

// ---------- brows: strong, straight, slightly lowered at the inner ends ----------
s += `<path d="M412,446 C428,434 452,428 480,432 C484,433 486,436 485,440 L484,447 C462,443 440,446 414,454 Z" fill="${C.hair}"/>`;
s += `<path d="M588,446 C572,434 548,428 520,432 C516,433 514,436 515,440 L516,447 C538,443 560,446 586,454 Z" fill="${C.hair}"/>`;
for (let i = 0; i < 46; i++) {
  const side = i % 2 ? -1 : 1, d = rr(18, 86), x = 500 + side * d, y = 440 + (d - 18) * 0.08 + rr(-5, 4);
  s += `<line x1="${x.toFixed(1)}" y1="${y.toFixed(1)}" x2="${(x + side * 8).toFixed(1)}" y2="${(y - 2).toFixed(1)}" stroke="${C.hairHi}" stroke-width="1.3" stroke-linecap="round" opacity="0.45"/>`;
}

// ---------- eyes: sharp almond shape, outer corners lifted ----------
function eye(cx, flip) {
  const f = v => (cx + flip * v).toFixed(1);
  const shape = `M${f(-29)},474 C${f(-18)},458 ${f(10)},453 ${f(30)},464 C${f(16)},483 ${f(-12)},485 ${f(-29)},474 Z`;
  const id = `eye${cx}`;
  return `<clipPath id="${id}"><path d="${shape}"/></clipPath>
    <path d="${shape}" fill="${C.white}"/>
    <g clip-path="url(#${id})">
      <circle cx="${f(1)}" cy="471" r="12.5" fill="${C.iris}"/>
      <circle cx="${f(1)}" cy="471" r="12.5" fill="none" stroke="#5A3E30" stroke-width="2" opacity="0.6"/>
      <circle cx="${f(1)}" cy="471" r="5.5" fill="#0E0A08"/>
      <path d="M${f(-30)},458 C${f(-10)},452 ${f(12)},451 ${f(31)},458 L${f(31)},464 C${f(12)},459 ${f(-10)},460 ${f(-30)},466 Z" fill="${C.skinDeep}" opacity="0.2"/>
    </g>
    <circle cx="${f(5)}" cy="465" r="3.2" fill="#FFFFFF"/>
    <circle cx="${f(-3)}" cy="476" r="1.4" fill="#FFFFFF" opacity="0.6"/>
    <path d="M${f(-31)},475 C${f(-19)},456 ${f(10)},450 ${f(31)},462 L${f(35)},458" fill="none" stroke="${C.line}" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M${f(-22)},480 C${f(-8)},484 ${f(10)},482 ${f(24)},473" fill="none" stroke="${C.line}" stroke-width="1.4" opacity="0.45"/>
    <path d="M${f(-28)},458 C${f(-12)},450 ${f(12)},448 ${f(30)},455" fill="none" stroke="${C.skinDeep}" stroke-width="2" opacity="0.3"/>`;
}
s += eye(452, 1) + eye(548, -1);

// ---------- nose: shadow and highlight only ----------
s += `<path d="M486,478 C484,505 482,530 476,548 C482,556 492,560 500,560" fill="none" stroke="${C.skinShade}" stroke-width="7" opacity="0.5" filter="url(#b4)"/>`;
s += `<ellipse cx="502" cy="560" rx="22" ry="7" fill="${C.skinDeep}" opacity="0.35" filter="url(#b4)"/>`;
s += `<ellipse cx="497" cy="546" rx="8" ry="6" fill="${C.skinLight}" opacity="0.85" filter="url(#b1)"/>`;
s += `<path d="M486,556 Q492,561 497,558 M503,558 Q508,561 514,556" fill="none" stroke="${C.line}" stroke-width="2" stroke-linecap="round" opacity="0.55"/>`;
s += `<path d="M476,550 C474,556 478,560 484,560" fill="none" stroke="${C.line}" stroke-width="1.6" opacity="0.35"/>`;
s += `<path d="M524,550 C526,556 522,560 516,560" fill="none" stroke="${C.line}" stroke-width="1.6" opacity="0.35"/>`;

// ---------- mouth: closed, a quiet half smile ----------
s += `<path d="M470,606 C482,600 492,598 500,601 C508,598 518,600 530,605 C516,610 484,611 470,606 Z" fill="${C.lip}" opacity="0.7"/>`;
s += `<path d="M474,609 C486,624 516,624 528,608 C512,613 490,613 474,609 Z" fill="${C.lipLight}" opacity="0.75"/>`;
s += `<ellipse cx="502" cy="616" rx="12" ry="3" fill="#F1C4B2" opacity="0.6"/>`;
s += pencil('M466,606 C480,611 500,612 516,609 C524,607 530,603 536,600', { w: 2.4, op: 0.8, amp: 0.25, step: 3 });
s += `<path d="M494,586 Q500,592 506,586" fill="none" stroke="${C.skinShade}" stroke-width="2.4" opacity="0.45"/>`;
s += `<ellipse cx="500" cy="632" rx="22" ry="6" fill="${C.skinShade}" opacity="0.4" filter="url(#b4)"/>`;

// ---------- optional glasses: thin dark translucent frames ----------
if (GLASSES) {
  const lens = x0 => `M${x0 + 12},446 L${x0 + 70},446 Q${x0 + 82},446 ${x0 + 82},458 L${x0 + 82},488 Q${x0 + 82},502 ${x0 + 68},502 L${x0 + 14},502 Q${x0},502 ${x0},488 L${x0},458 Q${x0},446 ${x0 + 12},446 Z`;
  [lens(410), lens(508)].forEach(d => {
    s += `<path d="${d}" fill="#FFFFFF" opacity="0.06"/>`;
    s += `<path d="${d}" fill="none" stroke="#3E444C" stroke-width="5" opacity="0.88"/>`;
    s += `<path d="${d}" fill="none" stroke="#9AA3AD" stroke-width="1.4" opacity="0.55"/>`;
  });
  s += `<path d="M420,496 L446,450 M432,500 L448,472" stroke="#FFFFFF" stroke-width="3" opacity="0.14"/>`;
  s += `<path d="M518,496 L544,450" stroke="#FFFFFF" stroke-width="3" opacity="0.14"/>`;
  s += `<path d="M492,462 Q500,454 508,462" fill="none" stroke="#3E444C" stroke-width="4.5"/>`;
  s += `<path d="M410,458 L384,466 M590,458 L616,466" stroke="#3E444C" stroke-width="4.5" stroke-linecap="round"/>`;
}

s += `</g></g>`;
// paper grain
s += `<rect width="1000" height="1000" filter="url(#grain)" opacity="0.07" style="mix-blend-mode:multiply"/>`;

document.getElementById('root').innerHTML =
  `<svg xmlns="http://www.w3.org/2000/svg" width="${S}" height="${S}" viewBox="0 0 1000 1000">${s}</svg>`;
window.ready = true;
</script>
</body>
</html>
