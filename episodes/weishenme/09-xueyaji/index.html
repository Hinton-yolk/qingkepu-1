"use strict";
// ============================================================================================
// EP.09 血压计 — a pure function of time. window.seek(t) paints frame t.
// Worlds:
//   ROOM (light, 0–6.75, 45.75–48): an arm lying on a table with a cuff, a tube, the monitor. World units = screen px at rest.
//     The dive (6.75–9.5) is one take: the camera pushes into the cuff and turns so the upper arm lies level; the cuff
//     and the skin turn see-through and the SECTION (dark) takes over.
//   SECTION (dark, 6.75–31.5): a side cut along the upper arm (artery, bone), the cuff's bladder with air, the tube, and a
//     cut-open panel of the machine (pressure sensor, the cuff-pressure bar, a small screen of spikes → the hill).
//     "E" units = screen px at the end of the dive, origin at the cuff's centre.
//   LINE (light, 31.5–39.5): one long line of "your blood pressure", two measuring windows.
//   SIDE (light, 39.5–45.75, 48–50.5): the woman in profile (traced from the user's references), the heart-level line.
//   TIPS (light, 48–56.25): a checklist card builds up.

// ============================================================================================

const PM = window.PEOPLE;
const cv = document.getElementById("c");

  skin: "#EBCBA5", skinD: "#D6AD84", skinL: "#F4DEC3",
  blood: "#C93F48", bloodL: "#E8868B", bloodD: "#8E2A33", tissue: "#3A2B2D", tissueL: "#4B3739", boneC: "#D8CFBE", boneD: "#B8AE9B",
  cuff: "#3B4252", cuffL: "#4F586B", cuffD: "#2B313D", bladder: "#59647A", airC: "#F1F0EC",
  dev: "#F4F3EF", devD: "#D6D4CC", lcd: "#C6D0C0", lcdD: "#25302A", tube: "#6C7383", tubeL: "#8A91A0",

// ---------------------------------------------------------------- math
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));

const prog = (t, a, b) => clamp((t - a) / (b - a));
const TAU = Math.PI * 2, RAD = Math.PI / 180;
const E = {

  p2io: (x) => (x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2),
  p3io: (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
  p2in: (x) => x * x, p3in: (x) => x * x * x,

  k0 = key(k1.F, toS(k0, k1.F), k0.A, k0.phi);

let VX = 0, VY = 0;                       // the scene's slow drift (screen px); 0 for the captions
const ID = () => ctx.setTransform(1, 0, 0, 1, VX, VY);

    const font = `${wt} ${size}px ${face}`.trim();

  });
}
function label(str, x, y, size, col, t, t0, t1, o = {}) {
  if (t < t0 || t >= t1) return;
  ID(); const font = `${o.weight ?? 700} ${size}px ${o.face ?? UI}`; const wv = mw(font, str);
  const k = E.p3out(prog(t, t0, t0 + 0.28)), e = prog(t, t1 - 0.15, t1);
  ctx.save(); ctx.font = font; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  const left = o.align === "right" ? x - wv : o.align === "center" ? x - wv / 2 : x;
  if (o.plate) { ctx.globalAlpha = (1 - e) * k; rr(left - 18, y - size - 4, wv + 36, size + 22, 12); ctx.fillStyle = o.plate; ctx.fill(); }
  ctx.beginPath(); ctx.rect(left - 4, y - size * 1.2, (wv + 8) * k, size * 1.6); ctx.clip();
  ctx.globalAlpha = (o.alpha ?? 1) * (1 - e); if (e > 0) ctx.filter = `blur(${(8 * e).toFixed(1)}px)`;
  ctx.fillStyle = col; ctx.fillText(str, left, y); ctx.restore(); ctx.filter = "none";
}
function underline(str, prefix, word, lineIdx, t, t0, t1, ys = [330, 472], size0 = 112) {
  if (t < t0 || t >= t1) return;
  const size = fitSize(str, size0, 930), f = `${size}px ${DISPLAY}`;
  const x0 = 96 + mw(f, prefix), wv = mw(f, word), k = E.p3out(prog(t, t0, t0 + 0.3)), fo = 1 - prog(t, t1 - 0.16, t1);

}
function leader(x0, y0, x1, y1, col, k = 1, w = 2.5) {
  ID(); ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(lerp(x0, x1, k), lerp(y0, y1, k)); ctx.stroke();

  ctx.restore();
}
function pill(str, x, y, size, t, t0, t1, o = {}) {                     // small text on a dark pill
  if (t < t0 || t >= t1) return;
  ID(); const font = `${o.weight ?? 700} ${size}px ${UI}`, wv = mw(font, str), k = E.p3out(prog(t, t0, t0 + 0.25)), e = 1 - prog(t, t1 - 0.15, t1);

}
// an orange box that draws itself (the 示意 frame for a new element)
function obox(x, y, w, h, k, a = 1, r = 14, lw = 5) {
  if (k <= 0 || a <= 0) return;
  ID(); ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = C.acc; ctx.lineWidth = lw; ctx.lineJoin = "round";
  const per = 2 * (w + h); ctx.setLineDash([per * k, per]); rr(x, y, w, h, r); ctx.stroke(); ctx.restore();
}
function oring(x, y, r, k, a = 1, lw = 4) {
  if (k <= 0 || a <= 0) return;
  ID(); ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = C.acc; ctx.lineWidth = lw; ctx.beginPath(); ctx.arc(x, y, r, -Math.PI / 2, -Math.PI / 2 + TAU * k); ctx.stroke(); ctx.restore();
}
function capsule(P, w, fill) { ctx.save(); ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = fill; ctx.lineWidth = w; ctx.beginPath(); P.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]))); ctx.stroke(); ctx.restore(); }

// ================================================================ people (drawn from the user's references, assets/people/model.js)
function smoothPath(P) {                                 // a closed curve through the points (quadratics through midpoints)
  const n = P.length, m = (i) => [(P[i % n][0] + P[(i + 1) % n][0]) / 2, (P[i % n][1] + P[(i + 1) % n][1]) / 2];
  const p0 = m(n - 1); ctx.beginPath(); ctx.moveTo(p0[0], p0[1]);
  for (let i = 0; i < n; i++) { const q = m(i); ctx.quadraticCurveTo(P[i][0], P[i][1], q[0], q[1]); }
  ctx.closePath();
}
// a skin shape like EP.05 / EP.08: flat skin, darker towards the edges, a soft light, an ink outline
function skinShape(P, s, o = {}) {
  smoothPath(P); ctx.fillStyle = C.skin; ctx.fill();
  ctx.save(); smoothPath(P); ctx.clip();
  ctx.filter = `blur(${(12 / s).toFixed(1)}px)`; ctx.strokeStyle = "rgba(120,66,30,0.20)"; ctx.lineWidth = 46 / Math.max(s, 0.3); smoothPath(P); ctx.stroke(); ctx.filter = "none";

}
// the arm (ARM): image px → world: x' = 0.5·x, y' = 0.5·y + 967; the arm leaves the picture at the left edge: carry it on
const AM = PM.ARM, ARM_S = 0.5, ARM_T = [0, 967];
const ARM_PTS = AM.pts.map((p) => (p[0] < 4 ? [-900, p[1] + (p[1] < 300 ? -60 : 60)] : p));

function drawArmImg(a = 1) {
  if (a <= 0.01) return;
  ctx.save(); ctx.globalAlpha *= a; ctx.translate(ARM_T[0], ARM_T[1]); ctx.scale(ARM_S, ARM_S);
  const s = ctx.getTransform().a;
  skinShape(ARM_PTS, s, { light: [[[-200, 250], [300, 285], [700, 380], [1300, 380]], 60], creases: ARM_CREASES });

}
// the cuff on the arm: centre and direction in world units (from the image: elbow crease x ≈ 550, the cuff 2–3 cm above it)
const CU = [135, 1150], CANG = 12 * RAD, CLEN = 200, CTH = 148;
// inflation 0..1 over the whole film (the bladder's fullness)
function inflate(t) {
  return kf(t, [[0, 0.5], [T.r1, 0], [T.inflate2, 0], [1.25, 1], [1.95, 0.05], [T.r2, 0], [T.squeeze, 0], [T.squeezeEnd, 1], [T.release, 1],

}
// the cuff pressure (mmHg-like, a 示意 scale) during the measurement in the section
function cuffP(t) { return kf(t, [[0, 0], [T.squeeze, 0], [T.squeezeEnd, 175], [T.release, 175], [T.beat1, 128], [23.0, 100], [26.5, 58], [27.5, 40], [DUR, 40]], (x) => x); }
// the arterial pressure wave (systolic 128, diastolic 82): a quick rise after each beat, a slow fall
function artP(t) {

}
// how far the squeezed artery is open (0 = flat, 1 = round)

// ================================================================ LINE (light, 31.5–39.5): your blood pressure keeps changing
const LN = { x0: 70, x1: 1010, y: 1000 };
function bpY(x, t) {
  const u = (x - LN.x0) / (LN.x1 - LN.x0);

  const ph = (t - T.line) * 2.2;

}

function drawLine(t) {

// ================================================================ SIDE (light): the woman in profile; heart-level line; the cuff
const SD = PM.SIDE;

  ctx.lineWidth = 3.4; ctx.beginPath(); ctx.moveTo(338, 186); ctx.quadraticCurveTo(352, 178, 366, 184); ctx.stroke();          // eye (upper lid)
  ctx.fillStyle = "rgba(40,28,22,0.9)"; ctx.beginPath(); ctx.ellipse(356, 186, 4, 5, 0, 0, TAU); ctx.fill();
  ctx.lineWidth = 2.4; ctx.beginPath(); ctx.moveTo(380, 238); ctx.quadraticCurveTo(372, 244, 376, 248); ctx.stroke();          // nostril
  ctx.strokeStyle = "rgba(170,80,80,0.9)"; ctx.lineWidth = 3.2; ctx.beginPath(); ctx.moveTo(344, 276); ctx.quadraticCurveTo(358, 280, 372, 274); ctx.stroke();   // lips

function poseMap(pose, p, S = SIDE_S, Tt = SIDE_T) { const [rs, rx, ry] = SD[pose].reg; return [Tt[0] + S * (rx + rs * p[0]), Tt[1] + S * (ry + rs * p[1])]; }

function poseAt(t) {                         // [pose, nextPose, mix]

// ================================================================ TIPS (light, 48–56.25)
const CARD = { x: 70, y: 1130, w: 940, h: 310 };
function drawTips(t) {
  ID(); ctx.fillStyle = C.ground; ctx.fillRect(-200, -200, W + 400, H + 400);
  const d = drift(t), ox = 0.15 * d[0], oy = 0.15 * d[1];

  if (a1 > 0.01) {
    const S = 0.5, Tt = [60 + ox, 600 + oy], hy = Tt[1] + S * HEART_Y;
    ctx.save(); ctx.globalAlpha = a1;
    // a cushion under the forearm (桌子低就垫高)
    const ck = E.p3out(prog(t, T.align, T.align + 0.4));
    if (ck > 0) { const p = poseMap("heart", [640, 770], S, Tt); rr(p[0] - 120, p[1] + 6, 240, 46 * ck, 16); ctx.fillStyle = "#C9C3B6"; ctx.fill(); ctx.strokeStyle = C.ink; ctx.lineWidth = 2.4; ctx.stroke(); }
    drawPerson("heart", 1, S, Tt);
    drawSideCuff("heart", 1, S, Tt, win(t, T.align, T.tip2, 0.3, 0.2) * (0.6 + 0.4 * Math.sin(t * 6)));
    heartLine(hy, E.smooth(prog(t, T.align, T.align + 0.4)), Tt[0] + S * 260, 1010, false);
    ctx.restore();
    // the timer ring (no seconds)
    const tk = prog(t, T.timer, T.timerEnd);
    ctx.save(); ctx.globalAlpha = a1 * E.smooth(prog(t, T.tip1, T.tip1 + 0.3)); const cx = 800, cy = 790;
    ctx.strokeStyle = "rgba(20,20,20,0.18)"; ctx.lineWidth = 16; ctx.beginPath(); ctx.arc(cx, cy, 86, 0, TAU); ctx.stroke();
    ctx.strokeStyle = C.acc; ctx.lineCap = "round"; ctx.beginPath(); ctx.arc(cx, cy, 86, -Math.PI / 2, -Math.PI / 2 + TAU * tk); ctx.stroke();
    ctx.strokeStyle = C.ink; ctx.lineWidth = 6; const ha = -Math.PI / 2 + TAU * tk; line(cx, cy, cx + 50 * Math.cos(ha), cy + 50 * Math.sin(ha)); ctx.restore();

  }

  if (a2 > 0.01) {
    ctx.save(); ctx.globalAlpha = a2;
    const flash = (tm) => win(t, tm + 0.25, tm + 0.9, 0.08, 0.2);
    for (const [x, tm] of [[300, T.m1], [780, T.m2]]) {

      ctx.save(); ctx.globalAlpha = a2 * on; drawMonitor(t, 1, { dash: t >= tm && t < tm + 0.5, txt: null }, [x + ox, 860 + oy], 0.62); ctx.restore();
      const f = flash(tm); if (f > 0.01) { ctx.save(); ctx.globalAlpha = a2 * f; ctx.fillStyle = "rgba(255,255,255,0.7)"; rr(x - 93 + ox, 787 + oy, 186, 99, 12); ctx.fill(); ctx.restore(); }
    }
    const gk = E.p3out(prog(t, T.wait, T.wait + 0.4));
    if (gk > 0) { arrowS(430 + ox, 860 + oy, lerp(430, 650, gk) + ox, 860 + oy, 1, C.ink, 5, 16); label(COPY.gap, 540 + ox, 820 + oy, 40, C.ink, t, T.wait + 0.1, T.tip3 + 0.2, { align: "center" }); }
    const bk = E.p3out(prog(t, T.m2End, T.m2End + 0.35));
    if (bk > 0) { ctx.strokeStyle = C.acc; ctx.lineWidth = 6; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.beginPath(); ctx.moveTo(300 + ox, 990 + oy); ctx.lineTo(300 + ox, 1020 + oy); ctx.lineTo(lerp(300, 780, bk) + ox, 1020 + oy); if (bk > 0.98) ctx.lineTo(780 + ox, 990 + oy); ctx.stroke(); label(COPY.avg, 540 + ox, 1078 + oy, 44, C.acc, t, T.m2End + 0.2, T.tip3 + 0.2, { align: "center" }); }

    ctx.restore();

    const rows = [[COPY.c1, T.card1, 1212], [COPY.c2, T.card2, 1318], [COPY.c3, T.card3, 1400]];
    for (const [s, tm, y] of rows) {
      if (t < tm) continue; const k = E.p3out(prog(t, tm, tm + 0.3));
      ctx.save(); ctx.globalAlpha = k; ctx.fillStyle = C.acc; ctx.beginPath(); ctx.arc(CARD.x + 52, y - 15, 10, 0, TAU); ctx.fill(); ctx.restore();
      label(s, CARD.x + 80, y, 46, C.ink, t, tm, T.end + 0.4);
    }
    label(COPY.c1b, CARD.x + 80, 1260, 36, C.ink, t, T.card1 + 0.2, T.end + 0.4, { weight: 400, alpha: 0.7 });
  }
}

// ================================================================ captions
// the dive's circle: it opens from the cuff (dark inside), no cross-fade, so there is never a grey frame
function diveIris(t) {
  if (t < T.xray || t >= T.diveEnd) return null;
  const k = E.p2in(prog(t, T.xray, T.diveEnd - 0.4)), c = toS(camRoom(t), CU);
  return { c, R: 4 + 2300 * k };
}
function darkAt(t) {
  if (t < T.xray) return 0;
  if (t < T.diveEnd) return -1;                                   // the circle: both, clipped
  if (t < T.q7) return 1;
  return 0;
}
function scrimOf(fl, a = 1, gr = "236,235,230") {
  const STOPS = [[0, 1], [0.66, 1], [0.74, 0.86], [0.82, 0.56], [0.9, 0.24], [1, 0]];
  const SH = fl > 0.5 ? 640 : 760;
  ID(); const g = ctx.createLinearGradient(0, 0, 0, SH);
  STOPS.forEach(([o, k]) => g.addColorStop(o, fl > 0.5 ? `rgba(23,25,28,${a * k * 0.92})` : `rgba(${gr},${a * k})`));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, SH);
}
function textBand(t, fl) {
  const L = C.ink, D = C.paper, M = fl > 0.5 ? D : L;
  lines(COPY.h1, t, -1, T.q2, { style: "none", col: L });
  underline(COPY.h1[2], "该信", "哪一次", 2, t, T.underline, T.q2, [300, 420, 540], 96);
  lines(COPY.q2, t, T.q2, T.a2, { style: "blur", col: L, acc: C.paper, exit: 0.001 });
  lines(COPY.a2, t, T.a2, T.q3, { style: "slam", col: L, acc: orangeK(t) > 0.35 ? C.ink : C.acc });
  lines(COPY.q3, t, T.q3, T.air, { style: "blur", col: M });
  lines(COPY.h4, t, T.air, T.squeeze, { style: "blur", col: D });
  lines(COPY.a4, t, T.squeeze, T.deflate, { style: "blur", col: D });
  lines(COPY.a5, t, T.deflate, T.beat1, { style: "blur", col: D });
  lines(COPY.b5, t, T.beat1, T.q5, { style: "blur", col: D });
  lines(COPY.q5, t, T.q5, T.push, { style: "blur", col: D });
  lines(COPY.a5b, t, T.push, T.more, { style: "wipe", col: D });
  lines(COPY.m5, t, T.more, T.less, { style: "blur", col: D });
  lines(COPY.l5, t, T.less, T.q6, { style: "blur", col: D });
  lines(COPY.q6, t, T.q6, T.a6, { style: "blur", col: D });
  lines(COPY.a6, t, T.a6, T.q7, { style: "slam", col: D, lineGap: 0.2 });
  lines(COPY.q7, t, T.q7, T.a7, { style: "blur", col: L });
  lines(COPY.a7, t, T.a7, T.a8, { style: "blur", col: L });
  lines(COPY.a8, t, T.a8, T.a9, { style: "blur", col: L });
  lines(COPY.a9, t, T.a9, T.q10, { style: "blur", col: L });
  lines(COPY.q10, t, T.q10, T.a10, { style: "blur", col: L });
  lines(COPY.a10, t, T.a10, T.a11, { style: "blur", col: L });
  lines(COPY.a11, t, T.a11, T.fin, { style: "blur", col: L });
  lines(COPY.fin, t, T.fin, T.tip1, { style: "slam", col: L, lineGap: 0.25 });
  lines(COPY.t1, t, T.tip1, T.tip2, { style: "blur", col: L });
  lines(COPY.t2, t, T.tip2, T.tip3, { style: "blur", col: L });
  lines(COPY.t3, t, T.tip3, T.end, { style: "blur", col: L });
}

// ================================================================ end card: the monitor becomes an outline badge
const BADGE = [200, 600];
function endCard(t) {
  if (t < T.end) return;
  const k = E.p3io(prog(t, T.end, T.endMorph + 0.3));
  ID(); ctx.save();
  const sc = lerp(0.9, 0.42, k), cx = lerp(540, BADGE[0], k), cy = lerp(880, BADGE[1], k);
  ctx.translate(cx, cy); ctx.scale(sc, sc);
  ctx.strokeStyle = C.ink; ctx.lineWidth = 8; rr(-MOW / 2, -MOH / 2, MOW, MOH, 46); ctx.fillStyle = mixHex(C.dev, C.ground, k); ctx.fill(); ctx.stroke();
  rr(-150, -118, 300, 160, 18); ctx.lineWidth = 6; ctx.stroke(); ctx.beginPath(); ctx.arc(0, 98, 30, 0, TAU); ctx.stroke();
  ctx.lineCap = "round"; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(-MOW / 2 - 4, 17); ctx.bezierCurveTo(-MOW / 2 - 120, 30, -MOW / 2 - 140, 160, -MOW / 2 - 60, 260); ctx.stroke();
  ctx.restore();
  lines(COPY.end, t, T.title1, DUR + 1, { style: "type", col: C.ink, ys: [905, 1045, 1185], size: 124, stag: 0.045, lineGap: 0.3 });
  lines([COPY.epNum], t, T.ep, DUR + 1, { style: "slam", col: C.ink, x: 400, ys: [520], size: 150 });
  lines([COPY.epName], t, T.ep + 0.25, DUR + 1, { style: "blur", col: C.ink, x: 404, ys: [668], size: 112 });
  if (t >= T.sting) {
    const s2 = spring(t - T.sting, 16, 0.5);
    ID(); ctx.save(); ctx.translate(BADGE[0], BADGE[1]); ctx.scale(s2, s2); ctx.font = `150px ${DISPLAY}`; ctx.fillStyle = C.acc; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("?", 4, 4); ctx.restore();
  }
}

// ================================================================ the frame
const orangeK = (t) => E.p2io(prog(t, T.myth, T.myth + 0.3)) * (1 - E.p2io(prog(t, T.unOrange, T.unOrange + 0.3)));
function groundRGB(t) { const o = orangeK(t), g = hexRGB(C.ground), q = hexRGB(C.acc); return [0, 1, 2].map((i) => Math.round(lerp(g[i], q[i], o))).join(","); }
function groundCol(t) { const o = orangeK(t); return o > 0 ? mixHex(C.ground, C.acc, o) : C.ground; }
function qmarks(t, K) {
  const a = win(t, T.qmarks, T.a2 + 0.2, 0.25, 0.25); if (a <= 0.01) return;
  for (const [p, ph] of [[[CARD1[0] + 150, CARD1[1] - 90], 0], [[MO[0] + 170, MO[1] - 130], 1.7]]) {
    const q = toS(K, p), born = spring(t - T.qmarks - 0.1 * ph, 14, 0.55);
    ID(); ctx.save(); ctx.globalAlpha = a; ctx.translate(q[0], q[1] + 0.8 * Math.sin(t * 5 + ph)); ctx.scale(born, born);
    ctx.font = `120px ${DISPLAY}`; ctx.fillStyle = C.ink; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("?", 0, 0); ctx.restore();
  }
}
function strike(t, K) {
  if (t < T.strike || t >= T.a2 + 0.35) return;
  const c = toS(K, [560, 850]), fo = 1 - prog(t, T.a2, T.a2 + 0.35);
  ID(); ctx.save(); ctx.globalAlpha = fo; ctx.strokeStyle = C.ink; ctx.lineCap = "round"; ctx.lineWidth = 28;
  const k1 = E.p3out(prog(t, T.strike, T.strike + 0.1)), k2 = E.p3out(prog(t, T.strike + 0.125, T.strike + 0.225));
  line(c[0] - 240, c[1] - 220, lerp(c[0] - 240, c[0] + 240, k1), lerp(c[1] - 220, c[1] + 220, k1));
  if (k2 > 0) line(c[0] + 240, c[1] - 220, lerp(c[0] + 240, c[0] - 240, k2), lerp(c[1] - 220, c[1] + 220, k2));
  ctx.restore();
}
function againNote(t, K) {
  if (t < T.inflate2 || t >= T.q2 + 0.3) return;
  const q = toS(K, [CARD1[0] - 130, CARD1[1] + 140]);
  label(COPY.again, q[0], q[1], 40, C.ink, t, T.inflate2 + 0.1, T.q2 + 0.3, { alpha: 0.85 });
}
function roomShot(t, K, ground) {
  ID(); ctx.fillStyle = ground; ctx.fillRect(-200, -200, W + 400, H + 400);
  const xr = 0;
  drawRoom(t, K, { cuff: 1 - 0.75 * xr, arm: 1 - 0.75 * xr, mon: 1 - xr, table: 1 - xr });
}
// the averaging bracket on the closing shot
function avgBracket(t, K) {
  const k = E.p3out(prog(t, T.avg, T.avg + 0.4)); if (k <= 0) return;
  const a = toS(K, [CARD1[0], CARD1[1] + 110]), b = toS(K, [MO[0], CARD1[1] + 110]);
  ID(); ctx.save(); ctx.strokeStyle = C.acc; ctx.lineWidth = 7; ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.beginPath(); ctx.moveTo(a[0], a[1] - 26); ctx.lineTo(a[0], a[1]); ctx.lineTo(lerp(a[0], b[0], k), a[1]); if (k > 0.98) ctx.lineTo(b[0], b[1] - 26); ctx.stroke(); ctx.restore();
  label(COPY.avg, (a[0] + b[0]) / 2, a[1] + 64, 48, C.acc, t, T.avg + 0.25, T.tip1, { align: "center" });
}
const IRC = [770, 860];
function frame(t) {
  ctx.reset(); [VX, VY] = viewDrift(t); ID();
  if (t < T.diveEnd) {
    const K = camRoom(t), ir = diveIris(t);
    roomShot(t, K, groundCol(t));
    if (ir) { ctx.save(); const P = new Path2D(); P.arc(ir.c[0], ir.c[1], ir.R, 0, TAU); ID(); ctx.clip(P); ctx.fillStyle = C.dark; ctx.fillRect(-200, -200, W + 400, H + 400); drawSection(t, 1); ctx.restore(); }
    qmarks(t, K); strike(t, K); againNote(t, K);
  } else if (t < T.q7) {
    ID(); ctx.fillStyle = C.dark; ctx.fillRect(-200, -200, W + 400, H + 400);
    const bigK = E.p2io(prog(t, T.big, T.bigEnd));
    drawSection(t, 1 - 0.85 * bigK);
    const pa = E.smooth(prog(t, T.sensor - 0.35, T.sensor)) * (1 - bigK);
    if (pa > 0.01) drawPanel(t, pa, {});
    if (t < T.big + 0.3) sectionNotes(t);
    if (bigK > 0) drawHill(t, 1);
    label(COPY.note, 1010, 1440, 32, C.paper, t, T.diveEnd, T.big, { align: "right", weight: 400, alpha: 0.5 });
  } else if (t < T.side) {
    drawLine(t);
  } else if (t < T.iris) {
    drawSide(t);
  } else if (t < T.tip1) {
    const K = roomK(t);
    const draw = () => { roomShot(t, K, C.ground); avgBracket(t, K); };
    if (t < T.irisEnd) {
      drawSide(t);
      const k = E.p2io(prog(t, T.iris, T.irisEnd)), R = 6 + 2200 * k;
      ctx.save(); const P = new Path2D(); P.arc(IRC[0], IRC[1], R, 0, TAU); ID(); ctx.clip(P); draw(); ctx.restore();
    } else draw();
  } else {
    drawTips(t);
  }
}
function overlay(t) {
  VX = 0; VY = 0;
  const fl = darkAt(t);
  if (fl < 0) {                                                   // the dive's circle: dark scrim inside, light outside
    const ir = diveIris(t);
    ctx.save(); let P = new Path2D(); P.rect(0, 0, W, H); P.arc(ir.c[0], ir.c[1], ir.R, 0, TAU); ID(); ctx.clip(P, "evenodd"); scrimOf(0, 1, groundRGB(t)); textBand(t, 0); ctx.restore();
    ctx.save(); P = new Path2D(); P.arc(ir.c[0], ir.c[1], ir.R, 0, TAU); ID(); ctx.clip(P); scrimOf(1); textBand(t, 1); ctx.restore();
  } else {
    scrimOf(fl, t >= T.end ? 1 - prog(t, T.end, T.end + 0.3) : 1, groundRGB(t));
    textBand(t, fl);
  }
  if (t >= T.end) { ID(); ctx.fillStyle = C.ground; ctx.globalAlpha = E.p2io(prog(t, T.end, T.end + 0.3)); ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; endCard(t); }
}

// ---------------------------------------------------------------- motion blur where things move fast
const BLUR = [[6.9, 7.25, 6], [41.5, 41.85, 6], [44.0, 44.35, 6], [56.25, 57.1, 6]];
const SHUTTER = 0.5 / FPS;
window.seek = function seek(t) {
  t = clamp(t, 0, DUR - 1e-6);
  const b = BLUR.find(([a, bb]) => t >= a && t < bb);
  if (!b) { ctx = MAIN; frame(t); overlay(t); return; }
  const SUB = b[2];
  MAIN.reset();
  for (let i = 0; i < SUB; i++) {
    ctx = OFFX;
    const ts = t + SHUTTER * (i / (SUB - 1) - 0.5);
    frame(clamp(ts, 0, DUR - 1e-6));
    MAIN.setTransform(1, 0, 0, 1, 0, 0); MAIN.globalAlpha = 1 / (i + 1); MAIN.drawImage(OFF, 0, 0);
  }
  MAIN.globalAlpha = 1; ctx = MAIN; overlay(t);
};
window.DUR = DUR; window.FPS = FPS;
window.ready = false;
window.whenReady = Promise.all([
  document.fonts.load(`100px ${DISPLAY}`, "血压每次量的都不一样"), document.fonts.load(`700 50px ${UI}`, "压力传感器高压低压0123456789"), document.fonts.load(`400 50px ${UI}`, "示意"),
]).then(() => document.fonts.ready).then(() => { MEASURE.clear(); window.seek(0); window.ready = true; });
</script>
</body>
</html>
