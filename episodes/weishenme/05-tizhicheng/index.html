<script>
"use strict";
// ============================================================================================
// EP.05 体脂秤 — a pure function of time. window.seek(t) paints frame t.
// One continuous space (world units: millimetres; x to the right, y towards the camera, z up): a glass bathroom scale on
// the floor (top of the glass at z = GS), a person standing on it facing the camera, seen from the waist down (bare feet,
// shorts), a phone lying on the floor to the right. One orthographic camera with a pitch θ (90° = straight from the front,
// 0° = straight down): the step onto the scale → the x-ray of the scale (orange) → the left foot → the whole lower body
// (the current's path) → one take into the left calf, cut across (dark) → out again → the phone → back → end badge.
// The body is drawn as tubes: rings (ellipses in horizontal or frontal planes) projected, the hull of every pair of
// neighbouring rings unioned into one path; ink outline underneath, flat fill, soft shading on top.
// No timers, no rAF, no CSS transitions, no state between frames (the context is reset every frame); seeded noise only.
// ============================================================================================
const { T, COPY, W, H, DUR, FPS, S16, WEIGHT, BF, BF_EVE, BF_JUMPS, BF_DRY, fatK, waterN, waterDry } = TL;
const cv = document.getElementById("c");
const MAIN = cv.getContext("2d");
const OFF = document.createElement("canvas"); OFF.width = W; OFF.height = H;
const OFFX = OFF.getContext("2d");
let ctx = MAIN;

  ground: "#ECEBE6", ink: "#141414", acc: "#FF4A1C", paper: "#F1F0EC", dark: "#17191C",
  skin: "#EBCBA5", skinD: "#D6AD84", skinL: "#F4DEC3", nail: "#F3DCCB",
  glass: "#1F2227", glassL: "#2B3036", glassEdge: "#47505A", base: "#111316",
  steel: "#C6CBD1", steelD: "#8B929A", steelL: "#EEF0F2", lcd: "#0A0B0D",
  shorts: "#78808C", shortsD: "#5E6570",
  fat: "#F3DF9F", fatD: "#DCC07A", muscle: "#CF6468", muscleD: "#A84B50", muscleL: "#DE8486", bone: "#DEDBD5", boneD: "#B8B2A8",
  phone: "#1C1D20", app: "#F6F5F1", appD: "#E4E2DC",

// ---------------------------------------------------------------- math
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const TAU = Math.PI * 2, RAD = Math.PI / 180;
const E = {
  sine: (x) => 0.5 - 0.5 * Math.cos(Math.PI * x),
  p2io: (x) => (x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2),
  p3io: (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
  p2in: (x) => x * x, p3in: (x) => x * x * x,
  p2out: (x) => 1 - (1 - x) * (1 - x), p3out: (x) => 1 - Math.pow(1 - x, 3), p4out: (x) => 1 - Math.pow(1 - x, 4),
  smooth: (x) => x * x * (3 - 2 * x),

function spring(x, w = 15, z = 0.72) {
  if (x <= 0) return 0;
  if (z >= 1) return 1 - Math.exp(-w * x) * (1 + w * x);
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * x) * (Math.cos(wd * x) + ((z * w) / wd) * Math.sin(wd * x));

function slamScale(u) {                              // 0.17 s: 1.55 -> 0.94 -> 1.0
  if (u <= 0) return 1.55;
  if (u < 0.09) return lerp(1.55, 0.94, E.p2in(u / 0.09));
  if (u < 0.17) return lerp(0.94, 1.0, E.p3out((u - 0.09) / 0.08));
  return 1;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const hexRGB = (h) => [0, 1, 2].map((i) => parseInt(h.slice(1 + 2 * i, 3 + 2 * i), 16));
const mixHex = (a, b, k) => { const p = hexRGB(a), q = hexRGB(b); return `rgb(${[0, 1, 2].map((i) => Math.round(lerp(p[i], q[i], k))).join(",")})`; };
const rgba = (h, a) => { const p = h[0] === "#" ? hexRGB(h) : h.match(/[\d.]+/g).slice(0, 3).map(Number); return `rgba(${p[0]},${p[1]},${p[2]},${a})`; };
const ACC = hexRGB("#FF4A1C").join(","), PAP = "241,240,236", INK = "20,20,20";
function kf(t, K, ease = E.p2io) {
  if (t <= K[0][0]) return K[0][1];
  for (let i = 1; i < K.length; i++) if (t < K[i][0]) { const [t0, v0] = K[i - 1], [t1, v1, e] = K[i]; return lerp(v0, v1, (e || ease)(prog(t, t0, t1))); }
  return K[K.length - 1][1];
}

// ---------------------------------------------------------------- camera: orthographic, pitch θ about the line y = piv
// screen = A·(x, piv + (y − piv)·cosθ − z·sinθ) + B. A = Z px per mm.
function key(F, anchor, Z, thDeg = 0, piv = 0) {
  const A = Z, th = thDeg * RAD, c = Math.cos(th), s = Math.sin(th), fz = F[2] || 0;
  const py = piv + (F[1] - piv) * c - fz * s;
  return { A, B: [anchor[0] - A * F[0], anchor[1] - A * py], Z, th, piv };
}
function interp(k0, k1, u, uth = u) {
  const lr = Math.log(k1.A / k0.A), kk = Math.exp(lr), ku = Math.exp(lr * u);
  let B;
  if (Math.abs(1 - kk) < 1e-9) B = [lerp(k0.B[0], k1.B[0], u), lerp(k0.B[1], k1.B[1], u)];
  else { const c0 = k1.B[0] - kk * k0.B[0], c1 = k1.B[1] - kk * k0.B[1], w0 = c0 / (1 - kk), w1 = c1 / (1 - kk); B = [ku * (k0.B[0] - w0) + w0, ku * (k0.B[1] - w1) + w1]; }
  return { A: k0.A * ku, B, Z: k0.Z * ku, th: lerp(k0.th, k1.th, uth), piv: lerp(k0.piv, k1.piv, u) };
}
// a move between two keys that keeps a chosen world point on a straight screen path (used where the pitch changes a lot)
function interpF(F0, a0, Z0, th0, F1, a1, Z1, th1, u, uz = u, uth = u) {
  const F = [0, 1, 2].map((i) => lerp(F0[i] || 0, F1[i] || 0, u)), a = [lerp(a0[0], a1[0], u), lerp(a0[1], a1[1], u)];
  return key(F, a, Z0 * Math.pow(Z1 / Z0, uz), lerp(th0, th1, uth));
}
function proj(K, x, y, z = 0) { const c = Math.cos(K.th), s = Math.sin(K.th); return [(K.mx ?? 1) * K.A * x + K.B[0], K.A * (K.piv + (y - K.piv) * c - z * s) + K.B[1]]; }
function planeT(K, z0 = 0, o = [0, 0], sc = 1) {            // the plane z = z0 (optionally translated to o, scaled)
  const c = Math.cos(K.th), q = proj(K, o[0], o[1], z0);
  ctx.setTransform((K.mx ?? 1) * K.A * sc, 0, 0, K.A * c * sc, q[0], q[1]);
}
const ID = () => ctx.setTransform(1, 0, 0, 1, 0, 0);
function strokePx(w, col) { ID(); ctx.lineWidth = w; if (col) ctx.strokeStyle = col; ctx.stroke(); }

// ---------------------------------------------------------------- the world
const GS = 26;                                         // top of the glass
const SC = { hx: 160, hy: 160, r: 26 };                 // the scale: 320 × 320 mm
const FX = 80;                                          // feet centred at x = ±80
const HEEL = -140;                                      // the back of the heels (y); the feet point to +y (the camera)
const PADS = [[FX, 45, 106, 92], [-FX, 45, 106, 92], [FX, -104, 98, 74], [-FX, -104, 98, 74]];   // cx, cy, w, h (front pads carry the current)
const LCDP = { x: 0, y: 130, w: 80, h: 32 };            // the display, in front of the toes (it faces the person)
const PH = { x: 420, y: 22, w: 76, h: 158 };            // the phone on the floor (its top towards −y)
const HC = 330, ZC = GS + HC;                           // the calf cut: 330 mm above the sole

// ---------------------------------------------------------------- keys
const lin = (x) => x;
const KH0 = key([0, -20, 120], [540, 925], 2.45, 50);          // frame 0: the scale, the feet, the shins
const KH1 = key([-8, -8, 104], [540, 890], 2.8, 50);
const KW = key([0, -6, GS], [540, 1070], 2.05, 30);             // the pads: from higher up, the whole scale
const KW2 = key([20, -10, GS], [540, 1036], 2.58, 30);
const KF = key([FX - 6, -24, 46], [560, 985], 3.4, 46);         // the left foot on its pad (from a little above; no toe close-up)
const KF2 = key([FX - 2, -30, 50], [560, 960], 3.8, 46);
const KB = key([0, -70, 560], [540, 1000], 0.8, 90);            // the lower body from the front
const KB2 = key([16, -70, 545], [540, 950], 0.95, 90);
const CALF = [FX, -90, ZC];                                     // the cut's centre
const KCut = key(CALF, [520, 1080], 5.0, 90);
const KSec = key(CALF, [500, 1150], 6.5, 58);                   // looking at the cut
const KSec2 = key([CALF[0] - 2, CALF[1], ZC], [504, 1154], 6.8, 56);
const KPr = key([90, -70, 540], [420, 1000], 0.8, 90);          // the principle: the body on the left, a big dial on the right
const KPr2 = key([96, -70, 530], [416, 990], 0.86, 90);
function kFollow(t) {                                            // ride one pulse round the loop
  const u = E.sine(prog(t, T.follow + 0.15, T.followEnd)), p = cAt(CPATH.len * u);
  return key([p[0], -70, p[2]], [540, 1010], 1.7, 90);
}
const KHc = key([-110, -20, 200], [600, 1000], 1.5, 50);         // the person on the right: the magnifiers (display / calf)
const KHc2 = key([-60, -20, 196], [560, 984], 1.66, 50);
const KSecB = key(CALF, [380, 1120], 5.4, 58);                  // the second dive: the cut on the left, a dial on the right
const KSecB2 = key([CALF[0] + 2, CALF[1], ZC], [384, 1124], 5.65, 57);
const KH2 = key([30, -30, 150], [540, 1000], 1.62, 50);         // out again (the card sits over it)
const KH2b = key([50, -30, 150], [540, 990], 1.9, 50);
const KP = key([PH.x, PH.y - 6, 8], [540, 1060], 7.6, 14);      // the phone, its form (its top edge under the caption wash)
const KP2 = key([PH.x + 2, PH.y - 8, 8], [540, 1052], 7.9, 14);
const KR = key([0, -20, 120], [540, 925], 2.45, 50);            // step on again
const KR2 = key([8, -8, 104], [540, 890], 2.8, 50);
const KT = key([PH.x, PH.y - 10, 8], [540, 1030], 7.6, 14);     // the tip: the history
const KT2 = key([PH.x + 2, PH.y - 11, 8], [540, 1024], 8.1, 14);
const KE = key([0, -10, GS], [540, 1060], 2.0, 28);             // back to the scale, empty now
const KE2 = key([0, -12, GS], [540, 1056], 2.15, 28);
const K7 = key([0, 0, GS], [232, 545], 0.53, 0);                // the end badge (from straight above)
function punch(K, pk, c = [540, 1100]) { return { ...K, A: K.A * pk, Z: K.Z * pk, B: [c[0] + pk * (K.B[0] - c[0]), c[1] + pk * (K.B[1] - c[1])] }; }
function cam(t) {
  if (t < T.a2) return interp(KH0, KH1, lin(prog(t, 0, T.a2)));
  if (t < T.a2 + 0.7) return interp(KH1, KW, E.p3io(prog(t, T.a2, T.a2 + 0.7)));
  if (t < T.close) return interp(KW, KW2, lin(prog(t, T.a2 + 0.7, T.close)));
  if (t < T.closeEnd) return interp(KW2, KF, E.p3io(prog(t, T.close, T.closeEnd)));
  if (t < T.pullB) return interp(KF, KF2, lin(prog(t, T.closeEnd, T.pullB)));
  if (t < T.pullBEnd) return interp(KF2, KB, E.p3io(prog(t, T.pullB, T.pullBEnd)), E.p2io(prog(t, T.pullB, T.pullBEnd)));
  if (t < T.follow) return interp(KB, KB2, lin(prog(t, T.pullBEnd, T.follow)));
  if (t < T.followEnd) return interp(KB2, kFollow(t), E.p2io(prog(t, T.follow, T.follow + 0.45)));
  if (t < T.prWideEnd) return interp(kFollow(T.followEnd), KPr, E.p3io(prog(t, T.followEnd, T.prWideEnd)));
  if (t < T.dive) return interp(KPr, KPr2, lin(prog(t, T.prWideEnd, T.dive)));
  if (t < T.tilt) return interp(KPr2, KCut, E.p2in(prog(t, T.dive, T.tilt)) * 0.55 + 0.45 * prog(t, T.dive, T.tilt));   // one take: in
  if (t < T.tiltEnd) return interp(KCut, KSec, E.p2out(prog(t, T.tilt, T.tiltEnd)), E.p2io(prog(t, T.tilt, T.tiltEnd)));
  if (t < T.out) return interp(KSec, KSec2, lin(prog(t, T.tiltEnd, T.out)));
  if (t < T.outEnd) return interp(KSec2, KHc, E.p3io(prog(t, T.out, T.outEnd)), E.p2io(prog(t, T.out, T.outEnd)));
  if (t < T.dive2) return interp(KHc, KHc2, lin(prog(t, T.outEnd, T.dive2)));
  if (t < T.tilt2End) return interp(KHc2, KSecB, E.p2in(prog(t, T.dive2, T.tilt2End)) * 0.5 + 0.5 * E.sine(prog(t, T.dive2, T.tilt2End)), E.p2io(prog(t, T.dive2 + 0.4, T.tilt2End)));   // in again
  if (t < T.out2) return interp(KSecB, KSecB2, lin(prog(t, T.tilt2End, T.out2)));
  if (t < T.out2End) return interp(KSecB2, KH2, E.p3io(prog(t, T.out2, T.out2End)), E.p2io(prog(t, T.out2, T.out2End)));
  if (t < T.pan) return interp(KH2, KH2b, lin(prog(t, T.out2End, T.pan)));
  if (t < T.panEnd) return interp(KH2b, KP, E.p3io(prog(t, T.pan, T.panEnd)), E.p2io(prog(t, T.pan, T.panEnd)));
  if (t < T.q9) return interp(KP, KP2, lin(prog(t, T.panEnd, T.q9)));
  if (t < T.q9 + 0.6) return interp(KP2, KR, E.p3io(prog(t, T.q9, T.q9 + 0.6)), E.p2io(prog(t, T.q9, T.q9 + 0.6)));
  if (t < T.ka) return interp(KR, KR2, lin(prog(t, T.q9 + 0.6, T.tip)));
  if (t < T.tip) { const pk = 1 + 0.04 * Math.sin(Math.PI * clamp((t - T.ka) / 0.4)); return punch(interp(KR, KR2, lin(prog(t, T.q9 + 0.6, T.tip))), pk, [540, 1200]); }
  if (t < T.pan2End) return interp(KR2, KT, E.p3io(prog(t, T.pan2, T.pan2End)), E.p2io(prog(t, T.pan2, T.pan2End)));
  if (t < T.back3) return interp(KT, KT2, lin(prog(t, T.pan2End, T.back3)));
  if (t < T.back3End) return interp(KT2, KE, E.p3io(prog(t, T.back3, T.back3End)), E.p2io(prog(t, T.back3, T.back3End)));
  if (t < T.end) return interp(KE, KE2, lin(prog(t, T.back3End, T.end)));

// ---------------------------------------------------------------- drawing helpers
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function line(x0, y0, x1, y1) { ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); }
const MEASURE = new Map();
function mw(font, s) { const k = font + "|" + s; let v = MEASURE.get(k); if (v === undefined) { ctx.font = font; v = ctx.measureText(s).width; MEASURE.set(k, v); } return v; }
function parse(str) { const out = []; let a = 0; for (const ch of str) { if (ch === "[") { a = 1; continue; } if (ch === "]") { a = 0; continue; } out.push({ ch, a }); } return out; }
const plain = (str) => str.replace(/[\[\]]/g, "");
function fitSize(str, size, maxW, face = DISPLAY, wt = "") { const f = `${wt} ${size}px ${face}`.trim(), w = mw(f, plain(str)); return w > maxW ? Math.floor(size * maxW / w) : size; }
// text in world units (mm) on the current transform: drawn at 10× size and scaled down (crisp at any zoom)
function uiText(str, x, y, sizeMM, col, o = {}) {
  ctx.save(); ctx.translate(x, y); ctx.scale(0.1, 0.1);
  ctx.font = `${o.weight ?? 700} ${sizeMM * 10}px ${o.face ?? UI}`; ctx.fillStyle = col; ctx.textAlign = o.align ?? "center"; ctx.textBaseline = o.base ?? "alphabetic";
  ctx.fillText(str, 0, 0); ctx.restore();
}
// Text band: style none | blur | type | slam | wipe; left aligned at x.
function lines(L, t, t0, t1, o = {}) {
  if (t < t0 || t >= t1) return;
  const x = o.x ?? 96, ys = o.ys ?? [330, 472], face = o.face ?? DISPLAY, wt = o.weight ?? "";
  const col = o.col ?? C.ink, acc = o.acc ?? C.acc, style = o.style ?? "blur";
  const stag = o.stag ?? 0.055, lineGap = o.lineGap ?? 0.16, exitDur = o.exit ?? 0.16, maxW = o.maxW ?? 900;
  ID();
  L.forEach((str, i) => {
    const size = fitSize(str, Array.isArray(o.size) ? o.size[i] : (o.size ?? 112), maxW, face, wt);
    const font = `${wt} ${size}px ${face}`.trim();
    const chars = parse(str), ls = t0 + i * lineGap;
    if (t < ls) return;
    let pre = "";
    ctx.save();
    if (style === "slam") { const sc = slamScale(t - ls), cy = ys[i] - size * 0.35; ctx.translate(x, cy); ctx.scale(sc, sc); ctx.translate(-x, -cy); }
    if (style === "wipe") { const wv = mw(font, plain(str)); ctx.beginPath(); ctx.rect(0, ys[i] - size * 1.2, x + wv * E.p3out(prog(t, ls, ls + 0.32)) + 4, size * 1.6); ctx.clip(); }
    ctx.font = font; ctx.textBaseline = "alphabetic";
    chars.forEach((c, j) => {
      const cx = x + mw(font, pre); pre += c.ch;
      const lt = t - (ls + j * stag);
      let a = 1, blur = 0;
      if (style === "blur") { const k = clamp(lt / 0.13); a = k; blur = 9 * (1 - k); }
      else if (style === "type") { a = lt >= 0 ? 1 : 0; }
      if (t > t1 - exitDur) { const e = clamp((t - (t1 - exitDur)) / exitDur); a *= 1 - e; blur = Math.max(blur, 10 * e); }
      if (a <= 0.003) return;
      ctx.globalAlpha = a; ctx.filter = blur > 0.3 ? `blur(${blur.toFixed(1)}px)` : "none";
      ctx.fillStyle = c.a ? acc : col; ctx.fillText(c.ch, cx, ys[i]);
    });
    ctx.restore(); ctx.filter = "none"; ctx.globalAlpha = 1;
  });
}
function label(str, x, y, size, col, t, t0, t1, o = {}) {
  if (t < t0 || t >= t1) return;
  ID(); const font = `${o.weight ?? 700} ${size}px ${o.face ?? UI}`; const wv = mw(font, str);
  const k = E.p3out(prog(t, t0, t0 + 0.28)), e = prog(t, t1 - 0.15, t1);
  ctx.save(); ctx.font = font; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  const left = o.align === "right" ? x - wv : o.align === "center" ? x - wv / 2 : x;
  ctx.beginPath(); ctx.rect(left - 4, y - size * 1.2, (wv + 8) * k, size * 1.6); ctx.clip();
  ctx.globalAlpha = (o.alpha ?? 1) * (1 - e); if (e > 0) ctx.filter = `blur(${(8 * e).toFixed(1)}px)`;
  ctx.fillStyle = col; ctx.fillText(str, left, y); ctx.restore(); ctx.filter = "none";
}
function underline(str, prefix, word, lineIdx, t, t0, t1, ys = [330, 472], size0 = 112) {
  if (t < t0 || t >= t1) return;
  const size = fitSize(str, size0, 900), f = `${size}px ${DISPLAY}`;
  const x0 = 96 + mw(f, prefix), wv = mw(f, word), k = E.p3out(prog(t, t0, t0 + 0.3)), fo = 1 - prog(t, t1 - 0.16, t1);
  ID(); ctx.globalAlpha = fo; ctx.fillStyle = C.acc; ctx.fillRect(x0 - 4, ys[lineIdx] + 20, (wv + 8) * k, 11); ctx.globalAlpha = 1;
}
// a leader from a label to a point, with a small dot at the point
function leader(x0, y0, x1, y1, col, k = 1, w = 2.5) {
  ID(); ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(lerp(x0, x1, k), lerp(y0, y1, k)); ctx.stroke();
  if (k > 0.98) { ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x1, y1, 6, 0, TAU); ctx.fill(); }
  ctx.restore();
}

// ---------------------------------------------------------------- geometry: hulls and tubes
function hull(P) {
  P.sort((a, b) => a[0] - b[0] || a[1] - b[1]);

  const yc = 2, dot = (x, al) => { ctx.fillStyle = `rgba(${ACC},${al})`; ctx.beginPath(); ctx.arc(x, yc, 13, 0, TAU); ctx.fill(); ctx.strokeStyle = `rgba(${INK},${al})`; ctx.lineWidth = 3; ctx.stroke(); ctx.fillStyle = `rgba(${PAP},${al})`; ctx.beginPath(); ctx.arc(x, yc, 4.6, 0, TAU); ctx.fill(); };
  const on = clamp((t - T.blocksEnd) / 0.3);
  if (on > 0) {
    if (m) { const gap = 40, off = (t * 330) % gap; ctx.strokeStyle = `rgba(${ACC},${0.35 * on})`; ctx.lineWidth = 5; line(x0, yc, x1, yc); for (let x = x0 - gap + off; x < x1 + gap; x += gap) dot(x, on); }
    else {
      const go = t >= T.fatGo ? 1 : 0.35, L = w + 40;
      ctx.strokeStyle = `rgba(${ACC},${0.18 * on})`; ctx.lineWidth = 4; ctx.setLineDash([10, 12]); line(x0, yc, x1, yc); ctx.setLineDash([]);
      for (let q = 0; q < 3; q++) { const tt = (t - T.blocksEnd) * go + q * 4.2, n = Math.floor(tt / 0.5), f = (tt / 0.5) - n, step = E.p3io(clamp(f / 0.35));   // moves a little, then stalls
        const x = x0 - 20 + ((n + step) * 22) % L, al = on * Math.min(1, (x - x0 + 20) / 30) * Math.min(1, (x1 + 20 - x) / 30); if (al > 0.01) dot(x, al); }
    }
  }
  ctx.restore();
  ctx.restore();
}
function samples(t, K) {
  if (t < T.blocks || t >= T.twinEnd) return;
  const bk = blockK(t), em = E.p3out(prog(t, T.blocks, T.blocksEnd));
  const fromM = proj(K, CALF[0] - 6, CALF[1] - 14, ZC), fromF = proj(K, CALF[0] - 46, CALF[1] - 6, ZC);
  const litM = t < T.a5 ? 1 : 0.4, litF = t < T.a5 ? 0.32 : 1;
  const posM = [lerp(fromM[0], BLK.xm, em), lerp(fromM[1], BLK.y, em)], posF = [lerp(fromF[0], BLK.xf, em), lerp(fromF[1], BLK.y, em)], sc = lerp(0.22, 1, em) * lerp(1, 0.7, 1 - bk);
  // the wires and meters underneath (after the blocks have landed)
  const wk = E.p3out(prog(t, T.blocksEnd, T.blocksEnd + 0.35)) * bk;
  [[BLK.xm, "m", litM, 0.18 * spring(t - T.blocksEnd - 0.2, 10, 0.6)], [BLK.xf, "f", litF, t >= T.fatGo ? 0.88 * spring(t - T.fatGo - 0.25, 7, 0.55) : 0.0]].forEach(([x, kind, lit, v]) => {
    if (wk <= 0.01) return;
    const al = wk * lerp(0.62, 1, lit > 0.5 ? 1 : 0), xa = x - BLK.w / 2 - 12, xb = x + BLK.w / 2 + 12, yb = BLK.y + BLK.h / 2 + 12;
    ID(); ctx.save(); ctx.globalAlpha = al; ctx.strokeStyle = "rgba(241,240,236,0.8)"; ctx.lineWidth = 3; ctx.lineJoin = "round";
    ctx.beginPath(); ctx.moveTo(xa, yb); ctx.lineTo(xa, BLK.my); ctx.lineTo(x - BLK.mr, BLK.my); ctx.moveTo(xb, yb); ctx.lineTo(xb, BLK.my); ctx.lineTo(x + BLK.mr, BLK.my); ctx.stroke(); ctx.restore();
    dial(x, BLK.my, BLK.mr, v, al, { ends: true, endsCol: C.paper });
  });
  sampleBlock(t, "m", posM[0], posM[1], sc, bk * (0.35 + 0.65 * Math.max(em, 0.3)) * lerp(0.72, 1, litM > 0.5 ? 1 : 0), litM > 0.5 ? E.p2io(prog(t, T.blocksEnd, T.blocksEnd + 0.3)) * (t < T.a5 ? 1 - prog(t, T.a5 - 0.2, T.a5) : 0) : 0);
  sampleBlock(t, "f", posF[0], posF[1], sc, bk * (0.35 + 0.65 * Math.max(em, 0.3)) * lerp(0.72, 1, litF > 0.5 ? 1 : 0), t >= T.a5 ? E.p2io(prog(t, T.a5, T.a5 + 0.3)) * (1 - prog(t, T.twin - 0.2, T.twin)) : 0);
}
// two calves side by side (22.5–28): the same current; thin fat on the left, thick on the right — the right dial reads higher
const KTL = key([0, -6, 0], [268, 955], 4.4, 58), KTR = key([0, -6, 0], [800, 955], 4.4, 58);
const FK_THIN = 0.7, FK_THICK = 2.0;                              // the right ring ≈ 2.9 × the left one
function twinK(t) { return t < T.twin ? 0 : E.p3out(prog(t, T.twin, T.twinEnd)) * (1 - E.p2io(prog(t, T.out, T.out + 0.35))); }
function twins(t) {
  const a = twinK(t); if (a <= 0.01) return;
  const dim = t >= T.name ? lerp(1, 0.55, E.p2io(prog(t, T.name, T.name + 0.3))) : 1, z = lerp(0.55, 1, E.p3out(prog(t, T.twin, T.twinEnd)));
  [[KTL, FK_THIN, 1], [KTR, FK_THICK, 0.5]].forEach(([K0, fk, sp]) => {
    const K = { ...K0, A: K0.A * z, Z: K0.Z * z }; K.B = [K0.B[0] + (1 - z) * (K0.B[0] - K0.B[0]), K0.B[1]];
    ctx.save(); ctx.globalAlpha = a * dim;
    const sh = drawSection(t, K, 0, 0, 0, { fk, hiM: 0, hiF: 0, lineW: 2.5 });
    drawFlow(t, K, 0, 0, 0, sh, { hgt: 66, aM: sp < 1 ? 0.85 : 1, aF: 0.9, speed: sp, r: 8.5 });   // thick fat: fewer, slower charges
    ctx.restore();
  });
  ID(); ctx.save(); ctx.globalAlpha = a * dim * E.p3out(prog(t, T.twinEnd - 0.2, T.twinEnd + 0.2)) * (1 - E.p2io(prog(t, T.twinLabOut, T.twinLabOut + 0.3))); ctx.font = `700 54px ${UI}`; ctx.fillStyle = C.paper; ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
  ctx.fillText(COPY.fatLow, 268, 1172); ctx.fillText(COPY.fatHigh, 800, 1172); ctx.restore();
  const sw = spring(t - T.twinEnd, 7, 0.55) * (t >= T.twinEnd ? 1 : 0), br = 0.012 * Math.sin(TAU * 0.4 * t);   // the needles swing over as the current flows
  dial(268, 1318, 100, 0.1 * sw + br, a * dim);
  dial(800, 1318, 100, 0.9 * sw - br, a * dim);
}
// the name (25–28): the big dial comes back over the two calves, and now it has a name: 电阻
function nameDial(t) {
  if (t < T.name || t >= T.out + 0.5) return;
  const a = E.p3out(prog(t, T.name, T.name + 0.12)) * (1 - E.p2io(prog(t, T.out, T.out + 0.4)));
  const sc = slamScale(t - T.name) * (1 + 0.05 * Math.sin(Math.PI * clamp((t - T.name - 0.17) / 0.35)));
  const v = 0.86 + 0.08 * Math.sin(Math.PI * clamp((t - T.name) / 0.5)) + 0.01 * Math.sin(TAU * 0.4 * t);
  ID(); ctx.save(); ctx.globalAlpha = 0.6 * a; ctx.fillStyle = C.dark; ctx.beginPath(); ctx.arc(540, 1075, 250 * sc, 0, TAU); ctx.fill(); ctx.restore();
  dial(540, 1075, 215, v, a, { sc, label: COPY.ohm });
}

// ---------------------------------------------------------------- text
function groundRGB(t) { const o = orangeK(t), g = hexRGB(C.ground), q = hexRGB(C.acc); return [0, 1, 2].map((i) => Math.round(lerp(g[i], q[i], o))).join(","); }
function scrim(t) {
  const fl = flood(t);
  const STOPS = [[0, 1], [0.66, 1], [0.74, 0.86], [0.82, 0.56], [0.9, 0.24], [1, 0]];   // fully opaque down to y ≈ 528
  if (fl > 0.02) { ID(); const g = ctx.createLinearGradient(0, 0, 0, 800); STOPS.forEach(([o, k]) => g.addColorStop(o, `rgba(23,25,28,${fl * k})`)); ctx.fillStyle = g; ctx.fillRect(0, 0, W, 800); }
  const a = (1 - fl) * (t >= T.end ? 1 - prog(t, T.end, T.end + 0.3) : 1);
  if (a <= 0.01) return;
  const col = groundRGB(t);
  ID(); const g = ctx.createLinearGradient(0, 0, 0, 800);
  STOPS.forEach(([o, k]) => g.addColorStop(o, `rgba(${col},${a * k})`));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, 800);
}
function textBand(t) {
  const L = C.ink, D = C.paper, fl = flood(t), M = mixHex(L, D, fl);
  // 1 the phenomenon — no noun
  lines(COPY.h1, t, -1, T.h1Out + 0.16, { style: "none", col: L });
  underline(COPY.h1[1], "你有多少", "脂肪", 1, t, T.underline, T.h1Out + 0.16);
  // the fact, straight away (one of the three loudest hits)
  lines(COPY.a2, t, T.a2, T.q3, { style: "slam", col: L, lineGap: 0.2 });
  lines(COPY.q3, t, T.q3, T.a3, { style: "blur", col: L });
  lines(COPY.a3, t, T.a3, T.q4, { style: "blur", col: L });
  lines(COPY.q4, t, T.q4, T.pr, { style: "blur", col: L });
  lines(COPY.pr, t, T.pr, T.fq, { style: "blur", col: L });
  lines(COPY.fq, t, T.fq, T.a4, { style: "blur", col: M });
  // the comparison (dark)
  lines(COPY.a4, t, T.a4, T.a5, { style: "blur", col: D });
  lines(COPY.a5, t, T.a5, T.a6, { style: "blur", col: D });
  lines(COPY.a6, t, T.a6, T.stop1 + 0.12, { style: "blur", col: D });
  lines(COPY.name, t, T.name, T.q6, { style: "slam", col: D, ys: [318, 492], size: [96, 136], lineGap: 0.25 });
  // every time a different number; the water; can it tell?
  lines(COPY.q6, t, T.q6, T.a9, { style: "blur", col: M });
  lines(COPY.a9, t, T.a9, T.a10, { style: "blur", col: L });
  lines(COPY.a10, t, T.a10, T.q7, { style: "blur", col: L });
  lines(COPY.q7, t, T.q7, T.n1, { style: "blur", col: M });
  lines(COPY.n1, t, T.n1, T.n2, { style: "blur", col: D });
  lines(COPY.n2, t, T.n2, T.a7, { style: "blur", col: D });
  // the estimate
  lines(COPY.a7, t, T.a7, T.a8, { style: "blur", col: M });
  lines(COPY.a8, t, T.a8, T.q9, { style: "blur", col: L });
  // back to the phenomenon
  lines(COPY.q9, t, T.q9, T.fin, { style: "blur", col: L });
  lines(COPY.fin, t, T.fin, T.finOut, { style: "slam", col: L, lineGap: 0.25 });
  // the tip in the same place; then the safety line as its own full-size caption beat
  label(COPY.tipTag, 98, 206, 46, C.acc, t, T.tip, T.tipOut, { weight: 700 });
  lines(COPY.tip, t, T.tip + 0.15, T.tipOut, { style: "blur", col: L, lineGap: 0.3 });
  lines(COPY.pace, t, T.pace, T.paceOut, { style: "blur", col: L, lineGap: 0.25 });
}
function overlays(t, K) {                               // labels in the picture: few and short
  const fl = flood(t);
  if (fl > 0.5 && t >= T.labels && t < T.blocks + 0.3) {    // inside the calf: name the two layers
    const k = E.p3out(prog(t, T.labels, T.labels + 0.35)), fo = 1 - prog(t, T.blocks, T.blocks + 0.3);
    const sh = secShape(1);
    const pm = proj(K, CALF[0] - 22, CALF[1] - 12, ZC), pf = proj(K, CALF[0] + sh.out[24][0] * 0.5 + sh.mus[24][0] * 0.5, CALF[1] + sh.out[24][1] * 0.5 + sh.mus[24][1] * 0.5, ZC);
    const lm = [72, 860], lf = [72, 1420];
    ID(); ctx.save(); ctx.globalAlpha = fo;
    leader(lm[0] + 116, lm[1] - 18, pm[0], pm[1], "rgba(241,240,236,0.8)", k); leader(lf[0] + 116, lf[1] - 18, pf[0], pf[1], "rgba(241,240,236,0.8)", k);
    ctx.restore();
    label(COPY.muscle, lm[0], lm[1], 56, "rgba(241,240,236,0.95)", t, T.labels, T.blocks + 0.3, { alpha: fo });
    label(COPY.fat, lf[0], lf[1], 56, "rgba(241,240,236,0.95)", t, T.labels, T.blocks + 0.3, { alpha: fo });
  }
  if (t >= T.blocksEnd && t < T.twin + 0.4) {               // the two samples carry their names
    const fo = 1 - prog(t, T.twin, T.twin + 0.4), aM = t < T.a5 ? 1 : 0.5, aF = t < T.a5 ? 0.5 : 1;
    label(COPY.muscle, BLK.xm, BLK.y - BLK.h / 2 - 58, 58, "rgba(241,240,236,0.95)", t, T.blocksEnd, T.twin + 0.4, { align: "center", alpha: fo * aM });
    label(COPY.fat, BLK.xf, BLK.y - BLK.h / 2 - 58, 58, "rgba(241,240,236,0.95)", t, T.blocksEnd, T.twin + 0.4, { align: "center", alpha: fo * aF });

function endCard(t) {
  if (t < T.title1) return;

  lines([COPY.epNum], t, T.ep, DUR + 1, { style: "slam", col: C.ink, x: 400, ys: [520], size: 150 });
  lines([COPY.epName], t, T.ep + 0.25, DUR + 1, { style: "blur", col: C.ink, x: 404, ys: [668], size: 112 });
  if (t >= T.sting) {
    const K = cam(t), c = proj(K, 0, -16, GS), sc = spring(t - T.sting, 16, 0.5);
    ID(); ctx.save(); ctx.translate(c[0], c[1]); ctx.scale(sc, sc); ctx.font = `200px ${DISPLAY}`; ctx.fillStyle = C.acc; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("?", 6, 0); ctx.restore();
  }

function frame(t) {
  ctx.reset();
  ID();
  const K = cam(t), fl = flood(t);
  if (fl < 0.999) drawLight(t, K);
  drawInterior(t, K, fl);
  if (t >= T.blocks && t < T.out + 0.5) {                          // the comparison: its own layer, slowly pushed in (it never parks)
    const prev = ctx; ctx = CMPX; ctx.reset(); samples(t, K); twins(t); nameDial(t); ctx = prev;
    const z = 1 + 0.011 * (t - T.blocks) + (t >= T.name ? 0.015 * (t - T.name) : 0), cx = 540, cy = 1060, dx = 6 * Math.sin(TAU * (t - T.blocks) / 9.5);
    ID(); ctx.save(); ctx.setTransform(z, 0, 0, z, cx - z * cx + dx, cy - z * cy); ctx.drawImage(CMP, 0, 0); ctx.restore();
  }
  waterDial(t);
  scrim(t);
  overlays(t, K);
  card(t);
  displayMag(t, K);
  calfMag(t, K);
  textBand(t);
  endCard(t);

// ---------------------------------------------------------------- motion blur: temporal supersampling where things move fast
const BLUR = [[0, 0.6], [2.75, 3.5], [5.0, 5.95], [6.75, 7.8], [9.25, 11.8], [13.75, 15.05], [15.25, 15.8], [20.0, 20.65], [22.45, 22.95], [25.25, 26.3], [32.25, 33.8], [39.0, 40.05], [41.75, 42.65], [44.5, 45.85], [48.75, 49.7], [51.5, 52.35], [54.25, 54.9]];
const SUB = 14, SHUTTER = 0.5 / FPS;            // 14 sub-frames: no stair-stepped ghosts
window.seek = function seek(t) {
  t = clamp(t, 0, DUR - 1e-6);
  const blur = BLUR.some(([a, b]) => t >= a && t < b);
  if (!blur) { ctx = MAIN; frame(t); return; }
  MAIN.reset();
  for (let i = 0; i < SUB; i++) {
    ctx = OFFX;
    const ts = t + SHUTTER * (i / (SUB - 1) - 0.5);
    frame(clamp(ts, 0, DUR - 1e-6));
    MAIN.setTransform(1, 0, 0, 1, 0, 0); MAIN.globalAlpha = 1 / (i + 1); MAIN.drawImage(OFF, 0, 0);
  }
  MAIN.globalAlpha = 1; ctx = MAIN;
};
window.DUR = DUR; window.FPS = FPS;
window.addEventListener("hf-seek", (e) => window.seek(e.detail.time));
window.ready = false;
window.whenReady = Promise.all([
  document.fonts.load(`100px ${DISPLAY}`, "体脂秤怎么知道你有多少脂肪"), document.fonts.load(`700 50px ${UI}`, "体脂率肌肉脂肪电阻"), document.fonts.load(`400 50px ${UI}`, "个人资料"),
]).then(() => document.fonts.ready).then(() => { MEASURE.clear(); window.seek(0); window.ready = true; });
</script>
