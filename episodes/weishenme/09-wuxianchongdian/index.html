<script>
// EP.09 无线充电 — 第二季：半透明玻璃实物。window.seek(t) paints frame t; a pure function of t (seeded noise only).
// World units ≈ 0.1 mm. The pad is a glass puck (r 300, h 60), its coil 30 below the top; the phone (420 × 880 × 44) lies on it,
// its coil 20 above its bottom: ~50 between the two coils (to scale-ish). A small 3D projector draws everything; the camera is
// keyframed. Two side-by-side comparisons (放正 / 放歪; 手机 / 钥匙) render the same world twice with two cameras.
const { T, COPY, SUBS, W, H, DUR, E8 } = TL;
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const C = {
  bg0: "#EEF0F2", bg1: "#DCE1E6", ink: "#141414", acc: "#FF4A1C", copper: "#C9824F", copperDk: "#8E5230",
  field: "110,140,255", skin: "#EBCBA5", skinSh: "#D6AD84", ferrite: "#3A3F48", magnet: "#5B6170", metal: "#9BA3AE",
};
const DISPLAY = "Smiley", UI = "NotoSC";
const TAU = Math.PI * 2;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const E = { p2io: (x) => (x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2), p3out: (x) => 1 - Math.pow(1 - x, 3), p3io: (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2), back: (x) => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); } };
const win = (t, a, b, fi = 0.25, fo = 0.25) => E.p3out(prog(t, a, a + fi)) * (1 - E.p2io(prog(t, b - fo, b)));
function spring(x, w = 15, z = 0.72) { if (x <= 0) return 0; return 1 - Math.exp(-z * w * x) * Math.cos(w * Math.sqrt(1 - z * z) * x); }
function slamScale(u) { if (u <= 0) return 1.55; if (u < 0.09) return lerp(1.55, 0.94, E.p2io(u / 0.09)); if (u < 0.17) return lerp(0.94, 1, E.p2io((u - 0.09) / 0.08)); return 1; }

// ================================================================ 3D
function makeP(c) {
  const ce = Math.cos(c.el), se = Math.sin(c.el), ca = Math.cos(c.az), sa = Math.sin(c.az);
  return ([x, y, z]) => {
    x -= c.tx; y -= c.ty; z -= c.tz;
    const x1 = x * ca - y * sa, y1 = x * sa + y * ca;
    const yv = y1 * ce + z * se, zv = -y1 * se + z * ce, s = c.focal / (c.dist + yv);
    return [c.cx + x1 * s, c.cy - zv * s, c.dist + yv];
  };
}
function rrPts(w, h, r, z, n = 8) {
  const pts = [], hw = w / 2, hh = h / 2;
  for (const [cx, cy, a0] of [[hw - r, hh - r, 0], [-hw + r, hh - r, Math.PI / 2], [-hw + r, -hh + r, Math.PI], [hw - r, -hh + r, 1.5 * Math.PI]])
    for (let i = 0; i <= n; i++) { const a = a0 + (i / n) * Math.PI / 2; pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a), z]); }
  return pts;
}
const circ = (r, z, n = 72, ox = 0, oy = 0) => Array.from({ length: n }, (_, i) => { const a = i / n * TAU; return [ox + r * Math.cos(a), oy + r * Math.sin(a), z]; });
function poly(P, pts, close = true) { ctx.beginPath(); pts.forEach((p, i) => { const q = P(p); i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]); }); if (close) ctx.closePath(); }
function hull2(pts) {
  const p = pts.map((q) => [q[0], q[1]]).sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cr = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]); const lo = [], up = [];
  for (const q of p) { while (lo.length >= 2 && cr(lo[lo.length - 2], lo[lo.length - 1], q) <= 0) lo.pop(); lo.push(q); }
  for (const q of p.slice().reverse()) { while (up.length >= 2 && cr(up[up.length - 2], up[up.length - 1], q) <= 0) up.pop(); up.push(q); }
  return lo.slice(0, -1).concat(up.slice(0, -1));
}
function hullPath(P, ptsA) { const h = hull2(ptsA.map(P)); ctx.beginPath(); h.forEach((q, i) => (i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]))); ctx.closePath(); }

// ================================================================ background + glass
let BG = null, BGBLUR = null;
function paintBackground(c2) {
  const g = c2.createLinearGradient(0, 0, 0, H); g.addColorStop(0, C.bg0); g.addColorStop(1, C.bg1); c2.fillStyle = g; c2.fillRect(0, 0, W, H);
  const blob = (x, y, r, col) => { const rg = c2.createRadialGradient(x, y, 0, x, y, r); rg.addColorStop(0, col); rg.addColorStop(1, "rgba(255,255,255,0)"); c2.fillStyle = rg; c2.fillRect(0, 0, W, H); };
  blob(860, 820, 640, "rgba(255,150,110,0.26)"); blob(160, 1250, 720, "rgba(120,160,255,0.24)"); blob(540, 1500, 520, "rgba(255,255,255,0.5)");
}
function buildBG() {
  BG = document.createElement("canvas"); BG.width = W; BG.height = H; paintBackground(BG.getContext("2d"));
  BGBLUR = document.createElement("canvas"); BGBLUR.width = W; BGBLUR.height = H; const b = BGBLUR.getContext("2d"); b.filter = "blur(28px)"; b.drawImage(BG, 0, 0);
}
let TNOW = 0;
function glass(pathFn, { tint = 0.3, sheen = -0.7, rim = 2.4, dark = 0, a = 1 } = {}) {
  if (a <= 0.01) return;
  sheen += 0.22 * Math.sin(0.9 * TNOW);
  ctx.save(); ctx.globalAlpha = a; pathFn(); ctx.clip();
  ctx.drawImage(BGBLUR, 0, 0);
  ctx.fillStyle = `rgba(255,255,255,${tint})`; ctx.fillRect(0, 0, W, H);
  if (dark) { ctx.fillStyle = `rgba(40,50,70,${dark})`; ctx.fillRect(0, 0, W, H); }
  const b = 1400, g = ctx.createLinearGradient(540 - b * Math.cos(sheen), 1000 - b * Math.sin(sheen), 540 + b * Math.cos(sheen), 1000 + b * Math.sin(sheen));
  g.addColorStop(0, "rgba(255,255,255,0)"); g.addColorStop(0.42, "rgba(255,255,255,0.05)"); g.addColorStop(0.47, "rgba(255,255,255,0.36)");
  g.addColorStop(0.5, "rgba(255,255,255,0.08)"); g.addColorStop(0.56, "rgba(255,255,255,0.18)"); g.addColorStop(0.6, "rgba(255,255,255,0.02)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.restore();
  ctx.save(); ctx.globalAlpha = a; pathFn(); ctx.lineWidth = rim; ctx.strokeStyle = "rgba(255,255,255,0.85)"; ctx.stroke(); ctx.lineWidth = 1; ctx.strokeStyle = "rgba(80,90,110,0.25)"; ctx.stroke(); ctx.restore();
}
function shadow(x, y, rx, ry, a) { ctx.save(); ctx.translate(x, y); ctx.scale(1, ry / rx); const g = ctx.createRadialGradient(0, 0, 0, 0, 0, rx); g.addColorStop(0, `rgba(30,40,60,${a})`); g.addColorStop(1, "rgba(30,40,60,0)"); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, rx, 0, TAU); ctx.fill(); ctx.restore(); }

// ================================================================ world geometry
const PAD = { r: 300, h: 60, coilZ: 30, ferZ: 22, rIn: 55, rOut: 230, turns: 9 };
const PH = { w: 420, h: 880, t: 44, coilDz: 20, ferDz: 27, rIn: 55, rOut: 215, turns: 8, coilOy: -20 };
function coilPts(rIn, rOut, turns, z, ox = 0, oy = 0, rot = 0) {
  const n = Math.round(turns * 64), pts = [];
  for (let i = 0; i <= n; i++) { const u = i / n, a = u * turns * TAU + rot, r = rIn + (rOut - rIn) * u; pts.push([ox + r * Math.cos(a), oy + r * Math.sin(a), z]); }
  return pts;
}
function drawCoil(P, pts, w, a = 1, glow = 0) {
  if (a <= 0.01) return;
  ctx.save(); ctx.globalAlpha = a; ctx.lineCap = "round"; ctx.lineJoin = "round";
  poly(P, pts, false); ctx.strokeStyle = C.copperDk; ctx.lineWidth = w + 2.5; ctx.stroke();
  ctx.strokeStyle = C.copper; ctx.lineWidth = w; ctx.stroke();
  ctx.strokeStyle = "rgba(255,225,190,0.55)"; ctx.lineWidth = w * 0.3; ctx.stroke();
  if (glow > 0.01) { ctx.globalAlpha = a * glow; ctx.strokeStyle = "rgba(255,120,60,0.55)"; ctx.lineWidth = w * 3; ctx.filter = "blur(10px)"; ctx.stroke(); ctx.filter = "none"; }
  ctx.restore();
}
function disc(P, r, z, fill, a = 1, ox = 0, oy = 0) { if (a <= 0.01) return; ctx.save(); ctx.globalAlpha = a; poly(P, circ(r, z, 64, ox, oy)); ctx.fillStyle = fill; ctx.fill(); ctx.restore(); }
// current dots along a coil: phase s ∈ ℝ (in units of "dot spacing"); a back-and-forth current is s = A sin(ωt)
function dots(P, pts, s, a = 1, n = 40, size = 6.5) {
  if (a <= 0.01) return; ctx.save(); ctx.globalAlpha = a; ctx.shadowColor = "rgba(255,74,28,0.9)"; ctx.shadowBlur = 14; ctx.fillStyle = "#FF6A3D";
  for (let i = 0; i < n; i++) { let u = ((i + s) / n) % 1; if (u < 0) u += 1; const idx = Math.floor(u * (pts.length - 1)); const q = P(pts[idx]); ctx.beginPath(); ctx.arc(q[0], q[1], size, 0, TAU); ctx.fill(); }
  ctx.restore();
}
// field loops of the pad coil: up through the middle, out over the top, down outside the coil, back through the ferrite
function loopPts(r0, r1, zb, zt, phi, ox = 0, oy = 0) {
  const pts = [], rc = (r0 + r1) / 2, rr = (r1 - r0) / 2;
  for (let i = 0; i <= 96; i++) { const th = Math.PI + (i / 96) * TAU; const s = Math.sin(th), r = rc - rr * Math.cos(th); const z = s < 0 ? zb + (zt - zb) * (-s) : zb - 6 * s; pts.push([ox + r * Math.cos(phi), oy + r * Math.sin(phi), z]); }
  return pts;   // starts at the inner bottom, goes up the inner leg first
}
const LOOPS = []; for (let k = 0; k < 2; k++) for (let j = 0; j < 7; j++) LOOPS.push({ k, phi: (j / 7) * TAU + k * 0.45, r0: 40 + k * 75, r1: 300 + k * 35, zt: 110 + k * 35 });
// the field of the pad coil as flowing light: each closed loop carries beads that drift along it; the drift follows the current
// (st.flow = ∫ I dt), so the beads run up through the middle, slow, stop and run back when the current reverses.
function drawField(P, st, front = false) {
  const amp = st.field; if (amp <= 0.01) return;
  const mag = Math.abs(st.fieldI), rx = st.rxCenter;
  ctx.save(); ctx.lineCap = "round";
  for (const L of LOOPS) {
    const pts = loopPts(L.r0, L.r1 * st.spread, PAD.ferZ, L.zt * st.reach * (1 + 1.2 * (st.explode || 0)), L.phi);
    const inner = [L.r0 * Math.cos(L.phi), L.r0 * Math.sin(L.phi)];
    const through = rx ? Math.hypot(inner[0] - rx[0], inner[1] - rx[1]) < PH.rOut * 0.92 : false;
    const hl = through ? st.throughHL : 0;
    if (front && (!through || hl < 0.01)) continue;
    const dim = 1 - 0.75 * st.dimNot * (through ? 0 : 1);
    const base = (front ? 0.9 * hl : 1) * (0.30 - L.k * 0.06) * amp * (0.45 + 0.55 * mag) * dim;
    const S = pts.map(P);
    ctx.beginPath(); S.forEach((q, i) => (i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1])));
    ctx.globalAlpha = 1; ctx.lineWidth = 2 + 1.5 * hl; ctx.strokeStyle = `rgba(${C.field},${Math.min(1, base + 0.25 * hl * amp)})`; ctx.stroke();
    // beads
    const nB = 7, a = Math.min(1, (0.55 + 0.45 * mag) * amp * dim * (front ? hl : 1) + 0.35 * hl * amp);
    ctx.fillStyle = `rgba(${C.field},${a})`; ctx.shadowColor = `rgba(${C.field},0.9)`; ctx.shadowBlur = 12;
    for (let b = 0; b < nB; b++) {
      let u = (b / nB + st.flow * 0.18 + L.k * 0.05 + L.phi * 0.02) % 1; if (u < 0) u += 1;
      const f = u * (S.length - 1), i = Math.floor(f), q0 = S[i], q1 = S[Math.min(S.length - 1, i + 1)], w = f - i;
      ctx.beginPath(); ctx.arc(lerp(q0[0], q1[0], w), lerp(q0[1], q1[1], w), (5 + 2 * hl) * (L.k === 0 ? 1 : 0.8), 0, TAU); ctx.fill();
    }
    ctx.shadowBlur = 0;
  }
  ctx.restore();
}

// ================================================================ objects
function drawPad(P, st) {
  const top = circ(PAD.r, PAD.h), bot = circ(PAD.r, 0);
  const c0 = P([0, 0, 0]); const sc = P([PAD.r, 0, 0])[0] - c0[0];
  shadow(c0[0] + 0.05 * sc, c0[1] + 0.1 * Math.abs(sc), Math.abs(sc) * 1.55, Math.abs(sc) * 0.42, 0.26);
  const coil = coilPts(PAD.rIn, PAD.rOut, PAD.turns, PAD.coilZ);
  // seen through frosted glass: blurred, faint coil (when not x-rayed)
  const hazy = 1 - st.xray;
  glass(() => hullPath(P, [...top, ...bot]), { tint: lerp(0.22, 0.10, st.xray), dark: 0.06, rim: 2 });
  glass(() => poly(P, top), { tint: lerp(0.28, 0.08, st.xray), sheen: -0.9, rim: 2 });
  if (hazy > 0.02) { ctx.save(); poly(P, top); ctx.clip(); ctx.filter = "blur(3px)"; drawCoil(P, coil, 7, 0.4 * hazy); ctx.restore(); ctx.filter = "none"; }
  if (st.xray > 0.02) { disc(P, PAD.rOut + 20, PAD.ferZ, C.ferrite, 0.55 * st.xray); drawCoil(P, coil, 10, st.xray, st.warm); }
  if (st.padDots > 0.01) dots(P, coil, st.padPhase, st.padDots * st.xray, 41);
  // charging indicator ring on the pad's top
  if (st.indicator > 0.01) { ctx.save(); poly(P, circ(PAD.r - 18, PAD.h + 0.5)); ctx.strokeStyle = `rgba(255,74,28,${0.85 * st.indicator * (0.65 + 0.35 * Math.sin(TAU * 0.8 * TNOW))})`; ctx.lineWidth = 3; ctx.shadowColor = "rgba(255,74,28,0.8)"; ctx.shadowBlur = 18; ctx.stroke(); ctx.restore(); }
  if (st.padMagnet > 0.01) magnetRing(P, 0, 0, PAD.h - 14, st.padMagnet, st.padMagnetHL);
  if (st.warm > 0.01) { const m = P([0, 0, PAD.coilZ]); ctx.save(); const g = ctx.createRadialGradient(m[0], m[1], 0, m[0], m[1], Math.abs(sc) * 1.1); g.addColorStop(0, `rgba(255,110,50,${0.4 * st.warm})`); g.addColorStop(1, "rgba(255,110,50,0)"); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.restore(); }
}
function magnetRing(P, ox, oy, z, a, hl) {
  ctx.save(); ctx.globalAlpha = a;
  for (let i = 0; i < 18; i++) { const a0 = (i / 18) * TAU, a1 = a0 + TAU / 18 * 0.7, r0 = 250, r1 = 272;
    const pts = [[r0 * Math.cos(a0), r0 * Math.sin(a0)], [r1 * Math.cos(a0), r1 * Math.sin(a0)], [r1 * Math.cos(a1), r1 * Math.sin(a1)], [r0 * Math.cos(a1), r0 * Math.sin(a1)]].map(([x, y]) => [ox + x, oy + y, z]);
    poly(P, pts); ctx.fillStyle = C.magnet; ctx.fill(); }
  if (hl > 0.01) { ctx.globalAlpha = a * hl; poly(P, circ(285, z, 72, ox, oy)); ctx.strokeStyle = C.acc; ctx.lineWidth = 5; ctx.stroke(); }
  ctx.restore();
}
function phoneFrame(st) { const c = Math.cos(st.rot), s = Math.sin(st.rot); return (p) => [st.ox + p[0] * c - p[1] * s, st.oy + p[0] * s + p[1] * c, p[2] + st.z + PAD.h]; }
// a real phone lying screen-up: brushed-metal frame, black glass, a dark wallpaper, the camera pill, and the charging ring.
// It turns into frosted glass only when we go inside (st.xray).
function drawRealPhone(PP, st, a) {
  if (a <= 0.01) return;
  const top = rrPts(PH.w, PH.h, 72, PH.t), bot = rrPts(PH.w, PH.h, 72, 0), mid = rrPts(PH.w, PH.h, 72, PH.t * 0.5);
  ctx.save(); ctx.globalAlpha = a;
  // frame (the visible side band): a metal gradient across the screen-space bounds
  const hb = hull2([...top, ...bot].map(PP)); let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9; hb.forEach(([x, y]) => { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); });
  ctx.beginPath(); hb.forEach((q, i) => (i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]))); ctx.closePath();
  const gm = ctx.createLinearGradient(x0, y0, x1, y1); gm.addColorStop(0, "#E9ECEF"); gm.addColorStop(0.35, "#A7AEB7"); gm.addColorStop(0.55, "#F4F5F7"); gm.addColorStop(0.8, "#8E959E"); gm.addColorStop(1, "#C9CED4");
  ctx.fillStyle = gm; ctx.fill(); ctx.strokeStyle = "rgba(40,45,55,0.55)"; ctx.lineWidth = 1.5; ctx.stroke();
  poly(PP, mid); ctx.strokeStyle = "rgba(255,255,255,0.35)"; ctx.lineWidth = 1.2; ctx.stroke();        // the frame's highlight line
  // side buttons on the left long edge
  [[-120, 70], [10, 70], [-260, 40]].forEach(([y, l]) => { poly(PP, [[-PH.w / 2 - 5, y, PH.t * 0.35], [-PH.w / 2 - 5, y + l, PH.t * 0.35], [-PH.w / 2 - 5, y + l, PH.t * 0.7], [-PH.w / 2 - 5, y, PH.t * 0.7]]); ctx.fillStyle = "#9AA1AA"; ctx.fill(); });
  // black glass
  poly(PP, top); ctx.fillStyle = "#0B0D11"; ctx.fill();
  // the display: a dark gradient wallpaper, slightly inset
  const scr = rrPts(PH.w - 26, PH.h - 26, 60, PH.t + 0.3); const c = PP([0, 0, PH.t]), tl = PP([-PH.w / 2, -PH.h / 2, PH.t]), br = PP([PH.w / 2, PH.h / 2, PH.t]);
  poly(PP, scr); const gw = ctx.createLinearGradient(tl[0], tl[1], br[0], br[1]); gw.addColorStop(0, "#1C2740"); gw.addColorStop(0.5, "#2A2140"); gw.addColorStop(1, "#3A2232"); ctx.fillStyle = gw; ctx.fill();
  // the camera pill near the top
  poly(PP, rrPts(110, 32, 16, PH.t + 0.6).map((p) => [p[0], p[1] - PH.h / 2 + 60, p[2]])); ctx.fillStyle = "#000"; ctx.fill();
  // the charging ring: a circle on the screen; its lit arc turns at the charging rate, and goes grey when charging stops
  if (st.charge > 0.01) {
    const R = 86, n = 64, cy0 = -40, k = st.charge;
    const ring = Array.from({ length: n + 1 }, (_, i) => { const t = i / n * TAU; return [R * Math.cos(t), cy0 + R * Math.sin(t), PH.t + 0.8]; });
    ctx.globalAlpha = a * k; poly(PP, ring, false); ctx.strokeStyle = "rgba(255,255,255,0.18)"; ctx.lineWidth = 7; ctx.stroke();
    const ph = st.chargePhase || 0, arc = ring.slice(0, Math.round(n * 0.32) + 1).map(([x, y, z]) => { const t = Math.atan2(y - cy0, x) + ph; return [R * Math.cos(t), cy0 + R * Math.sin(t), z]; });
    poly(PP, arc, false); ctx.strokeStyle = st.chargeOn ? C.acc : "rgba(170,175,185,0.8)"; ctx.lineWidth = 8; ctx.lineCap = "round"; if (st.chargeOn) { ctx.shadowColor = "rgba(255,74,28,0.9)"; ctx.shadowBlur = 16; } ctx.stroke(); ctx.shadowBlur = 0;
    const b = PP([0, cy0, PH.t + 1]); bolt(b[0], b[1], 0.75, a * k * (st.chargeOn ? 1 : 0.35));
  }
  // glass reflection: one soft diagonal streak
  ctx.save(); ctx.globalAlpha = a; poly(PP, top); ctx.clip(); const gr = ctx.createLinearGradient(tl[0], tl[1], br[0], br[1]);
  const sh = 0.38 + 0.08 * Math.sin(0.6 * TNOW); gr.addColorStop(sh - 0.08, "rgba(255,255,255,0)"); gr.addColorStop(sh, "rgba(255,255,255,0.10)"); gr.addColorStop(sh + 0.02, "rgba(255,255,255,0.03)"); gr.addColorStop(sh + 0.12, "rgba(255,255,255,0)");
  ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H); ctx.restore();
  poly(PP, top); ctx.strokeStyle = "rgba(20,22,28,0.9)"; ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();
}
function drawPhone(P, st) {
  if (st.phone <= 0.01) return;
  const F = phoneFrame(st), PP = (p) => P(F(p));
  const top = rrPts(PH.w, PH.h, 72, PH.t), bot = rrPts(PH.w, PH.h, 72, 0);
  const coil = coilPts(PH.rIn, PH.rOut, PH.turns, PH.coilDz, 0, PH.coilOy, 0.6);
  if (st.z > 4) { const s0 = P([st.ox, st.oy, PAD.h]); shadow(s0[0], s0[1], 260 * (1 + st.z / 400), 80, 0.22 / (1 + st.z / 150)); }
  if (st.ringHolder > 0.01 && st.ringLift < 0.01 && st.xray < 0.3) ringHolder(PP, st);

  if (g > 0.01) { const gx = x0 + 190 + (w0 - 190) * 0.62; ctx.globalAlpha = a * g; ctx.fillStyle = "rgba(235,60,40,0.85)"; ctx.beginPath(); ctx.roundRect(gx, y1 - 34, (w0 - 190) * 0.38, 40, 12); ctx.fill();
    ctx.strokeStyle = C.acc; ctx.lineWidth = 4; ctx.setLineDash([8, 8]); line2(gx, y1 - 44, gx, y2 + 12); ctx.setLineDash([]); }
  ctx.restore();
}
function iris(t, tIn, drawA, drawB, cx = 540, cy = 1040) {   // B grows out of a circle over 0.5 s
  const k = E.p3io(prog(t, tIn, tIn + 0.5));
  if (k <= 0) { drawA(); return; } if (k >= 1) { drawB(); return; }
  drawA(); ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, 1300 * k, 0, TAU); ctx.clip(); ctx.drawImage(BG, 0, 0); drawB(); ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, 1300 * k, 0, TAU); ctx.strokeStyle = "rgba(255,255,255,0.9)"; ctx.lineWidth = 4; ctx.stroke(); ctx.restore();
}
function worldScene(t) { const cam = camAt(t), P = makeP(cam), st = worldState(t); const PP = drawWorld(P, st); annotate(t, P, PP, st); }
function frame(t) {
  TNOW = t;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.filter = "none"; ctx.drawImage(BG, 0, 0);
  {   // a soft light drifting across the backdrop: the room's light, never still
    const lx = 540 + 360 * Math.cos(0.85 * t + 0.8), ly = 1050 + 450 * Math.sin(0.63 * t), g = ctx.createRadialGradient(lx, ly, 0, lx, ly, 640);
    g.addColorStop(0, "rgba(255,255,255,0.5)"); g.addColorStop(1, "rgba(255,255,255,0)"); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    const mx = 540 - 400 * Math.cos(0.6 * t), my = 900 + 400 * Math.cos(0.77 * t + 2), g2 = ctx.createRadialGradient(mx, my, 0, mx, my, 560);
    g2.addColorStop(0, "rgba(255,170,130,0.13)"); g2.addColorStop(1, "rgba(255,170,130,0)"); ctx.fillStyle = g2; ctx.fillRect(0, 0, W, H);
  }
  if (t >= T.end) { endCard(t); return; }
  if (t < T.labIn + 0.5) iris(t, T.labIn, () => worldScene(t), () => drawLab(t));
  else if (t < T.backPad) drawLab(t);
  else if (t < T.wire) iris(t, T.backPad, () => drawLab(t), () => worldScene(t));
  else if (t < T.pull) iris(t, T.wire, () => worldScene(t), () => drawACDC(t), 540, 1100);
  else iris(t, T.pull, () => drawACDC(t), () => worldScene(t));
  labLabels(t);
  drawSubs(t);
}
function labLabels(t) {
  if (t >= T.wire && t < T.pull + 0.3) label(COPY.rectNote, 560, 1240, t, T.rect, T.pull, { size: 44, align: "center" });
}
function annotate(t, P, PP, st) {
  const txC = P([0, 0, PAD.coilZ]), rxC = PP ? PP([0, PH.coilOy, PH.coilDz]) : txC;
  // 2: where the two shells meet — no contacts
  if (t >= T.cut && t < T.q1 + 0.4) { const a = P([-PAD.r * 0.2, 0, PAD.h + 70]), b = P([PAD.r * 0.2, 0, PAD.h + 70]); const k = E.p3out(prog(t, T.cut, T.cut + 0.4)), fo = 1 - prog(t, T.q1, T.q1 + 0.4);
    obox(Math.min(a[0], b[0]) - 260, a[1] - 150, Math.abs(b[0] - a[0]) + 520, 300, k, fo); }
  // 3: the two coils, one at a time
  const litTx = win(t, T.litTx, T.labIn, 0.3, 0.3), litRx = win(t, T.litRx, T.labIn, 0.3, 0.3);
  spotlight(txC[0], txC[1] + 10, 520, 230, litTx * (1 - litRx)); spotlight(rxC[0], rxC[1], 520, 230, litRx);
  if (t >= T.litTx && t < T.labIn) { const k = E.p3out(prog(t, T.litTx, T.litTx + 0.3)); leader(150, txC[1] - 110, txC[0] - 200, txC[1] - 10, k); label(COPY.tx, 96, txC[1] - 130, t, T.litTx, T.labIn); }
  if (t >= T.litRx && t < T.labIn) { const k = E.p3out(prog(t, T.litRx, T.litRx + 0.3)); leader(150, rxC[1] - 130, rxC[0] - 120, rxC[1] - 8, k); label(COPY.rx, 96, rxC[1] - 150, t, T.litRx, T.labIn); }
  label(COPY.gapNote, 1000, 700, t, T.cut, T.labIn, { size: 44, weight: 400, align: "right" });
  label(COPY.gapNote, 1000, 700, t, T.backPad, T.wire, { size: 44, weight: 400, align: "right" });
  label(COPY.gapNote, 1000, 700, t, T.pull, T.magnet, { size: 44, weight: 400, align: "right" });
  label(COPY.gapNote, 1000, 700, t, T.metal, T.bars, { size: 44, weight: 400, align: "right" });
  label(COPY.color, 1000, 776, t, T.cur, T.wire, { size: 44, weight: 400, align: "right" });
  label(COPY.freq, 540, 1430, t, T.cur, T.name, { size: 44, weight: 400, align: "center" });
  label(COPY.induct, 540, 1430, t, T.name + 0.3, T.wire, { size: 44, align: "center", col: C.ink });
  // 5a: heat — thermal view while the phone sits off-centre
  const th = win(t, T.thermal, T.slideBackEnd + 0.3, 0.5, 0.6);
  if (th > 0.01) { thermal(th, [[txC[0], txC[1] - 10, 300, st.warm], [rxC[0], rxC[1], 220, 0.4 * st.warm]]); label(COPY.thermalNote, 1000, 852, t, T.thermal, T.slideBackEnd + 0.3, { size: 44, weight: 400, align: "right" }); }
  label(COPY.qi2, 540, 1430, t, T.ringTx, T.metal, { size: 44, align: "center" });
  if (PP && t >= T.ringRx + 0.3 && t < T.snap + 0.5) { const a = P([230, 110, 120]), b = P([20, 10, 120]); arrowS(a[0], a[1], b[0], b[1], E.p3out(prog(t, T.ringRx + 0.3, T.snap)), 1 - prog(t, T.snap + 0.2, T.snap + 0.5)); }
  // 5b: metal — eddies, heat, the pad's sum
  if (PP && t >= T.metalIn && t < T.eddy + 0.6) { const c = PP([0, PH.coilOy + 40, -4 - (st.metalDrop || 0)]); obox(c[0] - 150, c[1] - 80, 300, 160, E.p3out(prog(t, T.metalIn, T.metalIn + 0.4)), 1 - prog(t, T.eddy + 0.2, T.eddy + 0.6)); }
  label(COPY.eddyNote, 540, 1430, t, T.eddy, T.metalHot, { size: 44, align: "center" });
  const mh = win(t, T.metalHot, T.bars + 0.4, 0.5, 0.5);
  if (mh > 0.01 && PP) { const c = PP([0, PH.coilOy + 40, -4 - (st.metalDrop || 0)]); thermal(mh, [[c[0], c[1], 300, 1], [txC[0], txC[1], 300, 0.35]]); label(COPY.thermalNote, 1000, 852, t, T.metalHot, T.bars + 0.4, { size: 44, weight: 400, align: "right" }); }
  fodBars(t);
  label(COPY.fod, 1000, 776, t, T.gap, T.back, { size: 44, align: "right" });
  // tip: the metal ring comes off
  if (PP && t >= T.tip && t < T.ringOff + 0.5) { const c = PP([0, PH.coilOy + 40, 0]); obox(c[0] - 130, c[1] - 90, 260, 180, E.p3out(prog(t, T.tip + 0.3, T.tip + 0.7)), 1 - prog(t, T.ringOff, T.ringOff + 0.4)); }
}

// ================================================================ end card
const BADGE = [200, 600], BSC = 0.34;
function endCard(t) {
  const k = E.p3io(prog(t, T.end, T.endMorph + 0.3));
  ctx.save(); const sc = lerp(0.95, BSC, k), cx = lerp(540, BADGE[0], k), cy = lerp(1000, BADGE[1], k);
  ctx.translate(cx, cy); ctx.scale(sc, sc); ctx.strokeStyle = C.ink; ctx.lineWidth = 6 / sc * 0.4 + 6; ctx.lineJoin = "round";
  ctx.beginPath(); ctx.ellipse(0, 120, 330, 110, 0, 0, TAU); ctx.fillStyle = "rgba(255,255,255,0.5)"; ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.roundRect(-190, -330, 380, 520, 60); ctx.fillStyle = "rgba(255,255,255,0.75)"; ctx.fill(); ctx.stroke();
  ctx.restore();
  typeLines(COPY.end, t, T.title1, [905, 1045, 1185], 124);
  slamLine(COPY.epNum, t, T.ep, 400, 520, 150);
  if (t >= T.ep + 0.25) { const a = clamp((t - T.ep - 0.25) / 0.2); ctx.save(); ctx.globalAlpha = a; ctx.filter = `blur(${(8 * (1 - a)).toFixed(1)}px)`; ctx.font = `112px ${DISPLAY}`; ctx.fillStyle = C.ink; ctx.fillText(COPY.epName, 404, 668); ctx.restore(); }
  if (t >= T.sting) { const s2 = spring(t - T.sting, 16, 0.5); ctx.save(); ctx.translate(BADGE[0], BADGE[1] - 70 * BSC); ctx.scale(s2 * 0.7, s2 * 0.7); ctx.font = `150px ${DISPLAY}`; ctx.fillStyle = C.acc; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("?", 4, 4); ctx.restore(); }
}
function typeLines(L, t, t0, ys, size) {
  const font = `${size}px ${DISPLAY}`; let n = 0;
  L.forEach((str, i) => { const chars = parse(str); let x = 96; chars.forEach((c) => { const ct = t0 + n * 0.045 + i * 0.3; n++; if (t >= ct) { ctx.font = font; ctx.fillStyle = c.a ? C.acc : C.ink; ctx.fillText(c.ch, x, ys[i]); } x += mw(font, c.ch); }); });
}
function slamLine(str, t, t0, x, y, size) { if (t < t0) return; const sc = slamScale(t - t0); ctx.save(); ctx.translate(x, y - size * 0.35); ctx.scale(sc, sc); ctx.font = `${size}px ${DISPLAY}`; ctx.fillStyle = C.ink; ctx.fillText(str, 0, size * 0.35); ctx.restore(); }

window.seek = function seek(t) { frame(Math.max(0, Math.min(DUR - 1e-6, t))); };
Promise.all([document.fonts.load(`104px ${DISPLAY}`), document.fonts.load(`700 44px ${UI}`), document.fonts.load(`400 44px ${UI}`)]).then(() => { buildBG(); window.seek(0); window.ready = true; });
</script>
