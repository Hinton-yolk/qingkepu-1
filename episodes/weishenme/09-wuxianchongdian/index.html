<script>
// EP.09 无线充电 — 第二季：半透明玻璃实物。window.seek(t) paints frame t; a pure function of t (seeded noise only).
// World units ≈ 0.1 mm. The pad is a glass puck (r 300, h 60), its coil 30 below the top; the phone (420 × 880 × 44) lies on it,
// its coil 20 above its bottom: ~50 between the two coils (to scale-ish). A small 3D projector draws everything; the camera is
// keyframed. Two side-by-side comparisons (放正 / 放歪; 手机 / 钥匙) render the same world twice with two cameras.
const { T, COPY, SUBS, W, H, DUR, E8 } = TL;
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const C = {
  bg0: "#EEF0F2", bg1: "#DCE1E6", ink: "#141414", acc: "#FF4A1C", copper: "#C9824F", copperDk: "#8E5230",
  field: "110,140,255", skin: "#EBCBA5", skinSh: "#D6AD84", ferrite: "#3A3F48", magnet: "#5B6170", metal: "#9BA3AE",
};
const DISPLAY = "Smiley", UI = "NotoSC";
const TAU = Math.PI * 2;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const E = { p2io: (x) => (x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2), p3out: (x) => 1 - Math.pow(1 - x, 3), p3io: (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2), back: (x) => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); } };
const win = (t, a, b, fi = 0.25, fo = 0.25) => E.p3out(prog(t, a, a + fi)) * (1 - E.p2io(prog(t, b - fo, b)));
function spring(x, w = 15, z = 0.72) { if (x <= 0) return 0; return 1 - Math.exp(-z * w * x) * Math.cos(w * Math.sqrt(1 - z * z) * x); }
function slamScale(u) { if (u <= 0) return 1.55; if (u < 0.09) return lerp(1.55, 0.94, E.p2io(u / 0.09)); if (u < 0.17) return lerp(0.94, 1, E.p2io((u - 0.09) / 0.08)); return 1; }

// ================================================================ 3D
function makeP(c) {
  const ce = Math.cos(c.el), se = Math.sin(c.el), ca = Math.cos(c.az), sa = Math.sin(c.az);
  return ([x, y, z]) => {
    x -= c.tx; y -= c.ty; z -= c.tz;
    const x1 = x * ca - y * sa, y1 = x * sa + y * ca;
    const yv = y1 * ce + z * se, zv = -y1 * se + z * ce, s = c.focal / (c.dist + yv);
    return [c.cx + x1 * s, c.cy - zv * s, c.dist + yv];
  };
}
function rrPts(w, h, r, z, n = 8) {
  const pts = [], hw = w / 2, hh = h / 2;
  for (const [cx, cy, a0] of [[hw - r, hh - r, 0], [-hw + r, hh - r, Math.PI / 2], [-hw + r, -hh + r, Math.PI], [hw - r, -hh + r, 1.5 * Math.PI]])
    for (let i = 0; i <= n; i++) { const a = a0 + (i / n) * Math.PI / 2; pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a), z]); }
  return pts;
}
const circ = (r, z, n = 72, ox = 0, oy = 0) => Array.from({ length: n }, (_, i) => { const a = i / n * TAU; return [ox + r * Math.cos(a), oy + r * Math.sin(a), z]; });
function poly(P, pts, close = true) { ctx.beginPath(); pts.forEach((p, i) => { const q = P(p); i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]); }); if (close) ctx.closePath(); }
function hull2(pts) {
  const p = pts.map((q) => [q[0], q[1]]).sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cr = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]); const lo = [], up = [];
  for (const q of p) { while (lo.length >= 2 && cr(lo[lo.length - 2], lo[lo.length - 1], q) <= 0) lo.pop(); lo.push(q); }
  for (const q of p.slice().reverse()) { while (up.length >= 2 && cr(up[up.length - 2], up[up.length - 1], q) <= 0) up.pop(); up.push(q); }
  return lo.slice(0, -1).concat(up.slice(0, -1));
}
function hullPath(P, ptsA) { const h = hull2(ptsA.map(P)); ctx.beginPath(); h.forEach((q, i) => (i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]))); ctx.closePath(); }

// ================================================================ background + glass
let BG = null, BGBLUR = null;
function paintBackground(c2) {
  const g = c2.createLinearGradient(0, 0, 0, H); g.addColorStop(0, C.bg0); g.addColorStop(1, C.bg1); c2.fillStyle = g; c2.fillRect(0, 0, W, H);
  const blob = (x, y, r, col) => { const rg = c2.createRadialGradient(x, y, 0, x, y, r); rg.addColorStop(0, col); rg.addColorStop(1, "rgba(255,255,255,0)"); c2.fillStyle = rg; c2.fillRect(0, 0, W, H); };
  blob(860, 820, 640, "rgba(255,150,110,0.26)"); blob(160, 1250, 720, "rgba(120,160,255,0.24)"); blob(540, 1500, 520, "rgba(255,255,255,0.5)");
}
function buildBG() {
  BG = document.createElement("canvas"); BG.width = W; BG.height = H; paintBackground(BG.getContext("2d"));
  BGBLUR = document.createElement("canvas"); BGBLUR.width = W; BGBLUR.height = H; const b = BGBLUR.getContext("2d"); b.filter = "blur(28px)"; b.drawImage(BG, 0, 0);
}
function glass(pathFn, { tint = 0.3, sheen = -0.7, rim = 2.4, dark = 0, a = 1 } = {}) {
  if (a <= 0.01) return;
  ctx.save(); ctx.globalAlpha = a; pathFn(); ctx.clip();
  ctx.drawImage(BGBLUR, 0, 0);
  ctx.fillStyle = `rgba(255,255,255,${tint})`; ctx.fillRect(0, 0, W, H);
  if (dark) { ctx.fillStyle = `rgba(40,50,70,${dark})`; ctx.fillRect(0, 0, W, H); }
  const b = 1400, g = ctx.createLinearGradient(540 - b * Math.cos(sheen), 1000 - b * Math.sin(sheen), 540 + b * Math.cos(sheen), 1000 + b * Math.sin(sheen));
  g.addColorStop(0, "rgba(255,255,255,0)"); g.addColorStop(0.42, "rgba(255,255,255,0.05)"); g.addColorStop(0.47, "rgba(255,255,255,0.36)");
  g.addColorStop(0.5, "rgba(255,255,255,0.08)"); g.addColorStop(0.56, "rgba(255,255,255,0.18)"); g.addColorStop(0.6, "rgba(255,255,255,0.02)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.restore();
  ctx.save(); ctx.globalAlpha = a; pathFn(); ctx.lineWidth = rim; ctx.strokeStyle = "rgba(255,255,255,0.85)"; ctx.stroke(); ctx.lineWidth = 1; ctx.strokeStyle = "rgba(80,90,110,0.25)"; ctx.stroke(); ctx.restore();
}
function shadow(x, y, rx, ry, a) { ctx.save(); ctx.translate(x, y); ctx.scale(1, ry / rx); const g = ctx.createRadialGradient(0, 0, 0, 0, 0, rx); g.addColorStop(0, `rgba(30,40,60,${a})`); g.addColorStop(1, "rgba(30,40,60,0)"); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, rx, 0, TAU); ctx.fill(); ctx.restore(); }

// ================================================================ world geometry
const PAD = { r: 300, h: 60, coilZ: 30, ferZ: 22, rIn: 55, rOut: 230, turns: 9 };
const PH = { w: 420, h: 880, t: 44, coilDz: 20, ferDz: 27, rIn: 55, rOut: 215, turns: 8, coilOy: -20 };
function coilPts(rIn, rOut, turns, z, ox = 0, oy = 0, rot = 0) {
  const n = Math.round(turns * 64), pts = [];
  for (let i = 0; i <= n; i++) { const u = i / n, a = u * turns * TAU + rot, r = rIn + (rOut - rIn) * u; pts.push([ox + r * Math.cos(a), oy + r * Math.sin(a), z]); }
  return pts;
}
function drawCoil(P, pts, w, a = 1, glow = 0) {
  if (a <= 0.01) return;
  ctx.save(); ctx.globalAlpha = a; ctx.lineCap = "round"; ctx.lineJoin = "round";
  poly(P, pts, false); ctx.strokeStyle = C.copperDk; ctx.lineWidth = w + 2.5; ctx.stroke();
  ctx.strokeStyle = C.copper; ctx.lineWidth = w; ctx.stroke();
  ctx.strokeStyle = "rgba(255,225,190,0.55)"; ctx.lineWidth = w * 0.3; ctx.stroke();
  if (glow > 0.01) { ctx.globalAlpha = a * glow; ctx.strokeStyle = "rgba(255,120,60,0.55)"; ctx.lineWidth = w * 3; ctx.filter = "blur(10px)"; ctx.stroke(); ctx.filter = "none"; }
  ctx.restore();
}
function disc(P, r, z, fill, a = 1, ox = 0, oy = 0) { if (a <= 0.01) return; ctx.save(); ctx.globalAlpha = a; poly(P, circ(r, z, 64, ox, oy)); ctx.fillStyle = fill; ctx.fill(); ctx.restore(); }
// current dots along a coil: phase s ∈ ℝ (in units of "dot spacing"); a back-and-forth current is s = A sin(ωt)
function dots(P, pts, s, a = 1, n = 40, size = 6.5) {
  if (a <= 0.01) return; ctx.save(); ctx.globalAlpha = a; ctx.shadowColor = "rgba(255,74,28,0.9)"; ctx.shadowBlur = 14; ctx.fillStyle = "#FF6A3D";
  for (let i = 0; i < n; i++) { let u = ((i + s) / n) % 1; if (u < 0) u += 1; const idx = Math.floor(u * (pts.length - 1)); const q = P(pts[idx]); ctx.beginPath(); ctx.arc(q[0], q[1], size, 0, TAU); ctx.fill(); }
  ctx.restore();
}
// field loops of the pad coil: up through the middle, out over the top, down outside the coil, back through the ferrite
function loopPts(r0, r1, zb, zt, phi, ox = 0, oy = 0) {
  const pts = [], rc = (r0 + r1) / 2, rr = (r1 - r0) / 2;
  for (let i = 0; i <= 96; i++) { const th = Math.PI + (i / 96) * TAU; const s = Math.sin(th), r = rc - rr * Math.cos(th); const z = s < 0 ? zb + (zt - zb) * (-s) : zb - 6 * s; pts.push([ox + r * Math.cos(phi), oy + r * Math.sin(phi), z]); }
  return pts;   // starts at the inner bottom, goes up the inner leg first
}
const LOOPS = []; for (let k = 0; k < 3; k++) for (let j = 0; j < 8; j++) LOOPS.push({ k, phi: (j / 8) * TAU + k * 0.2, r0: 18 + k * 50, r1: 270 + k * 60, zt: 150 + k * 60 });
function drawField(P, st) {
  const amp = st.field; if (amp <= 0.01) return;
  const sgn = st.fieldSign, mag = Math.abs(st.fieldI);
  const rx = st.rxCenter;   // [x, y] of the phone coil (for "through" highlighting)
  ctx.save(); ctx.lineCap = "round";
  for (const L of LOOPS) {
    const pts = loopPts(L.r0, L.r1 * st.spread, PAD.ferZ, L.zt * st.reach * (1 + 1.5 * (st.explode || 0)), L.phi);
    const inner = [L.r0 * Math.cos(L.phi), L.r0 * Math.sin(L.phi)];
    const through = rx ? Math.hypot(inner[0] - rx[0], inner[1] - rx[1]) < PH.rOut * 0.92 : false;
    const hl = through ? st.throughHL : 0;
    const base = (0.42 - L.k * 0.1) * amp * (0.35 + 0.65 * mag) * (1 - 0.5 * st.dimNot * (through ? 0 : 1));
    poly(P, pts, false);
    ctx.globalAlpha = 1; ctx.lineWidth = 9 - L.k * 2 + 4 * hl; ctx.strokeStyle = `rgba(${C.field},${base * 0.25 + 0.15 * hl * amp})`; ctx.shadowColor = `rgba(${C.field},0.8)`; ctx.shadowBlur = 18; ctx.stroke();
    ctx.lineWidth = 2.8 - L.k * 0.5 + 1.6 * hl; ctx.strokeStyle = `rgba(${C.field},${Math.min(1, base + 0.4 * hl * amp)})`; ctx.shadowBlur = 0; ctx.stroke();
    // a chevron at the top of the loop, pointing with the field
    if (L.k === 0 && mag > 0.2) { const i = 48, a0 = P(pts[i - 3]), a1 = P(pts[i + 3]); const ang = Math.atan2(a1[1] - a0[1], a1[0] - a0[0]) + (sgn < 0 ? Math.PI : 0); const m = P(pts[i]);
      ctx.save(); ctx.translate(m[0], m[1]); ctx.rotate(ang); ctx.globalAlpha = amp * mag; ctx.fillStyle = `rgba(${C.field},0.95)`; ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(-8, -8); ctx.lineTo(-8, 8); ctx.closePath(); ctx.fill(); ctx.restore(); }
  }
  ctx.restore();
}

// ================================================================ objects
function drawPad(P, st) {
  const top = circ(PAD.r, PAD.h), bot = circ(PAD.r, 0);
  const c0 = P([0, 0, 0]); const sc = P([PAD.r, 0, 0])[0] - c0[0];
  shadow(c0[0] + 0.05 * sc, c0[1] + 0.1 * Math.abs(sc), Math.abs(sc) * 1.55, Math.abs(sc) * 0.42, 0.26);
  const coil = coilPts(PAD.rIn, PAD.rOut, PAD.turns, PAD.coilZ);
  // seen through frosted glass: blurred, faint coil (when not x-rayed)
  const hazy = 1 - st.xray;
  if (hazy > 0.02) { ctx.save(); ctx.filter = "blur(2.5px)"; drawCoil(P, coil, 7, 0.55 * hazy); ctx.restore(); ctx.filter = "none"; }
  glass(() => hullPath(P, [...top, ...bot]), { tint: lerp(0.22, 0.10, st.xray), dark: 0.06, rim: 2 });
  glass(() => poly(P, top), { tint: lerp(0.28, 0.08, st.xray), sheen: -0.9, rim: 2 });
  if (st.xray > 0.02) { disc(P, PAD.rOut + 20, PAD.ferZ, C.ferrite, 0.55 * st.xray); drawCoil(P, coil, 10, st.xray, st.warm); }
  if (st.padDots > 0.01) dots(P, coil, st.padPhase, st.padDots * st.xray);
  // charging indicator ring on the pad's top
  if (st.indicator > 0.01) { ctx.save(); poly(P, circ(PAD.r - 18, PAD.h + 0.5)); ctx.strokeStyle = `rgba(255,74,28,${0.85 * st.indicator})`; ctx.lineWidth = 3; ctx.shadowColor = "rgba(255,74,28,0.8)"; ctx.shadowBlur = 18; ctx.stroke(); ctx.restore(); }
  if (st.padMagnet > 0.01) magnetRing(P, 0, 0, PAD.h - 14, st.padMagnet, st.padMagnetHL);
  if (st.warm > 0.01) { const m = P([0, 0, PAD.coilZ]); ctx.save(); const g = ctx.createRadialGradient(m[0], m[1], 0, m[0], m[1], Math.abs(sc) * 1.1); g.addColorStop(0, `rgba(255,110,50,${0.4 * st.warm})`); g.addColorStop(1, "rgba(255,110,50,0)"); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.restore(); }
}
function magnetRing(P, ox, oy, z, a, hl) {
  ctx.save(); ctx.globalAlpha = a;
  for (let i = 0; i < 18; i++) { const a0 = (i / 18) * TAU, a1 = a0 + TAU / 18 * 0.7, r0 = 250, r1 = 272;
    const pts = [[r0 * Math.cos(a0), r0 * Math.sin(a0)], [r1 * Math.cos(a0), r1 * Math.sin(a0)], [r1 * Math.cos(a1), r1 * Math.sin(a1)], [r0 * Math.cos(a1), r0 * Math.sin(a1)]].map(([x, y]) => [ox + x, oy + y, z]);
    poly(P, pts); ctx.fillStyle = C.magnet; ctx.fill(); }
  if (hl > 0.01) { ctx.globalAlpha = a * hl; poly(P, circ(285, z, 72, ox, oy)); ctx.strokeStyle = C.acc; ctx.lineWidth = 5; ctx.stroke(); }
  ctx.restore();
}
function phoneFrame(st) { const c = Math.cos(st.rot), s = Math.sin(st.rot); return (p) => [st.ox + p[0] * c - p[1] * s, st.oy + p[0] * s + p[1] * c, p[2] + st.z]; }
function drawPhone(P, st) {
  if (st.phone <= 0.01) return;
  const F = phoneFrame(st), PP = (p) => P(F(p));
  const top = rrPts(PH.w, PH.h, 72, PH.t), bot = rrPts(PH.w, PH.h, 72, 0);
  const coil = coilPts(PH.rIn, PH.rOut, PH.turns, PH.coilDz, 0, PH.coilOy, 0.6);
  const c0 = PP([0, 0, 0]);
  if (st.z > 4) shadow(P([st.ox, st.oy, PAD.h])[0], P([st.ox, st.oy, PAD.h])[1], 260 * (1 + st.z / 400), 80, 0.2 / (1 + st.z / 150));
  // inner parts, blurred behind the frosted back
  const hazy = 1 - st.xray;
  ctx.save(); ctx.globalAlpha = st.phone;
  if (hazy > 0.02) { ctx.filter = "blur(3px)"; innerParts(PP, st, 0.6 * hazy, coil); ctx.filter = "none"; }
  ctx.restore();
  glass(() => hullPath(PP, [...top, ...bot]), { tint: lerp(0.2, 0.06, st.xray), dark: 0.1, rim: 2, a: st.phone });
  glass(() => poly(PP, top), { tint: lerp(0.26, 0.05, st.xray), sheen: -0.75, rim: 2.6, a: st.phone });
  if (st.xray > 0.02) { ctx.save(); ctx.globalAlpha = st.phone; innerParts(PP, st, st.xray, coil, true); ctx.restore(); }
  if (st.rxDots > 0.01) dots(PP, coil, st.rxPhase, st.rxDots * st.xray, 36, 6);
  if (st.phoneMagnet > 0.01) magnetRing(PP, 0, PH.coilOy, 10, st.phoneMagnet, st.phoneMagnetHL);
  if (st.ringHolder > 0.01) ringHolder(PP, st);
  // the screen: charging bolt + battery level, fades out when x-rayed
  const ui = st.phone * (1 - st.xray) * st.screen;
  if (ui > 0.02) {
    const sc = PP([0, -40, PH.t]);
    const rg = ctx.createRadialGradient(sc[0], sc[1], 0, sc[0], sc[1], 230); rg.addColorStop(0, `rgba(255,120,70,${0.3 * st.bolt * ui})`); rg.addColorStop(1, "rgba(255,120,70,0)");
    ctx.save(); poly(PP, top); ctx.clip(); ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H); ctx.restore();
    if (st.bolt > 0.01) bolt(sc[0], sc[1], 1.2 * (0.6 + 0.4 * st.bolt), ui * st.bolt);
  }
  return PP;
}
function innerParts(PP, st, a, coil, sharp = false) {
  ctx.save(); ctx.globalAlpha *= a;
  // battery
  poly(PP, rrPts(320, 470, 24, 30).map((p) => [p[0], p[1] + 150 + 30, p[2]])); ctx.fillStyle = "rgba(60,70,90,0.28)"; ctx.fill(); ctx.strokeStyle = "rgba(60,70,90,0.5)"; ctx.lineWidth = 2; ctx.stroke();
  if (sharp && st.battFill > 0) { poly(PP, rrPts(300, 450 * st.battFill, 18, 31).map((p) => [p[0], p[1] + 180 + 225 * (1 - st.battFill), p[2]])); ctx.fillStyle = "rgba(255,74,28,0.30)"; ctx.fill(); }
  // ferrite above the coil (towards the battery)
  disc(PP, PH.rOut + 14, PH.ferDz, C.ferrite, sharp ? 0.5 : 0.35, 0, PH.coilOy);
  drawCoil(PP, coil, sharp ? 9 : 6, 1);
  // the receiver chip near the top + a copper trace from the coil
  poly(PP, rrPts(90, 64, 8, 32).map((p) => [p[0] + 80, p[1] - 330, p[2]])); ctx.fillStyle = "rgba(30,35,45,0.75)"; ctx.fill();
  if (sharp && st.trace > 0.01) { ctx.save(); ctx.globalAlpha *= st.trace; ctx.strokeStyle = C.copper; ctx.lineWidth = 5; ctx.lineCap = "round";
    poly(PP, [[PH.rOut * Math.cos(0.6), PH.coilOy + PH.rOut * Math.sin(0.6), PH.coilDz], [150, -250, 30], [80, -298, 32]], false); ctx.stroke();
    poly(PP, [[120, -330, 32], [150, -330, 32], [150, 180 - 235, 31]], false); ctx.stroke(); ctx.restore(); }
  // the little load switch (blinks when the phone "talks")
  if (sharp && st.switchA > 0.01) { const q = PP([30, -250, 34]); ctx.save(); ctx.globalAlpha = st.switchA * (0.35 + 0.65 * st.switchOn); ctx.fillStyle = C.acc; ctx.shadowColor = "rgba(255,74,28,0.9)"; ctx.shadowBlur = 16 * st.switchOn; ctx.beginPath(); ctx.roundRect(q[0] - 14, q[1] - 9, 28, 18, 5); ctx.fill(); ctx.restore(); }
  ctx.restore();
}
function ringHolder(PP, st) {
  const lift = st.ringLift, a = st.ringHolder;
  ctx.save(); ctx.globalAlpha = a;
  const pts = circ(95, -4 - lift * 220, 48, 0, PH.coilOy + 40 + lift * 260);
  poly(PP, pts); const g = ctx.createLinearGradient(0, 900, 0, 1200); g.addColorStop(0, "#C9CED6"); g.addColorStop(1, "#7E8692"); ctx.fillStyle = g; ctx.fill(); ctx.strokeStyle = "#5B6170"; ctx.lineWidth = 3; ctx.stroke();
  poly(PP, circ(60, -4 - lift * 220, 48, 0, PH.coilOy + 40 + lift * 260)); ctx.strokeStyle = "rgba(255,255,255,0.7)"; ctx.lineWidth = 6; ctx.stroke();
  ctx.restore();
}
function bolt(x, y, s, a) { ctx.save(); ctx.globalAlpha = a; ctx.translate(x, y); ctx.scale(s, s); ctx.shadowColor = "rgba(255,74,28,0.9)"; ctx.shadowBlur = 36; ctx.fillStyle = C.acc; ctx.beginPath(); ctx.moveTo(8, -52); ctx.lineTo(-26, 8); ctx.lineTo(-2, 8); ctx.lineTo(-10, 52); ctx.lineTo(26, -10); ctx.lineTo(2, -10); ctx.closePath(); ctx.fill(); ctx.restore(); }
function drawKey(P, a) {
  if (a <= 0.01) return; const z = PAD.h + 3;
  ctx.save(); ctx.globalAlpha = a;
  const g = ctx.createLinearGradient(300, 900, 700, 1200); g.addColorStop(0, "#D5DAE1"); g.addColorStop(1, "#8B939E");

  const b = E.p3io(prog(t, T.pair, T.pairEnd)) * (1 - E.p3io(prog(t, T.back, T.back + 0.6)));
  return Math.max(a, b);
}
function frame(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.filter = "none"; ctx.drawImage(BG, 0, 0);
  if (t >= T.end) { endCard(t); return; }
  const cam = camAt(t), sk = splitK(t);
  if (sk < 0.001) {
    const P = makeP(cam), st = worldState(t, 0); const PP = drawWorld(P, st); annotate(t, P, PP, st);
  } else {
    const shrink = lerp(1, 0.58, sk);
    const camL = { ...cam, focal: cam.focal * shrink, cx: lerp(540, 285, sk) }, camR = { ...cam, focal: cam.focal * shrink, cx: lerp(540 + 540, 800, sk) };
    const PL = makeP(camL), PR = makeP(camR);
    const stL = worldState(t, -1), stR = worldState(t, 1);
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, lerp(W, 540, sk), H); ctx.clip(); const PPL = drawWorld(PL, stL); ctx.restore();
    ctx.save(); ctx.globalAlpha = sk; ctx.beginPath(); ctx.rect(lerp(W, 540, sk), 0, W, H); ctx.clip(); const PPR = drawWorld(PR, stR); ctx.restore();
    // divider
    ctx.save(); ctx.globalAlpha = 0.6 * sk; ctx.strokeStyle = "rgba(255,255,255,0.9)"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(540, 700); ctx.lineTo(540, 1420); ctx.stroke(); ctx.restore();
    annotateSplit(t, PL, PR, PPL, PPR, stL, stR, sk);
  }
  drawSubs(t);
  label(COPY.hand, 540, 1440, t, 0, T.low, { size: 30, weight: 400, align: "center", plate: false, col: "rgba(20,20,20,0.35)" });
  label(COPY.hand, 540, 1440, t, T.back, T.tip, { size: 30, weight: 400, align: "center", plate: false, col: "rgba(20,20,20,0.35)" });
}
function annotate(t, P, PP, st) {
  // 2: where the two shells meet — no contacts
  if (t >= T.cut && t < T.q1 + 0.4) { const a = P([-PAD.r * 0.2, 0, PAD.h]), b = P([PAD.r * 0.2, 0, PAD.h]); const k = E.p3out(prog(t, T.cut, T.cut + 0.4)), fo = 1 - prog(t, T.q1, T.q1 + 0.4);
    obox(Math.min(a[0], b[0]) - 260, a[1] - 70, Math.abs(b[0] - a[0]) + 520, 140, k, fo); }
  // 3: the two coils, one at a time (spotlight + label)
  const txC = P([0, 0, PAD.coilZ]), rxC = PP ? PP([0, PH.coilOy, PH.coilDz]) : txC;
  const litTx = win(t, T.litTx, T.a3 + 0.3, 0.3, 0.3), litRx = win(t, T.litRx, T.a3 + 0.3, 0.3, 0.3);
  spotlight(txC[0], txC[1] + 10, 520, 230, litTx * (1 - litRx));
  spotlight(rxC[0], rxC[1], 520, 230, litRx);
  if (t >= T.litTx && t < T.cur + 2.0) { const k = E.p3out(prog(t, T.litTx, T.litTx + 0.3)); leader(150, txC[1] - 110, txC[0] - 200, txC[1] - 10, k); label(COPY.tx, 96, txC[1] - 130, t, T.litTx, T.cur + 2.0); }
  if (t >= T.litRx && t < T.cur + 2.0) { const k = E.p3out(prog(t, T.litRx, T.litRx + 0.3)); leader(150, rxC[1] - 130, rxC[0] - 120, rxC[1] - 8, k); label(COPY.rx, 96, rxC[1] - 150, t, T.litRx, T.cur + 2.0); }
  label(COPY.freq, 540, 1430, t, T.cur, T.q2, { size: 44, weight: 400, align: "center" });
  label(COPY.color, 540, 1430, t, T.q2, T.name, { size: 44, weight: 400, align: "center" });
  // cause → effect arrows: 电流 → 磁 → 电
  if (t >= T.field && t < T.name) arrowS(txC[0] + 330, txC[1] + 40, txC[0] + 330, txC[1] - 120, E.p3out(prog(t, T.field + 0.3, T.field + 0.8)), 1 - prog(t, T.name - 0.3, T.name));
  if (t >= T.rxCur && t < T.name) arrowS(rxC[0] + 330, rxC[1] - 10, rxC[0] + 250, rxC[1] - 70, E.p3out(prog(t, T.rxCur + 0.2, T.rxCur + 0.6)), 1 - prog(t, T.name - 0.3, T.name));
  label(COPY.induct, 540, 1430, t, T.name + 0.3, T.q3, { size: 44, align: "center", col: C.ink });
  // the chip: AC → DC
  if (PP && t >= T.chip && t < T.q4) { const c = PP([80, -330, 32]); const k = E.p3out(prog(t, T.chip, T.chip + 0.3)); spotlight(c[0], c[1], 220, 160, win(t, T.chip, T.batt + 0.4, 0.3, 0.3)); obox(c[0] - 70, c[1] - 60, 140, 120, k, 1 - prog(t, T.q4 - 0.3, T.q4)); label(COPY.acdc, c[0] + 100, c[1] - 70, t, T.chip, T.q4); }
  // the dense field over the coil
  if (t >= T.dense && t < T.q5) { const c = P([0, 0, 120]); obox(c[0] - 170, c[1] - 170, 340, 260, E.p3out(prog(t, T.dense + 0.2, T.dense + 0.6)), 1 - prog(t, T.q5 - 0.3, T.q5)); }
  label("间距放大 · 示意", 1000, 700, t, T.push + 1.6, T.magnet, { size: 44, weight: 400, align: "right" });
  // magnets
  label(COPY.qi2, 540, 1430, t, T.ringTx, T.q6, { size: 44, align: "center" });
  // tip: the metal ring
  if (PP && t >= T.tip && t < T.ringOff + 0.5) { const c = PP([0, PH.coilOy + 40, 0]); obox(c[0] - 130, c[1] - 90, 260, 180, E.p3out(prog(t, T.tip + 0.3, T.tip + 0.7)), 1 - prog(t, T.ringOff, T.ringOff + 0.4)); }
}
function annotateSplit(t, PL, PR, PPL, PPR, stL, stR, sk) {
  if (t >= T.back || (t >= T.magnet && t < T.pair)) return;
  if (t < T.magnet) {
    label(COPY.aligned, 285, 1430, t, T.split + 0.4, T.magnet, { size: 48, align: "center", col: t >= T.litL ? C.ink : "rgba(20,20,20,0.6)" });
    label(COPY.tilted, 800, 1430, t, T.split + 0.4, T.magnet, { size: 48, align: "center", col: t >= T.litR ? C.ink : "rgba(20,20,20,0.6)" });
    // one side at a time
    const onL = win(t, T.litL, T.litR, 0.3, 0.2), onR = E.p2io(prog(t, T.litR, T.litR + 0.3));
    ctx.save(); ctx.fillStyle = `rgba(30,36,48,${0.12 * onL})`; ctx.fillRect(540, 640, 540, 820); ctx.fillStyle = `rgba(30,36,48,${0.12 * onR})`; ctx.fillRect(0, 640, 540, 820); ctx.restore();
  } else {
    label(COPY.phone, 285, 1430, t, T.pair + 0.4, T.back, { size: 48, align: "center" });
    label(COPY.key, 800, 1430, t, T.pair + 0.4, T.back, { size: 48, align: "center" });
    const onL = win(t, T.replyL, T.silentR, 0.3, 0.2) + E.p2io(prog(t, T.talk, T.talk + 0.3)), onR = win(t, T.silentR, T.talk, 0.3, 0.3);
    ctx.save(); ctx.fillStyle = `rgba(30,36,48,${0.12 * clamp(onL)})`; ctx.fillRect(540, 640, 540, 820); ctx.fillStyle = `rgba(30,36,48,${0.12 * onR})`; ctx.fillRect(0, 640, 540, 820); ctx.restore();
    meter(285, 1300, t, E.p2io(prog(t, T.ping - 0.3, T.ping)) * sk, "reply");
    meter(800, 1300, t, E.p2io(prog(t, T.ping - 0.3, T.ping)) * sk, "none");
    label(COPY.load, 285, 1220, t, T.replyL, T.silentR + E8 * 2, { size: 44, align: "center" });
    if (PPL) { const c = PPL([0, -200, PH.t]); bubble(COPY.more, c[0], c[1] - 40, t, T.bub1, T.a14); bubble(COPY.less, c[0], c[1] + 90, t, T.bub2, T.a14); }
  }
}
// ================================================================ end card
const BADGE = [880, 520];
function endCard(t) {
  const k = E.p3io(prog(t, T.end, T.endMorph + 0.3));
  ctx.save(); const sc = lerp(0.95, 0.24, k), cx = lerp(540, BADGE[0], k), cy = lerp(1000, BADGE[1], k);
  ctx.translate(cx, cy); ctx.scale(sc, sc); ctx.strokeStyle = C.ink; ctx.lineWidth = 6 / sc * 0.4 + 6; ctx.lineJoin = "round";
  ctx.beginPath(); ctx.ellipse(0, 120, 330, 110, 0, 0, TAU); ctx.fillStyle = "rgba(255,255,255,0.5)"; ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.roundRect(-190, -330, 380, 520, 60); ctx.fillStyle = "rgba(255,255,255,0.75)"; ctx.fill(); ctx.stroke();
  ctx.restore();
  typeLines(COPY.end, t, T.title1, [905, 1045, 1185], 124);
  slamLine(COPY.epNum, t, T.ep, 96, 520, 150);
  if (t >= T.ep + 0.25) { const a = clamp((t - T.ep - 0.25) / 0.2); ctx.save(); ctx.globalAlpha = a; ctx.filter = `blur(${(8 * (1 - a)).toFixed(1)}px)`; ctx.font = `112px ${DISPLAY}`; ctx.fillStyle = C.ink; ctx.fillText(COPY.epName, 100, 668); ctx.restore(); }
  if (t >= T.sting) { const s2 = spring(t - T.sting, 16, 0.5); ctx.save(); ctx.translate(BADGE[0], BADGE[1]); ctx.scale(s2, s2); ctx.font = `150px ${DISPLAY}`; ctx.fillStyle = C.acc; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("?", 4, 4); ctx.restore(); }
}
function typeLines(L, t, t0, ys, size) {
  const font = `${size}px ${DISPLAY}`; let n = 0;
  L.forEach((str, i) => { const chars = parse(str); let x = 96; chars.forEach((c) => { const ct = t0 + n * 0.045 + i * 0.3; n++; if (t >= ct) { ctx.font = font; ctx.fillStyle = c.a ? C.acc : C.ink; ctx.fillText(c.ch, x, ys[i]); } x += mw(font, c.ch); }); });
}
function slamLine(str, t, t0, x, y, size) { if (t < t0) return; const sc = slamScale(t - t0); ctx.save(); ctx.translate(x, y - size * 0.35); ctx.scale(sc, sc); ctx.font = `${size}px ${DISPLAY}`; ctx.fillStyle = C.ink; ctx.fillText(str, 0, size * 0.35); ctx.restore(); }

window.seek = function seek(t) { frame(Math.max(0, Math.min(DUR - 1e-6, t))); };
Promise.all([document.fonts.load(`104px ${DISPLAY}`), document.fonts.load(`700 44px ${UI}`), document.fonts.load(`400 44px ${UI}`)]).then(() => { buildBG(); window.seek(0); window.ready = true; });
</script>
