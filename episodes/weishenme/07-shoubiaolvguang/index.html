// ============================================================================================
// EP.07 手表绿光 — a pure function of time. window.seek(t) paints frame t.
// One forearm in one space (world units: mm; x along the forearm towards the hand, y across it (+y = the little-finger
// side), z up; the wrist line at x = 0). A watch sits on the back of the wrist. One orthographic camera with a pitch θ

// face → the camera turns to the side and goes into the gap under the watch → the section through the skin (dark, its
// own drawing: the sensor on top, skin, small vessels; green light on curved paths) → out, from the side: the arm swings
// (running) → the hand opens, a ring (a magnified section of the finger) → back to the top view: off, back up, on again
// → wide: towards the elbow → the end badge. The light trace is a card under the picture (dark) from 14.5 to 44.
// No timers, no rAF, no CSS transitions, no state between frames (the context is reset every frame); seeded noise only.
// ============================================================================================

  shirt: "#78808C", shirtD: "#5E6570",

const TAU = Math.PI * 2, RAD = Math.PI / 180;

  const col = o.col ?? C.ink, acc = o.acc ?? C.acc, style = o.style ?? "blur";

    const font = `${wt} ${size}px ${face}`.trim();

// ---------------------------------------------------------------- the heart and the swing (shared by the picture and the trace)
function beatShape(u) { if (u < 0) return 0; if (u < 0.12) return E.smooth(u / 0.12); return Math.exp(-(u - 0.12) * 6.5); }

const SH = [-265, 300];                                                   // the shoulder (x, z), side view

  if (q > 0.01) { const j = 6 * Math.sin(t * 23) * (1 - prog(t, T.sub, T.subEnd)); ctx.save(); ctx.translate(j, 0); draw("?", q, T.qmark); ctx.restore(); }
  draw(String(HR_RUN), n120, T.num120);
}

// ---------------------------------------------------------------- magnifiers (screen-space circles)
function magFrame(C0, R, tip, op, k, inner) {
  if (op <= 0.005) return;
  ID(); ctx.save(); ctx.globalAlpha = op;
  const dx = tip[0] - C0[0], dy = tip[1] - C0[1], d = Math.hypot(dx, dy) || 1, ex = C0[0] + dx / d * R, ey = C0[1] + dy / d * R;
  ctx.strokeStyle = C.ink; ctx.lineWidth = 4; line(ex, ey, lerp(ex, tip[0], k), lerp(ey, tip[1], k));
  if (k > 0.98) { ctx.fillStyle = C.acc; ctx.beginPath(); ctx.arc(tip[0], tip[1], 9, 0, TAU); ctx.fill(); }
  const Rr = R * (0.6 + 0.4 * E.p3out(op));
  ctx.beginPath(); ctx.arc(C0[0], C0[1], Rr, 0, TAU); ctx.fillStyle = C.dark; ctx.fill(); ctx.save(); ctx.clip();
  inner(Rr);
  ctx.restore();
  ID(); ctx.lineWidth = 10; ctx.strokeStyle = C.ink; ctx.beginPath(); ctx.arc(C0[0], C0[1], Rr, 0, TAU); ctx.stroke();
  ctx.restore();
}
function accMag(t, K, F) {                                                 // inside the watch: the accelerometer
  const op = win(t, T.mag, T.sub + 0.6, 0.35, 0.35); if (op <= 0.005) return;
  const C0 = [820, 690], R = 150, tip = P3(K, F.c);
  magFrame(C0, R, tip, op, 1, (Rr) => {
    ctx.fillStyle = "#2B2F35"; ctx.fillRect(C0[0] - Rr, C0[1] - 40, 2 * Rr, 120);
    const on = E.p3out(prog(t, T.chipOn, T.chipOn + 0.3)), sw = Math.sin(swingPh(t)) * swingAmp(t);
    ctx.save(); ctx.translate(C0[0], C0[1] + 6);
    ctx.strokeStyle = "#8C939C"; ctx.lineWidth = 4; for (let i = -2; i <= 2; i++) { line(i * 18, -52, i * 18, -64); line(i * 18, 52, i * 18, 64); line(-52, i * 18, -64, i * 18); line(52, i * 18, 64, i * 18); }
    rr(-54, -54, 108, 108, 8); ctx.fillStyle = "#0E0F12"; ctx.fill();
    ctx.lineWidth = 5; ctx.strokeStyle = `rgba(${ACC},${on})`; ctx.stroke();
    // a tiny proof mass that lags the swing (示意)
    ctx.fillStyle = `rgba(${ACC},${0.9 * on})`; rr(-20 - 10 * sw, -20, 40, 40, 6); ctx.fill();
    ctx.restore();
  });
}
function ringMag(t, K, ringP) {                                             // the finger, cut across, inside the ring (示意)
  const op = win(t, T.rmag, T.q9 + 0.35, 0.4, 0.35); if (op <= 0.005 || !ringP) return;
  const C0 = [770, 760], R = 205;
  magFrame(C0, R, ringP, op, 1, (Rr) => {
    const pu = pulseAt(t, T.beat0), s = Rr / 205;
    ctx.save(); ctx.translate(C0[0], C0[1]); ctx.scale(s, s);
    ctx.beginPath(); ctx.arc(0, 0, 178, 0, TAU); ctx.fillStyle = C.ringC; ctx.fill();
    ctx.beginPath(); ctx.arc(0, 0, 156, 0, TAU); ctx.fillStyle = C.ringL; ctx.fill();
    ctx.beginPath(); ctx.arc(0, 0, 150, 0, TAU); ctx.fillStyle = C.derm; ctx.fill(); ctx.lineWidth = 8; ctx.strokeStyle = C.epi; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0, -30, 54, 46, 0, 0, TAU); ctx.fillStyle = C.bone; ctx.fill(); ctx.strokeStyle = "#B8B0A2"; ctx.lineWidth = 3; ctx.stroke();
    // small vessels on the palm side (they swell a little with each beat — 示意)
    for (const [x, y, r] of [[-62, 88, 11], [62, 88, 11], [0, 118, 7], [-104, 50, 6], [104, 50, 6]]) { ctx.beginPath(); ctx.arc(x, y, r * (1 + 0.45 * pu), 0, TAU); ctx.fillStyle = C.blood; ctx.fill(); ctx.strokeStyle = C.bloodD; ctx.lineWidth = 2.5; ctx.stroke(); }
    // two LEDs on the inner face of the ring (both sides of the palm side), the light eye between: curved green paths in and out
    const fl = flick(t), leds = [[-88, 122], [88, 122]], pdp = [0, 150];
    for (const [x, y] of leds) {
      const sd = x > 0 ? -1 : 1, P = [[x, y], [x + sd * 6, y - 95], [sd * 40, 40], [pdp[0], pdp[1] - 4]];
      ctx.strokeStyle = `rgba(61,240,138,${0.35})`; ctx.lineWidth = 4; ctx.beginPath(); for (let u = 0; u <= 1.001; u += 0.05) { const q = bez(P, u); u === 0 ? ctx.moveTo(...q) : ctx.lineTo(...q); } ctx.stroke();
      for (let i = 0; i < 3; i++) {
        const u = ((t * 0.8 + i / 3 + (x > 0 ? 0.17 : 0)) % 1), q = bez(P, u), al = 1 - 0.55 * pu * Math.sin(Math.PI * u);
        const g2 = ctx.createRadialGradient(q[0], q[1], 0, q[0], q[1], 22); g2.addColorStop(0, `rgba(61,240,138,${0.5 * al})`); g2.addColorStop(1, "rgba(61,240,138,0)"); ctx.fillStyle = g2; ctx.beginPath(); ctx.arc(q[0], q[1], 22, 0, TAU); ctx.fill();
        ctx.fillStyle = `rgba(61,240,138,${al})`; ctx.beginPath(); ctx.arc(q[0], q[1], 9, 0, TAU); ctx.fill();
      }
      rr(x - 16, y + 6, 32, 12, 3); ctx.fillStyle = mixHex("#1F6B40", C.green, fl); ctx.fill();
    }
    rr(-17, 150, 34, 12, 3); ctx.fillStyle = C.pd; ctx.fill();
    ctx.restore();
  });
  pill(COPY.note, C0[0] + 60, C0[1] + R + 70, 44, t, T.rmag + 0.3, T.q9 + 0.3, { weight: 700 });
}

// ---------------------------------------------------------------- text
function scrim(t) {
  const ir = irisOf(t);
  if (ir) { ctx.save(); irisClip(ir, false); scrimOf(t, ir.into ? 0 : 1); ctx.restore(); ctx.save(); irisClip(ir, true); scrimOf(t, ir.into ? 1 : 0); ctx.restore(); return; }
  scrimOf(t, flood(t));
}
function scrimOf(t, fl) {
  const STOPS = [[0, 1], [0.66, 1], [0.74, 0.86], [0.82, 0.56], [0.9, 0.24], [1, 0]];
  if (fl > 0.02) { ID(); const g = ctx.createLinearGradient(0, 0, 0, 800); STOPS.forEach(([o, k]) => g.addColorStop(o, `rgba(23,25,28,${fl * k})`)); ctx.fillStyle = g; ctx.fillRect(0, 0, W, 800); }
  const a = (1 - fl) * (t >= T.end ? 1 - prog(t, T.end, T.end + 0.3) : 1);
  if (a <= 0.01) return;
  ID(); const g = ctx.createLinearGradient(0, 0, 0, 800);
  STOPS.forEach(([o, k]) => g.addColorStop(o, `rgba(236,235,230,${a * k})`));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, 800);
}
function textBand(t) {
  const L = C.ink, D = C.paper, fl = TXF ?? flood(t), M = mixHex(L, D, fl);
  lines(COPY.h1, t, -1, T.q2, { style: "none", col: L });
  underline(COPY.h1[1], "在", "看", 1, t, T.underline, T.q2);
  lines(COPY.q2, t, T.q2, T.a1, { style: "blur", col: L });
  lines(COPY.a1, t, T.a1, T.q3, { style: "slam", col: M, lineGap: 0.2 });
  lines(COPY.q3, t, T.q3, T.a3, { style: "blur", col: M });
  lines(COPY.a3, t, T.a3, T.pd, { style: "blur", col: M });
  lines(COPY.pd, t, T.pd, T.q4, { style: "blur", col: M });
  lines(COPY.q4, t, T.q4, T.b1, { style: "blur", col: M });
  lines(COPY.b1, t, T.b1, T.q5, { style: "blur", col: M });
  lines(COPY.q5, t, T.q5, T.b2, { style: "blur", col: M });
  lines(COPY.b2, t, T.b2, T.rate, { style: "blur", col: M });
  lines(COPY.rate, t, T.rate, T.q6, { style: "slam", col: M, lineGap: 0.25 });
  lines(COPY.q6, t, T.q6, T.r1, { style: "blur", col: M });
  lines(COPY.r1, t, T.r1, T.q7, { style: "blur", col: L });
  lines(COPY.q7, t, T.q7, T.acc, { style: "blur", col: L });
  lines(COPY.acc, t, T.acc, T.acc2, { style: "slam", col: L });
  lines(COPY.acc2, t, T.acc2, T.sub, { style: "blur", col: L });
  lines(COPY.sub, t, T.sub, T.q8, { style: "blur", col: L });
  lines(COPY.q8, t, T.q8, T.ringA, { style: "blur", col: L });
  lines(COPY.ringA, t, T.ringA, T.q9, { style: "blur", col: L });
  lines(COPY.fin, t, T.fin, T.finOut, { style: "slam", col: L, lineGap: 0.25 });
  label(COPY.tipTag, 98, 206, 46, C.acc, t, T.tip, T.tipOut, { weight: 700 });
  lines(COPY.tip, t, T.tip + 0.15, T.tipOut, { style: "blur", col: L, lineGap: 0.3 });
  label(COPY.tattoo, 98, 592, 44, "rgba(20,20,20,0.85)", t, T.tip + 0.6, T.tipOut, { weight: 400 });
}
function overlays(t, K, LW) {
  const fl = flood(t);
  if (fl > 0.5) {
    const led = secPt(t, SEC.led, SEC.y0 - 4), pd = secPt(t, SEC.pd, SEC.y0 - 4);
    if (t >= T.ledLab && t < T.a3 + 0.3) { const k = E.p3out(prog(t, T.ledLab + 0.1, T.ledLab + 0.45)), fo = 1 - prog(t, T.a3, T.a3 + 0.3); ID(); ctx.save(); ctx.globalAlpha = fo; leader(250, 668, led[0] - 10, led[1] - 8, "rgba(241,240,236,0.8)", k); ctx.restore(); label(COPY.led, 96, 658, 44, "rgba(241,240,236,0.95)", t, T.ledLab, T.a3 + 0.3, { alpha: fo }); }
    if (t >= T.pd && t < T.q4 + 0.3) { const k = E.p3out(prog(t, T.pdOn, T.pdOn + 0.35)), fo = 1 - prog(t, T.q4, T.q4 + 0.3); ID(); ctx.save(); ctx.globalAlpha = fo; leader(800, 668, pd[0] + 14, pd[1] - 8, "rgba(241,240,236,0.8)", k); ctx.restore(); label(COPY.pdName, 984, 658, 44, "rgba(241,240,236,0.95)", t, T.pd, T.q4 + 0.3, { align: "right", alpha: fo }); }
    const note = (a, b) => { pill(COPY.note, 984, 1050, 44, t, a, b, { align: "right", weight: 700 }); };
    if (t >= T.eat && t < T.pd) note(T.eat, T.pd);
    if (t >= T.q5 && t < T.rate) note(T.q5, T.rate);
    if (t >= T.term && t < T.q6) pill(COPY.term, 984, 1050, 44, t, T.term, T.q6, { align: "right", weight: 700 });
  }
  // the tip: the wrist bone and the elbow side, named
  if (t >= T.wideEnd - 0.3 && t < T.tipOut) {
    const fo = 1 - prog(t, T.tipOut - 0.3, T.tipOut), k = E.p3out(prog(t, T.wideEnd - 0.3, T.wideEnd + 0.2));
    const b = proj(K, -6 + 40 / TOPI.s, 115 / TOPI.s, TOPI.z); ID(); ctx.save(); ctx.globalAlpha = fo; leader(b[0] + 70, b[1] + 120, b[0], b[1] + 6, C.ink, k); ctx.restore();
    label(COPY.bone, b[0] + 40, b[1] + 175, 46, C.ink, t, T.wideEnd - 0.3, T.tipOut, { alpha: fo });
    const s = watchState(t), w0 = proj(K, s.xw - WT.hx - 8, 0, armTop(s.xw) + 6), ax = proj(K, -205, 0, armTop(-205));
    const ak = E.p3out(prog(t, T.move - 0.25, T.move + 0.4));
    ID(); ctx.save(); ctx.globalAlpha = fo * ak; ctx.strokeStyle = C.acc; ctx.lineWidth = 9; ctx.lineCap = "round";
    const ay = w0[1] - 150; line(w0[0], ay, lerp(w0[0], ax[0], ak), ay); const hx = lerp(w0[0], ax[0], ak);
    ctx.beginPath(); ctx.moveTo(hx + 30, ay - 24); ctx.lineTo(hx, ay); ctx.lineTo(hx + 30, ay + 24); ctx.stroke(); ctx.restore();
    label(COPY.elbow, ax[0] - 30, ay - 40, 52, C.ink, t, T.move, T.tipOut, { alpha: fo, weight: 700 });
  }
}
function pill(str, x, y, size, t, t0, t1, o = {}) {                       // small text on a dark pill (readable on any tissue)
  if (t < t0 || t >= t1) return;
  ID(); const font = `${o.weight ?? 700} ${size}px ${UI}`, wv = mw(font, str), k = E.p3out(prog(t, t0, t0 + 0.25)), e = 1 - prog(t, t1 - 0.15, t1);
  const left = o.align === "right" ? x - wv : x;
  ctx.save(); ctx.globalAlpha = k * e; rr(left - 22, y - size - 6, wv + 44, size + 26, (size + 26) / 2); ctx.fillStyle = "rgba(23,25,28,0.88)"; ctx.fill();
  ctx.font = font; ctx.fillStyle = C.paper; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic"; ctx.fillText(str, left, y); ctx.restore();
}
function endCard(t, F, K) {
  if (t < T.title1) return;
  lines(COPY.end, t, T.title1, DUR + 1, { style: "type", col: C.ink, ys: [905, 1045, 1185], size: 124, stag: 0.045, lineGap: 0.3 });
  lines([COPY.epNum], t, T.ep, DUR + 1, { style: "slam", col: C.ink, x: 400, ys: [520], size: 150 });
  lines([COPY.epName], t, T.ep + 0.25, DUR + 1, { style: "blur", col: C.ink, x: 404, ys: [668], size: 112 });
  if (t >= T.sting) {
    const c = P3(K, LP(F, 0, 0, WT.th / 2)), sc = spring(t - T.sting, 16, 0.5);
    ID(); ctx.save(); ctx.translate(c[0], c[1]); ctx.scale(sc, sc); ctx.font = `150px ${DISPLAY}`; ctx.fillStyle = C.acc; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("?", 4, 4); ctx.restore();
  }
}

// dark ⇄ light switches: a growing circle (both worlds fully opaque)
const IRIS = [540, 1000];
function irisOf(t) {
  const fl = flood(t); if (fl <= 0.001 || fl >= 0.999) return null;
  const into = flood(t + 0.02) > fl, k = into ? fl : 1 - fl;
  return { into, R: 40 + 2300 * k };
}
function irisClip(ir, inside) { const p = new Path2D(); if (!inside) p.rect(0, 0, W, H); p.arc(IRIS[0], IRIS[1], ir.R, 0, TAU); ID(); ctx.clip(p, inside ? "nonzero" : "evenodd"); }
let TXF = null;
function frame(t) {
  ctx.reset(); ID();
  const K = cam(t), fl = flood(t), ir = irisOf(t);
  let LW = null;
  const light = () => { LW = drawLight(t, K); };
  if (ir) {
    if (ir.into) { light(); ctx.save(); irisClip(ir, true); drawSection(t, 1); ctx.restore(); }
    else { drawSection(t, 1); ctx.save(); irisClip(ir, true); light(); ctx.restore(); }
  } else if (fl < 0.999) light(); else drawSection(t, 1);
  if (!LW) { ALPHA = armAngle(t); const s = watchState(t); LW = { F: watchFrame(t, s), ringP: null }; }
  // the trace card, with its leader to the light eye (section) or to the device (outside)
  const inSec = fl > 0.5;
  let target = inSec ? secPt(t, SEC.pd, SEC.y0 - 4) : P3(K, LW.F.c);
  if (!inSec && t >= T.curveSlide && LW.ringP) { const u = E.p2io(prog(t, T.curveSlide, T.curveSlideEnd)); const r = [770, 760 + 205]; target = [lerp(target[0], r[0], u), lerp(target[1], r[1], u)]; }
  drawCard(t, !inSec, target);
  scrim(t);
  accMag(t, K, LW.F);
  ringMag(t, K, LW.ringP);
  overlays(t, K, LW);
  if (ir) {
    const nw = ir.into ? 1 : 0;
    ctx.save(); irisClip(ir, false); TXF = 1 - nw; textBand(t); ctx.restore();
    ctx.save(); irisClip(ir, true); TXF = nw; textBand(t); ctx.restore(); TXF = null;
  } else textBand(t);
  endCard(t, LW.F, K);
}

// ---------------------------------------------------------------- motion blur: temporal supersampling where things move fast
const BLUR = [[1.95, 2.65, 12], [5.25, 7.3, 10], [26.0, 27.6, 10], [27.6, 40.6, 5], [44.0, 45.6, 10], [46.2, 46.95, 12], [49.5, 50.6, 10], [51.2, 52.05, 8], [53.5, 54.15, 12]];
const SHUTTER = 0.5 / FPS;
window.seek = function seek(t) {
  t = clamp(t, 0, DUR - 1e-6);
  const b = BLUR.find(([a, bb]) => t >= a && t < bb);
  if (!b) { ctx = MAIN; frame(t); return; }
  const SUB = b[2];
  MAIN.reset();
  for (let i = 0; i < SUB; i++) {
    ctx = OFFX;
    const ts = t + SHUTTER * (i / (SUB - 1) - 0.5);
    frame(clamp(ts, 0, DUR - 1e-6));
    MAIN.setTransform(1, 0, 0, 1, 0, 0); MAIN.globalAlpha = 1 / (i + 1); MAIN.drawImage(OFF, 0, 0);
  }
  MAIN.globalAlpha = 1; ctx = MAIN;
};
window.DUR = DUR; window.FPS = FPS;
window.addEventListener("hf-seek", (e) => window.seek(e.detail.time));
window.ready = false;
window.whenReady = Promise.all([
  document.fonts.load(`100px ${DISPLAY}`, "手表背面的绿光在看什么"), document.fonts.load(`700 50px ${UI}`, "光甩手每秒闪几百次"), document.fonts.load(`400 50px ${UI}`, "这种测法叫光电容积描记"),
  loadImg("top", "assets/people/arm-top.webp"), loadImg("open", "assets/people/arm-side-open-ring.webp"), loadImg("fist", "assets/people/arm-side-fist.webp"), loadImg("pinch", "assets/people/hand-pinch.webp"),
]).then(() => document.fonts.ready).then(() => { MEASURE.clear(); window.seek(0); window.ready = true; });
</script>
