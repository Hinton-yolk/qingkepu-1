"use strict";
// ============================================================================================
// EP.07 手表绿光 — a pure function of time. window.seek(t) paints frame t.
// One forearm in one space (world units: mm; x along the forearm towards the hand, y across it (+y = the little-finger
// side), z up; the wrist line at x = 0). A watch sits on the back of the wrist. One orthographic camera with a pitch θ
// (0° = straight down onto the back of the arm, 90° = from the side): the back of the watch (top view) → it lands, the
// face → the camera turns to the side and goes into the gap under the watch → the section through the skin (dark, its
// own drawing: the sensor on top, skin, small vessels; green light on curved paths) → out, from the side: the arm swings
// (running) → the hand opens, a ring (a magnified section of the finger) → back to the top view: off, back up, on again
// → wide: towards the elbow → the end badge. The light trace is a card under the picture (dark) from 14.5 to 44.
// No timers, no rAF, no CSS transitions, no state between frames (the context is reset every frame); seeded noise only.
// ============================================================================================
const { T, COPY, W, H, DUR, FPS, S16, HR_REST, HR_RUN, P_REST, P_RUN, BEATS, SWINGS } = TL;
const cv = document.getElementById("c");
const MAIN = cv.getContext("2d");

  skin: "#EBCBA5", skinD: "#D6AD84", skinL: "#F4DEC3", nail: "#F3DCCB",
  green: "#3DF08A", greenD: "#19B85E",                                  // the light, and only the light
  caseC: "#2A2D33", caseL: "#3A3E46", caseD: "#1A1C20", glass: "#0C0D10", strap: "#4A505A", strapD: "#3A3F48",
  shirt: "#78808C", shirtD: "#5E6570",
  epi: "#EFD3B4", derm: "#E2A98F", dermD: "#C98B78", fat: "#F3DF9F", blood: "#C93F48", bloodD: "#8E2A33", bone: "#E4DED2",

const DISPLAY = "Smiley", UI = "NotoSC";

// ---------------------------------------------------------------- math
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const TAU = Math.PI * 2, RAD = Math.PI / 180;
const E = {
  sine: (x) => 0.5 - 0.5 * Math.cos(Math.PI * x),
  p2io: (x) => (x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2),
  p3io: (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),

  if (u <= 0) return 1.55;

}

function kf(t, K, ease = E.p2io) {

// ---------------------------------------------------------------- camera: orthographic, pitch θ about the line y = piv

function key(F, anchor, Z, thDeg = 0, piv = 0) {

}

function uiText(str, x, y, sizeMM, col, o = {}) {

  ctx.font = `${o.weight ?? 700} ${sizeMM * 10}px ${o.face ?? UI}`; ctx.fillStyle = col; ctx.textAlign = o.align ?? "center"; ctx.textBaseline = o.base ?? "alphabetic";
  ctx.fillText(str, 0, 0); ctx.restore();

// Text band: style none | blur | type | slam | wipe; left aligned at x.
function lines(L, t, t0, t1, o = {}) {

  const x = o.x ?? 96, ys = o.ys ?? [330, 472], face = o.face ?? DISPLAY, wt = o.weight ?? "";
  const col = o.col ?? C.ink, acc = o.acc ?? C.acc, style = o.style ?? "blur";
  const stag = o.stag ?? 0.055, lineGap = o.lineGap ?? 0.16, exitDur = o.exit ?? 0.16, maxW = o.maxW ?? 900;
  ID();

    const size = fitSize(str, Array.isArray(o.size) ? o.size[i] : (o.size ?? 112), maxW, face, wt);
    const font = `${wt} ${size}px ${face}`.trim();
    const chars = parse(str), ls = t0 + i * lineGap;

    chars.forEach((c, j) => {

  const k = E.p3out(prog(t, t0, t0 + 0.28)), e = prog(t, t1 - 0.15, t1);

}

  const x0 = 96 + mw(f, prefix), wv = mw(f, word), k = E.p3out(prog(t, t0, t0 + 0.3)), fo = 1 - prog(t, t1 - 0.16, t1);

  const lo = []; for (const p of pts) { while (lo.length >= 2 && cr(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop(); lo.push(p); }
  const up = []; for (let i = pts.length - 1; i >= 0; i--) { const p = pts[i]; while (up.length >= 2 && cr(up[up.length - 2], up[up.length - 1], p) <= 0) up.pop(); up.push(p); }

// ---------------------------------------------------------------- the heart and the swing (shared by the picture and the trace)
function beatShape(u) { if (u < 0) return 0; if (u < 0.12) return E.smooth(u / 0.12); return Math.exp(-(u - 0.12) * 6.5); }

// ---------------------------------------------------------------- the world: the arm (rotates about the shoulder when running)
const SH = [-265, 300];                                                   // the shoulder (x, z), side view
let ALPHA = 0;                                                            // the arm's angle this frame
function aw(p) {                                                          // a point on the arm → the world (the swing)

// v3: the forearm is a tube measured from the user's reference images (tools/model.py): width from the top view, thickness from the side view
const AM = window.ARM_MODEL;
function tubeAt(x) { const TB = AM.TUBE, x0 = TB[0][0], st = TB[1][0] - x0; x = clamp(x, x0, TB[TB.length - 1][0]); const i = Math.min(TB.length - 2, Math.floor((x - x0) / st)), u = (x - TB[i][0]) / st; return TB[i].map((v, k) => lerp(v, TB[i + 1][k], u)); }

function spotlight(t) {

  const F = FOCUS(); let i = 0; while (i + 1 < F.length && t >= F[i + 1][0]) i++;

function overlays(t, K, LW) {
  const fl = flood(t);
  if (fl > 0.5) {
    const led = secPt(t, SEC.led, SEC.y0 - 4), pd = secPt(t, SEC.pd, SEC.y0 - 4);
    if (t >= T.ledLab && t < T.a3 + 0.3) { const k = E.p3out(prog(t, T.ledLab + 0.1, T.ledLab + 0.45)), fo = 1 - prog(t, T.a3, T.a3 + 0.3); ID(); ctx.save(); ctx.globalAlpha = fo; leader(led[0], 596, led[0], led[1] - 26, "rgba(241,240,236,0.8)", k); ctx.restore(); label(COPY.led, 96, 580, 44, "rgba(241,240,236,0.95)", t, T.ledLab, T.a3 + 0.3, { alpha: fo }); }
    if (t >= T.pd && t < T.q4 + 0.3) { const k = E.p3out(prog(t, T.pdOn, T.pdOn + 0.35)), fo = 1 - prog(t, T.q4, T.q4 + 0.3); ID(); ctx.save(); ctx.globalAlpha = fo; leader(pd[0], 596, pd[0], pd[1] - 26, "rgba(241,240,236,0.8)", k); ctx.restore(); label(COPY.pdName, 984, 580, 44, "rgba(241,240,236,0.95)", t, T.pd, T.q4 + 0.3, { align: "right", alpha: fo }); }
    if (t >= T.a3 && t < T.pd) { const vp = secPt(t, 380, vesselY(380) + 26); pill(COPY.vessel, vp[0], vp[1] + 58, 46, t, T.a3 + 0.1, T.pd, { weight: 700 }); }   // v6
    const note = (a, b) => { pill(COPY.note, 118, 606, 44, t, a, b, { weight: 700 }); };   // v6: top left, in the case band (clear of the vessel tag and the meter)
    if (t >= T.eat && t < T.pd) note(T.eat, T.pd);

    // v3 (audience v2 #1): a meter tied to the light eye — how much light it caught; it drops on every beat, with the dip of the trace
    const mk = win(t, T.meterOn, T.rate + 0.4, 0.35, 0.4);   // v6: introduced right after the light eye
    if (mk > 0.01) {
      const pu = pulseAt(t, T.pulseOn), pd = secPt(t, SEC.pd, SEC.y0 - 4), n = 6, lit = n * (0.97 - 0.66 * Math.min(1, pu));
      const px = clamp(pd[0] + 70, 0, 900), py = pd[1] + 70, pw = 104, ph = 34 * n + 30;

      ctx.strokeStyle = "rgba(241,240,236,0.6)"; ctx.lineWidth = 3; ctx.setLineDash([8, 8]); line(pd[0] + 26, pd[1] + 8, px + 10, py + 12); ctx.setLineDash([]);
      rr(px, py, pw, ph, 18); ctx.fillStyle = "rgba(23,25,28,0.9)"; ctx.fill();
      // v4: a column of caught light (a soft glow that rises and falls), not a stack of battery cells
      const lvl = lit / n, cx0 = px + 22, cw = pw - 44, ch = ph - 36, cy1 = py + ph - 18, fy = cy1 - ch * lvl;
      rr(cx0, cy1 - ch, cw, ch, cw / 2); ctx.fillStyle = "rgba(241,240,236,0.10)"; ctx.fill();
      ctx.save(); rr(cx0, cy1 - ch, cw, ch, cw / 2); ctx.clip();
      const gg = ctx.createLinearGradient(0, fy, 0, cy1); gg.addColorStop(0, "rgba(61,240,138,0.95)"); gg.addColorStop(1, "rgba(61,240,138,0.45)"); ctx.fillStyle = gg; ctx.fillRect(cx0, fy, cw, cy1 - fy);
      ctx.shadowColor = "rgba(61,240,138,0.9)"; ctx.shadowBlur = 16; ctx.fillStyle = "rgba(200,255,220,0.9)"; ctx.fillRect(cx0, fy - 2, cw, 4); ctx.restore();
      // every beat: one orange ring on the vessel, on the column and (in the card) on the dip — the same moment
      // v5 (audience v4 #1): in order — first the vessel (blood more), then the column (less light caught), then the dip
      // v6.1 (audience v6 #1, user 11-14): every beat is told as a chain — the vessel swells → (arrow) → the meter drops → (arrow) → the trace dips
      const bt = BEATS.filter((b) => b <= t && b >= T.q5 - 0.01 && b < T.rate).pop();
      if (bt !== undefined) {

          if (k > 0.6) { ctx.beginPath(); ctx.moveTo(e[0] - 22 * Math.cos(an - 0.5), e[1] - 22 * Math.sin(an - 0.5)); ctx.lineTo(e[0], e[1]); ctx.lineTo(e[0] - 22 * Math.cos(an + 0.5), e[1] - 22 * Math.sin(an + 0.5)); ctx.stroke(); } };
        const ringE = (c, rx, ry, d) => { const q = clamp((tb - d) / 0.22); if (tb < d) return; ctx.strokeStyle = `rgba(${ACC},${fade})`; ctx.lineWidth = 6; ctx.beginPath(); ctx.ellipse(c[0], c[1], rx * (0.85 + 0.15 * E.p3out(q)), ry * (0.85 + 0.15 * E.p3out(q)), 0, 0, TAU); ctx.stroke(); };
        // v7 (user 11-14: 「血管那里不用加圈和箭头，只保留接住的光到曲线的箭头示意即可」): only the meter → trace arrow
        arrow(mB, [dip[0] + 10, dip[1] - 10], E.p3out(clamp((tb - 0.2) / 0.14)));
      }
      ctx.restore();
      pill(COPY.caught, px + pw / 2, py + ph + 64, 44, t, T.meterOn, T.rate + 0.4, { align: "center", weight: 700 });
      // v6: the trace is this meter, written over time — a line from the meter down to the head of the trace, and (once) a dot that travels it
      const lk = win(t, T.q4, T.rate + 0.4, 0.3, 0.4);
      if (lk > 0.01) {
        const a0 = [px + pw / 2, py + ph + 90], b0 = [CARD.px1 + 4, 1300 - 22 + 60 * greenVal(t, t)], dk = E.p3out(prog(t, T.q4, T.q4 + 0.5));
        ID(); ctx.save(); ctx.globalAlpha = lk; ctx.strokeStyle = "rgba(61,240,138,0.75)"; ctx.lineWidth = 4; ctx.setLineDash([10, 10]);

function pill(str, x, y, size, t, t0, t1, o = {}) {   // (v4: also 「简化示意」 at the subtraction, see frame())                       // small text on a dark pill (readable on any tissue)

function endCard(t, F, K) {

// dark ⇄ light switches: a growing circle (both worlds fully opaque)
const IRIS = [540, 1000];
function irisOf(t) {
  const fl = flood(t); if (fl <= 0.001 || fl >= 0.999 || t < T.q6) return null;   // v4: only on the way out
  const into = flood(t + 0.02) > fl, k = into ? fl : 1 - fl;
  return { into, R: 6 + 2300 * k * k * (3 - 2 * k) };
}
let IRISC = IRIS;

  ctx.reset(); ID();

  const light = () => { LW = drawLight(t, K); };
  if (ir) {

    else { drawSection(t, 1); ctx.save(); irisClip(ir, true); light(); ctx.restore(); }
  } else if (t >= T.pitch && t < T.floodEnd) {                         // v4.1: the dive — no grey dissolve

    ctx.save(); irisClip(ir, true); TXF = nw; textBand(t); ctx.restore(); TXF = null;

// ---------------------------------------------------------------- motion blur: temporal supersampling where things move fast
const BLUR = [[1.9, 3.35, 16], [5.0, 5.6, 14], [5.6, 6.3, 22], [25, 26.6, 10], [26.6, 39.6, 5], [43, 44.6, 16], [44.7, 45.45, 12], [47.25, 48.35, 10], [49, 49.8, 8], [51.25, 51.9, 12]];
const SHUTTER = 0.5 / FPS;
window.seek = function seek(t) {
  t = clamp(t, 0, DUR - 1e-6);
  const b = BLUR.find(([a, bb]) => t >= a && t < bb);
  if (!b) { ctx = MAIN; frame(t); return; }
  const SUB = b[2];
  MAIN.reset();
  for (let i = 0; i < SUB; i++) {
    ctx = OFFX;
    const ts = t + SHUTTER * (i / (SUB - 1) - 0.5);
    frame(clamp(ts, 0, DUR - 1e-6));

window.DUR = DUR; window.FPS = FPS;
window.addEventListener("hf-seek", (e) => window.seek(e.detail.time));
window.ready = false;
window.whenReady = Promise.all([
  document.fonts.load(`100px ${DISPLAY}`, "手表背面的绿光在看什么"), document.fonts.load(`700 50px ${UI}`, "光甩手每秒闪几百次"), document.fonts.load(`400 50px ${UI}`, "这种测法叫光电容积描记"),
]).then(() => document.fonts.ready).then(() => { MEASURE.clear(); window.seek(0); window.ready = true; });
