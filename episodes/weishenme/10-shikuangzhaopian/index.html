"use strict";
// ============================================================================================
// EP.10 实况照片 — a pure function of time. window.seek(t) paints frame t.
// Worlds:
//   OUTSIDE (light, 0–6.75 and 31.25–41): two hands hold a phone sideways (the hands from EP.08's photo); its screen is
//     the camera: a night sky with one firework. Local units = px at zoom 1, origin at the phone's centre.
//   DIVE (6.75–9.5): one take: the body turns x-ray, dark opens from the camera module, the screen and the lens + chip
//     move apart into the inside layout.
//   INSIDE (dark, 9.5–31.25): the viewfinder panel, the lens + the chip, the pile, the ring of 12 frames, the strip.
//     Sky time τ (timeline.js tau()) runs 4× slow from the tap (示意).
// No timers, no rAF, no state between frames (the context is reset every frame); seeded noise only.
// ============================================================================================
const { T, COPY, W, H, DUR, FPS, S16 } = TL;
const cv = document.getElementById("c");
const MAIN = cv.getContext("2d");
const OFF = document.createElement("canvas"); OFF.width = W; OFF.height = H;
const OFFX = OFF.getContext("2d");
let ctx = MAIN;

const C = {
  ground: "#ECEBE6", ink: "#141414", acc: "#FF4A1C", paper: "#F1F0EC", dark: "#17191C",
  skin: "#EBCBA5", skinD: "#D6AD84", skinL: "#F4DEC3", nail: "#F3DCCB",
  body: "#25282E", bodyL: "#3A3E46", glass: "#0D0E11", plug: "#DAD8D1", plugD: "#B9B6AE", metal: "#9EA3AB", cable: "#E4E2DB", cableD: "#C9C6BE",
  cath: "#2F3442", cathL: "#454B5B", anode: "#30333A", sheet: "#5A606C", sheetL: "#737A88", elyte: "#17191C", film: "#8F8A80", filmL: "#B3AC9F",
  ion: "#F1F0EC", night: "#171A21", nightW: "#202737", stand: "#2B2F38", table: "#23262D", tableL: "#333843",
  caseC: "#5E6570", caseL: "#747C88",

const DISPLAY = "Smiley", UI = "NotoSC";

// ---------------------------------------------------------------- math
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const TAU = Math.PI * 2, RAD = Math.PI / 180;
const E = {
  sine: (x) => 0.5 - 0.5 * Math.cos(Math.PI * x),
  p2io: (x) => (x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2),
  p3io: (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
  p2in: (x) => x * x, p3in: (x) => x * x * x,
  p2out: (x) => 1 - (1 - x) * (1 - x), p3out: (x) => 1 - Math.pow(1 - x, 3), p4out: (x) => 1 - Math.pow(1 - x, 4),
  smooth: (x) => x * x * (3 - 2 * x),
};
function spring(x, w = 15, z = 0.72) {
  if (x <= 0) return 0;
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * x) * (Math.cos(wd * x) + ((z * w) / wd) * Math.sin(wd * x));
}
function slamScale(u) {                              // 0.17 s: 1.55 -> 0.94 -> 1.0
  if (u <= 0) return 1.55;
  if (u < 0.09) return lerp(1.55, 0.94, E.p2in(u / 0.09));
  if (u < 0.17) return lerp(0.94, 1.0, E.p3out((u - 0.09) / 0.08));
  return 1;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const hexRGB = (h) => [0, 1, 2].map((i) => parseInt(h.slice(1 + 2 * i, 3 + 2 * i), 16));
const mixHex = (a, b, k) => { const p = hexRGB(a), q = hexRGB(b); return `rgb(${[0, 1, 2].map((i) => Math.round(lerp(p[i], q[i], k))).join(",")})`; };
const rgba = (h, a) => { const p = hexRGB(h); return `rgba(${p[0]},${p[1]},${p[2]},${a})`; };
function kf(t, K, ease = E.p2io) {

}
function win(t, a, b, fi = 0.25, fo = 0.25) { return E.p3out(prog(t, a, a + fi)) * (1 - E.p2io(prog(t, b - fo, b))); }
const hash = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

// a slow, smooth drift (never a shake): incommensurate sines so the picture never stops
function drift(t) { return [30 * Math.cos(0.8 * t) + 8 * Math.sin(1.7 * t), 22 * Math.sin(0.8 * t) + 6 * Math.cos(1.3 * t), 1 + 0.02 * Math.sin(0.37 * t)]; }   // an ellipse: the speed never drops to zero
// ---------------------------------------------------------------- camera: screen = A·local + B (log-spiral between keys)
function key(F, anchor, A) { return { A, B: [anchor[0] - A * F[0], anchor[1] - A * F[1]] }; }
function interp(k0, k1, u) {

  if (Math.abs(1 - kk) < 1e-9) B = [lerp(k0.B[0], k1.B[0], u), lerp(k0.B[1], k1.B[1], u)];
  else { const c0 = k1.B[0] - kk * k0.B[0], c1 = k1.B[1] - kk * k0.B[1], w0 = c0 / (1 - kk), w1 = c1 / (1 - kk); B = [ku * (k0.B[0] - w0) + w0, ku * (k0.B[1] - w1) + w1]; }
  return { A: k0.A * ku, B };
}
// BASE: a slow drift applied to a whole world (the inside view) under every ID()/setK(); identity for the captions
let BASE = [1, 0, 0];
const ID = () => ctx.setTransform(BASE[0], 0, 0, BASE[0], BASE[1], BASE[2]);
const setK = (K) => ctx.setTransform(K.A * BASE[0], 0, 0, K.A * BASE[0], K.B[0] * BASE[0] + BASE[1], K.B[1] * BASE[0] + BASE[2]);
function insideBase(t) {
  const d = drift(t * 0.9), s = 1 + 0.6 * (d[2] - 1), c = [540, 1000], tx = c[0] * (1 - s) + 1.2 * d[0], ty = c[1] * (1 - s) + 0.5 * d[1];
  // 9.5–12.25: a slow push towards the screen (only the screen is lit), easing back as the chip lights up
  const z = 1 + 0.07 * (E.sine(prog(t, T.vfOn, 11.0)) - E.sine(prog(t, T.chipOn, 12.25))), c2 = [540, 985];
  return [z * s, z * tx + c2[0] * (1 - z), z * ty + c2[1] * (1 - z)];

const toS = (K, p) => [K.A * p[0] + K.B[0], K.A * p[1] + K.B[1]];

// ---------------------------------------------------------------- drawing helpers
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function line(x0, y0, x1, y1) { ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); }
const MEASURE = new Map();
function mw(font, s) { const k = font + "|" + s; let v = MEASURE.get(k); if (v === undefined) { ctx.font = font; v = ctx.measureText(s).width; MEASURE.set(k, v); } return v; }
function parse(str) { const out = []; let a = 0; for (const ch of str) { if (ch === "[") { a = 1; continue; } if (ch === "]") { a = 0; continue; } out.push({ ch, a }); } return out; }
const plain = (str) => str.replace(/[\[\]]/g, "");
function fitSize(str, size, maxW, face = DISPLAY, wt = "") { const f = `${wt} ${size}px ${face}`.trim(), w = mw(f, plain(str)); return w > maxW ? Math.floor(size * maxW / w) : size; }
// Text band: style none | blur | type | slam | wipe; left aligned at x.
function lines(L, t, t0, t1, o = {}) {
  if (t < t0 || t >= t1) return;
  const three = L.length === 3 && !o.ys;
  const x = o.x ?? 96, ys = o.ys ?? (three ? [300, 420, 540] : [330, 472]), face = o.face ?? DISPLAY, wt = o.weight ?? "";
  const col = o.col ?? C.ink, acc = o.acc ?? C.acc, style = o.style ?? "blur";
  const stag = o.stag ?? 0.055, lineGap = o.lineGap ?? 0.16, exitDur = o.exit ?? 0.16, maxW = o.maxW ?? 930;
  ID();
  L.forEach((str, i) => {
    const size = fitSize(str, Array.isArray(o.size) ? o.size[i] : (o.size ?? (three ? 96 : 112)), maxW, face, wt);
    const font = `${wt} ${size}px ${face}`.trim();
    const chars = parse(str), ls = t0 + i * lineGap;
    if (t < ls) return;
    let pre = "";
    ctx.save();
    if (style === "slam") { const sc0 = slamScale(t - ls), sc = sc0 > 1 ? Math.min(sc0, Math.max(1, (1040 - x) / mw(font, plain(str)))) : sc0, cy = ys[i] - size * 0.35; ctx.translate(x, cy); ctx.scale(sc, sc); ctx.translate(-x, -cy); }
    if (style === "wipe") { const wv = mw(font, plain(str)); ctx.beginPath(); ctx.rect(0, ys[i] - size * 1.2, x + wv * E.p3out(prog(t, ls, ls + 0.32)) + 4, size * 1.6); ctx.clip(); }
    ctx.font = font; ctx.textBaseline = "alphabetic";
    chars.forEach((c, j) => {
      const cx = x + mw(font, pre); pre += c.ch;
      const lt = t - (ls + j * stag);
      let a = 1, blur = 0;
      if (style === "blur") { const k = clamp(lt / 0.13); a = k; blur = 9 * (1 - k); }
      else if (style === "type") { a = lt >= 0 ? 1 : 0; }
      if (t > t1 - exitDur) { const e = clamp((t - (t1 - exitDur)) / exitDur); a *= 1 - e; blur = Math.max(blur, 10 * e); }
      if (a <= 0.003) return;
      ctx.globalAlpha = a; ctx.filter = blur > 0.3 ? `blur(${blur.toFixed(1)}px)` : "none";
      ctx.fillStyle = c.a ? acc : col; ctx.fillText(c.ch, cx, ys[i]);
    });
    ctx.restore(); ctx.filter = "none"; ctx.globalAlpha = 1;
  });
}
function label(str, x, y, size, col, t, t0, t1, o = {}) {
  if (t < t0 || t >= t1) return;
  ID(); const font = `${o.weight ?? 700} ${size}px ${o.face ?? UI}`; const wv = mw(font, str);
  const k = E.p3out(prog(t, t0, t0 + 0.28)), e = prog(t, t1 - 0.15, t1);
  ctx.save(); ctx.font = font; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  const left = o.align === "right" ? x - wv : o.align === "center" ? x - wv / 2 : x;
  if (o.plate) { ctx.globalAlpha = (1 - e) * k; rr(left - 18, y - size - 4, wv + 36, size + 22, 12); ctx.fillStyle = o.plate; ctx.fill(); }
  ctx.beginPath(); ctx.rect(left - 4, y - size * 1.2, (wv + 8) * k, size * 1.6); ctx.clip();
  ctx.globalAlpha = (o.alpha ?? 1) * (1 - e); if (e > 0) ctx.filter = `blur(${(8 * e).toFixed(1)}px)`;
  ctx.fillStyle = col; ctx.fillText(str, left, y); ctx.restore(); ctx.filter = "none";
}
function underline(str, prefix, word, lineIdx, t, t0, t1, ys = [330, 472], size0 = 112) {
  if (t < t0 || t >= t1) return;
  const size = fitSize(str, size0, 930), f = `${size}px ${DISPLAY}`;
  const x0 = 96 + mw(f, prefix), wv = mw(f, word), k = E.p3out(prog(t, t0, t0 + 0.3)), fo = 1 - prog(t, t1 - 0.16, t1);
  ID(); ctx.globalAlpha = fo; ctx.fillStyle = C.acc; ctx.fillRect(x0 - 4, ys[lineIdx] + 20, (wv + 8) * k, 11); ctx.globalAlpha = 1;
}
function leader(x0, y0, x1, y1, col, k = 1, w = 2.5) {
  ID(); ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(lerp(x0, x1, k), lerp(y0, y1, k)); ctx.stroke();
  if (k > 0.98) { ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x1, y1, 6, 0, TAU); ctx.fill(); }
  ctx.restore();
}
function pill(str, x, y, size, t, t0, t1, o = {}) {                     // small text on a dark pill
  if (t < t0 || t >= t1) return;
  ID(); const font = `${o.weight ?? 700} ${size}px ${UI}`, wv = mw(font, str), k = E.p3out(prog(t, t0, t0 + 0.25)), e = 1 - prog(t, t1 - 0.15, t1);
  const left = o.align === "right" ? x - wv : o.align === "center" ? x - wv / 2 : x;
  ctx.save(); ctx.globalAlpha = k * e; rr(left - 22, y - size - 6, wv + 44, size + 26, (size + 26) / 2); ctx.fillStyle = o.fill ?? "rgba(23,25,28,0.88)"; ctx.fill();
  if (o.edge) { ctx.strokeStyle = C.acc; ctx.lineWidth = 4; ctx.stroke(); }
  ctx.font = font; ctx.fillStyle = o.col ?? C.paper; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic"; ctx.fillText(str, left, y); ctx.restore();
}
// an orange box that draws itself (the 示意 frame for a new element)
function obox(x, y, w, h, k, a = 1, r = 14, lw = 5) {
  if (k <= 0 || a <= 0) return;
  ID(); ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = C.acc; ctx.lineWidth = lw; ctx.lineJoin = "round";
  const per = 2 * (w + h); ctx.setLineDash([per * k, per]); rr(x, y, w, h, r); ctx.stroke(); ctx.restore();
}
function oring(x, y, r, k, a = 1, lw = 4) {
  if (k <= 0 || a <= 0) return;
  ID(); ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = C.acc; ctx.lineWidth = lw; ctx.beginPath(); ctx.arc(x, y, r, -Math.PI / 2, -Math.PI / 2 + TAU * k); ctx.stroke(); ctx.restore();
}
function capsule(P, w, fill) { ctx.save(); ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = fill; ctx.lineWidth = w; ctx.beginPath(); P.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]))); ctx.stroke(); ctx.restore(); }


// ---------------------------------------------------------------- the hands, drawn from the user's photos (assets/people/model.js)
// User 11-23 「手的建模也要优化」 → two reference photos (11-24): both hands holding a (missing) phone sideways, the right thumb
// pressing (hands-press) / lifted (hands-lift). tools/handmodel.py traces the outlines; the nails and the few creases are
// placed by hand. Drawn like EP.05's feet and EP.08's hands: one smooth skin, an ink outline, soft shading towards the
// edges, a few short creases, small pale nails with warm tips. Layered like a real grip: the hands behind the phone, only
// the thumbs (and the thumb base) in front of it.
const HMOD = window.HAND_MODEL;
const HIMG = { c: [1015, 370.5], s: 660 / 1170 };       // image px → phone-local units: the phone fills the gap between the hands
const HDET = {
  LH: { nails: [[655, 23, 32, 8, -0.03], [495, 143, 27, 36, -0.1]],
        creases: [[[445, 250], [480, 246], [515, 255]], [[465, 130], [437, 195], [400, 260], [367, 340], [357, 360]]],
        front: [[490, 96], [548, 130], [550, 185], [544, 228], [536, 262], [526, 302], [516, 342], [504, 382], [494, 420], [480, 445], [450, 452], [425, 440], [330, 440], [330, 90]] },
  RH: { nails: [[1330, 36, 30, 8, 0.05], [1370, 385, 30, 29, 0], [1467, 520, 18, 14, 0.7], [1505, 552, 15, 12, 0.6]],
        creases: [[[1455, 350], [1460, 395], [1458, 438]]],
        front: [[1318, 385], [1330, 352], [1345, 345], [1375, 340], [1410, 335], [1445, 332], [1470, 331], [1500, 335], [1530, 345], [1560, 358], [1590, 369], [1615, 378], [1645, 378], [1645, 470], [1610, 462], [1560, 455], [1525, 450], [1490, 445], [1460, 440], [1430, 437], [1400, 435], [1360, 427], [1335, 407], [1320, 392]] },
  RHL: { nails: [[1323, 35, 30, 8, 0.05], [1360, 316, 32, 29, -0.15], [1465, 520, 18, 14, 0.7], [1505, 552, 15, 12, 0.6]],
        creases: [[[1448, 295], [1455, 335], [1452, 380]]],
        front: [[1310, 305], [1322, 290], [1330, 287], [1360, 282], [1400, 284], [1440, 290], [1470, 295], [1500, 304], [1530, 315], [1560, 327], [1590, 340], [1615, 348], [1645, 348], [1645, 440], [1610, 432], [1560, 425], [1525, 417], [1490, 405], [1460, 395], [1430, 385], [1390, 370], [1350, 352], [1325, 327]] },
};
function smoothPath(P) {                                 // a closed Catmull-Rom-like curve through the points (quadratics through midpoints)
  const n = P.length, m = (i) => [(P[i % n][0] + P[(i + 1) % n][0]) / 2, (P[i % n][1] + P[(i + 1) % n][1]) / 2];
  const p0 = m(n - 1); ctx.beginPath(); ctx.moveTo(p0[0], p0[1]);

  ctx.closePath();
}
// 11-24 审核复核: the traced right thumb reads thin and long (its base is outside the frame) → widen it about its own axis
// (tip on the shutter stays put; the widening fades out towards the thumb base and away from the thumb)
const THB = { RH: { T: [1322, 390], B: [1645, 424] }, RHL: { T: [1314, 312], B: [1645, 394] }, k: 1.3 };
const smst = (a, b, x) => { const u = Math.min(1, Math.max(0, (x - a) / (b - a))); return u * u * (3 - 2 * u); };
const HWARP = {};
// v3 (user 11-24:「手部建模太假了，都镶嵌到手机里面去了」): the hands now hold the phone from outside it —
//  · the left hand is the right hand of the photo, mirrored, turned a little and lowered (not a copy of the right one):
//    its thumb lies across the screen like the right one, so the phone's left end and corners stay in view (the photo's
//    left thumb lay along the phone's end and covered it, so the phone read as set into the hand);
//  · the phone has a side band (it is a slab; the hands are behind it) and its shadow falls on the palms near its edges;
//  · each thumb casts a soft shadow on the screen; the skin is lit from above, the thumb rounded (light along its top,
//    shade underneath), the outline brown like EP.07's hands, not black ink.

function leftX(p) {

      axis: { T: leftX(R.axis.T), B: leftX(R.axis.B) } });

    if (u > 0 && u < 1) { ID(); ctx.save(); ctx.globalAlpha = 1 - E.p3in(prog(t, T.tap + 0.55, T.tap + 0.85)); ctx.strokeStyle = rgba(C.acc, 0.6); ctx.lineWidth = 3; ctx.setLineDash([8, 10]); line(sp[0], sp[1], hd[0], hd[1]); ctx.setLineDash([]);
      const q = [lerp(sp[0], hd[0], u), lerp(sp[1], hd[1], u)]; ctx.fillStyle = C.acc; ctx.beginPath(); ctx.arc(q[0], q[1], 12, 0, TAU); ctx.fill(); ctx.restore(); }
  }
}
// the labels of the inside world (small text, ≤ 2 at a time)
function insideLabels(t) {
  const G = ringGeo(t);
  if (t >= T.chipOn + 0.5 && t < PILE.hS + 0.15) leader(LOUPE.x, LOUPE.y + LOUPE.r + 10, LOUPE.x, DIE_AT[1] + 14, C.paper, E.p3out(prog(t, T.chipOn + 0.5, T.chipOn + 0.8)) * (1 - 0.6 * dimH(t)) * (1 - prog(t, PILE.hS, PILE.hS + 0.15)), 2.5);
  label(COPY.chip, LOUPE.x, LOUPE.y + LOUPE.r + 62, 44, C.paper, t, T.chipOn + 0.5, PILE.hA + 0.05, { align: "center" });
  label(COPY.structure, LOUPE.x, LOUPE.y - LOUPE.r - 18, 44, C.paper, t, T.chipOn + 0.7, T.ringForm, { align: "center", alpha: 0.85 * (1 - 0.6 * dimH(t)) });
  label(COPY.fps, 770, 1108, 44, C.paper, t, T.flow + 0.2, T.q5);
  label(COPY.ring, G.x, G.y + 118, 44, C.paper, t, T.ringFormEnd - 0.2, T.a6, { align: "center" });
  label(COPY.term, G.x, G.y + 118, 44, C.paper, t, T.a6 + 0.1, T.q7, { align: "center" });
  label(COPY.slow, G.x, G.y + 104, 44, C.paper, t, T.tap + 0.3, T.collapse, { align: "center" });
  if (t >= T.ringForm && t < T.ringFormEnd + 0.6) oring(G.x, G.y, G.r + G.ch * 0.5 + 10, E.p3out(prog(t, T.ringForm + 0.2, T.ringFormEnd)), 1 - prog(t, T.ringFormEnd + 0.3, T.ringFormEnd + 0.6), 5);
  label(COPY.pre, (stripX(-1, 0) + stripX(-1, 2)) / 2, ST.y + 86, 44, C.paper, t, T.copyB, T.collapse, { align: "center" });
  label(COPY.post, (stripX(1, 0) + stripX(1, 2)) / 2, ST.y + 86, 44, C.paper, t, T.copyA, T.collapse, { align: "center" });
  if (t >= T.collapseEnd && t < T.q10) pill(COPY.names, 540, 1140, 44, t, T.collapseEnd + 0.1, T.q10, { align: "center" });
}

// ================================================================ the dive (one take): the hands let go, the phone turns upright and comes
// to the middle while the camera pushes in; the body turns x-ray (the camera module shows at the top); the dark spreads out
// from the phone and fills the frame. The screen keeps showing the sky (the firework stays in view). User 11-23:
// 「8s的进入要一镜到底的感觉；进去的时候手机最好立起来，这样看着最自然」
function diveP(t) {
  const K0 = outK(t), c0 = toS(K0, [0, 0]);
  const u = E.p3io(prog(t, T.dive, T.dive + 1.0)), z = E.p2io(prog(t, T.dive, T.diveEnd));
  const push = lerp(1, PHI.sc, E.p2io(prog(t, 7.1, T.diveEnd)));
  return { cx: lerp(c0[0], PHI.cx, u), cy: lerp(c0[1], PHI.cy, u), sc: lerp(K0.A, 1.0, u) * push, ang: u * Math.PI / 2 };
}
const DARK_END = 7.85;
function darkE(t) { return 1500 * E.p2in(prog(t, 7.6, 7.85)); }   // quick (≤ 0.25 s), no grey band
function phoneHalf(P) { const ac = Math.abs(Math.cos(P.ang)), as = Math.abs(Math.sin(P.ang)); return [(330 * ac + 165 * as) * P.sc, (165 * ac + 330 * as) * P.sc]; }
function handsRelease(t, K, k, layer) { drawHands(K, layer, false, Math.pow(1 - k, 2.5), 340 * k); }   // the hands let go and move out sideways; review v3: gone before only fingertips are left at the frame edge
function drawDive(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = C.ground; ctx.fillRect(0, 0, W, H);
  const P = diveP(t), xr = E.p2io(prog(t, 7.3, 8.2)), e = darkE(t);
  if (t >= DARK_END) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = C.dark; ctx.fillRect(0, 0, W, H); }
  else if (e > 0) {
    const [hw, hh] = phoneHalf(P);
    ID(); ctx.save(); ctx.shadowColor = C.dark; ctx.shadowBlur = 22; ctx.fillStyle = C.dark;
    rr(P.cx - hw - e, P.cy - hh - e, 2 * (hw + e), 2 * (hh + e), 54 * P.sc + e); ctx.fill(); ctx.restore();
  }
  const rel = E.p2io(prog(t, T.dive, T.dive + 0.6));
  if (rel < 1) handsRelease(t, outK(t), rel, "back");
  phoneAny(t, P, { xray: xr, ages: agesIn(TL.tau(t)), uiL: 1 - prog(t, T.dive, T.dive + 0.35), uiP: prog(t, T.dive + 0.85, T.dive + 1.25), modA: 1 });
  if (rel < 1) handsRelease(t, outK(t), rel, "front");
}

// ================================================================ the closing shot: a window into the phone shows the ring
function drawXrayRing(t, K, a) {
  if (a <= 0.01) return;
  const c = toS(K, [-140, 0]), R = 150 * K.A;
  ID(); ctx.save(); ctx.globalAlpha = a;
  ctx.beginPath(); ctx.arc(c[0], c[1], R, 0, TAU); ctx.fillStyle = C.dark; ctx.fill(); ctx.strokeStyle = C.paper; ctx.lineWidth = 5; ctx.stroke(); ctx.clip();
  // 8 slots of ½ s, the head at the top; once the shutter is pressed the three that hold the burst are kept (orange)
  const t0 = T.q10 - 4, f = (t - t0) * 2, G = { x: c[0], y: c[1], r: R * 0.64 }; let popAt = null;
  for (let s = 0; s < 8; s++) {
    const fl = Math.floor(f + 1e-6), n = fl - (((fl - s) % 8) + 8) % 8, th = (-90 + (f - s) * 45) * RAD, p = [G.x + Math.cos(th) * G.r, G.y + Math.sin(th) * G.r];
    const tw = t0 + n / 2, age = tw - TL.BURST_OUT[1];
    const kept = t >= T.tapC && tw >= T.tapC - 1.5 && tw < T.tapC;
    card(p[0], p[1], 68, 39, [age], { t: tw, hl: kept, hlw: 5 });
    if (kept && Math.abs(tw - (T.tapC - 0.75)) < 0.01) popAt = { p, age, tw };
  }
  ctx.restore();
  // the burst frame we kept pops out of the window: the same burst you saw in the opening
  if (popAt && t >= T.tapC + 0.25) {
    const k = E.p3out(prog(t, T.tapC + 0.25, T.tapC + 0.75)), to = [c[0] + R + 150, c[1] - 60];
    ID(); ctx.save(); ctx.globalAlpha = a; card(lerp(popAt.p[0], to[0], k), lerp(popAt.p[1], to[1], k), lerp(68, 230, k), lerp(39, 130, k), [popAt.age], { t: popAt.tw, crisp: 1 }); ctx.restore();
  }
}

// ================================================================ light/dark: the caption band follows the picture
function darkAt(t) {
  if (t < T.darkA) return 0;
  if (t < DARK_END) { const e = darkE(t); if (e <= 0) return 0; const P = diveP(t), top = P.cy - phoneHalf(P)[1] - e; return E.smooth(prog(560 - top, 40, 620)); }   // as the dark reaches the captions
  if (t < T.diveEnd) return 1;
  if (t < T.iris) return 1;
  return 0;
}
function scrimOf(fl, a = 1, gr = "236,235,230") {
  const STOPS = [[0, 1], [0.66, 1], [0.74, 0.86], [0.82, 0.56], [0.9, 0.24], [1, 0]];
  const SH = 640;
  ID(); const g = ctx.createLinearGradient(0, 0, 0, SH);
  STOPS.forEach(([o, k]) => g.addColorStop(o, fl > 0.5 ? `rgba(23,25,28,${a * k * 0.92})` : `rgba(${gr},${a * k})`));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, SH);
}
function textBand(t, fl) {
  const L = C.ink, D = C.paper, M = fl > 0.5 ? D : L;
  lines(COPY.h1, t, -1, T.q2, { style: "none", col: L });
  underline(COPY.h1[1], "怎么还拍到它", "炸开", 1, t, T.underline, T.q2);
  lines(COPY.q2, t, T.q2, T.a2, { style: "blur", col: L, acc: C.paper, exit: 0.001 });
  lines(COPY.a2, t, T.a2, T.q3, { style: "slam", col: L, acc: orangeK(t) > 0.35 ? C.ink : C.acc });
  lines(COPY.q3, t, T.q3, 7.6, { style: "blur", col: C.ink, exit: 0.15 });
  lines(COPY.q3, t, 7.85, T.h4, { style: "blur", col: D, stag: 0.02 });
  lines(COPY.h4, t, T.h4, T.a4, { style: "blur", col: D });
  lines(COPY.a4, t, T.a4, T.q5, { style: "blur", col: D });
  lines(COPY.q5, t, T.q5, T.a5, { style: "blur", col: D });
  lines(COPY.a5, t, T.a5, T.a6, { style: "wipe", col: D });
  lines(COPY.a6, t, T.a6, T.q7, { style: "blur", col: D });
  lines(COPY.q7, t, T.q7, T.a7, { style: "blur", col: D });
  lines(COPY.a7, t, T.a7, T.q8, { style: "blur", col: D });
  lines(COPY.q8, t, T.q8, T.a8, { style: "blur", col: D });
  lines(COPY.a8, t, T.a8, T.a9, { style: "blur", col: D });            // stays through the half-beat stop (the music stops, not the words)
  lines(COPY.a9, t, T.a9, T.q10, { style: "slam", col: D, lineGap: 0.2 });
  lines(COPY.q10, t, T.q10, T.fin, { style: "blur", col: M });
  lines(COPY.fin, t, T.fin, T.tip, { style: "slam", col: L, lineGap: 0.25 });
  lines(COPY.tip1, t, T.tip, T.tip2, { style: "blur", col: L });
  lines(COPY.tip2, t, T.tip2, T.end, { style: "blur", col: L });
}

// ================================================================ end card: the phone becomes an outline badge
const BADGE = [200, 600];
function endCard(t) {
  if (t < T.end) return;
  const k = E.p3io(prog(t, T.end, T.endMorph + 0.3));
  ID(); ctx.save();
  const sc = lerp(1.16 * PS, 0.24, k), cx = lerp(540, BADGE[0], k), cy = lerp(900, BADGE[1], k);
  ctx.translate(cx, cy); ctx.scale(sc, sc);
  ctx.strokeStyle = C.ink; ctx.lineWidth = 9 / sc * 0.35 + 6; rr(-PH.w / 2, -PH.h / 2, PH.w, PH.h, PH.r); ctx.fillStyle = mixHex(C.body, C.ground, k); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(-PH.w / 2 + 120, 0, 60, 0, TAU); ctx.stroke();   // a lens, as a badge mark
  ctx.restore();
  lines(COPY.end, t, T.title1, DUR + 1, { style: "type", col: C.ink, ys: [905, 1045, 1185], size: 124, stag: 0.045, lineGap: 0.3 });
  lines([COPY.epNum], t, T.ep, DUR + 1, { style: "slam", col: C.ink, x: 400, ys: [520], size: 150 });
  lines([COPY.epName], t, T.ep + 0.25, DUR + 1, { style: "blur", col: C.ink, x: 404, ys: [668], size: 112 });
  if (t >= T.sting) {
    const s2 = spring(t - T.sting, 16, 0.5);
    ID(); ctx.save(); ctx.translate(BADGE[0], BADGE[1]); ctx.scale(s2, s2); ctx.font = `150px ${DISPLAY}`; ctx.fillStyle = C.acc; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("?", 4, 4); ctx.restore();
  }
}

// ================================================================ the frame
const orangeK = (t) => E.p2io(prog(t, T.myth, T.myth + 0.3)) * (1 - E.p2io(prog(t, T.unOrange, T.unOrange + 0.001)));
function groundRGB(t) { const o = orangeK(t), g = hexRGB(C.ground), q = hexRGB(C.acc); return [0, 1, 2].map((i) => Math.round(lerp(g[i], q[i], o))).join(","); }
function groundCol(t) { const o = orangeK(t); return o > 0 ? mixHex(C.ground, C.acc, o) : C.ground; }
// the outside scene for the opening (b = −0.25) and the closing shot (b = 31.0)
function drawOutside(t, o = {}) {
  ID(); ctx.fillStyle = o.ground ?? groundCol(t); ctx.fillRect(0, 0, W, H);
  const closing = t >= T.iris;
  const tipK = closing ? E.p2io(prog(t, T.tipIn, T.tipInEnd)) : 0;
  const pb = closing ? 0 : E.p2io(prog(t, T.open0, T.open0 + 0.6)) * (1 - E.p2io(prog(t, T.q2, T.q2 + 0.5)));   // the photo plays: push a little towards it
  const K = outK(t, (1 + 0.1 * tipK) * (1 + 0.1 * prog(t, T.tipInEnd, T.end)) * (1 + 0.06 * pb), [540, lerp(935, 900, tipK) - 22 * pb]);
  let s;
  if (!closing) s = screenOut(t, TL.BURST_OUT[0], T.tap0, T.open0, { still: true });
  else if (t < T.tip) s = screenOut(t, TL.BURST_OUT[1], T.tapC, T.fin);
  else s = { mode: "edit" };
  const tapT = closing ? (t < T.tip ? T.tapC : null) : T.tap0;
  handsOut(t, K, "back", tapT);
  phoneOut(t, K, s);
  if (closing && t < T.tip) drawXrayRing(t, K, E.p2io(prog(t, T.iris + 0.35, T.iris + 0.65)) * (1 - E.p2io(prog(t, T.fin, T.fin + 0.3))));
  handsOut(t, K, "front", tapT);
  if (!closing) { drawStill(t, K); drawGuessStrip(t); }
}
const IRC = [540, 900];
function frame(t) {
  ctx.reset(); BASE = t >= T.diveEnd - 0.6 && t < T.irisEnd ? insideBase(t) : [1, 0, 0];
  if (t >= T.diveEnd - 0.6 && t < T.diveEnd) { const k = E.smooth(prog(t, T.diveEnd - 0.6, T.diveEnd)), b = insideBase(t); BASE = [lerp(1, b[0], k), lerp(0, b[1], k), lerp(0, b[2], k)]; }
  ID();
  if (t < T.dive) drawOutside(t);
  else if (t < T.diveEnd) drawDive(t);
  else if (t < T.iris) drawInside(t);
  else if (t < T.irisEnd) {
    const k = E.p2io(prog(t, T.iris, T.irisEnd)), R = 6 + 2300 * k * k * (3 - 2 * k);
    drawInside(t);
    BASE = [1, 0, 0];
    ctx.save(); const P = new Path2D(); P.arc(IRC[0], IRC[1], R, 0, TAU); ID(); ctx.clip(P); drawOutside(t, { ground: C.ground }); ctx.restore();
  } else if (t < T.end + 0.35) drawOutside(t, { ground: C.ground });   // under the ground fading in
}
// the caption layer: drawn once per frame on top (never motion-blurred)
function overlay(t) {
  BASE = [1, 0, 0];
  let fl = darkAt(t);
  if (t >= T.iris && t < T.irisEnd) {
    const k = E.p2io(prog(t, T.iris, T.irisEnd)), R = 6 + 2300 * k * k * (3 - 2 * k);
    ctx.save(); let P = new Path2D(); P.rect(0, 0, W, H); P.arc(IRC[0], IRC[1], R, 0, TAU); ID(); ctx.clip(P, "evenodd"); scrimOf(1); textBand(t, 1); ctx.restore();
    ctx.save(); P = new Path2D(); P.arc(IRC[0], IRC[1], R, 0, TAU); ID(); ctx.clip(P); scrimOf(0); textBand(t, 0); ctx.restore();
    fl = -1;
  } else if (fl > 0 && fl < 1) { /* the quick dark opening (7.6–7.85): no caption on screen, no scrim (no grey band) */ }
  else scrimOf(fl, t >= T.end ? 1 - prog(t, T.end, T.end + 0.3) : 1, groundRGB(t));
  if (fl >= 0) textBand(t, fl);
  strikeX(t);
  if (t >= T.diveEnd && t < T.iris) { BASE = insideBase(t); insideLabels(t); BASE = [1, 0, 0]; }
  if (t >= T.tip && t < T.end) {
    label(COPY.tipTag, 96, 205, 46, C.acc, t, T.tip, T.end);
    label(COPY.iphone, 540, 1330, 44, C.ink, t, T.tip2 + 0.3, T.end, { align: "center", plate: C.ground });
  }
  if (t >= T.end) { ID(); ctx.fillStyle = C.ground; ctx.globalAlpha = E.p2io(prog(t, T.end, T.end + 0.3)); ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; endCard(t); }
}

// ---------------------------------------------------------------- motion blur where things move fast
const BLUR = [[6.8, 7.55, 6], [36.5, 37.1, 6], [41.0, 41.9, 6]];   // no blur on the quick dark opening (7.6–7.85): it would smear its edge into a grey band
const SHUTTER = 0.5 / FPS;
window.seek = function seek(t) {
  t = clamp(t, 0, DUR - 1e-6);
  const b = BLUR.find(([a, bb]) => t >= a && t < bb);
  if (!b) { ctx = MAIN; frame(t); overlay(t); return; }
  const SUB = b[2];
  MAIN.reset();
  for (let i = 0; i < SUB; i++) {
    ctx = OFFX;
    const ts = t + SHUTTER * (i / (SUB - 1) - 0.5);
    frame(clamp(ts, 0, DUR - 1e-6));
    MAIN.setTransform(1, 0, 0, 1, 0, 0); MAIN.globalAlpha = 1 / (i + 1); MAIN.drawImage(OFF, 0, 0);
  }
  MAIN.globalAlpha = 1; ctx = MAIN; overlay(t);
};
window.DUR = DUR; window.FPS = FPS;
window.ready = false;
window.whenReady = Promise.all([
  document.fonts.load(`100px ${DISPLAY}`, "烟花快散了才按怎么还拍到它炸开"), document.fonts.load(`700 50px ${UI}`, "感光芯片实况按下"), document.fonts.load(`400 50px ${UI}`, "示意"),
]).then(() => document.fonts.ready).then(() => { MEASURE.clear(); window.seek(0); window.ready = true; });
</script>
