<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>EP.04 距离传感器</title>
<style>
  @font-face { font-family: "Smiley"; src: url("assets/fonts/smiley.woff2") format("woff2"); }
  @font-face { font-family: "NotoSC"; font-weight: 700; src: url("assets/fonts/noto-sc-bold.woff2") format("woff2"); }
  @font-face { font-family: "NotoSC"; font-weight: 400; src: url("assets/fonts/noto-sc-regular.woff2") format("woff2"); }
  html, body { margin: 0; background: #ECEBE6; }
  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="59.75" data-width="1080" data-height="1920">
  <canvas id="c" width="1080" height="1920"></canvas>
</div>
<script src="timeline.js"></script>
<script>
"use strict";
// ============================================================================================
// EP.04 距离传感器 — a pure function of time. window.seek(t) paints frame t.
// One continuous space: a face seen from the front, a phone brought up to the ear. One camera: the face and the phone
// → the guess at the ear → the phone turned to us → the dark window by the earpiece → under the glass (a lamp, an eye)
// → into the lamp (dark: a side cut through the top of the phone, the cheek coming in) → the phone's face (the cheek on it)
// → the face and the phone again → the end badge.
// No timers, no rAF, no CSS transitions, no state between frames (the context is reset every frame); seeded noise only.
// World units are millimetres; y points down; the face is centred on the origin.
// ============================================================================================
const { T, COPY, W, H, DUR, FPS, screenOn, callState } = TL;
const cv = document.getElementById("c");
const MAIN = cv.getContext("2d");
const OFF = document.createElement("canvas"); OFF.width = W; OFF.height = H;
const OFFX = OFF.getContext("2d");
let ctx = MAIN;

const C = {
  ground: "#ECEBE6", ink: "#141414", acc: "#FF4A1C", paper: "#F1F0EC",
  skin: "#E3DDD2", skinDeep: "#D8D1C4", grey: "#8A847C", dark: "#17191C",
};
const DISPLAY = "Smiley", UI = "NotoSC";

// ---------------------------------------------------------------- math
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const TAU = Math.PI * 2;
const E = {
  sine: (x) => 0.5 - 0.5 * Math.cos(Math.PI * x),
  p2io: (x) => (x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2),
  p3io: (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
  p2in: (x) => x * x, p3in: (x) => x * x * x,
  p3out: (x) => 1 - Math.pow(1 - x, 3), p4out: (x) => 1 - Math.pow(1 - x, 4),
  smooth: (x) => x * x * (3 - 2 * x),
};
function spring(x, w = 15, z = 0.72) {
  if (x <= 0) return 0;
  if (z >= 1) return 1 - Math.exp(-w * x) * (1 + w * x);
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * x) * (Math.cos(wd * x) + ((z * w) / wd) * Math.sin(wd * x));
}
function slamScale(u) {                              // 0.17 s: 1.55 -> 0.94 -> 1.0
  if (u <= 0) return 1.55;
  if (u < 0.09) return lerp(1.55, 0.94, E.p2in(u / 0.09));
  if (u < 0.17) return lerp(0.94, 1.0, E.p3out((u - 0.09) / 0.08));
  return 1;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const hexRGB = (h) => [0, 1, 2].map((i) => parseInt(h.slice(1 + 2 * i, 3 + 2 * i), 16));
const mixHex = (a, b, k) => { const p = hexRGB(a), q = hexRGB(b); return `rgb(${[0, 1, 2].map((i) => Math.round(lerp(p[i], q[i], k))).join(",")})`; };
const ACC = hexRGB("#FF4A1C").join(",");

// ---------------------------------------------------------------- camera: similarity s = A·p + B (complex), log-spiral between keys
const S0 = 3.0;                                       // px per mm at Z = 1 (the opening shot)
const cmul = (a, b) => [a[0] * b[0] - a[1] * b[1], a[0] * b[1] + a[1] * b[0]];
const cdiv = (a, b) => { const d = b[0] * b[0] + b[1] * b[1]; return [(a[0] * b[0] + a[1] * b[1]) / d, (a[1] * b[0] - a[0] * b[1]) / d]; };
const cadd = (a, b) => [a[0] + b[0], a[1] + b[1]];
const csub = (a, b) => [a[0] - b[0], a[1] - b[1]];
const cpol = (r, th) => [r * Math.cos(th), r * Math.sin(th)];
const RAD = Math.PI / 180;
function key(F, anchor, Z, phiDeg = 0) { const A = cpol(Z * S0, phiDeg * RAD); return { A, B: csub(anchor, cmul(A, F)), Z, phi: phiDeg * RAD }; }
function interp(k0, k1, u) {
  const lr = Math.log(k1.Z / k0.Z), th = k1.phi - k0.phi;
  const kk = cpol(Math.exp(lr), th), ku = cpol(Math.exp(lr * u), th * u);
  const c = csub(k1.B, cmul(kk, k0.B)), omk = csub([1, 0], kk);
  if (Math.hypot(omk[0], omk[1]) < 1e-9) return { A: k0.A, B: cadd(k0.B, [c[0] * u, c[1] * u]), Z: k0.Z, phi: k0.phi };
  const ws = cdiv(c, omk);
  return { A: cmul(ku, k0.A), B: cadd(cmul(ku, csub(k0.B, ws)), ws), Z: k0.Z * Math.exp(lr * u), phi: k0.phi + th * u };
}
const toS = (K, p) => cadd(cmul(K.A, p), K.B);
function setT(K, o = [0, 0], u = 1) { const a = K.A[0] * u, b = K.A[1] * u, B = cadd(cmul(K.A, o), K.B); ctx.setTransform(a, b, -b, a, B[0], B[1]); }
const ID = () => ctx.setTransform(1, 0, 0, 1, 0, 0);

// ---------------------------------------------------------------- the world (mm): a face seen from the front, a phone
// the phone's own coordinates: x −36…36, y −74…74 (front face); the earpiece and the sensor window sit at the top
const PH = { w: 72, h: 148, r: 9, th: 8 };
const EARP = [-8, -71.2, 16, 1.6];
const WIN = [8.6, -71.6, 9, 2.4];                                 // the dark window right of the earpiece
const LED = [10.8, -70.4], EYE = [15.6, -70.4];                   // under it: the lamp and the eye
const SENS = [13.2, -70.4];
const P = {
  hand: { x: 100, y: 95, th: 0, ph: -8 },
  near: { x: 130, y: -2, th: 60, ph: 10 },
  ear: { x: 106, y: -2, th: 64, ph: 12 },
  mid: { x: 152, y: 8, th: 50, ph: 6 },
  touch: { x: 98, y: -2, th: 66, ph: 12 },
  gap: { x: 146, y: -2, th: 64, ph: 12 },
  front: { x: -10, y: -10, th: 0, ph: 0 },
};
const lerpP = (a, b, u) => ({ x: lerp(a.x, b.x, u), y: lerp(a.y, b.y, u), th: lerp(a.th, b.th, u), ph: lerp(a.ph, b.ph, u) });
function pose(t) {
  const seg = (a, b, t0, t1, ease = E.p2io) => lerpP(a, b, ease(prog(t, t0, t1)));
  if (t < 1.75) return seg(P.hand, P.near, 0.15, 1.75, E.sine);
  if (t < 2.6) return seg(P.near, P.ear, 1.75, 2.25);
  if (t < 2.95) return seg(P.ear, P.mid, 2.6, 2.95);
  if (t < T.myth) return seg(P.mid, P.ear, 2.95, 3.3);
  if (t < T.gap) { const g = seg(P.ear, P.touch, T.myth, T.contact); return t > T.contact ? { ...g, x: g.x + 1.6 * Math.sin((t - T.contact) * 6.0), ph: g.ph + 0.8 * Math.sin((t - T.contact) * 3.1) } : g; }   // pressed on, pressing
  if (t < T.swing) { const g = seg(P.touch, P.gap, T.gap, T.gapEnd); return t > T.gapEnd ? { ...g, x: g.x + 3 * Math.sin((t - T.gapEnd) * 4.2) } : g; }   // hovering, dark, not touching
  if (t < T.climb) return seg(P.gap, P.front, T.swing, T.swingEnd, E.p3io);
  if (t < T.lift) return seg(P.front, P.hand, T.climb, T.climbEnd);
  if (t < T.off3 + 0.3) return t < T.off3 ? seg(P.hand, P.near, T.lift, T.off3, E.sine) : seg(P.near, P.ear, T.off3, T.off3 + 0.3);
  if (t < 48.9) return seg(P.ear, P.mid, 48.5, 48.9);
  if (t < T.end) { const g = seg(P.mid, P.ear, 49.25, T.off4); return t > T.off4 ? { ...g, x: g.x + 2.2 * Math.sin((t - T.off4) * 1.7), y: g.y + 1.6 * Math.sin((t - T.off4) * 1.1 + 1), ph: g.ph + 1.2 * Math.sin((t - T.off4) * 1.3) } : g; }
  return seg(P.ear, P.front, T.end, T.endMorph, E.p3io);
}
const phoneW = (q, p) => { const c = Math.cos(q.th * RAD), s = Math.sin(q.th * RAD), a = q.ph * RAD; const x = p[0] * c - 4 * s, y = p[1]; return [q.x + x * Math.cos(a) - y * Math.sin(a), q.y + x * Math.sin(a) + y * Math.cos(a)]; };   // a point on the phone's face → world

// ---------------------------------------------------------------- cameras
const KH0 = key([40, 20], [540, 1180], 1.12);                 // the face and the phone, pushing in from frame 0
const KH = key([50, 12], [540, 1180], 1.26);
const KH2 = key([54, 10], [540, 1180], 1.34);
const KM = key([84, -4], [540, 1180], 2.15);                  // the guess: the ear and the phone
const KMz = key([90, -6], [540, 1180], 2.55);
const KF = key([-10, -12], [540, 1180], 1.85);                // the phone, turned to us
const KFz = key([-6, -30], [540, 1180], 2.1);
const SENSW = phoneW(P.front, SENS), LEDW = phoneW(P.front, LED), EYEW = phoneW(P.front, EYE);
const K1 = key(SENSW, [540, 1080], 21);                       // the window by the earpiece
const K1z = key(SENSW, [540, 1080], 25);
const K1in = key(LEDW, [540, 1080], 130);                      // into the lamp
const KMissFar = key([0, 30], [540, 1200], 7);
const KMiss = key([-6, 16], [540, 1200], 2.25);               // the missing step: the phone's face, the cheek on it
const KMissz = key([0, 22], [540, 1200], 2.65);
const KHe = key([98, -6], [540, 1150], 2.3);
const KHe2 = key([102, -10], [540, 1150], 2.85);                  // the closing: pushing in on the ear and the phone
const K7 = key([-10, -10], [225, 560], 0.55);                 // the end badge
const inLin = (x, a = 0.22) => (x < a ? (x * x) / (2 * a) : x - a / 2) / (1 - a / 2);
function cam(t) {
  if (t < T.off1) return interp(KH0, KH, E.sine(prog(t, 0, T.off1)));
  if (t < T.myth) return interp(KH, KH2, E.sine(prog(t, T.off1, T.myth)));
  if (t < T.myth + 0.7) return interp(KH2, KM, E.p3io(prog(t, T.myth, T.myth + 0.7)));
  if (t < T.swing) return interp(KM, KMz, E.sine(prog(t, T.myth + 0.7, T.swing)));
  if (t < T.swingEnd) return interp(KMz, KF, E.p3io(prog(t, T.swing, T.swingEnd)));
  if (t < T.dive1) return interp(KF, KFz, E.sine(prog(t, T.swingEnd, T.dive1)));
  if (t < T.dive1End) return interp(KFz, K1, E.p3io(prog(t, T.dive1, T.dive1End)));
  if (t < T.dive2) return interp(K1, K1z, E.sine(prog(t, T.dive1End, T.dive2)));
  if (t < T.climbA) return interp(K1z, K1in, inLin(prog(t, T.dive2, T.dive2End)));
  if (t < T.climbAEnd) return interp(KMissFar, KMiss, E.p3out(prog(t, T.climbA, T.climbAEnd)));
  if (t < T.climb) return interp(KMiss, KMissz, E.sine(prog(t, T.climbAEnd, T.climb)));
  if (t < T.climbEnd) return interp(KMissz, KH, E.p3io(prog(t, T.climb, T.climbEnd)));
  if (t < T.lift) return interp(KH, KH2, E.sine(prog(t, T.climbEnd, T.lift)));
  if (t < T.off4) return interp(KH2, KHe, E.sine(prog(t, T.lift, T.off3 + 0.5)));
  if (t < T.end) return interp(KHe, KHe2, E.sine(prog(t, T.off4, T.end)));
  return interp(KHe2, K7, E.p3io(prog(t, T.end, T.endMorph)));
}

// ---------------------------------------------------------------- states
const orangeK = (t) => E.p2io(prog(t, T.myth, T.myth + 0.3)) * (1 - E.p2io(prog(t, T.unOrange, T.unOrange + 0.3)));
function groundCol(t) { const o = orangeK(t); return o > 0 ? mixHex(C.ground, C.acc, o) : C.ground; }
function flood(t) {
  if (t < T.flood) return 0;
  if (t < T.floodEnd) return E.p2io(prog(t, T.flood, T.floodEnd));
  if (t < T.unflood) return 1;
  return 1 - E.p2io(prog(t, T.unflood, T.unflood + 0.15));
}
// the missing step: the cheek (in the phone's own coordinates, its left edge) comes onto the screen
function cheekL(t) {
  const s = (a, b, x0, x1) => lerp(x0, x1, E.p2io(prog(t, a, b)));
  if (t < T.press) return 140;
  if (t < T.touch) return s(T.press, T.touch, 140, 6);
  if (t < T.rewind) return 6;
  if (t < T.a8) return s(T.rewind, T.rewindEnd, 6, 140);
  if (t < T.away) return s(T.a8, T.touch2, 140, 6);
  return s(T.away, T.away + 0.5, 6, 140);
}

// ---------------------------------------------------------------- the light world: the face
function drawPerson(t, K, fade) {
  const ppm = K.Z * S0, lw = (n) => Math.max(0.2, n / ppm);
  ctx.save(); ctx.globalAlpha = 1 - fade; ctx.lineJoin = "round"; ctx.lineCap = "round"; ctx.strokeStyle = C.ink;
  // shirt, neck
  ctx.fillStyle = "#C9CED4"; ctx.beginPath(); ctx.moveTo(-160, 330); ctx.bezierCurveTo(-160, 230, -120, 196, -40, 186); ctx.lineTo(40, 186); ctx.bezierCurveTo(120, 196, 160, 230, 160, 330); ctx.closePath(); ctx.fill(); ctx.lineWidth = lw(5); ctx.stroke();
  ctx.fillStyle = C.skinDeep; ctx.beginPath(); ctx.moveTo(-30, 80); ctx.lineTo(-32, 192); ctx.quadraticCurveTo(0, 206, 32, 192); ctx.lineTo(30, 80); ctx.closePath(); ctx.fill(); ctx.stroke();
  // ears
  [-1, 1].forEach((sg) => { ctx.fillStyle = C.skin; ctx.beginPath(); ctx.ellipse(sg * 79, -4, 12, 25, sg * 0.12, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.lineWidth = lw(3.5); ctx.beginPath(); ctx.moveTo(sg * 76, -20); ctx.quadraticCurveTo(sg * 86, -6, sg * 77, 12); ctx.stroke(); ctx.lineWidth = lw(5); });
  // face
  ctx.fillStyle = C.skin; ctx.beginPath(); ctx.moveTo(0, -112); ctx.bezierCurveTo(48, -112, 76, -78, 76, -30); ctx.bezierCurveTo(76, 20, 62, 70, 32, 98); ctx.quadraticCurveTo(0, 118, -32, 98);
  ctx.bezierCurveTo(-62, 70, -76, 20, -76, -30); ctx.bezierCurveTo(-76, -78, -48, -112, 0, -112); ctx.closePath(); ctx.fill(); ctx.stroke();
  // hair
  ctx.fillStyle = "#CFC6B6"; ctx.beginPath(); ctx.moveTo(-80, -22); ctx.bezierCurveTo(-90, -96, -50, -134, 0, -134); ctx.bezierCurveTo(50, -134, 90, -96, 80, -22);
  ctx.bezierCurveTo(72, -64, 44, -86, 6, -88); ctx.bezierCurveTo(-34, -86, -70, -64, -80, -22); ctx.closePath(); ctx.fill(); ctx.stroke();
  // eyes: they glance toward the phone; a blink now and then
  const q = pose(t), look = clamp((q.x - 20) / 120, -1, 1) * 2.4, bl = ((t + 0.7) % 4.1) < 0.12 ? 0.15 : 1;
  [-1, 1].forEach((sg) => {
    ctx.fillStyle = "#F7F5F0"; ctx.beginPath(); ctx.ellipse(sg * 27, -16, 7, 4.6 * bl, 0, 0, TAU); ctx.fill(); ctx.lineWidth = lw(3.5); ctx.stroke();
    if (bl > 0.5) { ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(sg * 27 + look, -16, 2.8, 0, TAU); ctx.fill(); }
    ctx.lineWidth = lw(4); line(sg * 18, -31, sg * 36, -32);
  });
  // nose, mouth: talking while the call is on and the phone is at the ear
  ctx.lineWidth = lw(3.5); ctx.beginPath(); ctx.moveTo(-1, -6); ctx.quadraticCurveTo(-7, 18, 0, 22); ctx.stroke();
  const cs = callState(t), atEar = q.th > 40 ? 1 : 0, talk = cs.s === "talking" && atEar ? Math.max(0, Math.sin(t * 9.3) * Math.sin(t * 3.1 + 1)) : 0;
  ctx.lineWidth = lw(4);
  if (talk > 0.05) { ctx.fillStyle = "#7A4A42"; ctx.beginPath(); ctx.ellipse(0, 46, 11, 2 + 5 * talk, 0, 0, TAU); ctx.fill(); ctx.stroke(); }
  else { ctx.beginPath(); ctx.moveTo(-11, 45); ctx.quadraticCurveTo(0, 51, 11, 45); ctx.stroke(); }
  ctx.restore();
}
// ---------------------------------------------------------------- the phone
function handset(cx, cy, r, col) {                                  // a little phone glyph for the hang-up button
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(Math.PI * 0.75); ctx.fillStyle = col;
  ctx.beginPath(); ctx.roundRect(-r * 0.75, -r * 0.18, r * 1.5, r * 0.36, r * 0.18); ctx.fill();
  ctx.beginPath(); ctx.roundRect(-r * 0.78, -r * 0.18, r * 0.36, r * 0.62, r * 0.12); ctx.fill(); ctx.beginPath(); ctx.roundRect(r * 0.42, -r * 0.18, r * 0.36, r * 0.62, r * 0.12); ctx.fill();
  ctx.restore();
}
function drawScreen(t, K, on) {                                      // the call screen, in the phone's own coordinates
  const sx = -PH.w / 2 + 2.6, sy = -PH.h / 2 + 2.6, sw = PH.w - 5.2, sh = PH.h - 5.2;
  ctx.fillStyle = "#0A0B0D"; rr(sx, sy, sw, sh, PH.r - 2); ctx.fill();
  if (on <= 0.01) return;
  ctx.save(); ctx.globalAlpha *= on; rr(sx, sy, sw, sh, PH.r - 2); ctx.clip();
  ctx.fillStyle = "#24282E"; ctx.fillRect(sx, sy, sw, sh);
  const cs = callState(t), mmss = (n) => `${String(Math.floor(n / 60)).padStart(2, "0")}:${String(n % 60).padStart(2, "0")}`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = "#5C636C"; ctx.beginPath(); ctx.arc(0, -42, 10, 0, TAU); ctx.fill();
  ctx.fillStyle = C.paper; ctx.font = `700 9px ${UI}`; ctx.fillText(COPY.who[0], 0, -41.5);
  ctx.font = `700 8px ${UI}`; ctx.fillText(COPY.who, 0, -22);
  ctx.font = `400 4.4px ${UI}`; ctx.fillStyle = "rgba(241,240,236,0.75)";
  ctx.fillText(cs.s === "calling" ? COPY.calling : cs.s === "ended" ? `${COPY.endedTxt}  ${mmss(cs.sec)}` : `${COPY.talking}  ${mmss(cs.sec)}`, 0, -12);
  if (cs.s !== "ended") {
    COPY.btns.forEach((b, i) => { const x = -20 + i * 20; ctx.fillStyle = "#3B4048"; ctx.beginPath(); ctx.arc(x, 14, 7.4, 0, TAU); ctx.fill();
      ctx.fillStyle = "rgba(241,240,236,0.8)"; ctx.beginPath(); ctx.arc(x, 14, 1.6, 0, TAU); ctx.fill(); ctx.font = `400 3.4px ${UI}`; ctx.fillText(b, x, 25.5); });
    ctx.fillStyle = C.acc; ctx.beginPath(); ctx.arc(0, 48, 9, 0, TAU); ctx.fill(); handset(0, 48, 6.5, "#F7F5F0");
  } else {
    ctx.fillStyle = "rgba(241,240,236,0.9)"; ctx.font = `700 7px ${UI}`; ctx.fillText(COPY.endedTxt, 0, 22);
  }
  ctx.restore();
}
function drawHand(K) {                                               // the hand holding it (drawn under the phone)
  const ppm = K.Z * S0, lw = Math.max(0.2, 5 / ppm);
  ctx.fillStyle = C.skin; ctx.strokeStyle = C.ink; ctx.lineWidth = lw; ctx.lineJoin = "round";
  ctx.beginPath(); ctx.moveTo(10, 40); ctx.bezierCurveTo(40, 60, 62, 120, 70, 210); ctx.lineTo(18, 222); ctx.bezierCurveTo(14, 150, -4, 90, -30, 60); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#C9CED4"; ctx.beginPath(); ctx.moveTo(52, 118); ctx.bezierCurveTo(62, 150, 70, 190, 74, 240); ctx.lineTo(10, 250); ctx.bezierCurveTo(10, 200, 4, 160, -2, 128); ctx.closePath(); ctx.fill(); ctx.stroke();   // the sleeve
  ctx.fillStyle = C.skin;
  ctx.beginPath(); ctx.ellipse(-34, 26, 7, 12, 0.2, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(-35, 46, 7, 11, 0.25, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(38, 30, 6.5, 15, -0.2, 0, TAU); ctx.fill(); ctx.stroke();
}
function drawPhone(t, K, q, o = {}) {
  const ppm = K.Z * S0, lw = (n) => Math.max(0.06, n / ppm), c = Math.cos(q.th * RAD), s = Math.sin(q.th * RAD);
  setT(K); ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.ph * RAD);
  if (!o.noHand) drawHand(K);
  // the edge you see as it turns toward the face

    if (style === "slam") { const sc = slamScale(t - ls), cy = ys[i] - size * 0.35; ctx.translate(x, cy); ctx.scale(sc, sc); ctx.translate(-x, -cy); }

    ctx.font = font; ctx.textBaseline = "alphabetic";
    chars.forEach((c, j) => {
      const cx = x + mw(font, pre); pre += c.ch;
      const lt = t - (ls + j * stag);
      let a = 1, blur = 0;
      if (style === "blur") { const k = clamp(lt / 0.13); a = k; blur = 9 * (1 - k); }

}
function label(str, x, y, size, col, t, t0, t1, o = {}) {
  if (t < t0 || t >= t1) return;
  ID(); const font = `${o.weight ?? 700} ${size}px ${o.face ?? UI}`; const wv = mw(font, str);
  const k = E.p3out(prog(t, t0, t0 + 0.28)), e = prog(t, t1 - 0.15, t1);
  ctx.save(); ctx.font = font; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  const left = o.align === "right" ? x - wv : o.align === "center" ? x - wv / 2 : x;
  ctx.beginPath(); ctx.rect(left - 4, y - size * 1.2, (wv + 8) * k, size * 1.6); ctx.clip();
  ctx.globalAlpha = (o.alpha ?? 1) * (1 - e); if (e > 0) ctx.filter = `blur(${(8 * e).toFixed(1)}px)`;
  ctx.fillStyle = col; ctx.fillText(str, left, y); ctx.restore(); ctx.filter = "none";
}
function underline(str, prefix, word, lineIdx, t, t0, t1, ys = [330, 472], size0 = 112) {
  if (t < t0 || t >= t1) return;
  const size = fitSize(str, size0, 870), f = `${size}px ${DISPLAY}`;
  const x0 = 96 + mw(f, prefix), wv = mw(f, word), k = E.p3out(prog(t, t0, t0 + 0.3)), fo = 1 - prog(t, t1 - 0.16, t1);
  ID(); ctx.globalAlpha = fo; ctx.fillStyle = C.acc; ctx.fillRect(x0 - 4, ys[lineIdx] + 20, (wv + 8) * k, 11); ctx.globalAlpha = 1;

function bubble(cx, top, str, t, t0, t1) {           // a speech bubble; the tail points down at (cx, top + h + 26)
  if (t < t0 || t >= t1) return;
  const size = 76, font = `${size}px ${DISPLAY}`, wv = mw(font, str), w = wv + 64, h = size + 44;
  const sc = spring(t - t0, 15, 0.55), e = prog(t, t1 - 0.2, t1), x = cx, y = top + h + 26;
  const off = clamp(cx, 30 + w / 2, W - 30 - w / 2) - cx;
  ID(); ctx.save(); ctx.translate(x, y); ctx.scale(sc * (1 - 0.15 * e), sc * (1 - 0.15 * e)); ctx.globalAlpha = 1 - e;
  ctx.fillStyle = C.acc; rr(-w / 2 + off, -h - 26, w, h, 24); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-20, -27); ctx.lineTo(20, -27); ctx.lineTo(0, 0); ctx.closePath(); ctx.fill();
  ctx.font = font; ctx.fillStyle = C.ink; ctx.textAlign = "center"; ctx.textBaseline = "alphabetic"; ctx.fillText(str, off, -26 - h / 2 + size * 0.36);

function wavePath(f, x0, x1, y0 = 0, n = 140) { ctx.beginPath(); for (let i = 0; i <= n; i++) { const x = x0 + (x1 - x0) * (i / n), y = y0 + f(x); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } }
// a wiggle along a polyline (world): the microwave, travelling
function pathLen(P) { let L = 0; for (let i = 1; i < P.length; i++) L += Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]); return L; }
function pathAt(P, s) {
  for (let i = 1; i < P.length; i++) { const L = Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]); if (s <= L || i === P.length - 1) { const u = clamp(s / L); const dx = (P[i][0] - P[i - 1][0]) / L, dy = (P[i][1] - P[i - 1][1]) / L; return [lerp(P[i - 1][0], P[i][0], u), lerp(P[i - 1][1], P[i][1], u), -dy, dx]; } s -= L; }

}
function wiggle(P, s0, s1, amp, lam, ph) {
  ctx.beginPath(); const n = Math.max(8, Math.ceil((s1 - s0) / 1.2));
  for (let i = 0; i <= n; i++) { const s = lerp(s0, s1, i / n), p = pathAt(P, s), o = amp * Math.sin(TAU * (s / lam) - ph); const x = p[0] + p[2] * o, y = p[1] + p[3] * o; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
}


// ---------------------------------------------------------------- text
function groundRGB(t) { const o = orangeK(t), g = hexRGB(C.ground), q = hexRGB(C.acc); return [0, 1, 2].map((i) => Math.round(lerp(g[i], q[i], o))).join(","); }
function scrim(t) {                                    // a soft wash of the ground colour behind the text band
  const fl = flood(t);
  if (fl > 0.02) { ID(); const g = ctx.createLinearGradient(0, 0, 0, 700); g.addColorStop(0, `rgba(23,25,28,${0.82 * fl})`); g.addColorStop(0.75, `rgba(23,25,28,${0.82 * fl})`); g.addColorStop(1, "rgba(23,25,28,0)"); ctx.fillStyle = g; ctx.fillRect(0, 0, W, 700); }
  const a = 0.86 * (1 - fl) * (t >= T.end ? 1 - prog(t, T.end, T.end + 0.3) : 1);
  if (a <= 0.01) return;
  const col = groundRGB(t);
  ID(); const g = ctx.createLinearGradient(0, 0, 0, 700);
  g.addColorStop(0, `rgba(${col},${a})`); g.addColorStop(0.75, `rgba(${col},${a})`); g.addColorStop(1, `rgba(${col},0)`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, 700);
}
function textBand(t) {
  const L = C.ink, D = C.paper;
  scrim(t);
  // 1 the phenomenon — no noun
  lines(COPY.h1, t, -1, T.h1Out + 0.16, { style: "none", col: L });
  underline(COPY.h1[1], "屏幕怎么", "自己", 1, t, T.underline, T.h1Out + 0.16);
  // 2 the wrong guess (on orange), struck
  lines(COPY.q2, t, T.q2, T.a2, { style: "blur", col: L, acc: C.paper, exit: 0.001 });
  lines(COPY.a2, t, T.a2, T.q3, { style: "slam", col: L, acc: C.paper, lineGap: 0.2 });
  // 3 dig in
  lines(COPY.q3, t, T.q3, T.a3, { style: "blur", col: L });
  lines(COPY.a3, t, T.a3, T.q4, { style: "blur", col: L });
  lines(COPY.q4, t, T.q4, T.flood, { style: "blur", col: L });
  // 4 one mechanism, slowly (dark)
  lines(COPY.h3, t, T.h3, T.q5, { style: "blur", col: D });
  lines(COPY.q5, t, T.q5, T.push, { style: "blur", col: D });
  lines(COPY.push, t, T.push, T.a5, { style: "blur", col: D });
  lines(COPY.a5, t, T.a5, T.q6, { style: "slam", col: D });
  lines(COPY.q6, t, T.q6, T.a6, { style: "blur", col: D });
  lines(COPY.a6, t, T.a6, T.name, { style: "blur", col: D });
  lines(COPY.name, t, T.name, T.q7, { style: "slam", col: D, ys: [318, 492], size: [96, 132], lineGap: 0.25 });
  // 5 the missing step
  lines(COPY.q7, t, T.q7, T.a7, { style: "blur", col: L });
  lines(COPY.a7, t, T.a7, T.a8, { style: "blur", col: L });
  lines(COPY.a8, t, T.a8, T.climb + 0.3, { style: "blur", col: L });
  // 6 back to the start
  lines(COPY.q9, t, T.q9, T.fin, { style: "blur", col: L });
  lines(COPY.fin, t, T.fin, T.finOut, { style: "blur", col: L, lineGap: 0.25 });
  // a small tip in the same place, after the last line
  label(COPY.tipTag, 98, 282, 44, C.acc, t, T.tip, T.tipOut, { weight: 700 });
  lines(COPY.tip, t, T.tip + 0.15, T.tipOut, { style: "blur", col: "rgba(20,20,20,0.85)", face: UI, weight: 400, size: 58, x: 98, ys: [366, 444], lineGap: 0.3, stag: 0.02, maxW: 900 });
}
function endCard(t) {
  if (t < T.title1) return;
  lines(COPY.end, t, T.title1, DUR + 1, { style: "type", col: C.ink, ys: [905, 1045, 1185], size: 124, stag: 0.045, lineGap: 0.3 });
  lines([COPY.epNum], t, T.ep, DUR + 1, { style: "slam", col: C.ink, x: 400, ys: [520], size: 150 });
  lines([COPY.epName], t, T.ep + 0.25, DUR + 1, { style: "blur", col: C.ink, x: 404, ys: [668], size: 104 });
  if (t >= T.sting) {
    const K = cam(t), q = pose(t), c = toS(K, [q.x, q.y]), sc = spring(t - T.sting, 16, 0.5);
    ID(); ctx.save(); ctx.translate(c[0], c[1]); ctx.scale(sc, sc); ctx.font = `100px ${DISPLAY}`; ctx.fillStyle = C.acc; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("?", 2, 6); ctx.restore();
  }
}

function frame(t) {
  ctx.reset();                                     // no canvas state survives from the previous frame
  ID();
  const K = cam(t), fl = flood(t);
  drawLight(t, K);
  drawDark(t, fl);
  darkOverlays(t, fl);
  textBand(t);
  endCard(t);
}

// ---------------------------------------------------------------- motion blur: temporal supersampling where things move fast
const BLUR = [[0, 3.5], [5.0, 5.75], [8.25, 8.8], [10.5, 11.7], [12.25, 14.05], [19.25, 22.7], [37.7, 39.05], [39.25, 41.0], [42.0, 43.8], [44.25, 46.3], [46.5, 50.3], [56.5, 57.12], [58.0, 58.3]];
const SUB = 6, SHUTTER = 0.5 / FPS;
const CUTS = [];
window.seek = function seek(t) {
  t = clamp(t, 0, DUR - 1e-6);
  const blur = BLUR.some(([a, b]) => t >= a && t < b);
  if (!blur) { ctx = MAIN; frame(t); return; }

  for (let i = 0; i < SUB; i++) {
    ctx = OFFX;
    let ts = t + SHUTTER * (i / (SUB - 1) - 0.5);
    for (const c of CUTS) { if (t >= c && ts < c) ts = c; if (t < c && ts >= c) ts = c - 1e-4; }

};
window.DUR = DUR; window.FPS = FPS;
window.addEventListener("hf-seek", (e) => window.seek(e.detail.time));
window.ready = false;
window.whenReady = Promise.all([
  document.fonts.load(`100px ${DISPLAY}`, "打电话时屏幕黑"), document.fonts.load(`700 50px ${UI}`, "弹回来的光够近了"), document.fonts.load(`400 50px ${UI}`, "通话中妈妈"),
]).then(() => document.fonts.ready).then(() => { MEASURE.clear(); window.seek(0); window.ready = true; });
</script>
