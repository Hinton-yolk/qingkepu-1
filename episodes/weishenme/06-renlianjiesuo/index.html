// Two worlds, as in the series: the light one (the person, the phone) and the dark one (inside: the dot projector,

// ---------------------------------------------------------------- text (the series' caption band, as in EP.05)

}

  const x0 = 96 + mw(f, plain(prefix)), wv = mw(f, word), k = E.p3out(prog(t, t0, t0 + 0.3)), fo = 1 - prog(t, t1 - 0.16, t1);

}
function tag(txt, x, y, a, o = {}) {                                  // a small pill (术语 / 注释 are small text, ≥ 44 px)
  if (a <= 0.01) return;

// ---------------------------------------------------------------- the worlds: dark from the dive until the way out
function flood(t) { if (t < T.flood) return 0; if (t < T.floodEnd) return prog(t, T.flood, T.floodEnd); if (t < T.out) return 1; return 1 - prog(t, T.out, T.out + 0.5); }
function irisAt(t) { if (t >= 30) return [540, 1060]; const Z = openZoom(t); return [OPEN.isl[0] * Z.s + Z.tx, OPEN.isl[1] * Z.s + Z.ty]; }
function irisOf(t) {
  const fl = flood(t); if (fl <= 0.001 || fl >= 0.999) return null;
  const into = t < 30, k = into ? fl : 1 - fl;
  return { into, R: 30 + 2300 * E.p2in(k), c: irisAt(t) };
}
function irisClip(ir, inside) { const p = new Path2D(); if (!inside) p.rect(0, 0, W, H); p.arc(ir.c[0], ir.c[1], ir.R, 0, TAU); ID(); ctx.clip(p, inside ? "nonzero" : "evenodd"); }

// ---------------------------------------------------------------- the pictures (the person and the hand: generated with GPT by
// the user from 图片prompt.md, prepared by tools/people.py; 1024 × 1536 each, transparent)
const IMG = {};
let NOSTRETCH = false;                                 // on the dark ground the pictures fade out at the bottom instead
const PEOPLE = ["base", "makeup", "contour", "mask", "lipstick", "hand", "lipstick-hand", "mask-layer"];
const SCREEN = { x: 281, y: 235, w: 457, h: 902 }, PHONE_C = [510, 686], ISLAND = [512, 265], PHONE_W = 480;
function loadImg(src) { return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; }); }
function pic(name, x, y, s, a = 1, fade = null) {     // a picture with its top-left at (x, y), scale s. On the light ground the bottom row
  const im = IMG[name]; if (!im || a <= 0.003) return;   // is stretched to the frame's bottom; on the dark one (fade = colour) it fades out instead
  ID(); ctx.save(); ctx.globalAlpha *= a;
  ctx.drawImage(im, x, y, 1024 * s, 1536 * s);
  const yb = y + 1536 * s - 1;
  if (!fade && !NOSTRETCH && yb < H) ctx.drawImage(im, 0, 1535, 1024, 1, x, yb, 1024 * s, H - yb + 2);
  ctx.restore();

    const y0 = y + 1536 * s * 0.8, g = ctx.createLinearGradient(0, y0, 0, yb);
    g.addColorStop(0, rgba(fade, 0)); g.addColorStop(1, rgba(fade, a));

// the phone in the hand: (cx, cy) is the phone's centre on screen, w its width; st: unlock, glow, shake, dim, keys
const PHC = document.createElement("canvas"); PHC.width = 1024; PHC.height = 1536; const PHX = PHC.getContext("2d");
function handPhone(cx, cy, w, st = {}) {
  const s = w / PHONE_W, x = cx - PHONE_C[0] * s, y = cy - PHONE_C[1] * s;
  pic("hand", x, y, s);

  const prev = ctx; ctx = PHX; ctx.reset();
  const un = st.unlock ?? 0, g = ctx.createLinearGradient(0, SCREEN.y, 0, SCREEN.y + SCREEN.h);
  g.addColorStop(0, mixHex("#2E3036", "#8FA3B8", un * 0.9)); g.addColorStop(1, mixHex("#1D1E22", "#D9C7B4", un * 0.85));
  ctx.fillStyle = g; ctx.fillRect(SCREEN.x - 4, SCREEN.y - 4, SCREEN.w + 8, SCREEN.h + 8);
  if (st.keys != null) phoneKeys(PHONE_C[0], PHONE_C[1], PHONE_W, 920, st);
  else lockIcon(PHONE_C[0], SCREEN.y + SCREEN.h * 0.2, PHONE_W * 0.13, un, st.shake ?? 0, st.dim ?? 0);
  if ((st.glow ?? 0) > 0) { ctx.globalAlpha = st.glow; rr(ISLAND[0] - 64, ISLAND[1] - 24, 128, 48, 24); ctx.strokeStyle = "rgba(255,74,28,0.6)"; ctx.lineWidth = 6; ctx.stroke(); ctx.globalAlpha = 1; }

}

// ---------------------------------------------------------------- the opening (and the closing): the person and the phone
const OPEN = { phone: [880, 1080, 300] };
OPEN.isl = [OPEN.phone[0] + (ISLAND[0] - PHONE_C[0]) * OPEN.phone[2] / PHONE_W, OPEN.phone[1] + (ISLAND[1] - PHONE_C[1]) * OPEN.phone[2] / PHONE_W];
function openZoom(t) {                               // a screen-space push towards the island (2.75–6.5)
  let s = 1;
  if (t >= T.toTop) s = lerp(1, 2.5, E.p3io(prog(t, T.toTop, T.toTopEnd)));
  if (t >= T.toTopEnd) s = lerp(2.5, 2.8, prog(t, T.toTopEnd, T.dive));

const FACECAM = { eye: [12, -3.0, 58], target: [1.8, -3.4, 0], fov: 24 };
const PERS = { x: -381, y: 70, s: 1.15 };                 // the person picture in the opening (her nose near x 640, eye near y 760)

  const y = lerp(pcy + 1500, pcy, up) + 6 * Math.sin(TAU * t / 3.1);

  const glow = fin ? 0.6 * Math.sin(Math.PI * prog(t, T.outEnd, T.ka)) : 0.6 * Math.sin(Math.PI * prog(t, T.scan, T.ka0)) + (t >= T.glow && t < T.dive ? 0.5 + 0.3 * Math.sin(TAU * (t - T.glow) * 1.5) : 0);

function module(x, y, r, kind, t) {

  ctx.beginPath(); ctx.arc(0, 0, r * 0.72, 0, TAU); ctx.fillStyle = "#101114"; ctx.fill();

// ---------------------------------------------------------------- the face in the dark: dots, heights, the depth map
const DARKCAM = { eye: [0, -0.4, 44], target: [0, -0.4, 0], fov: 25 };

// the person getting her makeup: the base picture; the makeup picture shows through growing soft circles (lips, cheek, eye);
// the contour picture over it for 修容. (cx, cy) is where the face's middle (700, 720 in the picture) lands.
const MKC = document.createElement("canvas"); MKC.width = 1024; MKC.height = 1536; const MKX = MKC.getContext("2d");
function personMakeup(t, cx, cy, s, mk, o = {}) {
  const x = cx - 700 * s, y = cy - 720 * s;
  const prev = ctx; ctx = MKX; ctx.reset();
  ctx.drawImage(IMG.makeup, 0, 0);

  const spots = [[[820, 850], 150, mk.lips], [[700, 730], 230, mk.blush], [[770, 600], 140, mk.shadow]];
  ctx.fillStyle = "#000";

  if (mk.contour > 0) { pic("contour", x, y, s, mk.contour * (o.a ?? 1)); noseContour(x, y, s, mk.contour * (o.a ?? 1)); }

function bridgeLine(t, dv) {
  const k = E.p3out(prog(t, T.prof + 0.2, T.profEnd)), pts = MID.map((i) => FR.project(dv, i));
  ID(); ctx.save(); ctx.lineJoin = "round"; ctx.lineCap = "round";
  ctx.lineWidth = 7; ctx.strokeStyle = "rgba(241,240,236,0.95)"; ctx.globalAlpha = E.p3out(prog(t, T.prof, T.prof + 0.3));
  ctx.beginPath(); pts.forEach((p, i) => (i ? ctx.lineTo(p[0] + 6, p[1]) : ctx.moveTo(p[0] + 6, p[1]))); ctx.stroke();
  ctx.globalAlpha = 1; ctx.setLineDash([14, 10]); ctx.lineWidth = 5; ctx.strokeStyle = C.acc;
  const n = Math.max(2, Math.round(pts.length * k)); ctx.beginPath(); pts.slice(0, n).forEach((p, i) => (i ? ctx.lineTo(p[0] + 6, p[1]) : ctx.moveTo(p[0] + 6, p[1]))); ctx.stroke();

}
// the vertices down the middle of the face, from the brow to the nose tip (for the bridge line)
const MID = (() => { const P = FR.FACE.P, out = []; for (let y = 3.6; y >= -0.6; y -= 0.15) { let bi = -1, bz = -1e9; for (let i = 0; i < FR.FACE.n; i++) if (Math.abs(P[i * 3]) < 0.12 && Math.abs(P[i * 3 + 1] - y) < 0.1 && P[i * 3 + 2] > bz) { bz = P[i * 3 + 2]; bi = i; } if (bi >= 0) out.push(bi); } return out; })();
// ---------------------------------------------------------------- the mask: only the eyes
function maskScene(t) {                             // 34–43
  const k = E.p3out(prog(t, T.q10, T.q10 + 0.5));
  if (k <= 0 || t >= T.out + 0.5) return;
  const mk = { lips: 1, blush: 1, shadow: 1, contour: 1 };
  const side = E.p3io(prog(t, T.toDepth, T.toDepthEnd));                 // the person moves left; the data comes in on the right

  ID(); ctx.save(); ctx.globalAlpha = k;

  if (full > 0) pic("mask", ox, oy, ps, full);
  ctx.restore();
  fadeBottom(ox, oy, ps, k);
  // the face data: the lower half is just the mask (greyed); only the eye area is used
  const ring = E.p2io(prog(t, T.ring, T.ringEnd));
  if (side > 0.01) {
    const swing = t >= T.swing ? 14 * Math.sin(TAU * prog(t, T.swing, T.swingEnd)) : 0;
    const face = { yaw: swing + 3 * Math.sin(TAU * (t - T.q10) / 7), pitch: -3 };
    const dx = lerp(1250, 800, side), dy = 880, cw = 330, ch = 360;
    ID(); ctx.save(); ctx.globalAlpha = k; rr(dx - cw / 2, dy - ch / 2, cw, ch, 22); ctx.fillStyle = "#1E2125"; ctx.fill();
    ctx.save(); rr(dx - cw / 2, dy - ch / 2, cw, ch, 22); ctx.clip();
    FR.render({ ctx, x: dx - cw / 2, y: dy - ch / 2, w: cw, h: ch, scale: 0.5, cam: { eye: [0, -0.4, 56], target: [0, -0.4, 0], fov: 25 }, face, ...LINES, mask: 1, maskCut: 0, maskGrey: 1, eyesOnly: ring * 0.75 });
    ctx.restore();
    rr(dx - cw / 2, dy - ch / 2, cw, ch, 22); ctx.strokeStyle = "rgba(241,240,236,0.35)"; ctx.lineWidth = 3; ctx.stroke();
    if (ring > 0) { ctx.globalAlpha = k * ring; ctx.strokeStyle = C.acc; ctx.lineWidth = 6; rr(dx - cw * 0.42, dy - ch * 0.3, cw * 0.84, ch * 0.3, 40); ctx.stroke(); }
    ctx.restore();

    ctx.beginPath(); ctx.ellipse(e[0] - 20 * ps, e[1], 130 * ps, 95 * ps, -0.1, 0, TAU); ctx.stroke(); ctx.restore();
  }

}

// ---------------------------------------------------------------- the tip: not recognised → the passcode → next time easier
function tipScene(t) {
  if (t < T.tip || t >= T.end + 0.6) return;
  const k = E.p3out(prog(t, T.tip, T.tip + 0.45));
  const s = 0.92, cx = 600, cy = 1150;
  const keysN = 6 * prog(t, T.keys, T.keys + 0.75);
  const un = E.p3out(prog(t, T.open2, T.open2 + 0.3));
  const shake = t >= T.miss && t < T.miss + 0.4 ? 1 - prog(t, T.miss, T.miss + 0.4) : 0;
  const morph = E.p3io(prog(t, T.end, T.endMorph));

  const mv = E.p3io(prog(t, T.tip, T.tip + 0.45)), [ocx, ocy, ow] = OPEN.phone, oy = ocy + 6 * Math.sin(TAU * t / 3.1);
  handPhone(lerp(ocx, cx, mv), lerp(oy, cy, mv), lerp(ow, 420 * s, mv), t < T.keys - 0.1 ? { unlock: 1 - E.p2io(prog(t, T.tip, T.tip + 0.25)), shake, dim: 0 } : t < T.open2 ? { keys: keysN } : { unlock: un });
  ctx.restore();
  if (t >= T.miss && t < T.keys) label(COPY.lockMiss, cx, cy - 860 * s * 0.08, 46, C.paper, t, T.miss, T.keys, { align: "center" });
  label(COPY.tipNote, 96, 700, 44, "rgba(20,20,20,0.7)", t, T.tip + 0.6, T.tipOut);
}

// ---------------------------------------------------------------- scrim, captions, end card
function scrim(t) {
  const ir = irisOf(t);
  if (ir) { ctx.save(); irisClip(ir, false); scrimOf(t, ir.into ? 0 : 1); ctx.restore(); ctx.save(); irisClip(ir, true); scrimOf(t, ir.into ? 1 : 0); ctx.restore(); return; }

}
function scrimOf(t, fl) {
  const STOPS = [[0, 1], [0.66, 1], [0.74, 0.86], [0.82, 0.56], [0.9, 0.24], [1, 0]];
  if (fl > 0.02) { ID(); const g = ctx.createLinearGradient(0, 0, 0, 800); STOPS.forEach(([o, k]) => g.addColorStop(o, `rgba(23,25,28,${fl * k})`)); ctx.fillStyle = g; ctx.fillRect(0, 0, W, 800); }
  const a = (1 - fl) * (t >= T.end ? 1 - prog(t, T.end, T.end + 0.3) : 1);
  if (a <= 0.01) return;
  ID(); const g = ctx.createLinearGradient(0, 0, 0, 800); STOPS.forEach(([o, k]) => g.addColorStop(o, `rgba(236,235,230,${a * k})`)); ctx.fillStyle = g; ctx.fillRect(0, 0, W, 800);

let TXF = null;

  lines(COPY.q3, t, T.q3, T.a3, { style: "blur", col: M });
  lines(COPY.a3, t, T.a3, T.q4, { style: "blur", col: D });
  lines(COPY.q4, t, T.q4, T.a4, { style: "blur", col: D });
  lines(COPY.a4, t, T.a4, T.q5, { style: "blur", col: D });
  lines(COPY.q5, t, T.q5, T.a5, { style: "blur", col: D });
  lines(COPY.a5, t, T.a5, T.a6, { style: "blur", col: D });
  lines(COPY.a6, t, T.a6, T.q6, { style: "blur", col: D });
  lines(COPY.q6, t, T.q6, T.a7, { style: "blur", col: D });

  lines(COPY.q9, t, T.q9, T.a9, { style: "blur", col: D });
  lines(COPY.a9, t, T.a9, T.q10, { style: "slam", col: D, lineGap: 0.25 });

  lines(COPY.a10, t, T.a10, T.q11, { style: "blur", col: D });
  lines(COPY.q11, t, T.q11, T.a11, { style: "blur", col: D });

  label(COPY.tipTag, 98, 176, 46, C.acc, t, T.tip, T.tipOut, { weight: 700 });
  lines(COPY.tip, t, T.tip + 0.15, T.tipOut, { style: "blur", col: L, lineGap: 0.3, ys: [300, 420, 540], size: 96 });

  if (t >= T.note && t < T.noteOut) tag(COPY.note, 96, 1405, E.p3out(prog(t, T.note, T.note + 0.3)) * (1 - prog(t, T.noteOut - 0.3, T.noteOut)), { align: "left", col: mixHex(L, D, fl), bg: fl > 0.5 ? "rgba(241,240,236,0.12)" : "rgba(20,20,20,0.07)", size: 44 });

function endCard(t) {

// ---------------------------------------------------------------- frame
function drawLight(t) {
  NOSTRETCH = false;
  ID(); ctx.fillStyle = C.ground; ctx.fillRect(0, 0, W, H);
  if (t < T.out) personScene(t, { Z: openZoom(t) });
  else if (t < T.tip + 0.45) { const fo = 1 - E.p3io(prog(t, T.tip, T.tip + 0.45)); ctx.save(); ctx.globalAlpha = fo; personScene(t, { fin: true, noPhone: t >= T.tip }); ctx.restore(); }

function frame(t) {

window.seek = function seek(t) { t = clamp(t, 0, DUR - 1e-6); ctx = MAIN; frame(t); };
window.DUR = DUR; window.FPS = FPS;
window.addEventListener("hf-seek", (e) => window.seek(e.detail.time));
window.ready = false;
window.whenReady = Promise.all([
  ...PEOPLE.map((n) => loadImg(`assets/people/${n}.webp`).then((im) => { IMG[n] = im; })), loadImg("assets/people/screen-mask.png").then((im) => { IMG.screenMask = im; }),
