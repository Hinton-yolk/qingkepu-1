"use strict";
// ============================================================================================
// EP.06 人脸解锁 — a pure function of time. window.seek(t) paints frame t.
// Two worlds, as in the series: the light one (the person, the phone) and the dark one (inside: the dot projector,
// the dots on the face, the depth map), joined by a circular opening. The face is MediaPipe's canonical face mesh
// (Apache-2.0), drawn by a small CPU rasteriser (face.js): as skin outside, as plaster / depth map / infrared photo inside.
// No timers, no rAF, no state between frames (the context is reset every frame); seeded noise only.
// ============================================================================================
const { T, COPY, W, H, DUR, FPS, S16 } = TL;
const cv = document.getElementById("c");
const MAIN = cv.getContext("2d");
let ctx = MAIN;
const LAY = document.createElement("canvas"); LAY.width = W; LAY.height = H; const LAYX = LAY.getContext("2d");   // a layer (the depth map grown from the dots)

const C = {

// ---------------------------------------------------------------- math
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));

const mixHex = (a, b, k) => { const p = hexRGB(a), q = hexRGB(b); return `rgb(${[0, 1, 2].map((i) => Math.round(lerp(p[i], q[i], k))).join(",")})`; };

const ID = () => ctx.setTransform(1, 0, 0, 1, 0, 0);

// ---------------------------------------------------------------- text (the series' caption band, as in EP.05)
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
const MEASURE = new Map();
function mw(font, s) { const k = font + "|" + s; let v = MEASURE.get(k); if (v === undefined) { ctx.font = font; v = ctx.measureText(s).width; MEASURE.set(k, v); } return v; }
function parse(str) { const out = []; let a = 0; for (const ch of str) { if (ch === "[") { a = 1; continue; } if (ch === "]") { a = 0; continue; } out.push({ ch, a }); } return out; }
const plain = (str) => str.replace(/[\[\]]/g, "");
function fitSize(str, size, maxW, face = DISPLAY, wt = "") { const f = `${wt} ${size}px ${face}`.trim(), w = mw(f, plain(str)); return w > maxW ? Math.floor(size * maxW / w) : size; }
function lines(L, t, t0, t1, o = {}) {
  if (t < t0 || t >= t1) return;
  const x = o.x ?? 96, ys = o.ys ?? (L.length === 3 ? [300, 420, 540] : [330, 472]), face = o.face ?? DISPLAY, wt = o.weight ?? "";
  const col = o.col ?? C.ink, acc = o.acc ?? C.acc, style = o.style ?? "blur";
  const stag = o.stag ?? 0.055, lineGap = o.lineGap ?? 0.16, exitDur = o.exit ?? 0.16, maxW = o.maxW ?? 900;
  ID();
  L.forEach((str, i) => {
    const size = fitSize(str, Array.isArray(o.size) ? o.size[i] : (o.size ?? (L.length === 3 ? 96 : 112)), maxW, face, wt);
    const font = `${wt} ${size}px ${face}`.trim();
    const chars = parse(str), ls = t0 + i * lineGap;
    if (t < ls) return;
    let pre = "";
    ctx.save();
    if (style === "slam") { const sc = slamScale(t - ls), cy = ys[i] - size * 0.35; ctx.translate(x, cy); ctx.scale(sc, sc); ctx.translate(-x, -cy); }
    ctx.font = font; ctx.textBaseline = "alphabetic";
    chars.forEach((c, j) => {
      const cx = x + mw(font, pre); pre += c.ch;
      const lt = t - (ls + j * stag);

      if (style === "blur") { const k = clamp(lt / 0.13); a = k; blur = 9 * (1 - k); }
      else if (style === "type") { a = lt >= 0 ? 1 : 0; }
      if (t > t1 - exitDur) { const e = clamp((t - (t1 - exitDur)) / exitDur); a *= 1 - e; blur = Math.max(blur, 10 * e); }
      if (a <= 0.003) return;

}
function label(str, x, y, size, col, t, t0, t1, o = {}) {

  const k = E.p3out(prog(t, t0, t0 + 0.28)), e = prog(t, t1 - 0.15, t1);

  ctx.fillStyle = col; ctx.fillText(str, left, y); ctx.restore(); ctx.filter = "none";
}
function underline(str, prefix, word, lineIdx, t, t0, t1, ys = [330, 472], size0 = 112) {

  const size = fitSize(str, size0, 900), f = `${size}px ${DISPLAY}`;
  const x0 = 96 + mw(f, plain(prefix)), wv = mw(f, word), k = E.p3out(prog(t, t0, t0 + 0.3)), fo = 1 - prog(t, t1 - 0.16, t1);

}
function tag(txt, x, y, a, o = {}) {                                  // a small pill (术语 / 注释 are small text, ≥ 44 px)
  if (a <= 0.01) return;

  const left = o.align === "center" ? x - (wv + 2 * pad) / 2 : o.align === "right" ? x - wv - 2 * pad : x;
  ctx.save(); ctx.globalAlpha = a;

}

// ---------------------------------------------------------------- the worlds: dark from the dive until the way out
function flood(t) { if (t < T.flood) return 0; if (t < T.floodEnd) return prog(t, T.flood, T.floodEnd); if (t < T.out) return 1; return 1 - prog(t, T.out, T.out + 0.5); }
function irisAt(t) { if (t >= 30) return [540, 1060]; const Z = openZoom(t); return [OPEN.isl[0] * Z.s + Z.tx, OPEN.isl[1] * Z.s + Z.ty]; }
function irisOf(t) {
  const fl = flood(t); if (fl <= 0.001 || fl >= 0.999) return null;
  const into = t < 30, k = into ? fl : 1 - fl;
  return { into, R: 30 + 2300 * E.p2in(k), c: irisAt(t) };
}
function irisClip(ir, inside) { const p = new Path2D(); if (!inside) p.rect(0, 0, W, H); p.arc(ir.c[0], ir.c[1], ir.R, 0, TAU); ID(); ctx.clip(p, inside ? "nonzero" : "evenodd"); }

// ---------------------------------------------------------------- the phone (screen space; upright)
function drawPhone(cx, cy, w, h, st = {}) {

  ctx.shadowColor = "rgba(0,0,0,0.25)"; ctx.shadowBlur = 40; ctx.shadowOffsetY = 18;
  rr(cx - w / 2, cy - h / 2, w, h, r); ctx.fillStyle = C.phone; ctx.fill();
  ctx.shadowColor = "transparent";

  rr(sx, sy, sw, sh, r - m); ctx.save(); ctx.clip();

  g.addColorStop(0, mixHex(C.screen, "#8FA3B8", un * 0.9)); g.addColorStop(1, mixHex("#15171A", "#D9C7B4", un * 0.85));
  ctx.fillStyle = g; ctx.fillRect(sx, sy, sw, sh);

  if (st.keys != null) phoneKeys(cx, cy, w, h, st);
  else lockIcon(cx, sy + sh * 0.2, w * 0.13, un, st.shake ?? 0, st.dim ?? 0);
  ctx.restore();

  const iw = w * 0.32, ih = w * 0.095, ix = cx - iw / 2, iy = sy + w * 0.05;
  rr(ix, iy, iw, ih, ih / 2); ctx.fillStyle = "#050506"; ctx.fill();

  ctx.restore();

}

  ctx.strokeStyle = ctx.fillStyle = `rgba(241,240,236,${0.92 - dim * 0.5})`; ctx.lineWidth = s * 0.16; ctx.lineCap = "round";
  // the shackle lifts and swings open
  const lift = un * s * 0.42;
  ctx.save(); ctx.translate(s * 0.32, -lift); ctx.rotate(-un * 0.55); ctx.translate(-s * 0.32, 0);
  ctx.beginPath(); ctx.moveTo(-s * 0.32, -s * 0.1); ctx.lineTo(-s * 0.32, -s * 0.42); ctx.arc(0, -s * 0.42, s * 0.32, Math.PI, 0); ctx.lineTo(s * 0.32, -s * 0.1); ctx.stroke();

  ctx.restore();
}

  for (let i = 0; i < n; i++) {

// fingers: rounded capsules in skin tone (a soft shade on one side)
function finger(x0, y0, x1, y1, wd) {

  ctx.save(); ctx.fillStyle = C.skinD;

  ctx.restore();

  finger(L - w * 0.08, B + h * 0.08, L + w * 0.06, cy + h * 0.2, w * 0.16);   // the thumb
}

// ---------------------------------------------------------------- the opening (and the closing): the person and the phone
const OPEN = { phone: [860, 1080, 300, 620], isl: [860, 1080 - 310 + 300 * 0.1325] };
function openZoom(t) {                               // a screen-space push towards the island (2.75–6.5)
  let s = 1;
  if (t >= T.toTop) s = lerp(1, 2.5, E.p3io(prog(t, T.toTop, T.toTopEnd)));
  if (t >= T.toTopEnd) s = lerp(2.5, 2.8, prog(t, T.toTopEnd, T.dive));
  if (t >= T.dive) s = 2.8 * Math.pow(30, E.p2in(prog(t, T.dive, T.diveEnd)));

}
const FACECAM = { eye: [12, -3.0, 58], target: [1.8, -3.4, 0], fov: 24 };
const PORT = { x: -215, y: 200, s: 1.25 };                 // the drawn profile's placement (lips near (560, 1000))
const ptXY = (q) => [PORT.x + q[0] * PORT.s, PORT.y + q[1] * PORT.s];
function personScene(t, o = {}) {                     // o.fin: the closing (makeup on, a mask, no lipstick)
  const fin = !!o.fin, Z = o.Z || { s: 1, tx: 0, ty: 0 };
  const [pcx, pcy, pw, ph] = OPEN.phone;
  const up = fin ? E.p3out(prog(t, T.out + 0.05, T.outEnd)) : E.p3out(prog(t, T.rise, T.riseEnd));
  const y = lerp(pcy + 900, pcy, up) + 6 * Math.sin(TAU * t / 3.1);
  const un = fin ? E.p3out(prog(t, T.ka, T.ka + 0.3)) : E.p3out(prog(t, T.ka0, T.ka0 + 0.3));

let LIPV = null;

// ---------------------------------------------------------------- inside: the projector and the infrared camera
function partsScene(t) {

  module(170, 0, 64, "proj", t); module(-250, 0, 58, "cam", t);
  ctx.restore();

}
// the vertices down the middle of the face, from the brow to the nose tip (for the bridge line)
const MID = (() => { const P = FR.FACE.P, out = []; for (let y = 3.6; y >= -0.6; y -= 0.15) { let bi = -1, bz = -1e9; for (let i = 0; i < FR.FACE.n; i++) if (Math.abs(P[i * 3]) < 0.12 && Math.abs(P[i * 3 + 1] - y) < 0.1 && P[i * 3 + 2] > bz) { bz = P[i * 3 + 2]; bi = i; } if (bi >= 0) out.push(bi); } return out; })();
// ---------------------------------------------------------------- the mask: only the eyes
function maskScene(t) {                             // 34–43
  const k = E.p3out(prog(t, T.q10, T.q10 + 0.5));
  if (k <= 0 || t >= T.out + 0.5) return;
  const mk = { lips: 1, blush: 1, shadow: 1, contour: 1 };
  const side = E.p3io(prog(t, T.toDepth, T.toDepthEnd));                 // the person moves left; the data comes in on the right
  const ps = lerp(0.98, 0.86, side), px = lerp(540, 330, side), py = 1030;
  const ox = px - 500 * ps, oy = py - 540 * ps;
  ID(); ctx.save(); ctx.globalAlpha = k;
  PT.draw(ctx, ox, oy, ps, { makeup: mk, mask: E.p3io(prog(t, T.mask, T.maskEnd)) });
  ctx.restore();
  // the face data: the lower half is just the mask (greyed); only the eye area is used
  const ring = E.p2io(prog(t, T.ring, T.ringEnd));
  if (side > 0.01) {
    const swing = t >= T.swing ? 14 * Math.sin(TAU * prog(t, T.swing, T.swingEnd)) : 0;
    const face = { yaw: swing + 3 * Math.sin(TAU * (t - T.q10) / 7), pitch: -3 };
    const dx = lerp(1250, 800, side), dy = 960, cw = 380, ch = 470;
    ID(); ctx.save(); ctx.globalAlpha = k; rr(dx - cw / 2, dy - ch / 2, cw, ch, 22); ctx.fillStyle = "#1E2125"; ctx.fill();
    ctx.save(); rr(dx - cw / 2, dy - ch / 2, cw, ch, 22); ctx.clip();
    FR.render({ ctx, x: dx - cw / 2, y: dy - ch / 2, w: cw, h: ch, scale: 0.5, cam: { eye: [0, -0.4, 56], target: [0, -0.4, 0], fov: 25 }, face, ...LINES, mask: 1, maskCut: 0, maskGrey: 1, eyesOnly: ring * 0.75 });
    ctx.restore();
    rr(dx - cw / 2, dy - ch / 2, cw, ch, 22); ctx.strokeStyle = "rgba(241,240,236,0.35)"; ctx.lineWidth = 3; ctx.stroke();
    // the eye area, ringed on the data card
    if (ring > 0) { ctx.globalAlpha = k * ring; ctx.strokeStyle = C.acc; ctx.lineWidth = 6; rr(dx - cw * 0.42, dy - ch * 0.3, cw * 0.84, ch * 0.3, 40); ctx.stroke(); }
    ctx.restore();
    tag(COPY.depth, dx - cw / 2 + 4, dy + ch / 2 + 40, k * side, {});
  }
  // the eye area, ringed on the person too
  if (ring > 0) {
    const e = [ox + 560 * ps, oy + 418 * ps];
    ID(); ctx.save(); ctx.globalAlpha = k * ring; ctx.strokeStyle = C.acc; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.ellipse(e[0], e[1], 120 * ps, 82 * ps, -0.1, 0, TAU); ctx.stroke(); ctx.restore();
  }
  if (t >= T.a10) tag(COPY.setting, 96, 1440 - 30, E.p3out(prog(t, T.a10 + 0.25, T.a10 + 0.55)), {});
  if (t >= T.a11 - 0.25) storedCard(t, 800, 1345, E.p3out(prog(t, T.a11 - 0.25, T.a11 + 0.1)), T.match2);
}

// ---------------------------------------------------------------- the tip: not recognised → the passcode → next time easier
function tipScene(t) {
  if (t < T.tip || t >= T.end + 0.6) return;
  const k = E.p3out(prog(t, T.tip, T.tip + 0.45));
  const s = lerp(0.8, 0.92, k), cx = 600, cy = lerp(1350, 1150, k);
  const keysN = 6 * prog(t, T.keys, T.keys + 0.75);
  const un = E.p3out(prog(t, T.open2, T.open2 + 0.3));
  const shake = t >= T.miss && t < T.miss + 0.4 ? 1 - prog(t, T.miss, T.miss + 0.4) : 0;
  const morph = E.p3io(prog(t, T.end, T.endMorph));
  ID(); ctx.save(); ctx.globalAlpha = 1 - morph;
  drawPhone(cx, cy, 420 * s, 860 * s, t < T.keys - 0.1 ? { unlock: 0, shake, dim: 0 } : t < T.open2 ? { keys: keysN } : { unlock: un });
  handOnPhone(cx, cy, 420 * s, 860 * s);
  ctx.restore();
  if (t >= T.miss && t < T.keys) label(COPY.lockMiss, cx, cy - 860 * s * 0.08, 46, C.paper, t, T.miss, T.keys, { align: "center" });
  label(COPY.tipNote, 96, 700, 44, "rgba(20,20,20,0.7)", t, T.tip + 0.6, T.tipOut);
}

// ---------------------------------------------------------------- scrim, captions, end card
function scrim(t) {
  const ir = irisOf(t);
  if (ir) { ctx.save(); irisClip(ir, false); scrimOf(t, ir.into ? 0 : 1); ctx.restore(); ctx.save(); irisClip(ir, true); scrimOf(t, ir.into ? 1 : 0); ctx.restore(); return; }
  scrimOf(t, flood(t));
}
function scrimOf(t, fl) {
  const STOPS = [[0, 1], [0.66, 1], [0.74, 0.86], [0.82, 0.56], [0.9, 0.24], [1, 0]];
  if (fl > 0.02) { ID(); const g = ctx.createLinearGradient(0, 0, 0, 800); STOPS.forEach(([o, k]) => g.addColorStop(o, `rgba(23,25,28,${fl * k})`)); ctx.fillStyle = g; ctx.fillRect(0, 0, W, 800); }
  const a = (1 - fl) * (t >= T.end ? 1 - prog(t, T.end, T.end + 0.3) : 1);
  if (a <= 0.01) return;
  ID(); const g = ctx.createLinearGradient(0, 0, 0, 800); STOPS.forEach(([o, k]) => g.addColorStop(o, `rgba(236,235,230,${a * k})`)); ctx.fillStyle = g; ctx.fillRect(0, 0, W, 800);
}
let TXF = null;
function textBand(t) {
  const fl = TXF ?? flood(t), L = C.ink, D = C.paper, M = mixHex(L, D, fl);
  lines(COPY.h1, t, -1, T.h1Out + 0.16, { style: "none", col: L });
  underline(COPY.h1[1], "为什么还", "认得", 1, t, T.underline, T.h1Out + 0.16);
  lines(COPY.a2, t, T.a2, T.q3, { style: "slam", col: L, lineGap: 0.2 });
  lines(COPY.q3, t, T.q3, T.a3, { style: "blur", col: M });
  lines(COPY.a3, t, T.a3, T.q4, { style: "blur", col: D });
  lines(COPY.q4, t, T.q4, T.a4, { style: "blur", col: D });
  lines(COPY.a4, t, T.a4, T.q5, { style: "blur", col: D });
  lines(COPY.q5, t, T.q5, T.a5, { style: "blur", col: D });
  lines(COPY.a5, t, T.a5, T.a6, { style: "blur", col: D });
  lines(COPY.a6, t, T.a6, T.q6, { style: "blur", col: D });
  lines(COPY.q6, t, T.q6, T.a7, { style: "blur", col: D });
  lines(COPY.a7, t, T.a7, T.q8, { style: "slam", col: D, lineGap: 0.25 });
  lines(COPY.q8, t, T.q8, T.a8, { style: "blur", col: D });
  lines(COPY.a8, t, T.a8, T.q9, { style: "blur", col: D });
  lines(COPY.q9, t, T.q9, T.a9, { style: "blur", col: D });
  lines(COPY.a9, t, T.a9, T.q10, { style: "slam", col: D, lineGap: 0.25 });
  lines(COPY.q10, t, T.q10, T.a10, { style: "blur", col: D });
  lines(COPY.a10, t, T.a10, T.q11, { style: "blur", col: D });
  lines(COPY.q11, t, T.q11, T.a11, { style: "blur", col: D });
  lines(COPY.a11, t, T.a11, T.fin, { style: "blur", col: D });
  lines(COPY.fin, t, T.fin, T.finOut, { style: "slam", col: M, lineGap: 0.25 });
  label(COPY.tipTag, 98, 176, 46, C.acc, t, T.tip, T.tipOut, { weight: 700 });
  lines(COPY.tip, t, T.tip + 0.15, T.tipOut, { style: "blur", col: L, lineGap: 0.3, ys: [300, 420, 540], size: 96 });
  // 以 iPhone 面容 ID 为例 (a corner note while the measuring is introduced)
  if (t >= T.note && t < T.noteOut) tag(COPY.note, 96, 1420, E.p3out(prog(t, T.note, T.note + 0.3)) * (1 - prog(t, T.noteOut - 0.3, T.noteOut)), { align: "left", col: mixHex(L, D, fl), bg: fl > 0.5 ? "rgba(241,240,236,0.12)" : "rgba(20,20,20,0.07)", size: 44 });
}
function endCard(t) {
  if (t < T.end) return;
  // the phone shrinks into an outline badge
  const m = E.p3io(prog(t, T.end, T.endMorph)), bx = lerp(540, 232, m), by = lerp(1060, 560, m), s = lerp(1, 0.32, m);
  ID(); ctx.save(); ctx.translate(bx, by); ctx.scale(s, s);
  ctx.globalAlpha = m; rr(-210, -430, 420, 860, 68); ctx.lineWidth = 14 / Math.max(s, 0.32); ctx.strokeStyle = C.ink; ctx.stroke();
  rr(-68, -398, 136, 40, 20); ctx.fillStyle = C.ink; ctx.fill();
  ctx.restore();
  lines(COPY.end, t, T.title1, DUR + 1, { style: "type", col: C.ink, ys: [905, 1045, 1185], size: 124, stag: 0.045, lineGap: 0.3 });
  lines([COPY.epNum], t, T.ep, DUR + 1, { style: "slam", col: C.ink, x: 400, ys: [520], size: 150 });
  lines([COPY.epName], t, T.ep + 0.25, DUR + 1, { style: "blur", col: C.ink, x: 404, ys: [668], size: 112 });
  if (t >= T.sting) {
    const sc = spring(t - T.sting, 16, 0.5);
    ID(); ctx.save(); ctx.translate(232, 560); ctx.scale(sc, sc); ctx.font = `200px ${DISPLAY}`; ctx.fillStyle = C.acc; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("?", 6, 0); ctx.restore();
  }
}

// ---------------------------------------------------------------- frame
function drawLight(t) {
  ID(); ctx.fillStyle = C.ground; ctx.fillRect(0, 0, W, H);
  if (t < T.out) personScene(t, { Z: openZoom(t) });
  else if (t < T.tip + 0.45) { const fo = 1 - E.p3io(prog(t, T.tip, T.tip + 0.45)); ctx.save(); ctx.globalAlpha = fo; personScene(t, { fin: true }); ctx.restore(); }
  tipScene(t);
}
function drawDark(t) {
  ID(); ctx.fillStyle = C.dark; ctx.fillRect(0, 0, W, H);
  if (t < T.a3 + 1.0) partsScene(t);
  if (t >= T.a3 && t < T.topEnd + 0.1) dotsScene(t);
  if (t >= T.top && t < T.backEnd + 0.1) topScene(t);
  if (t >= T.back && t < T.q8 + 0.7) depthScene(t);
  if (t >= T.q8 && t < T.q10 + 0.6) makeupScene(t);
  if (t >= T.q10) maskScene(t);
}
function frame(t) {
  ctx.reset(); ID();
  const fl = flood(t), ir = irisOf(t);
  if (ir) {
    if (ir.into) { drawLight(t); ctx.save(); irisClip(ir, true); drawDark(t); ctx.restore(); }
    else { drawDark(t); ctx.save(); irisClip(ir, true); drawLight(t); ctx.restore(); }
  } else if (fl > 0.5) drawDark(t); else drawLight(t);
  scrim(t);
  if (ir) { const nw = ir.into ? 1 : 0; ctx.save(); irisClip(ir, false); TXF = 1 - nw; textBand(t); ctx.restore(); ctx.save(); irisClip(ir, true); TXF = nw; textBand(t); ctx.restore(); TXF = null; }
  else textBand(t);
  endCard(t);
}
window.seek = function seek(t) { t = clamp(t, 0, DUR - 1e-6); ctx = MAIN; frame(t); };
window.DUR = DUR; window.FPS = FPS;
window.addEventListener("hf-seek", (e) => window.seek(e.detail.time));
window.ready = false;
LIPV = { r: FR.nearest(-2.1, -4.7), c: FR.nearest(0.2, -4.95) };
window.whenReady = Promise.all([
  document.fonts.load(`100px ${DISPLAY}`, "化了妆手机为什么还认得你"), document.fonts.load(`700 50px ${UI}`, "点阵投影器红外镜头"), document.fonts.load(`400 50px ${UI}`, "示意"),
]).then(() => document.fonts.ready).then(() => { MEASURE.clear(); window.seek(0); window.ready = true; });
</script>
