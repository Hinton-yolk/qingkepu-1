<!doctype html>

<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="51.75" data-width="1080" data-height="1920">
  <canvas id="c" width="1080" height="1920"></canvas>
</div>
<script src="timeline.js"></script>
<script>
"use strict";
// ============================================================================================
// EP.04 触摸屏 — a pure function of time. window.seek(t) paints frame t.
// One continuous space: a phone (world units: millimetres, y down the screen, z up out of the glass). One orthographic
// camera with a pitch: flat-on (θ = 0) for the call, tilted for the inside of the screen and for the sausage / touch glove.
// The phone → the touch point → one take through the cover glass (dark: the electrode grid, field arcs, a finger in
// section, a glove) → back out to the tilted phone (a sausage, a touch glove) → flat again for the same call → end badge.
// No timers, no rAF, no CSS transitions, no state between frames (the context is reset every frame); seeded noise only.
// ============================================================================================
const { T, COPY, W, H, DUR, FPS, S16, ROWS, ringing, buzzK, stealK, scanRow } = TL;
const cv = document.getElementById("c");
const MAIN = cv.getContext("2d");
const OFF = document.createElement("canvas"); OFF.width = W; OFF.height = H;
const OFFX = OFF.getContext("2d");
let ctx = MAIN;

const C = {
  ground: "#ECEBE6", ink: "#141414", acc: "#FF4A1C", paper: "#F1F0EC", dark: "#17191C",
  body: "#1C1D20", bodyEdge: "#4A4D52", side: "#111214", glass: "#0E0F11",
  knit: "#5B6B7F", knitD: "#45536A", knitL: "#8C9BAD", silver: "#BCC3CA", silverL: "#F4F6F8", silverD: "#7B838C",
  skin: "#EBCBA5", skinD: "#D6AD84", nail: "#F3DCCB", sleeve: "#3B3431", sleeveD: "#2A2421",
  flesh: "#D6AD84", skinS: "#EBCBA5", bone: "#F6F0E6",
  saus: "#C88F7C", sausD: "#9C6656", sausL: "#E6BBAA",
};
const DISPLAY = "Smiley", UI = "NotoSC";

// ---------------------------------------------------------------- math
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const TAU = Math.PI * 2, RAD = Math.PI / 180;
const E = {
  sine: (x) => 0.5 - 0.5 * Math.cos(Math.PI * x),
  p2io: (x) => (x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2),
  p3io: (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
  p2in: (x) => x * x, p3in: (x) => x * x * x,
  p2out: (x) => 1 - (1 - x) * (1 - x), p3out: (x) => 1 - Math.pow(1 - x, 3), p4out: (x) => 1 - Math.pow(1 - x, 4),
  smooth: (x) => x * x * (3 - 2 * x),
};
function spring(x, w = 15, z = 0.72) {
  if (x <= 0) return 0;
  if (z >= 1) return 1 - Math.exp(-w * x) * (1 + w * x);
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * x) * (Math.cos(wd * x) + ((z * w) / wd) * Math.sin(wd * x));
}
function slamScale(u) {                              // 0.17 s: 1.55 -> 0.94 -> 1.0
  if (u <= 0) return 1.55;
  if (u < 0.09) return lerp(1.55, 0.94, E.p2in(u / 0.09));
  if (u < 0.17) return lerp(0.94, 1.0, E.p3out((u - 0.09) / 0.08));
  return 1;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const hexRGB = (h) => [0, 1, 2].map((i) => parseInt(h.slice(1 + 2 * i, 3 + 2 * i), 16));
const mixHex = (a, b, k) => { const p = hexRGB(a), q = hexRGB(b); return `rgb(${[0, 1, 2].map((i) => Math.round(lerp(p[i], q[i], k))).join(",")})`; };
const ACC = hexRGB("#FF4A1C").join(","), PAP = "241,240,236";
// piecewise keyframes: [[t, v], ...] with an easing per segment (default p2io)
function kf(t, K, ease = E.p2io) {
  if (t <= K[0][0]) return K[0][1];
  for (let i = 1; i < K.length; i++) if (t < K[i][0]) { const [t0, v0] = K[i - 1], [t1, v1, e] = K[i]; return lerp(v0, v1, (e || ease)(prog(t, t0, t1))); }
  return K[K.length - 1][1];
}

// ---------------------------------------------------------------- camera: orthographic, pitch θ about the line y = piv
// screen = A·(x, piv + (y − piv)·cosθ − z·sinθ) + B. θ = 0 is the flat similarity camera of the earlier episodes.
const S0 = 5;                                          // px per mm at Z = 1
const P = [-21.5, 58];                                 // the 接听 knob = the touch point; the sensor lattice is P + 5k
const PITCH = 5, G = 1.2;                              // electrode pitch, cover glass thickness (mm, drawn)
function key(F, anchor, Z, thDeg = 0, piv = P[1]) {
  const A = Z * S0, th = thDeg * RAD, c = Math.cos(th), s = Math.sin(th), fz = F[2] || 0;
  const py = piv + (F[1] - piv) * c - fz * s;
  return { A, B: [anchor[0] - A * F[0], anchor[1] - A * py], Z, th, piv };
}
function interp(k0, k1, u, uth = u) {
  const lr = Math.log(k1.A / k0.A), kk = Math.exp(lr), ku = Math.exp(lr * u);
  let B;
  if (Math.abs(1 - kk) < 1e-9) B = [lerp(k0.B[0], k1.B[0], u), lerp(k0.B[1], k1.B[1], u)];
  else { const c0 = k1.B[0] - kk * k0.B[0], c1 = k1.B[1] - kk * k0.B[1], w0 = c0 / (1 - kk), w1 = c1 / (1 - kk); B = [ku * (k0.B[0] - w0) + w0, ku * (k0.B[1] - w1) + w1]; }
  return { A: k0.A * ku, B, Z: k0.Z * ku, th: lerp(k0.th, k1.th, uth), piv: lerp(k0.piv, k1.piv, u) };
}
function proj(K, x, y, z = 0) { const c = Math.cos(K.th), s = Math.sin(K.th); return [K.A * x + K.B[0], K.A * (K.piv + (y - K.piv) * c - z * s) + K.B[1]]; }
function planeT(K, z0 = 0, o = [0, 0], sc = 1) {            // the plane z = z0 (optionally translated to o, scaled)
  const c = Math.cos(K.th), s = Math.sin(K.th), q = proj(K, o[0], o[1], z0);
  ctx.setTransform(K.A * sc, 0, 0, K.A * c * sc, q[0], q[1]);
}
function vplaneT(K, y0) { const c = Math.cos(K.th), s = Math.sin(K.th); ctx.setTransform(K.A, 0, 0, -K.A * s, K.B[0], K.B[1] + K.A * (K.piv + (y0 - K.piv) * c)); }
const ID = () => ctx.setTransform(1, 0, 0, 1, 0, 0);
function strokePx(w, col) { ID(); ctx.lineWidth = w; if (col) ctx.strokeStyle = col; ctx.stroke(); }   // uniform screen-px strokes

// keys (phone centre = origin)
const KO0 = key([0, 0], [540, 1000], 1.12);                    // the call: the phone and the gloved hand, slow push from frame 0
const KO1 = key([-3, 6], [540, 1004], 1.22);
const KM = key([-8, 32], [540, 1080], 1.75);                   // the guess: the knob and the glove
const KMz = key([-9, 34], [540, 1085], 1.86);
const KQ = key(P, [540, 1150], 3.6);                           // push in on the touch point
const KD = key(P, [540, 1150], 6.0);                           // through the glass (flat)
const TH = 50;                                                  // the pitch inside the screen (the net)
const KSIDE = key([P[0] + 1.5, P[1], 0.5], [540, 1150], 12.4, 90);   // the side cut along the touched row, close on the touch
const KSIDE2 = key([P[0] - 0.8, P[1], 0.5], [540, 1155], 13.2, 90);
const KSIDE3 = key([P[0] - 1.4, P[1], 0.6], [540, 1160], 14.0, 90);
const KTOP = key([P[0] + 4, P[1] + 3], [540, 1080], 6.4, 0);    // straight down: the scan (the only view from above)
const KTOP2 = key([P[0] + 1, P[1] + 1.5], [560, 1095], 7.6, 0);
const KTOP3 = key([P[0] - 1, P[1] + 0.5], [580, 1110], 8.6, 0);
const KTOPT = key([P[0] + 2, P[1] + 2], [520, 1100], 6.4, 0);
const KT = key(P, [500, 1175], 6.2, TH);                        // tilted: the grid, the arcs
const KF = key(P, [560, 1330], 8.4, TH);                        // the finger
const KG = key(P, [560, 1330], 8.5, TH);                        // the glove
const KG2 = key([P[0] - 1.2, P[1]], [560, 1345], 9.7, TH);
const S = [P[0] + 25, P[1] - 45];                               // the sausage's touch point (a crossing)
const TL2 = 45;                                                 // the pitch in the light world
const KS = key([0, 0], [540, 1030], 1.45, TL2);                 // back out: the tilted phone, screen off
const KSz = key([S[0], S[1]], [520, 1120], 3.0, TL2);           // closer on the sausage's tip
const KS2 = key([0, -2], [540, 1040], 1.5, TL2);                // the screen lit, the label
const KTG = key(P, [470, 1120], 3.0, 0);                        // the touch glove, close (flat again)
const KTG2 = key([P[0] + 1, P[1] - 1], [480, 1110], 3.55, 0);
const KC = key([0, 2], [540, 1010], 1.05);                      // the same call again
const KC2 = key([0, 8], [540, 1036], 1.42);
const KTip = key([2, 8], [540, 1040], 1.55);                    // the tip: the settings page
const KTip2 = key([8, 10], [540, 1040], 2.15);
const K7 = key([0, 0], [232, 545], 0.47);                       // the end badge
// holds drift at a constant speed (no eased stops: the picture never parks), moves ease in and out
const lin = (x) => x;
const KT3 = key([P[0] - 3, P[1]], [520, 1185], 6.9, TH);
const KF3 = key([P[0] - 1, P[1] - 1], [560, 1340], 9.2, TH);
const KF4 = key([P[0] - 1.6, P[1] - 1], [560, 1345], 9.55, TH);
const KS3 = key([0, -4], [540, 1062], 1.64, TL2);
function punch(K, pk, c = [540, 1100]) { return { ...K, A: K.A * pk, Z: K.Z * pk, B: [c[0] + pk * (K.B[0] - c[0]), c[1] + pk * (K.B[1] - c[1])] }; }
function cam(t) {
  if (t < T.myth) return interp(KO0, KO1, lin(prog(t, 0, T.myth)));
  if (t < T.push1End) return interp(KO1, KM, E.p3io(prog(t, T.push1, T.push1End)));
  if (t < T.q3) return interp(KM, KMz, lin(prog(t, T.push1End, T.q3)));
  if (t < T.dive) return interp(KMz, KQ, E.p2in(prog(t, T.q3, T.dive)) * 0.6 + 0.4 * prog(t, T.q3, T.dive));
  if (t < T.tilt) return interp(KQ, KD, prog(t, T.dive, T.tilt));                       // a constant push through the glass
  if (t < T.tiltEnd) return interp(KD, KT, E.p2out(prog(t, T.tilt, T.tiltEnd)), E.p2io(prog(t, T.tilt, T.tiltEnd)));
  if (t < T.q4) return interp(KT, KT3, lin(prog(t, T.tiltEnd, T.q4)));
  if (t < T.q4 + 0.75) return interp(KT3, KSIDE, E.p2io(prog(t, T.q4, T.q4 + 0.75)));    // down to the side cut
  if (t < T.a5) return interp(KSIDE, KSIDE2, lin(prog(t, T.q4 + 0.75, T.a5)));
  if (t < T.scan1) return interp(KSIDE2, KTOP, E.p2io(prog(t, T.a5, T.scan1)));          // up, to look straight down
  if (t < T.name) return interp(KTOP, KTOP2, lin(prog(t, T.scan1, T.name)));
  if (t < T.q6) { const pk = 1 + 0.06 * Math.sin(Math.PI * clamp((t - T.name) / 0.45)); return punch(interp(KTOP2, KTOP3, lin(prog(t, T.name, T.q6))), pk); }   // a punch on the name
  if (t < T.q6 + 0.75) return interp(KTOP3, KSIDE, E.p2io(prog(t, T.q6, T.q6 + 0.75)));   // back down to the same side cut, and stay
  if (t < T.climb) return interp(KSIDE, KSIDE3, lin(prog(t, T.q6 + 0.75, T.climb)));
  if (t < T.climbEnd) return interp(KSIDE3, KS, E.p3out(prog(t, T.climb, T.climbEnd)), E.p2io(prog(t, T.climb, T.climbEnd)));
  if (t < T.saus - 0.25) return KS;
  if (t < T.wake) return interp(KS, KSz, E.p3io(prog(t, T.saus - 0.25, T.wake)));
  if (t < T.wake + 1.0) return interp(KSz, KS2, E.p3io(prog(t, T.wake, T.wake + 1.0)));
  if (t < T.tgIn - 0.25) return interp(KS2, KS3, lin(prog(t, T.wake + 1.0, T.tgIn - 0.25)));
  if (t < T.dive2) return interp(KS3, KTG, E.p3io(prog(t, T.tgIn - 0.25, T.dive2)), E.p2io(prog(t, T.tgIn - 0.25, T.tg + 0.1)));
  if (t < T.side2) return interp(KTG, KSIDE, E.p2in(prog(t, T.dive2, T.side2)) * 0.5 + 0.5 * prog(t, T.dive2, T.side2), E.p2io(prog(t, T.dive2, T.side2)));   // into the fingertip, down to the side cut
  if (t < T.climb2) return interp(KSIDE, KSIDE2, lin(prog(t, T.side2, T.climb2)));
  if (t < T.climb2End) return interp(KSIDE2, KC, E.p3io(prog(t, T.climb2, T.climb2End)), E.p2out(prog(t, T.climb2, T.climb2 + 0.5)));
  if (t < T.tip) return interp(KC, KC2, lin(prog(t, T.climb2End, T.tip)));
  if (t < T.tip + 0.75) return interp(KC2, KTip, E.p3io(prog(t, T.tip, T.tip + 0.75)));
  if (t < T.end) return interp(KTip, KTip2, lin(prog(t, T.tip + 0.75, T.end)));
  return interp(KTip2, K7, E.p3io(prog(t, T.end, T.endMorph)));
}

// ---------------------------------------------------------------- drawing helpers
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function line(x0, y0, x1, y1) { ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); }
const MEASURE = new Map();
function mw(font, s) { const k = font + "|" + s; let v = MEASURE.get(k); if (v === undefined) { ctx.font = font; v = ctx.measureText(s).width; MEASURE.set(k, v); } return v; }
function parse(str) { const out = []; let a = 0; for (const ch of str) { if (ch === "[") { a = 1; continue; } if (ch === "]") { a = 0; continue; } out.push({ ch, a }); } return out; }
const plain = (str) => str.replace(/[\[\]]/g, "");
function fitSize(str, size, maxW, face = DISPLAY, wt = "") { const f = `${wt} ${size}px ${face}`.trim(), w = mw(f, plain(str)); return w > maxW ? Math.floor(size * maxW / w) : size; }
// text in world units (mm) on the current transform: drawn at 10× size and scaled down (crisp at any zoom)
function uiText(str, x, y, sizeMM, col, o = {}) {
  ctx.save(); ctx.translate(x, y); ctx.scale(0.1, 0.1);
  ctx.font = `${o.weight ?? 700} ${sizeMM * 10}px ${o.face ?? UI}`; ctx.fillStyle = col; ctx.textAlign = o.align ?? "center"; ctx.textBaseline = o.base ?? "alphabetic";
  ctx.fillText(str, 0, 0); ctx.restore();
}

// Text band: style none | blur | type | slam | wipe; left aligned at x.
function lines(L, t, t0, t1, o = {}) {
  if (t < t0 || t >= t1) return;
  const x = o.x ?? 96, ys = o.ys ?? [330, 472], face = o.face ?? DISPLAY, wt = o.weight ?? "";
  const col = o.col ?? C.ink, acc = o.acc ?? C.acc, style = o.style ?? "blur";
  const stag = o.stag ?? 0.055, lineGap = o.lineGap ?? 0.16, exitDur = o.exit ?? 0.16, maxW = o.maxW ?? 900;
  ID();
  L.forEach((str, i) => {
    const size = fitSize(str, Array.isArray(o.size) ? o.size[i] : (o.size ?? 112), maxW, face, wt);
    const font = `${wt} ${size}px ${face}`.trim();
    const chars = parse(str), ls = t0 + i * lineGap;
    if (t < ls) return;
    let pre = "";
    ctx.save();
    if (style === "slam") { const sc = slamScale(t - ls), cy = ys[i] - size * 0.35; ctx.translate(x, cy); ctx.scale(sc, sc); ctx.translate(-x, -cy); }
    if (style === "wipe") { const wv = mw(font, plain(str)); ctx.beginPath(); ctx.rect(0, ys[i] - size * 1.2, x + wv * E.p3out(prog(t, ls, ls + 0.32)) + 4, size * 1.6); ctx.clip(); }
    ctx.font = font; ctx.textBaseline = "alphabetic";
    chars.forEach((c, j) => {
      const cx = x + mw(font, pre); pre += c.ch;
      const lt = t - (ls + j * stag);
      let a = 1, blur = 0;
      if (style === "blur") { const k = clamp(lt / 0.13); a = k; blur = 9 * (1 - k); }
      else if (style === "type") { a = lt >= 0 ? 1 : 0; }
      if (t > t1 - exitDur) { const e = clamp((t - (t1 - exitDur)) / exitDur); a *= 1 - e; blur = Math.max(blur, 10 * e); }
      if (a <= 0.003) return;
      ctx.globalAlpha = a; ctx.filter = blur > 0.3 ? `blur(${blur.toFixed(1)}px)` : "none";
      ctx.fillStyle = c.a ? acc : col; ctx.fillText(c.ch, cx, ys[i]);
    });
    ctx.restore(); ctx.filter = "none"; ctx.globalAlpha = 1;
  });
}
function label(str, x, y, size, col, t, t0, t1, o = {}) {
  if (t < t0 || t >= t1) return;
  ID(); const font = `${o.weight ?? 700} ${size}px ${o.face ?? UI}`; const wv = mw(font, str);
  const k = E.p3out(prog(t, t0, t0 + 0.28)), e = prog(t, t1 - 0.15, t1);
  ctx.save(); ctx.font = font; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  const left = o.align === "right" ? x - wv : o.align === "center" ? x - wv / 2 : x;
  ctx.beginPath(); ctx.rect(left - 4, y - size * 1.2, (wv + 8) * k, size * 1.6); ctx.clip();
  ctx.globalAlpha = (o.alpha ?? 1) * (1 - e); if (e > 0) ctx.filter = `blur(${(8 * e).toFixed(1)}px)`;
  ctx.fillStyle = col; ctx.fillText(str, left, y); ctx.restore(); ctx.filter = "none";
}
function underline(str, prefix, word, lineIdx, t, t0, t1, ys = [330, 472], size0 = 112) {
  if (t < t0 || t >= t1) return;
  const size = fitSize(str, size0, 900), f = `${size}px ${DISPLAY}`;
  const x0 = 96 + mw(f, prefix), wv = mw(f, word), k = E.p3out(prog(t, t0, t0 + 0.3)), fo = 1 - prog(t, t1 - 0.16, t1);
  ID(); ctx.globalAlpha = fo; ctx.fillStyle = C.acc; ctx.fillRect(x0 - 4, ys[lineIdx] + 20, (wv + 8) * k, 11); ctx.globalAlpha = 1;
}

// ---------------------------------------------------------------- icons (unit size, drawn on the current transform)
function handsetPath(x, y, r, rot) {                    // a phone receiver, as a filled shape
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(r, r);
  ctx.beginPath();
  ctx.moveTo(-0.95, -0.28); ctx.bezierCurveTo(-0.95, -0.62, -0.5, -0.66, 0, -0.66); ctx.bezierCurveTo(0.5, -0.66, 0.95, -0.62, 0.95, -0.28);
  ctx.lineTo(0.95, -0.08); ctx.quadraticCurveTo(0.95, 0.04, 0.82, 0.04); ctx.lineTo(0.5, 0.04); ctx.quadraticCurveTo(0.38, 0.04, 0.38, -0.08);
  ctx.lineTo(0.38, -0.2); ctx.quadraticCurveTo(0, -0.3, -0.38, -0.2); ctx.lineTo(-0.38, -0.08); ctx.quadraticCurveTo(-0.38, 0.04, -0.5, 0.04);
  ctx.lineTo(-0.82, 0.04); ctx.quadraticCurveTo(-0.95, 0.04, -0.95, -0.08); ctx.closePath();
  ctx.restore();
}
function personIcon(x, y, r, bg, fg) {
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
  ctx.clip();
  ctx.fillStyle = fg; ctx.beginPath(); ctx.arc(0, -0.2 * r, 0.33 * r, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(0, 0.72 * r, 0.62 * r, 0.46 * r, 0, 0, TAU); ctx.fill();
  ctx.restore();
}

// ---------------------------------------------------------------- the phone's screens (phone coordinates, mm)
const SCR = { x0: -33.5, y0: -75.5, w: 67, h: 151, r: 8 };
const TRACK = { x0: -27, x1: 27, y: P[1], r: 6 };
const KNOB0 = P[0], KNOB1 = -P[0];
function knobX(t) {
  if (t < T.graze) return KNOB0;
  if (t < T.grazeEnd) return clamp(handTip(t, "bare")[0], KNOB0, KNOB1);
  if (t < T.ring2) { const x1 = clamp(handTip(T.grazeEnd - 1e-4, "bare")[0], KNOB0, KNOB1); return lerp(x1, KNOB0, spring(t - T.grazeEnd, 16, 0.75)); }
  if (t < T.sw3) return KNOB0;
  return clamp(handTip(Math.min(t, T.ka), "touch")[0], KNOB0, KNOB1);

  if (t >= T.sLock) { vplaneT(KI, S[1]); const k = E.p3out(prog(t, T.sLock, T.sLock + 0.3)); ctx.beginPath(); ctx.arc(S[0], ZRX - 0.8, 2.2 + 0.8 * (1 - k), -Math.PI / 2, -Math.PI / 2 + TAU * k); ctx.save(); ID(); ctx.lineWidth = 6; ctx.strokeStyle = C.acc; ctx.lineCap = "round"; ctx.stroke(); ctx.restore(); }
  ctx.restore();
  ID(); ctx.lineWidth = 10; ctx.strokeStyle = C.ink; ctx.beginPath(); ctx.arc(C0[0], C0[1], R, 0, TAU); ctx.stroke();
  ctx.restore();
}

// ---------------------------------------------------------------- the light-world x-ray: under a touch, the grid and the arcs
function xray(t, K, at, R, open, bend, obj, t0lock, t1lock, flat = false) {
  if (open <= 0.005) return;
  const Rr = R * E.p3out(open);
  ctx.save(); planeT(K, G); ctx.beginPath(); ctx.arc(at[0], at[1], Rr, 0, TAU); ctx.clip();
  ctx.fillStyle = "rgba(23,25,28,0.95)"; ctx.fillRect(at[0] - R, at[1] - R, 2 * R, 2 * R);
  for (let k = -4; k <= 4; k++) {
    planeT(K, G); ctx.beginPath(); ctx.moveTo(at[0] - R, at[1] + k * PITCH); ctx.lineTo(at[0] + R, at[1] + k * PITCH); strokePx(1.6, `rgba(${PAP},0.32)`);
    planeT(K, G); ctx.beginPath(); ctx.moveTo(at[0] + k * PITCH, at[1] - R); ctx.lineTo(at[0] + k * PITCH, at[1] + R); strokePx(1.6, `rgba(${PAP},0.4)`);
  }
  for (let i = -2; i <= 2; i++) for (let j = -2; j <= 2; j++) {
    const b = 1 - 0.85 * wAt(i * PITCH, j * PITCH) * bend; planeT(K, G, [at[0] + i * PITCH, at[1] + j * PITCH]);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 1.8); g.addColorStop(0, `rgba(${PAP},${0.8 * b})`); g.addColorStop(1, `rgba(${PAP},0)`); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 1.8, 0, TAU); ctx.fill();
  }
  ctx.restore();
  planeT(K, G); ctx.beginPath(); ctx.arc(at[0], at[1], Rr, 0, TAU); strokePx(2.5, `rgba(23,25,28,0.9)`);
  if (flat) {                                                      // seen from above: the field lines run in to the fingertip
    for (let j = -2; j <= 2; j++) for (let i = -2; i <= 2; i++) {
      if (!i && !j) continue; const d = Math.hypot(i, j) * PITCH; if (d > R * E.p3out(open) - 1) continue;
      const w = clamp(bend * (1.4 - d / 12)); if (w <= 0.01) continue;
      const a = [at[0] + i * PITCH, at[1] + j * PITCH], m = [lerp(a[0], at[0], 0.5) + j * 0.9, lerp(a[1], at[1], 0.5) - i * 0.9];
      planeT(K, G); ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.quadraticCurveTo(m[0], m[1], at[0], at[1]); strokePx(3, `rgba(${ACC},${0.85 * w})`);
      const u = (t * 1.1 + HASH(i, j, 0)) % 1, x = (1 - u) * (1 - u) * a[0] + 2 * (1 - u) * u * m[0] + u * u * at[0], y = (1 - u) * (1 - u) * a[1] + 2 * (1 - u) * u * m[1] + u * u * at[1];
      const q = proj(K, x, y, G); ID(); ctx.fillStyle = `rgba(${ACC},${w})`; ctx.beginPath(); ctx.arc(q[0], q[1], 5, 0, TAU); ctx.fill();
    }
    return;
  }
  // arcs, scaled up so they can be seen at this distance, bending into the object above
  const HS = 2.4;
  for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) {
    const xc = at[0] + i * PITCH, y = at[1] + j * PITCH, w = wAt(i * PITCH, j * PITCH);
    if (Math.hypot(i * PITCH, j * PITCH) > Rr - 1) continue;
    ARC.forEach(([hw, hh], k) => {
      const bk = clamp(w * bend * [0.3, 0.8, 1][k] * 1.3), Q = [at[0] + i * 1.2, at[1] + j * 1.2, G + obj];
      const ptAt = (u) => { const ph = Math.PI * u; let p = [xc - hw * Math.cos(ph), y, G + HS * hh * Math.sin(ph)];
        if (bk > 0) { const m = 1 - u, b0 = [xc - hw, y, G], b1 = [xc - hw, y, G + HS * hh * 1.3], b2 = [Q[0], Q[1], Q[2] - 1.5], b3 = Q; const bz = [0, 1, 2].map((d) => m * m * m * b0[d] + 3 * m * m * u * b1[d] + 3 * m * u * u * b2[d] + u * u * u * b3[d]); p = p.map((v, d) => lerp(v, bz[d], bk)); }
        return p; };
      ctx.beginPath(); for (let n = 0; n <= 14; n++) { const q = proj(K, ...ptAt(n / 14)); n ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]); }
      ID(); ctx.lineWidth = bk > 0.3 ? 3.2 : 2.2; ctx.strokeStyle = bk > 0.3 ? `rgba(${ACC},${(0.6 + 0.4 * bk) * E.p3out(open)})` : `rgba(${PAP},${0.5 * E.p3out(open)})`; ctx.stroke();
      const u = (t * 0.9 + HASH(i, j, k)) % 1, q = proj(K, ...ptAt(u));
      ctx.fillStyle = bk > 0.3 ? `rgba(${ACC},${E.p3out(open)})` : `rgba(${PAP},${0.8 * E.p3out(open)})`; ctx.beginPath(); ctx.arc(q[0], q[1], 3.6, 0, TAU); ctx.fill();
    });
  }
  // the lock
  if (!flat && t >= t0lock && t < t1lock) { const k = E.p3out(prog(t, t0lock, t0lock + 0.3)), fo = 1 - prog(t, t1lock - 0.25, t1lock);
    planeT(K, G, at); ctx.beginPath(); ctx.arc(0, 0, 3.4 + 1.5 * (1 - k), -Math.PI / 2, -Math.PI / 2 + TAU * k); ctx.save(); ID(); ctx.globalAlpha *= fo; ctx.lineWidth = 7; ctx.strokeStyle = C.acc; ctx.lineCap = "round"; ctx.stroke(); ctx.restore(); }
}

// ---------------------------------------------------------------- states
const orangeK = (t) => E.p2io(prog(t, T.myth, T.myth + 0.3)) * (1 - E.p2io(prog(t, T.unOrange, T.unOrange + 0.3)));
function groundCol(t) { const o = orangeK(t); return o > 0 ? mixHex(C.ground, C.acc, o) : C.ground; }
function flood(t) {
  if (t >= T.dive2) return E.p2io(prog(t, T.dive2 + 0.12, T.dive2 + 0.4)) * (1 - E.p2io(prog(t, T.climb2 + 0.3, T.climb2 + 0.55)));
  if (t < T.flood) return 0;
  if (t < T.floodEnd) return E.p2io(prog(t, T.flood, T.floodEnd));
  if (t < T.unflood) return 1;
  return 1 - E.p2io(prog(t, T.unflood, T.unflood + 0.25));
}
function drawLight(t, K) {
  const endFade = t >= T.end ? E.p2io(prog(t, T.end, T.endMorph)) : 0;
  ID(); ctx.fillStyle = groundCol(t); ctx.fillRect(0, 0, W, H);
  drawPhone(t, K, endFade);
  if (endFade > 0) {                                                 // the badge: the phone as an outline
    ctx.save(); ctx.globalAlpha = endFade; planeT(K, G); rr(-36, -78, 72, 156, 10); strokePx(9, C.ink);
    planeT(K, G); ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(0, -68, 2.6, 0, TAU); ctx.fill(); ctx.restore();
  }
  // x-ray under a touch (the sausage, tilted; the touch glove, flat), then the object itself
  if (t >= T.climb && t < T.climb2 + 0.6) {
    drawSausage(t, K);
  }
  if (Math.sin(K.th) < 0.5) drawHands(t, K);

  // the guess is struck: a big ✕ across the press (ink, with a paper edge so it reads on the dark glass and the orange)
  if (t >= T.strike && t < T.unOrange + 0.3) {
    const c = proj(K, P[0] + 6, P[1] - 4, G), fo = 1 - prog(t, T.a2 + 0.25, T.a2 + 0.55);
    const k1 = E.p3out(prog(t, T.strike, T.strike + 0.1)), k2 = E.p3out(prog(t, T.strike + 0.125, T.strike + 0.225)), R = 230;
    ID(); ctx.save(); ctx.globalAlpha = fo; ctx.lineCap = "round"; ctx.translate(c[0], c[1]); ctx.rotate(16 * RAD); ctx.translate(-c[0], -c[1]);
    [[C.paper, 40], [C.ink, 26]].forEach(([col, w]) => { ctx.strokeStyle = col; ctx.lineWidth = w;
      line(c[0] - R, c[1] - R, lerp(c[0] - R, c[0] + R, k1), lerp(c[1] - R, c[1] + R, k1));
      if (k2 > 0) line(c[0] + R, c[1] - R, lerp(c[0] + R, c[0] - R, k2), lerp(c[1] - R, c[1] + R, k2)); });
    ctx.restore();
  }
  ID();
}

// ---------------------------------------------------------------- text
function groundRGB(t) { const o = orangeK(t), g = hexRGB(C.ground), q = hexRGB(C.acc); return [0, 1, 2].map((i) => Math.round(lerp(g[i], q[i], o))).join(","); }
function scrim(t) {                                    // a soft wash of the ground colour behind the text band
  const fl = flood(t);
  if (fl > 0.02) { ID(); const g = ctx.createLinearGradient(0, 0, 0, 760); [[0, 1], [0.6, 1], [0.7, 0.85], [0.8, 0.55], [0.9, 0.22], [1, 0]].forEach(([o, k]) => g.addColorStop(o, `rgba(23,25,28,${0.88 * fl * k})`)); ctx.fillStyle = g; ctx.fillRect(0, 0, W, 760); }
  const a = 0.88 * (1 - fl) * (t >= T.end ? 1 - prog(t, T.end, T.end + 0.3) : 1);
  if (a <= 0.01) return;
  const col = groundRGB(t);
  ID(); const g = ctx.createLinearGradient(0, 0, 0, 780);
  [[0, 1], [0.6, 1], [0.68, 0.9], [0.76, 0.66], [0.84, 0.38], [0.92, 0.14], [1, 0]].forEach(([o, k]) => g.addColorStop(o, `rgba(${col},${a * k})`));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, 780);
}
function textBand(t) {
  const L = C.ink, D = C.paper;
  scrim(t);
  // 1 the phenomenon — no noun
  lines(COPY.h1, t, -1, T.h1Out + 0.16, { style: "none", col: L });
  underline(COPY.h1[1], "为什么点不动", "屏幕", 1, t, T.underline, T.h1Out + 0.16);
  // 2 the wrong guess (on orange), struck
  lines(COPY.q2, t, T.q2, T.a2, { style: "blur", col: L, acc: C.paper, exit: 0.001 });
  lines(COPY.a2, t, T.a2, T.q3, { style: "slam", col: L, acc: C.paper, lineGap: 0.2 });
  // 3 dig in
  lines(COPY.q3, t, T.q3, T.flood + 0.1, { style: "blur", col: L });
  lines(COPY.a3, t, T.a3, T.q4, { style: "blur", col: D });
  // 4 one mechanism (dark)
  lines(COPY.q4, t, T.q4, T.a4, { style: "blur", col: D });
  lines(COPY.a4, t, T.a4, T.a5, { style: "blur", col: D });
  lines(COPY.a5, t, T.a5, T.stop1 + 0.12, { style: "blur", col: D });
  lines(COPY.name, t, T.name, T.q6, { style: "slam", col: D, ys: [318, 492], size: [96, 140], lineGap: 0.25 });
  // 5 the missing step: a glove
  lines(COPY.q6, t, T.q6, T.a6, { style: "blur", col: D });
  lines(COPY.a6, t, T.a6, T.q7, { style: "blur", col: D });
  lines(COPY.q7, t, T.q7, T.a7, { style: "blur", col: mixHex(L, D, flood(t)) });
  lines(COPY.a7, t, T.a7, T.a8, { style: "slam", col: L, lineGap: 0.2 });
  lines(COPY.a8, t, T.a8, T.q9, { style: "blur", col: mixHex(L, D, flood(t)) });
  // 6 back to the phenomenon
  lines(COPY.q9, t, T.q9, T.fin, { style: "blur", col: mixHex(L, D, flood(t)) });
  lines(COPY.fin, t, T.fin, T.finOut, { style: "blur", col: L, lineGap: 0.25 });
  // a small tip in the same place, after the last line
  label(COPY.tipTag, 98, 206, 46, C.acc, t, T.tip, T.tipOut, { weight: 700 });
  lines(COPY.tip, t, T.tip + 0.15, T.tipOut, { style: "blur", col: L, lineGap: 0.3 });
}
function overlays(t, K) {                               // labels in the picture: few and short
  if (flood(t) > 0.5 && t >= T.arcsOn + 0.5 && t < T.q4 + 0.3) {   // inside the phone: name the glass and the net of wires
    const k = E.p3out(prog(t, T.arcsOn + 0.5, T.arcsOn + 0.9)), fo = 1 - prog(t, T.q4, T.q4 + 0.3);
    const ag = proj(K, P[0] - 9, YFRONT, G), an = proj(K, P[0] + 7.5, P[1] + 5, -0.3);
    ID(); ctx.save(); ctx.globalAlpha = k * fo; ctx.strokeStyle = "rgba(241,240,236,0.7)"; ctx.lineWidth = 2.5; ctx.fillStyle = "rgba(241,240,236,0.9)";
    [[ag, 150, 1424], [an, 600, 1424]].forEach(([a, lx, ly]) => { ctx.beginPath(); ctx.moveTo(lx + 44, ly - 50); ctx.lineTo(a[0], a[1]); ctx.stroke(); ctx.beginPath(); ctx.arc(a[0], a[1], 6, 0, TAU); ctx.fill(); });
    ctx.restore();
    label(COPY.glassLabel, 150, 1424, 46, "rgba(241,240,236,0.92)", t, T.arcsOn + 0.5, T.q4 + 0.3, { weight: 700, alpha: fo });
    label(COPY.netLabel, 600, 1424, 46, "rgba(241,240,236,0.92)", t, T.arcsOn + 0.5, T.q4 + 0.3, { weight: 700, alpha: fo });
  }
  if (flood(t) > 0.5 && t >= T.q4 + 0.5 && t < T.a5) {        // the side cut: name the glass once
    const q = proj(K, P[0] - 20, P[1], G * 0.5); label("玻璃", 64, q[1] + 16, 44, "rgba(241,240,236,0.75)", t, T.q4 + 0.6, T.a5, { weight: 700 });
  }
  // the sausage: a thin leader from the label to the sausage
  if (t >= T.sLabel && t < T.a8) {
    const k = E.p3out(prog(t, T.sLabel, T.sLabel + 0.35)), fo = 1 - prog(t, T.a8 - 0.2, T.a8);
    const sp = sausagePos(t), q = proj(K, sp[0] + DIR3[0] * 55, sp[1] + DIR3[1] * 55, sp[2] + DIR3[2] * 55 + 8);
    const lx = 96, ly = 618, ex = lx + 810;
    ID(); ctx.save(); ctx.globalAlpha = fo; ctx.strokeStyle = "rgba(20,20,20,0.7)"; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(ex - 10, ly + 14); ctx.lineTo(lerp(ex - 10, q[0], k), lerp(ly + 14, q[1], k)); ctx.stroke();
    if (k > 0.98) { ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(q[0], q[1], 6, 0, TAU); ctx.fill(); }
    ctx.restore();
    label(COPY.sLabel, lx, ly, 54, C.ink, t, T.sLabel, T.a8, { weight: 700 });
  }
}
function endCard(t) {
  if (t < T.title1) return;
  lines(COPY.end, t, T.title1, DUR + 1, { style: "type", col: C.ink, ys: [905, 1045, 1185], size: 124, stag: 0.045, lineGap: 0.3 });
  lines([COPY.epNum], t, T.ep, DUR + 1, { style: "slam", col: C.ink, x: 400, ys: [520], size: 150 });
  lines([COPY.epName], t, T.ep + 0.25, DUR + 1, { style: "blur", col: C.ink, x: 404, ys: [668], size: 112 });
  if (t >= T.sting) {
    const K = cam(t), c = proj(K, 0, 4, G), sc = spring(t - T.sting, 16, 0.5);
    ID(); ctx.save(); ctx.translate(c[0], c[1]); ctx.scale(sc, sc); ctx.font = `210px ${DISPLAY}`; ctx.fillStyle = C.acc; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("?", 6, 0); ctx.restore();
  }
}

function frame(t) {
  ctx.reset();                                     // no canvas state survives from the previous frame
  ID();
  const K = cam(t), fl = flood(t);
  if (fl < 0.999) drawLight(t, K);
  drawInterior(t, K, fl);
  overlays(t, K);
  textBand(t);
  if (t >= T.inset && t < T.insetOut + 0.3) sausageInset(t, K);     // the magnifier sits over the wash, clear of the text
  endCard(t);
}

// ---------------------------------------------------------------- motion blur: temporal supersampling where things move fast
const BLUR = [[0, 2.8], [4.25, 4.9], [6.45, 8.3], [10.0, 12.8], [14.75, 16.7], [19.25, 19.8], [24.25, 26.4], [27.5, 28.05], [29.0, 30.6], [30.25, 34.0], [34.5, 36.6], [38.75, 42.3], [44.4, 47.1], [48.3, 49.4], [50.0, 50.3]];
const SUB = 6, SHUTTER = 0.5 / FPS;
const CUTS = [];
window.seek = function seek(t) {
  t = clamp(t, 0, DUR - 1e-6);
  const blur = BLUR.some(([a, b]) => t >= a && t < b);
  if (!blur) { ctx = MAIN; frame(t); return; }
  MAIN.reset();
  for (let i = 0; i < SUB; i++) {
    ctx = OFFX;
    let ts = t + SHUTTER * (i / (SUB - 1) - 0.5);
    for (const c of CUTS) { if (t >= c && ts < c) ts = c; if (t < c && ts >= c) ts = c - 1e-4; }
    frame(clamp(ts, 0, DUR - 1e-6));
    MAIN.setTransform(1, 0, 0, 1, 0, 0); MAIN.globalAlpha = 1 / (i + 1); MAIN.drawImage(OFF, 0, 0);
  }
  MAIN.globalAlpha = 1; ctx = MAIN;
};
window.DUR = DUR; window.FPS = FPS;
window.addEventListener("hf-seek", (e) => window.seek(e.detail.time));
window.ready = false;
window.whenReady = Promise.all([
  document.fonts.load(`100px ${DISPLAY}`, "戴着手套为什么点不动屏幕"), document.fonts.load(`700 50px ${UI}`, "妈妈来电手套模式"), document.fonts.load(`400 50px ${UI}`, "滑动接听设置"),
]).then(() => document.fonts.ready).then(() => { MEASURE.clear(); window.seek(0); window.ready = true; });
</script>
