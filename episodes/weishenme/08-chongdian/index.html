<script>
"use strict";
// ============================================================================================
// EP.08 充电 — a pure function of time. window.seek(t) paints frame t.
// Worlds:
//   PHONE (light, 0–10.5 and 49.75–55.75): a phone standing upright, a USB-C plug and its cable, a hand (placeholder until
//     the user's reference images arrive: 图片prompt.md). Local units = px at zoom 1, origin at the phone's centre.
//     The dive (7.25–10.25) is one take: x-ray → the battery → its electrode stripes → between two sheets (dark).
//   CELL (dark, 10.5–36): the space between the cathode (left) and the graphite anode (right), in "E" units = screen px
//     at the end of the dive. Lithium = light balls (#F1F0EC), never orange; orange only marks (boxes, rings, arrows).
//   SPLIT (dark, 34–38.5): two small anode surfaces side by side (不满不热 | 满 + 热, a thermometer).
//   NIGHT (dark, 38.5–49.75): a bedside, a phone on a stand, a window.
// No timers, no rAF, no state between frames (the context is reset every frame); seeded noise only.
// ============================================================================================
const { T, COPY, W, H, DUR, FPS, S16, PLUGS, UNPLUGS, FAST } = TL;
const cv = document.getElementById("c");
const MAIN = cv.getContext("2d");
const OFF = document.createElement("canvas"); OFF.width = W; OFF.height = H;
const OFFX = OFF.getContext("2d");
let ctx = MAIN;

const C = {
  ground: "#ECEBE6", ink: "#141414", acc: "#FF4A1C", paper: "#F1F0EC", dark: "#17191C",
  skin: "#EBCBA5", skinD: "#D6AD84", skinL: "#F4DEC3", nail: "#F3DCCB",
  body: "#25282E", bodyL: "#3A3E46", glass: "#0D0E11", plug: "#DAD8D1", plugD: "#B9B6AE", metal: "#9EA3AB", cable: "#E4E2DB", cableD: "#C9C6BE",
  cath: "#2F3442", cathL: "#454B5B", anode: "#30333A", sheet: "#5A606C", sheetL: "#737A88", elyte: "#17191C", film: "#8F8A80", filmL: "#B3AC9F",
  ion: "#F1F0EC", night: "#171A21", nightW: "#202737", stand: "#2B2F38", table: "#23262D", tableL: "#333843",
  caseC: "#5E6570", caseL: "#747C88",
};
const DISPLAY = "Smiley", UI = "NotoSC";

// ---------------------------------------------------------------- math
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const TAU = Math.PI * 2, RAD = Math.PI / 180;
const E = {
  sine: (x) => 0.5 - 0.5 * Math.cos(Math.PI * x),
  p2io: (x) => (x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2),
  p3io: (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
  p2in: (x) => x * x, p3in: (x) => x * x * x,
  p2out: (x) => 1 - (1 - x) * (1 - x), p3out: (x) => 1 - Math.pow(1 - x, 3), p4out: (x) => 1 - Math.pow(1 - x, 4),
  smooth: (x) => x * x * (3 - 2 * x),
};
function spring(x, w = 15, z = 0.72) {
  if (x <= 0) return 0;
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * x) * (Math.cos(wd * x) + ((z * w) / wd) * Math.sin(wd * x));
}
function slamScale(u) {                              // 0.17 s: 1.55 -> 0.94 -> 1.0
  if (u <= 0) return 1.55;
  if (u < 0.09) return lerp(1.55, 0.94, E.p2in(u / 0.09));
  if (u < 0.17) return lerp(0.94, 1.0, E.p3out((u - 0.09) / 0.08));
  return 1;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const hexRGB = (h) => [0, 1, 2].map((i) => parseInt(h.slice(1 + 2 * i, 3 + 2 * i), 16));
const mixHex = (a, b, k) => { const p = hexRGB(a), q = hexRGB(b); return `rgb(${[0, 1, 2].map((i) => Math.round(lerp(p[i], q[i], k))).join(",")})`; };
const rgba = (h, a) => { const p = hexRGB(h); return `rgba(${p[0]},${p[1]},${p[2]},${a})`; };
function kf(t, K, ease = E.p2io) {
  if (t <= K[0][0]) return K[0][1];
  for (let i = 1; i < K.length; i++) if (t < K[i][0]) { const [t0, v0] = K[i - 1], [t1, v1, e] = K[i]; return lerp(v0, v1, (e || ease)(prog(t, t0, t1))); }
  return K[K.length - 1][1];
}
function win(t, a, b, fi = 0.25, fo = 0.25) { return E.p3out(prog(t, a, a + fi)) * (1 - E.p2io(prog(t, b - fo, b))); }
const hash = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const vnoise = (x) => { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash(i), hash(i + 1), u); };

// a slow, smooth drift (never a shake): incommensurate sines so the picture never stops
function drift(t) { return [30 * Math.cos(0.8 * t) + 8 * Math.sin(1.7 * t), 22 * Math.sin(0.8 * t) + 6 * Math.cos(1.3 * t), 1 + 0.02 * Math.sin(0.37 * t)]; }   // an ellipse: the speed never drops to zero
// ---------------------------------------------------------------- camera: screen = A·local + B (log-spiral between keys)
function key(F, anchor, A) { return { A, B: [anchor[0] - A * F[0], anchor[1] - A * F[1]] }; }
function interp(k0, k1, u) {
  const lr = Math.log(k1.A / k0.A), kk = Math.exp(lr), ku = Math.exp(lr * u);
  let B;
  if (Math.abs(1 - kk) < 1e-9) B = [lerp(k0.B[0], k1.B[0], u), lerp(k0.B[1], k1.B[1], u)];
  else { const c0 = k1.B[0] - kk * k0.B[0], c1 = k1.B[1] - kk * k0.B[1], w0 = c0 / (1 - kk), w1 = c1 / (1 - kk); B = [ku * (k0.B[0] - w0) + w0, ku * (k0.B[1] - w1) + w1]; }
  return { A: k0.A * ku, B };
}
const ID = () => ctx.setTransform(1, 0, 0, 1, 0, 0);
const setK = (K) => ctx.setTransform(K.A, 0, 0, K.A, K.B[0], K.B[1]);
const toS = (K, p) => [K.A * p[0] + K.B[0], K.A * p[1] + K.B[1]];

// ---------------------------------------------------------------- drawing helpers
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function line(x0, y0, x1, y1) { ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); }
const MEASURE = new Map();
function mw(font, s) { const k = font + "|" + s; let v = MEASURE.get(k); if (v === undefined) { ctx.font = font; v = ctx.measureText(s).width; MEASURE.set(k, v); } return v; }
function parse(str) { const out = []; let a = 0; for (const ch of str) { if (ch === "[") { a = 1; continue; } if (ch === "]") { a = 0; continue; } out.push({ ch, a }); } return out; }
const plain = (str) => str.replace(/[\[\]]/g, "");
function fitSize(str, size, maxW, face = DISPLAY, wt = "") { const f = `${wt} ${size}px ${face}`.trim(), w = mw(f, plain(str)); return w > maxW ? Math.floor(size * maxW / w) : size; }
// Text band: style none | blur | type | slam | wipe; left aligned at x.
function lines(L, t, t0, t1, o = {}) {
  if (t < t0 || t >= t1) return;
  const three = L.length === 3 && !o.ys;
  const x = o.x ?? 96, ys = o.ys ?? (three ? [300, 420, 540] : [330, 472]), face = o.face ?? DISPLAY, wt = o.weight ?? "";
  const col = o.col ?? C.ink, acc = o.acc ?? C.acc, style = o.style ?? "blur";
  const stag = o.stag ?? 0.055, lineGap = o.lineGap ?? 0.16, exitDur = o.exit ?? 0.16, maxW = o.maxW ?? 930;
  ID();
  L.forEach((str, i) => {
    const size = fitSize(str, Array.isArray(o.size) ? o.size[i] : (o.size ?? (three ? 96 : 112)), maxW, face, wt);
    const font = `${wt} ${size}px ${face}`.trim();
    const chars = parse(str), ls = t0 + i * lineGap;
    if (t < ls) return;
    let pre = "";
    ctx.save();
    if (style === "slam") { const sc0 = slamScale(t - ls), sc = sc0 > 1 ? Math.min(sc0, Math.max(1, (1040 - x) / mw(font, plain(str)))) : sc0, cy = ys[i] - size * 0.35; ctx.translate(x, cy); ctx.scale(sc, sc); ctx.translate(-x, -cy); }
    if (style === "wipe") { const wv = mw(font, plain(str)); ctx.beginPath(); ctx.rect(0, ys[i] - size * 1.2, x + wv * E.p3out(prog(t, ls, ls + 0.32)) + 4, size * 1.6); ctx.clip(); }
    ctx.font = font; ctx.textBaseline = "alphabetic";
    chars.forEach((c, j) => {
      const cx = x + mw(font, pre); pre += c.ch;
      const lt = t - (ls + j * stag);
      let a = 1, blur = 0;
      if (style === "blur") { const k = clamp(lt / 0.13); a = k; blur = 9 * (1 - k); }
      else if (style === "type") { a = lt >= 0 ? 1 : 0; }
      if (t > t1 - exitDur) { const e = clamp((t - (t1 - exitDur)) / exitDur); a *= 1 - e; blur = Math.max(blur, 10 * e); }
      if (a <= 0.003) return;
      ctx.globalAlpha = a; ctx.filter = blur > 0.3 ? `blur(${blur.toFixed(1)}px)` : "none";
      ctx.fillStyle = c.a ? acc : col; ctx.fillText(c.ch, cx, ys[i]);
    });
    ctx.restore(); ctx.filter = "none"; ctx.globalAlpha = 1;
  });
}
function label(str, x, y, size, col, t, t0, t1, o = {}) {
  if (t < t0 || t >= t1) return;
  ID(); const font = `${o.weight ?? 700} ${size}px ${o.face ?? UI}`; const wv = mw(font, str);
  const k = E.p3out(prog(t, t0, t0 + 0.28)), e = prog(t, t1 - 0.15, t1);
  ctx.save(); ctx.font = font; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  const left = o.align === "right" ? x - wv : o.align === "center" ? x - wv / 2 : x;
  if (o.plate) { ctx.globalAlpha = (1 - e) * k; rr(left - 18, y - size - 4, wv + 36, size + 22, 12); ctx.fillStyle = o.plate; ctx.fill(); }
  ctx.beginPath(); ctx.rect(left - 4, y - size * 1.2, (wv + 8) * k, size * 1.6); ctx.clip();
  ctx.globalAlpha = (o.alpha ?? 1) * (1 - e); if (e > 0) ctx.filter = `blur(${(8 * e).toFixed(1)}px)`;
  ctx.fillStyle = col; ctx.fillText(str, left, y); ctx.restore(); ctx.filter = "none";
}
function underline(str, prefix, word, lineIdx, t, t0, t1, ys = [330, 472], size0 = 112) {
  if (t < t0 || t >= t1) return;
  const size = fitSize(str, size0, 930), f = `${size}px ${DISPLAY}`;
  const x0 = 96 + mw(f, prefix), wv = mw(f, word), k = E.p3out(prog(t, t0, t0 + 0.3)), fo = 1 - prog(t, t1 - 0.16, t1);
  ID(); ctx.globalAlpha = fo; ctx.fillStyle = C.acc; ctx.fillRect(x0 - 4, ys[lineIdx] + 20, (wv + 8) * k, 11); ctx.globalAlpha = 1;
}
function leader(x0, y0, x1, y1, col, k = 1, w = 2.5) {
  ID(); ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(lerp(x0, x1, k), lerp(y0, y1, k)); ctx.stroke();
  if (k > 0.98) { ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x1, y1, 6, 0, TAU); ctx.fill(); }
  ctx.restore();
}
function pill(str, x, y, size, t, t0, t1, o = {}) {                     // small text on a dark pill
  if (t < t0 || t >= t1) return;
  ID(); const font = `${o.weight ?? 700} ${size}px ${UI}`, wv = mw(font, str), k = E.p3out(prog(t, t0, t0 + 0.25)), e = 1 - prog(t, t1 - 0.15, t1);
  const left = o.align === "right" ? x - wv : o.align === "center" ? x - wv / 2 : x;
  ctx.save(); ctx.globalAlpha = k * e; rr(left - 22, y - size - 6, wv + 44, size + 26, (size + 26) / 2); ctx.fillStyle = o.fill ?? "rgba(23,25,28,0.88)"; ctx.fill();
  if (o.edge) { ctx.strokeStyle = C.acc; ctx.lineWidth = 4; ctx.stroke(); }
  ctx.font = font; ctx.fillStyle = o.col ?? C.paper; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic"; ctx.fillText(str, left, y); ctx.restore();
}
// an orange box that draws itself (the 示意 frame for a new element)
function obox(x, y, w, h, k, a = 1, r = 14, lw = 5) {
  if (k <= 0 || a <= 0) return;
  ID(); ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = C.acc; ctx.lineWidth = lw; ctx.lineJoin = "round";
  const per = 2 * (w + h); ctx.setLineDash([per * k, per]); rr(x, y, w, h, r); ctx.stroke(); ctx.restore();
}
function oring(x, y, r, k, a = 1, lw = 4) {
  if (k <= 0 || a <= 0) return;
  ID(); ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = C.acc; ctx.lineWidth = lw; ctx.beginPath(); ctx.arc(x, y, r, -Math.PI / 2, -Math.PI / 2 + TAU * k); ctx.stroke(); ctx.restore();
}
function capsule(P, w, fill) { ctx.save(); ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = fill; ctx.lineWidth = w; ctx.beginPath(); P.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]))); ctx.stroke(); ctx.restore(); }

// ================================================================ PHONE world (light)
const PH = { w: 330, h: 660, r: 54 };                 // the phone, upright, centre at local (0,0)
const PORT = [0, PH.h / 2];
const K_HOME = key([0, 30], [540, 1000], 1.0);         // the phone a little above centre; its plug ends above y 1450
// the plug: how far it is out of the port (0 = home), from the plug / unplug events
function plugOut(t) {
  // events: plug(in) at PLUGS; unplug at UNPLUGS; FAST: in at f, out at f+0.25
  const ev = [[-1, 1]];                                 // [time, target out]
  PLUGS.forEach((p) => ev.push([p - 0.2, 0]));
  UNPLUGS.forEach((u) => ev.push([u, 1]));
  FAST.forEach((f) => { ev.push([f - 0.12, 0]); ev.push([f + 0.2, 1]); });
  ev.push([FAST[FAST.length - 1] + 0.45, 0]);          // home again before the dive
  ev.push([T.plugF - 0.2, 0]);
  ev.sort((a, b) => a[0] - b[0]);
  // the closing shot: start out
  if (t >= T.irisOut - 0.01 && t < T.plugF - 0.2) return 1;
  let v = 1, tl = -1;
  for (const [a, k] of ev) { if (a > t) break; tl = a; v = k; }
  // ease from the previous value over 0.2 s
  let prev = 1; for (const [a, k] of ev) { if (a >= tl) break; prev = k; }
  const u = E.p3io(prog(t, tl, tl + 0.2));
  return lerp(prev, v, u);
}
function drawPlugAndCable(t, K, out, a = 1) {
  setK(K); ctx.save(); ctx.globalAlpha = a;
  const y0 = PORT[1] - 22 + out * 50;                   // the metal tip's top
  // cable: from the plug's tail, curving off to the right edge
  const tail = [0, y0 + 22 + 84];
  ctx.lineCap = "round"; ctx.strokeStyle = C.cableD; ctx.lineWidth = 22;
  ctx.beginPath(); ctx.moveTo(tail[0], tail[1]); ctx.bezierCurveTo(0, tail[1] + 70, 220, tail[1] + 40, 640, tail[1] - 40); ctx.stroke();
  ctx.strokeStyle = C.cable; ctx.lineWidth = 16; ctx.stroke();
  // the boot and the plug body
  rr(-24, y0 + 22 + 60, 48, 34, 10); ctx.fillStyle = C.plugD; ctx.fill();
  rr(-34, y0 + 18, 68, 70, 14); const g = ctx.createLinearGradient(-34, 0, 34, 0); g.addColorStop(0, C.plugD); g.addColorStop(0.4, C.plug); g.addColorStop(1, C.plugD); ctx.fillStyle = g; ctx.fill();
  // the metal tip (hidden inside the phone when home: the phone is drawn on top)
  rr(-21, y0, 42, 24, 8); ctx.fillStyle = C.metal; ctx.fill();
  ctx.restore();
}
function phoneScreen(t, K, s) {                         // s: { pct, charging, pause, glow, game, bar }
  setK(K); ctx.save();
  rr(-PH.w / 2 + 12, -PH.h / 2 + 12, PH.w - 24, PH.h - 24, PH.r - 12); ctx.clip();
  ctx.fillStyle = C.glass; ctx.fillRect(-PH.w / 2, -PH.h / 2, PH.w, PH.h);
  const on = s.on ?? 0;
  if (on > 0) {
    ctx.globalAlpha = on;
    const g = ctx.createRadialGradient(0, -60, 20, 0, -60, 360); g.addColorStop(0, "#2A2E38"); g.addColorStop(1, "#121318");
    ctx.fillStyle = g; ctx.fillRect(-PH.w / 2, -PH.h / 2, PH.w, PH.h);
    // the battery icon, big, in the middle; the level as a fill
    const bw = 150, bh = 70, bx = -bw / 2, by = 40;
    ctx.strokeStyle = C.paper; ctx.lineWidth = 6; rr(bx, by, bw, bh, 16); ctx.stroke();
    rr(bx + bw + 4, by + 22, 10, 26, 4); ctx.fillStyle = C.paper; ctx.fill();
    const lv = clamp(s.level ?? 0.37);
    rr(bx + 9, by + 9, (bw - 18) * lv, bh - 18, 9); ctx.fillStyle = lv > 0.2 ? C.paper : C.acc; ctx.fill();
    if (s.charging) {                                   // charging: a soft light runs along the fill, again and again
      ctx.save(); ctx.clip(); const u = (t * 0.9) % 1, xs = bx + 9 + (bw - 18) * lv * u;
      const g2 = ctx.createLinearGradient(xs - 40, 0, xs + 40, 0); g2.addColorStop(0, "rgba(120,124,132,0)"); g2.addColorStop(0.5, "rgba(120,124,132,0.75)"); g2.addColorStop(1, "rgba(120,124,132,0)");
      ctx.fillStyle = g2; ctx.fillRect(xs - 40, by, 80, bh); ctx.restore();
      // and the whole screen breathes a little
      ctx.fillStyle = `rgba(255,255,255,${0.035 + 0.035 * Math.sin(t * 3.1)})`; ctx.fillRect(-PH.w / 2, -PH.h / 2, PH.w, PH.h);
    }
    if (!s.charging) {                                  // not charging (held or full): the icon glows slowly, so the picture never stops
      const pk = 0.5 + 0.5 * Math.sin(t * 2.6);
      ctx.strokeStyle = `rgba(241,240,236,${0.12 + 0.25 * pk})`; ctx.lineWidth = 10 + 10 * pk; rr(bx - 10, by - 10, bw + 20, bh + 20, 22); ctx.stroke();
    }
    if (s.mark80) { ctx.strokeStyle = C.acc; ctx.lineWidth = 4; const xm = bx + 9 + (bw - 18) * 0.8; line(xm, by - 10, xm, by + bh + 10); }
    // the percentage, with a bolt or a pause sign
    if (s.txt) {
      ctx.font = `700 76px ${UI}`; ctx.textAlign = "center"; ctx.textBaseline = "alphabetic"; ctx.fillStyle = C.paper;
      ctx.fillText(s.txt, 18, -40);
      const tw = mw(`700 76px ${UI}`, s.txt), ix = 18 - tw / 2 - 34, iy = -68;
      if (s.pause) { ctx.fillRect(ix - 10, iy - 22, 8, 40); ctx.fillRect(ix + 6, iy - 22, 8, 40); }
      else if (s.charging) { ctx.beginPath(); ctx.moveTo(ix + 6, iy - 30); ctx.lineTo(ix - 14, iy + 4); ctx.lineTo(ix, iy + 4); ctx.lineTo(ix - 6, iy + 32); ctx.lineTo(ix + 16, iy - 4); ctx.lineTo(ix + 2, iy - 4); ctx.closePath(); ctx.fillStyle = C.paper; ctx.fill(); }
    }
  }
  ctx.restore();
}
function drawPhone(t, K, o = {}) {
  setK(K); ctx.save();
  // a soft contact shadow under the phone
  if (o.shadow ?? 1) { ctx.globalAlpha = 0.18 * (o.shadow ?? 1); const g = ctx.createRadialGradient(0, PH.h / 2 + 10, 10, 0, PH.h / 2 + 10, 240); g.addColorStop(0, "#000"); g.addColorStop(1, "rgba(0,0,0,0)"); ctx.fillStyle = g; ctx.fillRect(-260, PH.h / 2 - 40, 520, 110); ctx.globalAlpha = 1; }
  const body = o.body ?? C.body;
  rr(-PH.w / 2, -PH.h / 2, PH.w, PH.h, PH.r); ctx.fillStyle = body; ctx.fill();
  ctx.strokeStyle = o.edge ?? C.bodyL; ctx.lineWidth = 4; ctx.stroke();
  // side buttons
  ctx.fillStyle = o.edge ?? C.bodyL; rr(PH.w / 2 - 1, -170, 7, 90, 3); ctx.fill(); rr(-PH.w / 2 - 6, -200, 7, 54, 3); ctx.fill(); rr(-PH.w / 2 - 6, -130, 7, 54, 3); ctx.fill();
  // the port
  rr(-24, PH.h / 2 - 8, 48, 10, 5); ctx.fillStyle = "#0A0B0D"; ctx.fill();
  ctx.restore();
  phoneScreen(t, K, o.screen ?? {});
  // the notch / island
  setK(K); rr(-46, -PH.h / 2 + 32, 92, 26, 13); ctx.fillStyle = "#050506"; ctx.fill();
}

// ---------------------------------------------------------------- placeholder hands (until the reference images arrive)
function skinGrad(x0, y0, x1, y1) { const g = ctx.createLinearGradient(x0, y0, x1, y1); g.addColorStop(0, C.skinL); g.addColorStop(0.45, C.skin); g.addColorStop(1, C.skinD); return g; }

  const k1 = E.p3out(prog(t, T.strike, T.strike + 0.1)), k2 = E.p3out(prog(t, T.strike + 0.125, T.strike + 0.225));
  line(c[0] - 240, c[1] - 220, lerp(c[0] - 240, c[0] + 240, k1), lerp(c[1] - 220, c[1] + 220, k1));
  if (k2 > 0) line(c[0] + 240, c[1] - 220, lerp(c[0] + 240, c[0] - 240, k2), lerp(c[1] - 220, c[1] + 220, k2));
  ctx.restore();
}
function drawPhoneScene(t, K, o = {}) {
  ID(); ctx.fillStyle = o.ground ?? groundCol(t); ctx.fillRect(0, 0, W, H);
  const out = plugOut(t);
  drawPlugAndCable(t, K, out);
  // the dive: x-ray → the battery → its stripes
  const dk = diveK(t), xr = t >= T.dive && t < T.diveEnd ? E.p2io(prog(t, T.xray, T.xray + 0.6)) : 0;
  drawPhone(t, K, { screen: screenState(t) });
  if (xr > 0) {
    setK(K); ctx.save();
    rr(-PH.w / 2 + 12, -PH.h / 2 + 12, PH.w - 24, PH.h - 24, PH.r - 12); ctx.fillStyle = rgba("#1E2025", xr); ctx.fill();
    ctx.globalAlpha = xr; rr(BATT.x, BATT.y, BATT.w, BATT.h, BATT.r); ctx.fillStyle = "#262A31"; ctx.fill(); ctx.strokeStyle = "#8A919C"; ctx.lineWidth = 4 / K.A; ctx.stroke();
    ctx.fillStyle = "#9EA3AB"; rr(-70, BATT.y - 16, 34, 22, 4); ctx.fill(); rr(36, BATT.y - 16, 34, 22, 4); ctx.fill();   // the tabs
    rr(BATT.x + 26, BATT.y + 60, BATT.w - 52, 120, 10); ctx.fillStyle = "#3A3F49"; ctx.fill(); ctx.strokeStyle = "#555B67"; ctx.lineWidth = 2 / K.A; ctx.stroke();   // the label panel
    ctx.restore();
    const st = E.p2io(prog(t, T.cells, T.cells + 0.5));
    if (st > 0) drawStripes(K, st, 0);
  }
  // the hand holds the plug (from the first frame until the dive takes over), and again in the closing shot
  const handA = t < T.dive ? 1 : t < T.irisOut ? 1 - E.p2io(prog(t, T.dive, T.dive + 0.4)) : 1;
  if (handA > 0.01) handPinch(K, [0, PORT[1] + 40 + out * 50], handA);
}
const IRC = [300, 760];                                                  // the night → light circle opens away from phone B (its 80% stays ≥ 1 s)
function frame(t) {
  ctx.reset(); ID();
  let fl = darkAt(t);
  if (t < T.diveEnd) {
    const K = camPhone(t);
    drawPhoneScene(t, K);
    // the cell grows in as the stripes fill the frame
    const M = cellM(t), det = E.smooth(prog(M[0], 0.25, 0.75)), cA = E.smooth(prog(M[0], 0.12, 0.3));
    if (cA > 0) { ctx.save(); setK(K); rr(BATT.x, BATT.y, BATT.w, BATT.h, BATT.r); ID(); ctx.restore(); ctx.save(); const P = new Path2D(); const a0 = toS(K, [BATT.x, BATT.y]); P.roundRect(a0[0], a0[1], BATT.w * K.A, BATT.h * K.A, BATT.r * K.A); ctx.clip(P); drawCell(t, M, cA, det); ctx.restore(); }
    strike(t, K);
  } else if (t < T.pull + 1.2) {
    const M = cellM(t), sk = splitK(t);
    if (t < T.splitEnd + 0.01) drawCell(t, M, 1, 1);
    if (sk > 0) { if (t >= T.split) { ID(); ctx.fillStyle = rgba(C.dark, sk); ctx.fillRect(0, 0, W, H); } drawSplit(t, sk); }
    if (t < T.split + 0.4) { drawBar(t, barK(t)); drawRing(t, ringK(t)); cellLabels(t, M); }
    if (t >= T.split && t < T.pull + 0.2) {
      const P0 = PAN[0], P1 = PAN[1];
      pill(COPY.cmpL, P0.x + P0.w / 2, P0.y - 30, 46, t, T.cmpL - 0.1, T.pull, { align: "center" });
      pill(COPY.cmpR, P1.x + P1.w / 2, P1.y - 30, 46, t, T.cmpR - 0.1, T.pull, { align: "center", edge: t >= T.cmpR && t < T.cmpR + 1.2 });
    }
    if (t >= T.pull) { const na = nightA(t); ctx.save(); ctx.globalAlpha = na; drawNightScene(t); ctx.restore(); drawSplit(t, splitK(t)); }
  } else if (t < T.irisOut) {
    drawNightScene(t);
    pill(COPY.opt, 420, 1395, 44, t, T.hold80, T.q14, { align: "center" });
    pill(COPY.dawn, 805, 1120, 44, t, T.dawn + 0.2, T.q14 - 0.1, { align: "center" });
    if (t >= T.limit - 0.1) pill(COPY.next, 650, 1395, 44, t, T.limit - 0.1, T.irisOut + 0.2, { align: "center" });
    if (t >= T.a14) pill(COPY.note, 980, 1400, 44, t, T.a14, T.a15, { align: "right" });
  } else if (t < T.irisOutEnd) {
    // dark (night) → light (the first shot): a growing circle, both worlds fully opaque
    const k = E.p2io(prog(t, T.irisOut, T.irisOutEnd)), R = 6 + 2300 * k * k * (3 - 2 * k);
    drawNightScene(t);
    ctx.save(); const P = new Path2D(); P.arc(IRC[0], IRC[1], R, 0, TAU); ID(); ctx.clip(P); { const d = drift(t); drawPhoneScene(t, key([0, 30], [540 + 0.95 * d[0], PHY + 0.95 * d[1]], PHS * d[2])); } ctx.restore();
    fl = 1 - k;
  } else if (t < T.tip) {
    { const d = drift(t); drawPhoneScene(t, key([0, 30], [540 + 0.95 * d[0], PHY + 0.95 * d[1]], PHS * d[2])); }
  } else {
    ID(); ctx.fillStyle = C.ground; ctx.fillRect(0, 0, W, H);
    if (t < T.end + 0.05) drawTip(t);
  }
  if (t >= T.irisOut && t < T.irisOutEnd) {                             // the circle: dark scrim outside, light inside (no grey)
    const k = E.p2io(prog(t, T.irisOut, T.irisOutEnd)), R = 6 + 2300 * k * k * (3 - 2 * k);
    ctx.save(); let P = new Path2D(); P.rect(0, 0, W, H); P.arc(IRC[0], IRC[1], R, 0, TAU); ID(); ctx.clip(P, "evenodd"); scrimOf(1); textBand(t, 1); ctx.restore();
    ctx.save(); P = new Path2D(); P.arc(IRC[0], IRC[1], R, 0, TAU); ID(); ctx.clip(P); scrimOf(0); textBand(t, 0); ctx.restore();
    fl = -1;
  } else scrimOf(fl, t >= T.end ? 1 - prog(t, T.end, T.end + 0.3) : 1, groundRGB(t));
  if (t < T.dive + 0.5) drawRow(t);                                   // above the caption scrim
  if (fl >= 0) textBand(t, fl);
  if (t >= T.a7 + 0.3 && t < T.q8) pill(COPY.term, 980, 1400, 44, t, T.term, T.q8, { align: "right" });
  if (t >= T.end) { ID(); ctx.fillStyle = C.ground; ctx.globalAlpha = E.p2io(prog(t, T.end, T.end + 0.3)); ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; endCard(t); }
}

// ---------------------------------------------------------------- motion blur where things move fast
const BLUR = [[7.6, 10.3, 8], [38.5, 40, 6], [52.75, 53.3, 8], [55.75, 56.7, 8]];
const SHUTTER = 0.5 / FPS;
window.seek = function seek(t) {
  t = clamp(t, 0, DUR - 1e-6);
  const b = BLUR.find(([a, bb]) => t >= a && t < bb);
  if (!b) { ctx = MAIN; frame(t); return; }
  const SUB = b[2];
  MAIN.reset();
  for (let i = 0; i < SUB; i++) {
    ctx = OFFX;
    const ts = t + SHUTTER * (i / (SUB - 1) - 0.5);
    frame(clamp(ts, 0, DUR - 1e-6));
    MAIN.setTransform(1, 0, 0, 1, 0, 0); MAIN.globalAlpha = 1 / (i + 1); MAIN.drawImage(OFF, 0, 0);
  }
  MAIN.globalAlpha = 1; ctx = MAIN;
};
window.DUR = DUR; window.FPS = FPS;
window.ready = false;
window.whenReady = Promise.all([
  document.fonts.load(`100px ${DISPLAY}`, "手机天天充会充坏电池吗"), document.fonts.load(`700 50px ${UI}`, "正极负极电量循环"), document.fonts.load(`400 50px ${UI}`, "示意"),
]).then(() => document.fonts.ready).then(() => { MEASURE.clear(); window.seek(0); window.ready = true; });
</script>
