<!doctype html>
<meta charset="utf-8">
<title>T0 两个开场</title>
<style>
  html, body { margin: 0; background: #000; }
  canvas { display: block; width: 540px; height: 960px; }
</style>
<canvas id="c" width="540" height="960"></canvas>
<script>
// T0 概念测试：两个开场 0–4 秒。二维示意，不是成片画面。
//   A「玻璃丝奇观」：一把黄线缆，镜头推近一根，外皮变透明，露出玻璃丝，一根头发作比例。
//   B「这条消息送得到吗？」：一排比特 → 金色线伸向远处，条纹越远越虚，远处机柜冒出珊瑚色问号。
// window.renderFrame(t, {variant:'A'|'B'}) 画出第 t 秒的一帧。只有静音版，无字幕。
const W = 540, H = 960;
const FONT = '"WenQuanYi Zen Hei", "Noto Sans CJK SC", sans-serif';
const CYAN = [86, 232, 240], GOLD = [255, 190, 70], CORAL = [255, 122, 107];
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const smooth = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${clamp(a, 0, 1)})`;
const PATTERN = [1, 1, 0, 1, 0, 0, 1, 0];   // 亮亮暗亮暗暗亮暗

function bg(ctx) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#123a4a'); g.addColorStop(0.55, '#0d2d3d'); g.addColorStop(1, '#0a2231');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function bigText(ctx, lines, t, yTop, size = 50) {
  // 大字：0.3 秒内出现（第一帧已经有字，半透明 + 略偏下），深色底衬 + 描边
  const k = smooth(t / 0.3), alpha = 0.75 + 0.25 * k, dy = (1 - k) * 12;
  ctx.font = `bold ${size}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const lh = size * 1.3;
  const w = Math.max(...lines.map(l => ctx.measureText(l).width));
  const h = lines.length * lh + 20;
  ctx.fillStyle = `rgba(5,16,24,${0.80 * alpha})`;
  ctx.beginPath(); ctx.roundRect(W / 2 - w / 2 - 22, yTop + dy, w + 44, h, 14); ctx.fill();
  lines.forEach((l, i) => {
    const y = yTop + dy + 10 + lh * (i + 0.5);
    ctx.lineJoin = 'round'; ctx.lineWidth = 6; ctx.strokeStyle = `rgba(5,16,24,${alpha})`; ctx.strokeText(l, W / 2, y);
    ctx.fillStyle = `rgba(255,250,235,${alpha})`; ctx.fillText(l, W / 2, y);
  });
}
function label(ctx, text, x, y, size = 24) {
  ctx.font = `${size}px ${FONT}`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  const w = ctx.measureText(text).width, pad = 8;
  ctx.fillStyle = 'rgba(4,16,24,0.78)'; ctx.beginPath(); ctx.roundRect(x - pad, y - size * 0.75, w + pad * 2, size * 1.5, 6); ctx.fill();
  ctx.fillStyle = 'rgba(240,248,250,0.95)'; ctx.fillText(text, x, y + 1);
}

// ---------------- A ----------------
// 世界坐标：u 沿线缆，v 横向。线缆宽 70，玻璃丝宽 9.3，头发宽 5.7（玻璃丝 = 头发 1.6 倍），走光的芯宽 0.65。
// 1.4 秒时镜头约 7 倍：玻璃丝约 65 像素，头发约 40 像素，亮线约 4.5 像素。
const CAB_W = 70, FIB_W = 9.3, HAIR_W = 5.7, CORE_W = 0.65, EDGE = 3.5;
const AXIS = -1.15;                                  // 线缆倾斜角（u 轴指向右上）
function glassFiber(ctx, v, alpha, L) {
  const g = ctx.createLinearGradient(0, v - FIB_W / 2, 0, v + FIB_W / 2);
  g.addColorStop(0, 'rgba(200,240,250,0.62)'); g.addColorStop(0.2, 'rgba(160,215,230,0.22)');
  g.addColorStop(0.5, 'rgba(120,190,215,0.10)'); g.addColorStop(0.8, 'rgba(160,215,230,0.22)'); g.addColorStop(1, 'rgba(200,240,250,0.62)');
  ctx.globalAlpha = alpha; ctx.fillStyle = g; ctx.fillRect(-L, v - FIB_W / 2, 2 * L, FIB_W);
  ctx.fillStyle = 'rgba(235,252,255,0.9)'; ctx.fillRect(-L, v - FIB_W / 2, 2 * L, 0.28); ctx.fillRect(-L, v + FIB_W / 2 - 0.28, 2 * L, 0.28);
  ctx.globalAlpha = 1;
}
function renderA(ctx, t) {
  bg(ctx);
  // 镜头：0–1.4 秒从 1.25 倍冲到 7 倍（第一帧起就在动），之后慢慢继续推
  const k = clamp(t / 1.4, 0, 1);
  const z = t < 1.4 ? 1.25 * Math.pow(7 / 1.25, k * (2 - k)) : 7 * (1 + 0.05 * (t - 1.4) / 2.6);
  const cx = 270, cy = 330;
  const jacket = smooth((t - 0.5) / 0.7);            // 0.5–1.2 秒外皮中间变没，只剩两侧窄边
  ctx.save();
  ctx.translate(cx, cy); ctx.scale(z, z); ctx.rotate(AXIS);
  const L = 400;
  for (const v0 of [-170, -85, 0, 85, 170]) {
    const focus = v0 === 0;
    if (focus) {
      // 外皮里面的空间：深青蓝，不是灰绿
      const cg = ctx.createLinearGradient(0, -CAB_W / 2, 0, CAB_W / 2);
      cg.addColorStop(0, '#0b2a3b'); cg.addColorStop(0.5, '#10384b'); cg.addColorStop(1, '#0b2a3b');
      ctx.fillStyle = cg; ctx.fillRect(-L, -CAB_W / 2, 2 * L, CAB_W);
      // 两侧只露一部分的玻璃丝：暗、虚
      ctx.save(); ctx.filter = 'blur(3px)';
      glassFiber(ctx, -34, 0.55 * jacket, L); glassFiber(ctx, 34, 0.55 * jacket, L);
      ctx.restore();
      // 主角：一根玻璃丝，正中间
      glassFiber(ctx, 0, jacket, L);
      // 走光的芯：一段亮一段暗，明显在流动；光晕只在玻璃丝里面
      const P = 6.5, off = (t * 46) % (P * 8);      // 亮 / 暗段各约 45 像素，流速约 320 像素 / 秒
      ctx.globalAlpha = jacket;
      for (let u = -150; u < 150; u += P) {
        const idx = ((Math.floor((u - off) / P) % 8) + 8) % 8, on = PATTERN[idx];
        ctx.fillStyle = rgba(CYAN, on ? 0.45 : 0.10); ctx.fillRect(u, -0.95, P, 1.9);
        if (on) { ctx.fillStyle = rgba(CYAN, 0.22); ctx.fillRect(u, -1.6, P, 3.2); }
        ctx.fillStyle = on ? 'rgba(235,255,255,1)' : rgba(CYAN, 0.28); ctx.fillRect(u, -CORE_W / 2, P, CORE_W);
      }
      ctx.globalAlpha = 1;
    }
    // 外皮：哑光柠檬黄。焦点线缆的中间会变没，两侧窄边一直在
    const ja = focus ? 1 - jacket : 1;
    if (ja > 0.01) {
      ctx.fillStyle = rgba([226, 214, 58], ja); ctx.fillRect(-L, v0 - CAB_W / 2, 2 * L, CAB_W);
      ctx.fillStyle = rgba([186, 174, 36], ja * 0.9); ctx.fillRect(-L, v0 + CAB_W / 2 - 14, 2 * L, 14);
      ctx.fillStyle = rgba([240, 232, 120], ja * 0.5); ctx.fillRect(-L, v0 - CAB_W / 2 + 4, 2 * L, 6);
    }
    if (focus) for (const s of [-1, 1]) {
      ctx.fillStyle = '#e2d63a'; ctx.fillRect(-L, s < 0 ? -CAB_W / 2 : CAB_W / 2 - EDGE, 2 * L, EDGE);
      ctx.fillStyle = '#a69a20'; ctx.fillRect(-L, s < 0 ? -CAB_W / 2 + EDGE - 0.6 : CAB_W / 2 - EDGE, 2 * L, 0.6);
    } else { ctx.strokeStyle = 'rgba(120,108,20,0.85)'; ctx.lineWidth = 1.5; ctx.strokeRect(-L, v0 - CAB_W / 2, 2 * L, CAB_W); }
  }
  // 头发：1.6 秒起从右边横着滑进来，躺在玻璃丝旁边，和它平行
  const slide = smooth((t - 1.6) / 0.7), hv = 14 + (1 - slide) * 70;
  if (slide > 0) {
    ctx.strokeStyle = 'rgba(20,10,5,0.5)'; ctx.lineWidth = HAIR_W + 0.7; ctx.lineCap = 'butt';
    ctx.beginPath(); ctx.moveTo(-L, hv); ctx.lineTo(L, hv); ctx.stroke();
    ctx.strokeStyle = '#4f2f1b'; ctx.lineWidth = HAIR_W;
    ctx.beginPath(); ctx.moveTo(-L, hv); ctx.lineTo(L, hv); ctx.stroke();
    ctx.strokeStyle = 'rgba(205,150,105,0.75)'; ctx.lineWidth = 0.9;
    ctx.beginPath(); ctx.moveTo(-L, hv - 1.5); ctx.lineTo(L, hv - 1.5); ctx.stroke();
  }
  const m = ctx.getTransform();
  ctx.restore();
  const sp = (u, v) => { const x = u * Math.cos(0) , _ = x; return [m.a * u + m.c * v + m.e, m.b * u + m.d * v + m.f]; };
  const fade = a => smooth((t - a) / 0.2);
  const lab = (text, a, u, v, lead) => {
    if (t < a) return;
    const [x, y] = sp(u, v);
    ctx.save(); ctx.globalAlpha = fade(a);
    if (lead) { const [x2, y2] = sp(u, 0); ctx.strokeStyle = 'rgba(235,250,255,0.9)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x2, y2); ctx.stroke(); ctx.fillStyle = '#eaffff'; ctx.beginPath(); ctx.arc(x2, y2, 3.5, 0, 7); ctx.fill(); }
    ctx.font = `30px ${FONT}`; const w = ctx.measureText(text).width;
    label(ctx, text, clamp(x - w / 2, 14, W - w - 14), y, 30);
    ctx.restore();
  };
  lab('玻璃丝', 1.5, -26, -19, false);
  lab('头发', 2.0, -2, 14, false);
  lab('光', 2.4, 26, -19, true);
  bigText(ctx, ['AI 芯片之间传数据', '为什么要用玻璃丝？'], t, 705, 46);
}

// ---------------- B ----------------
const VP = [270, 470], Y0 = 815, W0 = 300, ZMAX = 14;
function renderB(ctx, t) {
  bg(ctx);
  const push = 1 + 0.12 * smooth(t / 4.0) + 0.02 * t / 4;   // 镜头缓慢往远处推
  ctx.save();
  ctx.translate(VP[0], VP[1]); ctx.scale(push, push); ctx.translate(-VP[0], -VP[1]);
  // 地面：越近越亮，地平线处一条淡光；几条收向灭点的细线
  const gg = ctx.createLinearGradient(0, VP[1], 0, 960);
  gg.addColorStop(0, 'rgba(60,120,140,0.20)'); gg.addColorStop(1, 'rgba(20,50,65,0.0)');
  ctx.fillStyle = gg; ctx.fillRect(0, VP[1], W, 500);
  ctx.strokeStyle = 'rgba(140,200,220,0.07)'; ctx.lineWidth = 2;
  for (const x of [-300, -120, 60, 480, 660, 840]) { ctx.beginPath(); ctx.moveTo(VP[0], VP[1]); ctx.lineTo(x, 1000); ctx.stroke(); }
  // 金色线：逐行画，用透视 z = (Y0-VP)/(y-VP)。条纹周期在 z 里固定，越远越密；对比度随 z 衰减，最后融成暗金色
  const PER = 0.2, SPEED = 1.6, span = Y0 - VP[1];
  for (let y = Y0; y > VP[1] + 3; y -= 1) {
    const z = span / (y - VP[1]);
    const zn = span / (y - 1 - VP[1]);
    let bsum = 0; for (let q = 0; q < 6; q++) { const zz = z + (zn - z) * (q + 0.5) / 6; const ix = Math.floor((zz - SPEED * t) / PER); bsum += PATTERN[((-ix % 8) + 8) % 8] ? 1 : 0.12; }
    const bit = bsum / 6;
    const fade = Math.exp(-(z - 1) / 2.0) * (1 - smooth((z - 2.5) / 5));   // 条纹对比度：近处 1，到 z≈7.5 时降到 0，远处是均匀暗金
    const mean = 0.45, val = mean + (bit - mean) * fade;
    const w = W0 / z;
    const haze = Math.min(1, (z - 1) / 9);               // 越远越融进背景，边也虚
    const alpha = 0.95 - 0.55 * haze;
    const col = [GOLD[0] * val + 40 * (1 - val), GOLD[1] * val + 28 * (1 - val), GOLD[2] * val + 14 * (1 - val)];
    ctx.fillStyle = rgba(col, alpha);
    ctx.fillRect(VP[0] - w / 2, y, w, 1.6);
    // 边缘虚化：远处加两侧渐隐的软边
    if (z > 2) { const soft = Math.min(6, w * 0.35); ctx.fillStyle = rgba(col, alpha * 0.35); ctx.fillRect(VP[0] - w / 2 - soft, y, soft, 1.2); ctx.fillRect(VP[0] + w / 2, y, soft, 1.2); }
  }
  // 线两侧的近处亮边
  ctx.strokeStyle = 'rgba(255,200,100,0.35)'; ctx.lineWidth = 2;
  for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(VP[0] + s * W0 / 2, Y0); ctx.lineTo(VP[0] + s * W0 / 2 / 5, VP[1] + span / 5); ctx.stroke(); }
  // 远处机柜：小轮廓，在雾里
  const cabX = VP[0], cabY = VP[1] - 4;
  const cw = 52, chh = 88;
  const ask = smooth((t - 1.6) / 0.35), pulse = ask * (0.65 + 0.35 * Math.sin((t - 1.6) * 9));
  if (ask > 0) { const g = ctx.createRadialGradient(cabX, cabY - chh / 2, 2, cabX, cabY - chh / 2, 90); g.addColorStop(0, rgba(CORAL, 0.55 * pulse)); g.addColorStop(1, rgba(CORAL, 0)); ctx.fillStyle = g; ctx.fillRect(cabX - 100, cabY - chh / 2 - 100, 200, 200); }
  ctx.fillStyle = 'rgba(34,66,82,0.95)'; ctx.fillRect(cabX - cw / 2, cabY - chh, cw, chh);
  ctx.strokeStyle = ask > 0 ? rgba([255, 150, 135], 0.55 + 0.4 * pulse) : 'rgba(150,200,215,0.6)'; ctx.lineWidth = 1.5; ctx.strokeRect(cabX - cw / 2, cabY - chh, cw, chh);
  ctx.fillStyle = 'rgba(150,200,215,0.45)';
  for (let i = 0; i < 6; i++) ctx.fillRect(cabX - cw / 2 + 8, cabY - chh + 9 + i * 13, cw - 16, 5);
  if (ask > 0) {
    ctx.font = `bold 40px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(5,16,24,0.9)'; ctx.strokeText('?', cabX, cabY - chh - 28 - 4 * Math.sin((t - 1.6) * 6));
    ctx.fillStyle = rgba(CORAL, ask); ctx.fillText('?', cabX, cabY - chh - 28 - 4 * Math.sin((t - 1.6) * 6));
  }
  // 一排八条消息：亮亮暗亮暗暗亮暗；微微闪，表示在发出去
  const bw = 34, gap = 10, x0 = W / 2 - (8 * bw + 7 * gap) / 2;
  for (let i = 0; i < 8; i++) {
    const on = PATTERN[i], sh = 0.9 + 0.1 * Math.sin(t * 8 + i);
    const x = x0 + i * (bw + gap);
    if (on) { ctx.fillStyle = rgba(GOLD, 0.25 * sh); ctx.fillRect(x - 3, Y0 + 4, bw + 6, 58); }
    ctx.fillStyle = on ? rgba([255, 200, 90], sh) : 'rgba(110,80,35,0.9)';
    ctx.beginPath(); ctx.roundRect(x, Y0 + 8, bw, 50, 5); ctx.fill();
  }
  ctx.restore();
  const bs = (x, y) => [VP[0] + (x - VP[0]) * push, VP[1] + (y - VP[1]) * push];
  { const [x, y] = bs(cabX + cw / 2 + 14, cabY - chh / 2); ctx.save(); ctx.globalAlpha = smooth((t - 0.5) / 0.25); label(ctx, '对面的芯片', x + 10, y, 26); ctx.restore(); }
  { const zc = 2.2, [x, y] = bs(VP[0] + W0 / 2 / zc + 22, VP[1] + span / zc); ctx.save(); ctx.globalAlpha = smooth((t - 0.8) / 0.25); label(ctx, '铜线', x, y, 28); ctx.restore(); }
  bigText(ctx, ['这条消息', '送得到吗？'], t, 120, 60);
}

function renderFrame(t, opt) {
  const variant = (opt && opt.variant) || 'A';
  const ctx = document.getElementById('c').getContext('2d');
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  (variant === 'A' ? renderA : renderB)(ctx, t);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.font = `15px ${FONT}`; ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.fillStyle = 'rgba(220,235,240,0.55)';
  ctx.fillText(`概念测试 T0-${variant} · 二维粗样 · 非成片 · 示意`, 14, 12);
}
window.renderFrame = renderFrame;
</script>
