<!doctype html>
<meta charset="utf-8">
<title>T0 两个开场</title>
<style>
  html, body { margin: 0; background: #000; }
  canvas { display: block; width: 540px; height: 960px; }
</style>
<canvas id="c" width="540" height="960"></canvas>
<script>
// T0 概念测试：两个开场 0–4 秒。二维示意，不是成片画面。
//   A「玻璃丝奇观」：一把黄线缆，镜头推近一根，外皮变透明，露出玻璃丝，一根头发作比例。
//   B「这条消息送得到吗？」：一排比特 → 金色线伸向远处，条纹越远越虚，远处机柜冒出珊瑚色问号。
// window.renderFrame(t, {variant:'A'|'B'}) 画出第 t 秒的一帧。只有静音版，无字幕。
const W = 540, H = 960;
const FONT = '"WenQuanYi Zen Hei", "Noto Sans CJK SC", sans-serif';
const CYAN = [86, 232, 240], GOLD = [255, 190, 70], CORAL = [255, 122, 107];
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const smooth = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${clamp(a, 0, 1)})`;
const PATTERN = [1, 1, 0, 1, 0, 0, 1, 0];   // 亮亮暗亮暗暗亮暗

function bg(ctx) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#123a4a'); g.addColorStop(0.55, '#0d2d3d'); g.addColorStop(1, '#0a2231');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function bigText(ctx, lines, t, yTop, size = 50) {
  // 大字：0.3 秒内出现（第一帧已经有字，半透明 + 略偏下），深色底衬 + 描边
  const k = smooth(t / 0.3), alpha = 0.75 + 0.25 * k, dy = (1 - k) * 12;
  ctx.font = `bold ${size}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const lh = size * 1.3;
  const w = Math.max(...lines.map(l => ctx.measureText(l).width));
  const h = lines.length * lh + 20;
  ctx.fillStyle = `rgba(5,16,24,${0.80 * alpha})`;
  ctx.beginPath(); ctx.roundRect(W / 2 - w / 2 - 22, yTop + dy, w + 44, h, 14); ctx.fill();
  lines.forEach((l, i) => {
    const y = yTop + dy + 10 + lh * (i + 0.5);
    ctx.lineJoin = 'round'; ctx.lineWidth = 6; ctx.strokeStyle = `rgba(5,16,24,${alpha})`; ctx.strokeText(l, W / 2, y);
    ctx.fillStyle = `rgba(255,250,235,${alpha})`; ctx.fillText(l, W / 2, y);
  });
}
function label(ctx, text, x, y, size = 24) {
  ctx.font = `${size}px ${FONT}`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  const w = ctx.measureText(text).width, pad = 8;
  ctx.fillStyle = 'rgba(4,16,24,0.78)'; ctx.beginPath(); ctx.roundRect(x - pad, y - size * 0.75, w + pad * 2, size * 1.5, 6); ctx.fill();
  ctx.fillStyle = 'rgba(240,248,250,0.95)'; ctx.fillText(text, x, y + 1);
}

// ---------------- A ----------------
// 世界坐标：u 沿线缆，v 横向。线缆宽 70，玻璃丝宽 9.6，头发宽 6（比例 玻璃丝:头发 = 1.6），走光的芯宽 0.7（约头发的 1/9）。
const CAB_W = 70, FIB_W = 9.6, HAIR_W = 6, CORE_W = 0.7;
const FIB_V = [-21, -7, 7, 21], LIGHT_FIB = 0;       // 走光的是 v=-21 这一根（最外侧，紧挨头发）
const AXIS = -1.15;                                  // 线缆倾斜角
const HAIR_PATH = [[700, -330], [450, -200], [260, -100], [120, -45], [0, -33], [-600, -33]];  // 头发：从右上斜着进来，贴着玻璃丝躺下
function renderA(ctx, t) {
  bg(ctx);
  // 镜头：从 1.25 倍推到 3.0 倍，第一帧起就在动
  const k = clamp(t / 4.0, 0, 1), z = 1.25 * Math.pow(3.0 / 1.25, k * (2 - k) * 0.9 + 0.1 * k);
  const cx = 270, cy = 400;
  const jacket = smooth((t - 0.8) / 0.7);            // 0.8–1.5 秒外皮变透明
  ctx.save();
  ctx.translate(cx, cy); ctx.scale(z, z); ctx.rotate(AXIS);
  const L = 1600;
  const cabs = [-170, -85, 0, 85, 170];
  for (const v0 of cabs) {
    const focus = v0 === 0;
    // 里面的玻璃丝（只在焦点线缆里画，外皮透明后才看得见）
    if (focus) {
      ctx.fillStyle = 'rgba(30,50,40,1)';
      ctx.fillRect(-L, v0 - CAB_W / 2, 2 * L, CAB_W);                    // 外皮底下的暗腔
      ctx.globalAlpha = jacket;
      for (let i = 0; i < FIB_V.length; i++) {
        const v = FIB_V[i];
        ctx.fillStyle = 'rgba(210,235,240,0.55)'; ctx.fillRect(-L, v - FIB_W / 2, 2 * L, FIB_W);
        ctx.fillStyle = 'rgba(235,250,255,0.75)'; ctx.fillRect(-L, v - FIB_W / 2, 2 * L, 0.8);
        ctx.fillRect(-L, v + FIB_W / 2 - 0.8, 2 * L, 0.8);
      }
      // 走光的芯：一串明暗在里面流动，亮度只在芯里，光晕比玻璃丝窄得多
      const vv = FIB_V[LIGHT_FIB], P = 14, off = (t * 150) % (P * 8);
      for (let u = -300; u < 300; u += P) {
        const idx = ((Math.floor((u + off) / P) % 8) + 8) % 8, on = PATTERN[idx];
        const a = 0.22 + 0.78 * on;
        ctx.fillStyle = rgba(CYAN, 0.30 * a); ctx.fillRect(u, vv - 1.9, P, 3.8);
        ctx.fillStyle = rgba([215, 252, 255], a); ctx.fillRect(u, vv - CORE_W * 1.5, P, CORE_W * 3);
      }
      ctx.globalAlpha = 1;
    }
    // 外皮：哑光柠檬黄，透明后只剩淡淡的一层
    const ja = 1 - 0.86 * (focus ? jacket : 0);
    ctx.fillStyle = rgba([226, 214, 58], ja); ctx.fillRect(-L, v0 - CAB_W / 2, 2 * L, CAB_W);
    ctx.fillStyle = rgba([186, 174, 36], ja * 0.9); ctx.fillRect(-L, v0 + CAB_W / 2 - 14, 2 * L, 14);   // 背光面
    ctx.fillStyle = rgba([240, 232, 120], ja * 0.5); ctx.fillRect(-L, v0 - CAB_W / 2 + 4, 2 * L, 6);   // 哑光的宽高光
    ctx.strokeStyle = rgba([120, 108, 20], 0.85 * (focus ? 1 - 0.3 * jacket : 1)); ctx.lineWidth = 1.5;
    ctx.strokeRect(-L, v0 - CAB_W / 2, 2 * L, CAB_W);
  }
  // 头发：1.5 秒起沿路径进来
  const reveal = smooth((t - 1.4) / 0.8);
  let hairLabel = null;
  if (reveal > 0) {
    // 按路径总长截取
    let total = 0; const segs = [];
    for (let i = 0; i < HAIR_PATH.length - 1; i++) { const l = Math.hypot(HAIR_PATH[i + 1][0] - HAIR_PATH[i][0], HAIR_PATH[i + 1][1] - HAIR_PATH[i][1]); segs.push(l); total += l; }
    let rem = total * reveal;
    ctx.strokeStyle = '#4a2c1a'; ctx.lineWidth = HAIR_W; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(...HAIR_PATH[0]);
    for (let i = 0; i < segs.length; i++) {
      const f = Math.min(1, rem / segs[i]);
      const x = HAIR_PATH[i][0] + (HAIR_PATH[i + 1][0] - HAIR_PATH[i][0]) * f, y = HAIR_PATH[i][1] + (HAIR_PATH[i + 1][1] - HAIR_PATH[i][1]) * f;
      ctx.lineTo(x, y); rem -= segs[i]; if (rem <= 0) break;
    }
    ctx.stroke();
    ctx.strokeStyle = 'rgba(150,100,70,0.55)'; ctx.lineWidth = 1.2; ctx.stroke();
    if (reveal > 0.99) hairLabel = [-60, -33];
  }
  const m = ctx.getTransform();
  ctx.restore();
  if (hairLabel) {
    const sx = m.a * hairLabel[0] + m.c * hairLabel[1] + m.e, sy = m.b * hairLabel[0] + m.d * hairLabel[1] + m.f;
    ctx.save(); ctx.globalAlpha = smooth((t - 2.2) / 0.25);
    label(ctx, '头发', clamp(sx + 30, 20, 440), clamp(sy - 40, 80, 560));
    ctx.restore();
  }
  bigText(ctx, ['AI 芯片之间传数据', '为什么要用玻璃丝？'], t, 705, 46);
}

// ---------------- B ----------------
const VP = [270, 470], Y0 = 815, W0 = 300, ZMAX = 14;
function renderB(ctx, t) {
  bg(ctx);
  const push = 1 + 0.12 * smooth(t / 4.0) + 0.02 * t / 4;   // 镜头缓慢往远处推
  ctx.save();
  ctx.translate(VP[0], VP[1]); ctx.scale(push, push); ctx.translate(-VP[0], -VP[1]);
  // 地面：越近越亮，地平线处一条淡光；几条收向灭点的细线
  const gg = ctx.createLinearGradient(0, VP[1], 0, 960);
  gg.addColorStop(0, 'rgba(60,120,140,0.20)'); gg.addColorStop(1, 'rgba(20,50,65,0.0)');
  ctx.fillStyle = gg; ctx.fillRect(0, VP[1], W, 500);
  ctx.strokeStyle = 'rgba(140,200,220,0.07)'; ctx.lineWidth = 2;
  for (const x of [-300, -120, 60, 480, 660, 840]) { ctx.beginPath(); ctx.moveTo(VP[0], VP[1]); ctx.lineTo(x, 1000); ctx.stroke(); }
  // 金色线：逐行画，用透视 z = (Y0-VP)/(y-VP)。条纹周期在 z 里固定，越远越密；对比度随 z 衰减，最后融成暗金色
  const PER = 0.2, SPEED = 1.6, span = Y0 - VP[1];
  for (let y = Y0; y > VP[1] + 3; y -= 1) {
    const z = span / (y - VP[1]);
    const idx = Math.floor((z - SPEED * t) / PER);
    const bit = PATTERN[((-idx % 8) + 8) % 8];
    const fade = Math.exp(-(z - 1) / 2.0);               // 条纹对比度：近处 1，远处趋于 0
    const mean = 0.45, val = mean + ((bit ? 1 : 0.12) - mean) * fade;
    const w = W0 / z;
    const haze = Math.min(1, (z - 1) / 9);               // 越远越融进背景，边也虚
    const alpha = 0.95 - 0.55 * haze;
    const col = [GOLD[0] * val + 40 * (1 - val), GOLD[1] * val + 28 * (1 - val), GOLD[2] * val + 14 * (1 - val)];
    ctx.fillStyle = rgba(col, alpha);
    ctx.fillRect(VP[0] - w / 2, y, w, 1.2);
    // 边缘虚化：远处加两侧渐隐的软边
    if (z > 2) { const soft = Math.min(6, w * 0.35); ctx.fillStyle = rgba(col, alpha * 0.35); ctx.fillRect(VP[0] - w / 2 - soft, y, soft, 1.2); ctx.fillRect(VP[0] + w / 2, y, soft, 1.2); }
  }
  // 线两侧的近处亮边
  ctx.strokeStyle = 'rgba(255,200,100,0.35)'; ctx.lineWidth = 2;
  for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(VP[0] + s * W0 / 2, Y0); ctx.lineTo(VP[0] + s * W0 / 2 / 5, VP[1] + span / 5); ctx.stroke(); }
  // 远处机柜：小轮廓，在雾里
  const cabX = VP[0], cabY = VP[1] - 4;
  const cw = 26, chh = 44;
  const ask = smooth((t - 2.5) / 0.35), pulse = ask * (0.65 + 0.35 * Math.sin((t - 2.5) * 9));
  if (ask > 0) { const g = ctx.createRadialGradient(cabX, cabY - chh / 2, 2, cabX, cabY - chh / 2, 48); g.addColorStop(0, rgba(CORAL, 0.55 * pulse)); g.addColorStop(1, rgba(CORAL, 0)); ctx.fillStyle = g; ctx.fillRect(cabX - 60, cabY - chh / 2 - 60, 120, 120); }
  ctx.fillStyle = 'rgba(34,66,82,0.95)'; ctx.fillRect(cabX - cw / 2, cabY - chh, cw, chh);
  ctx.strokeStyle = ask > 0 ? rgba([255, 150, 135], 0.55 + 0.4 * pulse) : 'rgba(150,200,215,0.6)'; ctx.lineWidth = 1.5; ctx.strokeRect(cabX - cw / 2, cabY - chh, cw, chh);
  ctx.fillStyle = 'rgba(150,200,215,0.45)';
  for (let i = 0; i < 6; i++) ctx.fillRect(cabX - cw / 2 + 4, cabY - chh + 5 + i * 7, cw - 8, 3);
  if (ask > 0) {
    ctx.font = `bold 34px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(5,16,24,0.9)'; ctx.strokeText('?', cabX, cabY - chh - 26 - 4 * Math.sin((t - 2.5) * 6));
    ctx.fillStyle = rgba(CORAL, ask); ctx.fillText('?', cabX, cabY - chh - 26 - 4 * Math.sin((t - 2.5) * 6));
  }
  // 一排八条消息：亮亮暗亮暗暗亮暗；微微闪，表示在发出去
  const bw = 34, gap = 10, x0 = W / 2 - (8 * bw + 7 * gap) / 2;
  for (let i = 0; i < 8; i++) {
    const on = PATTERN[i], sh = 0.9 + 0.1 * Math.sin(t * 8 + i);
    const x = x0 + i * (bw + gap);
    if (on) { ctx.fillStyle = rgba(GOLD, 0.25 * sh); ctx.fillRect(x - 3, Y0 + 4, bw + 6, 58); }
    ctx.fillStyle = on ? rgba([255, 200, 90], sh) : 'rgba(110,80,35,0.9)';
    ctx.beginPath(); ctx.roundRect(x, Y0 + 8, bw, 50, 5); ctx.fill();
  }
  ctx.restore();
  bigText(ctx, ['这条消息', '送得到吗？'], t, 120, 60);
}

function renderFrame(t, opt) {
  const variant = (opt && opt.variant) || 'A';
  const ctx = document.getElementById('c').getContext('2d');
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  (variant === 'A' ? renderA : renderB)(ctx, t);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.font = `15px ${FONT}`; ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.fillStyle = 'rgba(220,235,240,0.55)';
  ctx.fillText(`概念测试 T0-${variant} · 二维粗样 · 非成片 · 示意`, 14, 12);
}
window.renderFrame = renderFrame;
</script>
