<!doctype html>
<html><head><meta charset="utf-8">
<title>AI 灵魂拷问 EP.01 · strawberry</title>
<style>
@font-face { font-family: NS; src: url(assets/fonts/NotoSansSC-500.woff); font-weight: 500; }
@font-face { font-family: NS; src: url(assets/fonts/NotoSansSC-700.woff); font-weight: 700; }
@font-face { font-family: NS; src: url(assets/fonts/NotoSansSC-900.woff); font-weight: 900; }
@font-face { font-family: IN; src: url(assets/fonts/Inter-var.woff); font-weight: 100 900; }
html, body { margin: 0; background: #000; }
canvas { display: block; }
</style></head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="timeline.js"></script>
<script>
// 「AI 灵魂拷问」EP.01 — draft. window.seek(t) is a pure function of t; randomness only from seeded mulberry32.
// Look of the series (proposal): warm cream "toy-block" world on the surface (phone / AI model layers), deep navy once we
// dig into the chip. The depth gauge on the left says how deep we are. Tokens are toy bricks.
const { W, H, L, END_CARD, DUR } = window.TL;
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const a = (i) => L[i].t0, b = (i) => L[i].t1;

// ---------- palette ----------
const C = {
  cream: "#F3EEE3", ink: "#1C1B22", soft: "rgba(28,27,34,.55)", tile: "#FFFDF8", edge: "#D8D0C0",
  red: "#E5483B", yellow: "#F2B33D", blue: "#2F6FDB", green: "#2FA36B",
  navy: "#111A2C", glow: "#FFD166", paper: "#F6F3EC", skin: "#EBCBA5",
};
const BRICK = [C.red, C.yellow, C.blue, C.green];
// motion tuning (studio rule: no still stretch > 0.6 s). cam = slow floating camera in px; amb* = drifting background bricks
const TUNE = Object.assign({ plate: 0.045, plateV: 60, cam: 12, camW: 1.2, bob: 8, camS: 0.007, ambA: 0.12, ambN: 22, ambV: 1.3, ambS: 1 }, window.TUNE || {});

// ---------- math ----------
const clamp = (x, lo = 0, hi = 1) => Math.max(lo, Math.min(hi, x));
const ramp = (t, t0, t1) => clamp((t - t0) / (t1 - t0));
const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const eo = (x) => 1 - Math.pow(1 - x, 3);
const back = (x) => { const c1 = 1.9, c3 = c1 + 1; return x <= 0 ? 0 : x >= 1 ? 1 : 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (p, q, x) => p + (q - p) * x;
const vis = (t, t0, t1, fi = 0.3, fo = 0.3) => ramp(t, t0, t0 + fi) * (1 - ramp(t, t1 - fo, t1));
const bump = (t, t0, d = 0.35) => Math.sin(Math.PI * ramp(t, t0, t0 + d));
function mulberry(seed) { return function () { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let x = Math.imul(seed ^ (seed >>> 15), 1 | seed); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; }; }
const hash = (i) => mulberry(i * 7919 + 13)();
function hex(c) { const n = parseInt(c.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function mixc(c1, c2, x) { const p = hex(c1), q = hex(c2); return `rgb(${p.map((v, i) => Math.round(lerp(v, q[i], x))).join(",")})`; }
function shade(c, k) { const p = hex(c); return `rgb(${p.map((v) => Math.round(k < 0 ? v * (1 + k) : v + (255 - v) * k)).join(",")})`; }

// ---------- drawing helpers ----------
const F = (w, s) => `${w} ${s}px NS, "Noto Sans CJK SC", sans-serif`;
const FI = (w, s) => `${w} ${s}px IN, NS, "Noto Sans CJK SC", sans-serif`;
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function txt(s, x, y, o = {}) {
  ctx.save(); ctx.font = o.font || F(700, 40); ctx.fillStyle = o.color || C.ink;
  ctx.textAlign = o.align || "center"; ctx.textBaseline = o.base || "middle"; ctx.globalAlpha *= o.alpha ?? 1;
  ctx.fillText(s, x, y); ctx.restore();
}
function tw(s, font) { ctx.save(); ctx.font = font; const w = ctx.measureText(s).width; ctx.restore(); return w; }
// rich text: [word] is drawn in the highlight colour
function rich(s, x, y, font, color, hl, align = "center") {
  const parts = []; s.replace(/\[([^\]]+)\]|([^\[]+)/g, (m, h, n) => parts.push(h ? [h, hl] : [n, color]));
  ctx.save(); ctx.font = font; ctx.textBaseline = "middle"; ctx.textAlign = "left";
  const total = parts.reduce((w, p) => w + ctx.measureText(p[0]).width, 0);
  let cx = align === "center" ? x - total / 2 : x;
  for (const [str, col] of parts) { ctx.fillStyle = col; ctx.fillText(str, cx, y); cx += ctx.measureText(str).width; }
  ctx.restore(); return total;
}
function pill(s, x, y, o = {}) {
  const font = o.font || F(700, 34), w = tw(s, font) + (o.padX ?? 40), h = o.h || 64;
  ctx.save(); ctx.globalAlpha *= o.alpha ?? 1;
  ctx.translate(x, y); ctx.scale(o.scale ?? 1, o.scale ?? 1); ctx.rotate(o.rot || 0);
  ctx.fillStyle = o.bg || C.ink; rr(-w / 2, -h / 2, w, h, h / 2); ctx.fill();
  if (o.stroke) { ctx.lineWidth = 4; ctx.strokeStyle = o.stroke; ctx.stroke(); }
  txt(s, 0, 2, { font, color: o.color || C.paper });
  ctx.restore();
}
// a toy brick: body + studs on top. letters (optional) are drawn by the caller.
function brick(cx, cy, w, h, col, o = {}) {
  const x = cx - w / 2, y = cy - h / 2, al = o.alpha ?? 1;
  if (al <= 0) return;
  ctx.save(); ctx.globalAlpha *= al;
  ctx.fillStyle = "rgba(0,0,0,.13)"; rr(x + 3, y + 9, w, h, 14); ctx.fill();
  const n = Math.max(1, Math.round(w / 66)), st = o.stud ?? 1;
  if (st > 0) {
    const sw = Math.min(30, (w / n) * 0.5), sh = 15 * st;
    ctx.fillStyle = shade(col, -0.12);
    for (let i = 0; i < n; i++) { const sx = x + ((i + 0.5) * w) / n; rr(sx - sw / 2, y - sh + 2, sw, sh + 6, 5); ctx.fill(); }
  }
  ctx.fillStyle = col; rr(x, y, w, h, 14); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,.2)"; rr(x + 7, y + 6, w - 14, Math.min(22, h * 0.24), 9); ctx.fill();
  if (o.label) txt(o.label, cx, cy + 3, { font: o.font || F(900, o.size || 46), color: o.tc || "#fff", alpha: o.la ?? 1 });
  if (o.ring) { ctx.lineWidth = 6; ctx.strokeStyle = o.ring; rr(x - 10, y - 22, w + 20, h + 32, 20); ctx.stroke(); }
  ctx.restore();
}
function tile(cx, cy, s, ch, o = {}) {
  const al = o.alpha ?? 1; if (al <= 0) return;
  ctx.save(); ctx.globalAlpha *= al;
  if ((o.box ?? 1) > 0) {
    ctx.globalAlpha *= o.box ?? 1;
    ctx.fillStyle = o.bg || C.tile; rr(cx - s / 2, cy - s / 2, s, s, s * 0.2); ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = o.edge || C.edge; ctx.stroke();
    ctx.globalAlpha /= o.box ?? 1;
  }
  txt(ch, cx, cy + s * 0.01, { font: FI(800, s * 0.6), color: o.fg || C.ink });
  ctx.restore();
}

// ---------- depth (0 phone · 1 AI model · 2 chip · 3 memory) ----------
function level(t) {
  let v = 0;
  v += ease(ramp(t, a(6) + 0.2, a(6) + 0.9));
  v += ease(ramp(t, a(23) - 0.2, a(23) + 0.6));
  v -= 2 * ease(ramp(t, a(27) - 0.3, a(27) + 0.7));
  return v;
}
const dark = (t) => clamp(level(t) - 1);

// ---------- background + ambient bricks ----------
function background(t) {
  const k = dark(t);
  ctx.fillStyle = C.cream; ctx.fillRect(0, 0, W, H);
  // the cream world stands on a toy baseplate: sparse studs, drifting slowly (keeps the frame alive between beats)
  if (TUNE.plate > 0) {
    const P = 120, off = (t * TUNE.plateV) % P;
    ctx.save(); ctx.lineWidth = 5;
    for (let y = -P; y < H + P; y += P) for (let x = -P; x < W + P; x += P) {
      const cx = x + off + P / 2, cy = y + off * 0.6 + P / 2;
      ctx.strokeStyle = `rgba(28,27,34,${TUNE.plate})`; ctx.beginPath(); ctx.arc(cx, cy, 20, 0, 7); ctx.stroke();
      ctx.strokeStyle = `rgba(255,255,255,${TUNE.plate * 4})`; ctx.beginPath(); ctx.arc(cx - 2, cy - 2, 14, 3.4, 5.2); ctx.stroke();
    }
    ctx.restore();
  }
  if (k > 0) { // going down into the chip: the dark opens from the chip's centre (an iris), and closes again on the way up
    ctx.fillStyle = C.navy; ctx.beginPath(); ctx.arc(560, 900, 1250 * eo(k), 0, 7); ctx.fill();
    const g = ctx.createRadialGradient(560, 900, 60, 560, 900, 820);
    g.addColorStop(0, `rgba(60,90,150,${0.35 * k})`); g.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  for (let i = 0; i < TUNE.ambN; i++) {
    const r = mulberry(i * 31 + 5), x = 60 + r() * 960, sp = (26 + r() * 30) * TUNE.ambV, ph = r() * 2400, sz = (26 + r() * 30) * TUNE.ambS;
    const y = H + 120 - ((t * sp + ph) % (H + 260));
    const sway = Math.sin(t * 0.6 + i) * 14;
    ctx.save(); ctx.translate(x + sway, y); ctx.rotate(Math.sin(t * 0.4 + i * 2) * 0.4);
    if (k < 1) { ctx.globalAlpha = TUNE.ambA * (1 - k); ctx.fillStyle = BRICK[i % 4]; rr(-sz / 2, -sz * 0.35, sz, sz * 0.7, 6); ctx.fill(); }
    if (k > 0) { ctx.globalAlpha = 0.35 * k; ctx.fillStyle = C.glow; ctx.beginPath(); ctx.arc(0, 0, 2 + sz / 14, 0, 7); ctx.fill(); }
    ctx.restore();
  }
}

// ---------- A · the chat on a phone ----------
const PH = { cx: 560, cy: 820, w: 480, h: 760 }, PS = 1.18;   // drawn at PS× around its centre
const Q = "strawberry 里有几个 r？", QF = F(700, 32);
function qLayout() {
  const w = tw(Q, QF) + 44, x = PH.cx + PH.w / 2 - 34 - w, y = PH.cy - PH.h / 2 + 170;
  const x0 = x + 22, word = "strawberry";
  const xs = []; for (let i = 0; i < word.length; i++) xs.push(PH.cx + PS * (x0 + tw(word.slice(0, i), QF) + tw(word[i], QF) / 2 - PH.cx));
  return { x, y, w, h: 76, xs, ty: PH.cy + PS * (y + 38 - PH.cy) };
}
function scenePhone(t) {
  const out = ease(ramp(t, a(1) + 0.78, a(1) + 1.35));   // leaves after every letter has left the bubble
  if (out >= 1) return;
  const { w, h } = PH, cy = PH.cy, cx = PH.cx - 1400 * out;      // slides out to the left (fully off-screen at out = 1)
  ctx.save();
  ctx.translate(cx, cy); ctx.rotate(Math.sin(t * 0.9) * 0.01 - 0.12 * out); ctx.scale(PS, PS); ctx.translate(-cx, -cy);
  ctx.fillStyle = "rgba(0,0,0,.14)"; rr(cx - w / 2 + 10, cy - h / 2 + 22, w, h, 64); ctx.fill();
  ctx.fillStyle = "#23232B"; rr(cx - w / 2, cy - h / 2, w, h, 64); ctx.fill();
  ctx.fillStyle = "#FBFAF7"; rr(cx - w / 2 + 14, cy - h / 2 + 14, w - 28, h - 28, 52); ctx.fill();
  ctx.fillStyle = "#23232B"; rr(cx - 56, cy - h / 2 + 28, 112, 30, 15); ctx.fill();
  txt("AI 助手", cx, cy - h / 2 + 98, { font: F(700, 30) });
  ctx.fillStyle = "rgba(0,0,0,.08)"; ctx.fillRect(cx - w / 2 + 14, cy - h / 2 + 130, w - 28, 2);
  // the question (the word strawberry leaves the bubble when the letters fly out)
  const q0 = qLayout(), q = { ...q0, x: q0.x + (cx - PH.cx) }, qy = q.y;
  ctx.fillStyle = C.blue; rr(q.x, qy, q.w, q.h, 26); ctx.fill();
  const go = 1 - ramp(t, a(1) + 0.42, a(1) + 0.5);
  ctx.save(); ctx.font = QF; ctx.textBaseline = "middle"; ctx.fillStyle = "#fff";
  ctx.globalAlpha *= go; ctx.fillText("strawberry", q.x + 22, qy + 38); ctx.globalAlpha /= Math.max(go, 1e-6) || 1;
  ctx.restore();
  ctx.save(); ctx.font = QF; ctx.textBaseline = "middle"; ctx.fillStyle = "#fff";
  ctx.fillText(" 里有几个 r？", q.x + 22 + tw("strawberry", QF), qy + 38); ctx.restore();
  // the answer pops at frame 0
  const pop = back(ramp(t, -0.12, 0.3)), ay = qy + 130;
  ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(cx - w / 2 + 62, ay + 38, 24, 0, 7); ctx.fill();
  txt("AI", cx - w / 2 + 62, ay + 39, { font: FI(800, 20), color: C.paper });
  ctx.save(); ctx.translate(cx - w / 2 + 100, ay + 38); ctx.scale(pop, pop);
  ctx.fillStyle = "#ECE8DF"; rr(0, -42, 170, 84, 28); ctx.fill();
  txt("2 个。", 85, 2, { font: F(900, 42) });
  ctx.restore();
  // typing dots under the answer, so the screen is alive
  for (let i = 0; i < 3; i++) { ctx.fillStyle = `rgba(28,27,34,${0.15 + 0.25 * Math.max(0, Math.sin(t * 6 - i))})`; ctx.beginPath(); ctx.arc(cx - w / 2 + 112 + i * 22, ay + 130, 6, 0, 7); ctx.fill(); }
  txt("示意：早期 AI 的常见错答", cx, cy + h / 2 - 60, { font: F(700, 30), color: "rgba(28,27,34,.6)" });
  ctx.restore();
}

// ---------- A→B · the word on letter tiles ----------
const WORD = "strawberry", S = 68, G = 6;
const RCX = 545, TX = (i) => RCX - (10 * S + 9 * G) / 2 + S / 2 + i * (S + G);
const ROWY = 800;
const GROUP = (i) => (i < 3 ? 0 : i < 5 ? 1 : 2);
const GCOL = [C.red, C.yellow, C.blue];
const ISR = (i) => i === 2 || i === 7 || i === 8;
function sceneWord(t) {
  const t0 = a(1) + 0.42;
  if (t < t0 || t > a(10) + 0.6) return;
  const exit = ease(ramp(t, a(10) - 0.1, a(10) + 0.5));          // the merged brick leaves when the chain-word scene starts
  const q = qLayout();
  const rIdx = [2, 7, 8];
  const redOn = (i) => { const k = rIdx.indexOf(i); return k < 0 ? 0 : ramp(t, a(2) + 0.05 + k * 0.3, a(2) + 0.25 + k * 0.3) * (1 - ramp(t, a(4) + 3.2, a(4) + 3.6)); };
  // reading sweep (L4): one letter at a time
  const rs = (t - a(5) - 0.45) / 0.22, readIdx = rs >= 0 && rs < 10 ? Math.floor(rs) : -1;
  // cut (L5)
  const cutT = a(6) + 0.5, sep = ease(ramp(t, cutT + 0.3, cutT + 0.8)), m = ease(ramp(t, cutT + 0.8, cutT + 1.6));
  const merge = ease(ramp(t, a(8) + 0.9, a(8) + 1.7));
  const gdx = [-24, 0, 24].map((d) => d * sep * (1 - merge));
  const bounce = (g) => -26 * bump(t, a(7) + 0.95 + g * 0.62, 0.38) - 16 * bump(t, a(6) + 3.1 + g * 0.18, 0.32) - 16 * bump(t, a(7) - 0.15 + g * 0.18, 0.32);
  ctx.save(); ctx.globalAlpha = 1 - exit; ctx.translate(0, -140 * exit);
  // bricks under the tiles
  if (m > 0) {
    for (let g = 0; g < 3; g++) {
      const ids = [...WORD].map((_, i) => i).filter((i) => GROUP(i) === g);
      const x0 = TX(ids[0]) + gdx[g] - S / 2 - 10, x1 = TX(ids[ids.length - 1]) + gdx[g] + S / 2 + 10;
      brick((x0 + x1) / 2, ROWY + bounce(g) + TUNE.bob * Math.sin(t * 2.4 - g * 1.2), x1 - x0, 104, GCOL[g], { alpha: m * (1 - merge), stud: m });
    }
    if (merge > 0) brick(RCX, ROWY + TUNE.bob * Math.sin(t * 2.4 - 1.2), TX(9) - TX(0) + S + 20, 104, C.green, { alpha: merge, stud: 1 });
  }
  for (let i = 0; i < 10; i++) {
    const tf = t0 + i * 0.035, p = ease(ramp(t, tf, tf + 0.65));
    const x = lerp(q.xs[i], TX(i), p) + gdx[GROUP(i)], y0 = q.ty + (PH.cy - PH.cy);
    let y = lerp(y0, ROWY, p) + (m > 0 ? bounce(GROUP(i)) : 0) + TUNE.bob * p * Math.sin(t * 2.4 - (m > 0 ? GROUP(i) * 1.2 : i * 0.5));
    const lift = i === readIdx ? -12 : 0;
    const s = lerp(30 * PS, S, p);
    const r = redOn(i);
    const fg = m > 0 ? mixc(C.ink, "#FFFFFF", m) : r > 0 ? mixc(C.ink, "#FFFFFF", r) : C.ink;
    const letterAlpha = 1 - 0.62 * merge;   // once it is one brick, the letters fade: the AI only sees the brick
    tile(x, y + lift, s, WORD[i], { box: p * (1 - m), bg: r > 0 ? mixc(C.tile, C.red, r) : i === readIdx ? "#FFF3D6" : C.tile, edge: i === readIdx ? C.yellow : C.edge, fg: p < 0.3 && m === 0 ? "#fff" : fg, alpha: letterAlpha });
  }
  // counting the r's (L2)
  rIdx.forEach((i, k) => {
    const tk = a(2) + 0.05 + k * 0.3, al = ramp(t, tk, tk + 0.12) * (1 - ramp(t, a(4) + 3.2, a(4) + 3.6));
    if (al > 0) { const s = back(ramp(t, tk, tk + 0.3)); ctx.save(); ctx.globalAlpha *= al; ctx.translate(TX(i), ROWY - 84); ctx.scale(s, s); txt(String(k + 1), 0, 0, { font: FI(900, 44), color: C.red }); ctx.restore(); }
  });
  // reading eye (L4)
  if (readIdx >= 0 || (t > a(5) && t < a(6))) {
    const ex = TX(clamp(rs, 0, 9)), al = vis(t, a(5) + 0.2, a(6) + 0.2, 0.25, 0.3);
    eye(ex, ROWY - 100, al);
  }
  // the AI's scan: while it "thinks" about the question (L1), and before the cut (L5) — a band sweeps the word
  const sc1 = ramp(t, a(1) + 1.25, b(1) - 0.8), sc5a = ramp(t, a(6) + 0.1, cutT - 0.05);
  const sc5 = sc1 > 0 && sc1 < 1 ? sc1 : sc5a;
  if (sc5 > 0 && sc5 < 1) {
    const xs = lerp(TX(0) - 60, TX(9) + 60, ease(sc5));
    ctx.save(); const g = ctx.createLinearGradient(xs - 90, 0, xs + 30, 0);
    g.addColorStop(0, "rgba(47,111,219,0)"); g.addColorStop(1, "rgba(47,111,219,.35)");
    ctx.fillStyle = g; ctx.fillRect(xs - 90, ROWY - 70, 120, 140);
    ctx.fillStyle = C.blue; ctx.fillRect(xs + 26, ROWY - 74, 6, 148); ctx.restore();
  }
  // cut lines (L5)
  const cl = ramp(t, cutT, cutT + 0.25) * (1 - ramp(t, cutT + 0.7, cutT + 1.0));
  if (cl > 0) for (const xc of [(TX(2) + TX(3)) / 2, (TX(4) + TX(5)) / 2]) {
    ctx.save(); ctx.strokeStyle = C.red; ctx.lineWidth = 6; ctx.setLineDash([16, 10]); ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(xc, ROWY - 80); ctx.lineTo(xc, ROWY - 80 + 160 * cl); ctx.stroke(); ctx.restore();
  }
  // token ids (L6–L8): the AI sees numbers, not letters
  const idA = vis(t, a(7) + 0.4, a(8) + 1.2, 0.3, 0.3), idB = vis(t, a(8) + 1.5, a(10), 0.3, 0.2);
  [["#496", 0], ["#675", 1], ["#15717", 2]].forEach(([s, g]) => {
    const ids = [...WORD].map((_, i) => i).filter((i) => GROUP(i) === g), xc = (TX(ids[0]) + TX(ids[ids.length - 1])) / 2 + gdx[g];
    txt(s, xc, ROWY + 94, { font: FI(700, 30), color: C.soft, alpha: idA });
  });
  txt("编号 #73700（GPT-4）", RCX, ROWY + 94, { font: F(700, 30), color: C.soft, alpha: idB });
  ctx.restore();
  // labels under the row
  txt("我们：一个字母一个字母地看", RCX, 960, { font: F(700, 36), color: C.ink, alpha: vis(t, a(5) + 0.45, a(6) + 0.4) });
  txt("AI：先切成一块块积木", RCX, 960, { font: F(700, 36), color: C.ink, alpha: vis(t, a(6) + 0.4, a(9) + 0.2) * (1 - exit) });
  txt("切法：GPT-4 分词器实测", RCX, 1016, { font: F(700, 34), color: C.soft, alpha: vis(t, a(7) + 0.4, a(8) + 0.4) });
  // the sentence context (L7): with a space in front, the whole word is one block
  const ctxA = vis(t, a(8) + 0.2, a(10), 0.3, 0.2);
  if (ctxA > 0) {
    ctx.save(); ctx.globalAlpha = ctxA; rich("How many r's are in [strawberry]?", RCX, 640, FI(700, 40), C.soft, C.green); ctx.restore();
    txt("句子里（前面有空格）整个词 = 1 块 · 实测", RCX, 1016, { font: F(700, 34), color: C.soft, alpha: ctxA });
    ctx.save(); ctx.globalAlpha = 1; ctx.restore();
  }
  // Token name (L8)
  const tk = ramp(t, a(9) + 1.15, a(9) + 1.5) * (1 - exit);
  if (tk > 0) {
    ctx.save(); ctx.globalAlpha = tk; ctx.strokeStyle = C.ink; ctx.lineWidth = 4;
    const x0 = TX(0) - S / 2 - 10, x1 = TX(9) + S / 2 + 10;
    ctx.beginPath(); ctx.moveTo(x0, ROWY + 128); ctx.lineTo(x0, ROWY + 140); ctx.lineTo(x1, ROWY + 140); ctx.lineTo(x1, ROWY + 128); ctx.stroke();
    ctx.restore();
    pill("Token", RCX, ROWY + 196, { font: FI(800, 40), scale: back(ramp(t, a(9) + 1.15, a(9) + 1.45)), alpha: tk, bg: C.green });
  }
  // AI's confident answer (end of L1) and the correction (L2)
  const st = vis(t, b(1) - 0.75, a(4) + 3.6, 0.2, 0.3);
  if (st > 0) {

  if (t >= L[i].t1 + 0.5) return;

  let acc = L[i].t0, idx = 0;
  for (let j = 0; j < cs.length; j++) { const d = (L[i].t1 - L[i].t0) * lens[j] / tot; if (t >= acc) idx = j; acc += d; }
  const st = L[i].t0 + (L[i].t1 - L[i].t0) * lens.slice(0, idx).reduce((x, y) => x + y, 0) / tot;
  const rows = wrap2(cs[idx].replace(/[，；：。]$/, "")).map((r) => r.replace(/[，；：。]$/, ""));
  const al = st <= 0.05 ? 1 : ramp(t, st, st + 0.1);
  const font = F(700, 52), w = Math.max(...rows.map((r) => tw(r, font)));
  const top = rows.length > 1 ? 1262 : 1306, hgt = rows.length > 1 ? 150 : 82;
  ctx.save(); ctx.globalAlpha = al;
  ctx.fillStyle = k > 0.5 ? "rgba(0,0,0,.42)" : "rgba(255,255,255,.72)"; rr(CAPX - w / 2 - 26, top, w + 52, hgt, 22); ctx.fill();
  rows.forEach((r, n) => txt(r, CAPX, top + 43 + n * 66, { font, color: k > 0.5 ? C.paper : C.ink }));
  ctx.restore();
}

// ---------- frame ----------
window.seek = function (t) {
  ctx.reset();
  background(t);
  ctx.save();
  const dz = 1 + TUNE.camS * Math.sin(t * 0.9);       // a slow floating camera on the stage
  ctx.translate(560, 900); ctx.scale(dz, dz);
  ctx.translate(-560 + TUNE.cam * Math.cos(t * TUNE.camW), -900 + 0.75 * TUNE.cam * Math.sin(t * TUNE.camW));
  scenePhone(t); sceneWord(t); sceneChain(t); scenePhoneCall(t); sceneChinese(t);
  sceneLength(t); sceneCarry(t); sceneNumbers(t); sceneChip(t); scenePunch(t); sceneTease(t);
  ctx.restore();
  gauge(t); headline(t); captions(t);
  endCard(t);
};
window.ready = false;
Promise.all([
  document.fonts.load(F(500, 40), "字"), document.fonts.load(F(700, 40), "字"), document.fonts.load(F(900, 40), "字"),
  document.fonts.load(FI(800, 40), "a"), document.fonts.load(`900 40px "Noto Sans CJK SC"`, "龘"),
]).then(() => { window.seek(0); window.ready = true; });
</script>
