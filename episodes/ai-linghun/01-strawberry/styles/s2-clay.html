<script type="module">

import * as THREE from "three";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";

const R0 = mulberry(21);

// ---- the cutting mat ----
{ const c = Object.assign(document.createElement("canvas"), { width: 1024, height: 1024 }), x = c.getContext("2d");
  x.fillStyle = "#5F8F70"; x.fillRect(0, 0, 1024, 1024);

  x.strokeStyle = "rgba(214,238,220,.35)"; x.lineWidth = 2; x.beginPath(); x.moveTo(0, 1024); x.lineTo(1024, 0); x.stroke();
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(4, 4);
  const mat = new THREE.Mesh(new THREE.PlaneGeometry(64, 64), new THREE.MeshStandardMaterial({ map: t, roughness: 0.85 })); mat.rotation.x = -Math.PI / 2; mat.receiveShadow = true; scene.add(mat);
  const tab = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ color: "#C8A57A", roughness: 0.8 })); tab.rotation.x = -Math.PI / 2; tab.position.y = -0.02; tab.receiveShadow = true; scene.add(tab); }

// ---- fingerprints / clay surface (bump map) ----
const bump = (() => { const c = Object.assign(document.createElement("canvas"), { width: 512, height: 512 }), x = c.getContext("2d");
  x.fillStyle = "#808080"; x.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 9000; i++) { const v = 110 + Math.floor(R0() * 40); x.fillStyle = `rgb(${v},${v},${v})`; x.fillRect(R0() * 512, R0() * 512, 2, 2); }
  for (let f = 0; f < 7; f++) { const cx = R0() * 512, cy = R0() * 512, a = R0() * 3; x.save(); x.translate(cx, cy); x.rotate(a); for (let r = 4; r < 46; r += 4.5) { x.strokeStyle = `rgba(${R0() < 0.5 ? 60 : 200},${R0() < 0.5 ? 60 : 200},${R0() < 0.5 ? 60 : 200},.45)`; x.lineWidth = 1.6; x.beginPath(); x.ellipse(0, 0, r * 1.25, r, 0, 0.2, 6.0); x.stroke(); } x.restore(); }
  x.filter = "blur(1px)"; x.drawImage(c, 0, 0);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t; })();
const clay = (col, bs = 0.8) => new THREE.MeshPhysicalMaterial({ color: col, roughness: 0.72, sheen: 0.5, sheenRoughness: 0.5, sheenColor: "#ffffff", bumpMap: bs > 0 ? bump : null, bumpScale: bs });
function lumpy(geo, amp = 0.03, seed = 1) {
  const p = geo.attributes.position, n = geo.attributes.normal, v = new THREE.Vector3(), nn = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) { v.fromBufferAttribute(p, i); nn.fromBufferAttribute(n, i);
    const d = amp * (Math.sin(3.1 * v.x + 1.3 * v.y + seed) + 0.7 * Math.sin(4.3 * v.z + 2.1 * v.x + seed * 2) + 0.5 * Math.sin(6.7 * v.y - 3.3 * v.z + seed * 3)) / 2.2;
    v.addScaledVector(nn, d); p.setXYZ(i, v.x, v.y, v.z); }
  geo.computeVertexNormals(); return geo;
}

// ---- the three pieces ----
const COL = ["#5C8FD6", "#F0A33C", "#EC86AE"], CREAM = "#F8F0E2";
const U = 1.0, GAP = 0.5, D = 1.15, HG = 1.25, total = 10 * U + 2 * GAP;
let x0 = -total / 2; const pcs = [];
COPY.pieces.forEach(([s, id], k) => {
  const w = s.length * U, g = new THREE.Group(); scene.add(g);
  g.position.set(x0 + w / 2, HG / 2, [0, 0.15, -0.05][k]); g.rotation.y = [0.04, -0.07, 0.02][k];
  const m = clay(COL[k]);
  const body = new THREE.Mesh(lumpy(new RoundedBoxGeometry(w - 0.08, HG, D, 10, 0.26), 0.035, k * 3 + 1), m); body.castShadow = body.receiveShadow = true; g.add(body);
  for (let u = 0; u < s.length; u++) for (const dz of [-0.24, 0.24]) { const st = new THREE.Mesh(lumpy(new THREE.SphereGeometry(0.2, 24, 16), 0.015, u + dz * 9), m); st.scale.set(1, 0.6, 1); st.position.set((u - (s.length - 1) / 2) * U + (R0() - 0.5) * 0.04, HG / 2 + 0.03, dz); st.castShadow = true; g.add(st); }
  [...s].forEach((ch, i) => {
    const tg = new TextGeometry(ch, { font, size: 0.52, depth: 0.14, curveSegments: 10, bevelEnabled: true, bevelThickness: 0.05, bevelSize: 0.035, bevelSegments: 4 });
    tg.computeBoundingBox(); const bb = tg.boundingBox; tg.translate(-(bb.min.x + bb.max.x) / 2, -(bb.min.y + bb.max.y) / 2, 0);
    const lm = new THREE.Mesh(lumpy(tg, 0.01, i + k), clay(CREAM, 0)); lm.position.set((i - (s.length - 1) / 2) * U, 0.02, D / 2 - 0.02); lm.rotation.z = (R0() - 0.5) * 0.12; lm.castShadow = true; g.add(lm);
  });
  pcs.push({ g, w, k, id, cx: x0 + w / 2 }); x0 += w + GAP;
});
const gap1 = pcs[0].cx + pcs[0].w / 2 + GAP / 2, gap2 = pcs[1].cx + pcs[1].w / 2 + GAP / 2;
// cut faces: a slightly darker smear where the wire went through
for (const [gx, sd] of [[gap1, -1], [gap1, 1], [gap2, -1], [gap2, 1]]) { const k = sd < 0 ? (gx === gap1 ? 0 : 1) : (gx === gap1 ? 1 : 2); const sm = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 0.82), new THREE.MeshStandardMaterial({ color: new THREE.Color(COL[k]).multiplyScalar(0.85), roughness: 0.4, transparent: true, opacity: 0.0 })); sm.visible = false; scene.add(sm); }

// ---- the wire cutter through gap 1 (wire runs front-to-back; wooden toggles at both ends) ----
{ const y = 0.42, wire = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 3.6, 10), new THREE.MeshStandardMaterial({ color: "#E4E7EC", metalness: 0.6, roughness: 0.25 }));
  wire.rotation.x = Math.PI / 2; wire.position.set(gap1, y, 0); scene.add(wire);
  const wood = new THREE.MeshStandardMaterial({ color: "#A8743F", roughness: 0.6 });
  for (const z of [-1.85, 1.85]) { const h = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.95, 20), wood); h.position.set(gap1, y, z); h.castShadow = true; scene.add(h);
    const cap = new THREE.Mesh(new THREE.SphereGeometry(0.1, 16, 12), wood); cap.position.set(gap1, y + 0.47, z); scene.add(cap); }
  // a curl of clay peeled off by the wire, and crumbs
  const curl = new THREE.Mesh(lumpy(new THREE.TorusGeometry(0.16, 0.05, 12, 30, 4.2), 0.01, 7), clay(COL[1])); curl.position.set(gap1 + 0.05, 0.12, 0.85); curl.rotation.set(1.2, 0.3, 0); curl.castShadow = true; scene.add(curl);
  for (let i = 0; i < 10; i++) { const gx = i < 6 ? gap1 : gap2, k = i % 3; const c = new THREE.Mesh(lumpy(new THREE.SphereGeometry(0.05 + R0() * 0.05, 12, 8), 0.01, i), clay(COL[k])); c.position.set(gx + (R0() - 0.5) * 0.7, 0.05, 0.6 + R0() * 0.9); c.scale.y = 0.7; c.castShadow = true; scene.add(c); }
}

// ---- name plates in front: what the AI sees ----
const plates = [];
pcs.forEach(({ w, k, id, cx }) => {
  const pw = Math.max(w - 0.5, 1.9), g = new THREE.Group(); scene.add(g); g.position.set(cx, 0.36, 2.7); g.rotation.x = -0.55; g.rotation.y = [0.05, -0.04, 0.03][k];
  const slab = new THREE.Mesh(lumpy(new RoundedBoxGeometry(pw, 0.72, 0.22, 8, 0.1), 0.02, k + 11), clay(COL[k])); slab.castShadow = slab.receiveShadow = true; g.add(slab);
  const tg = new TextGeometry(id, { font, size: 0.36, depth: 0.08, curveSegments: 10, bevelEnabled: true, bevelThickness: 0.03, bevelSize: 0.02, bevelSegments: 3 });
  tg.computeBoundingBox(); const bb = tg.boundingBox; tg.translate(-(bb.min.x + bb.max.x) / 2, -(bb.min.y + bb.max.y) / 2, 0);
  const t = new THREE.Mesh(lumpy(tg, 0.006, k), clay(CREAM, 0)); t.position.z = 0.1; t.castShadow = true; g.add(t);
  const prop = new THREE.Mesh(lumpy(new THREE.SphereGeometry(0.16, 16, 12), 0.01, k), clay(COL[k])); prop.position.set(cx, 0.12, 2.38); prop.scale.set(1.6, 0.8, 1); scene.add(prop);
  plates.push(g);
});

// ---- camera: 3/4, fitted to the width ----
const cam = new THREE.PerspectiveCamera(34, W / H, 0.1, 300), tgt = new THREE.Vector3(0, -0.6, 1.0), dir = new THREE.Vector3(-0.32, 0.36, 1).normalize();
const pts = []; for (const x of [-total / 2, total / 2]) for (const y of [0, HG + 0.3]) for (const z of [-D / 2, 3.0]) pts.push(new THREE.Vector3(x, y, z));
let dist = 20; for (let it = 0; it < 5; it++) { cam.position.copy(tgt).addScaledVector(dir, dist); cam.lookAt(tgt); cam.updateMatrixWorld(true); cam.updateProjectionMatrix(); let mx = 0; for (const p of pts) mx = Math.max(mx, Math.abs(p.clone().project(cam).x)); dist *= mx / 0.9; }
cam.position.copy(tgt).addScaledVector(dir, dist); cam.lookAt(tgt); cam.updateMatrixWorld(true);
R.render(scene, cam);
const proj = (v) => { const p = v.clone().project(cam); return { x: (p.x + 1) / 2 * W, y: (1 - p.y) / 2 * H }; };

// ---- 2D layer ----
const ctx = document.getElementById("c").getContext("2d");
ctx.drawImage(glc, 0, 0);
const INK = "#2E261F", ACC = "#3C74C9";
function blob(cx, cy, w, h, fillc) { ctx.save(); ctx.shadowColor = "rgba(80,55,30,.28)"; ctx.shadowBlur = 16; ctx.shadowOffsetY = 6; ctx.fillStyle = fillc; rr(ctx, cx - w / 2, cy - h / 2, w, h, h / 2); ctx.fill(); ctx.restore(); }
{ const s = "AI 怎么读字？", f = F(900, 90), w = tw(ctx, s, f) + 90; blob(540, 300, w, 132, "rgba(248,240,226,.92)"); rich(ctx, COPY.head, 540, 302, f, INK, ACC); }
{ const p = proj(new THREE.Vector3(gap1, 0.9, -1.85)), s = COPY.tool + " · 切泥线", f = F(700, 36), w = tw(ctx, s, f) + 50; const y = p.y - 120; blob(p.x + 60, y, w, 64, "rgba(248,240,226,.94)"); txt(ctx, s, p.x + 60, y + 1, { font: f, color: INK });
  ctx.save(); ctx.strokeStyle = "rgba(46,38,31,.55)"; ctx.lineWidth = 3; ctx.setLineDash([4, 7]); ctx.beginPath(); ctx.moveTo(p.x + 30, y + 32); ctx.lineTo(p.x + 4, p.y - 6); ctx.stroke(); ctx.restore(); }
{ const p = proj(new THREE.Vector3(0, 0.95, 2.7)); const s = COPY.aiSees, f = F(900, 38), w = tw(ctx, s, f) + 54; const y = Math.min(p.y + 150, 1180); blob(540, y, w, 66, "rgba(248,240,226,.94)"); txt(ctx, s, 540, y + 1, { font: f, color: INK }); }
txt(ctx, COPY.src + " · 切泥线为示意", 540, 1256, { font: F(700, 30), color: "rgba(46,38,31,.75)" });
{ const f = F(700, 52), w = tw(ctx, COPY.cap, f) + 64; blob(525, 1347, w, 92, "rgba(248,240,226,.94)"); txt(ctx, COPY.cap, 525, 1349, { font: f, color: INK }); }
window.ready = true;
