<!doctype html>
<html><head><meta charset="utf-8"><title>样张 4 · 亚克力 / 磨砂玻璃</title>
<style>
@font-face { font-family: NS; src: url(/assets/fonts/NotoSansSC-500.woff); font-weight: 500; }
@font-face { font-family: NS; src: url(/assets/fonts/NotoSansSC-700.woff); font-weight: 700; }
@font-face { font-family: NS; src: url(/assets/fonts/NotoSansSC-900.woff); font-weight: 900; }
@font-face { font-family: IN; src: url(/assets/fonts/Inter-var.woff); font-weight: 100 900; }
html, body { margin: 0; background: #000; } canvas { display: block; }
</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script type="importmap">{ "imports": { "three": "/v4-3d/node_modules/three/build/three.module.js", "three/addons/": "/v4-3d/node_modules/three/examples/jsm/" } }</script>
<script type="module">
// Style 4 · frosted acrylic. Letters are etched on the glass surface (what we see); the token number glows inside the block
// (what the AI sees), softened by the frosted glass. The cut is a blade of light.
import * as THREE from "three";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { W, H, COPY, F, FI, fonts, rr, tw, txt, rich, mulberry } from "./common.mjs";
await fonts();

const glc = Object.assign(document.createElement("canvas"), { width: W, height: H });
const R = new THREE.WebGLRenderer({ canvas: glc, antialias: true, preserveDrawingBuffer: true });
R.setPixelRatio(1); R.setSize(W, H, false); R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFSoftShadowMap;
R.toneMapping = THREE.NeutralToneMapping; R.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
const BG = "#1A2130";
scene.background = new THREE.Color("#1A2130");
scene.fog = new THREE.Fog(BG, 22, 48);
scene.environment = new THREE.PMREMGenerator(R).fromScene(new RoomEnvironment(), 0.02).texture; scene.environmentIntensity = 1.3;
const back = new THREE.DirectionalLight("#bcd6ff", 2.2); back.position.set(2, 6, -9); scene.add(back);
const key = new THREE.DirectionalLight("#ffffff", 1.2); key.position.set(-5, 10, 6); key.castShadow = true; key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -9, right: 9, top: 9, bottom: -9, near: 1, far: 40 }); key.shadow.radius = 8; key.shadow.bias = -0.0005; scene.add(key);
scene.add(new THREE.HemisphereLight("#9fb4d8", "#1a2130", 0.5));
const floor = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), new THREE.MeshPhysicalMaterial({ color: "#2A3346", roughness: 0.38, clearcoat: 0.8, clearcoatRoughness: 0.18 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

function tex(s, wpx, hpx, font, col) {
  const c = Object.assign(document.createElement("canvas"), { width: wpx, height: hpx }), x = c.getContext("2d");
  x.font = font; x.fillStyle = col; x.textAlign = "center"; x.textBaseline = "middle";
  x.lineJoin = "round"; x.lineWidth = hpx * 0.06; x.strokeStyle = "rgba(20,28,48,.55)"; x.strokeText(s, wpx / 2, hpx / 2 + hpx * 0.04);
  x.fillText(s, wpx / 2, hpx / 2 + hpx * 0.04);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
const TINT = ["#7FB6FF", "#FFC874", "#FF9CC6"], GLOW = ["#2F7BFF", "#FF9418", "#FF3E8E"];
const U = 1.0, GAP = 0.5, D = 1.05, HGT = 1.05;
const total = 10 * U + 2 * GAP; let x0 = -total / 2;
const pieces = [];
COPY.pieces.forEach(([s, id], k) => {
  const w = s.length * U, g = new THREE.Group(); scene.add(g);
  g.position.set(x0 + w / 2, HGT / 2 + 0.02 + [0, 0.42, 0.08][k], 0); g.rotation.set([0, 0.05, 0][k], [0.0, -0.06, 0.03][k], [0, -0.05, 0][k]);
  const mat = new THREE.MeshPhysicalMaterial({ color: TINT[k], transmission: 1, roughness: 0.3, thickness: 1.2, ior: 1.49, attenuationColor: TINT[k], attenuationDistance: 4.0, emissive: TINT[k], emissiveIntensity: 0.55, sheen: 0.4, sheenColor: "#ffffff", clearcoat: 1, clearcoatRoughness: 0.04, specularIntensity: 1 });
  const body = new THREE.Mesh(new RoundedBoxGeometry(w - 0.06, HGT, D, 6, 0.16), mat); body.castShadow = true; g.add(body);
  const sg = new THREE.CylinderGeometry(0.19, 0.19, 0.16, 40);
  for (let u = 0; u < s.length; u++) for (const dz of [-0.25, 0.25]) { const st = new THREE.Mesh(sg, mat); st.position.set((u - (s.length - 1) / 2) * U, HGT / 2 + 0.07, dz); st.castShadow = true; g.add(st); }
  // etched letters on the front face (upper half)
  [...s].forEach((ch, i) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.5), new THREE.MeshBasicMaterial({ map: tex(ch, 256, 256, FI(800, 230), "#ffffff"), transparent: true, opacity: 0.92, depthWrite: false, toneMapped: false })); m.renderOrder = 8; m.position.set((i - (s.length - 1) / 2) * U, 0.27, D / 2 + 0.003); g.add(m); });
  // the number glows inside (lower half): a soft halo + a sharper core, drawn through the glass
  for (const [blur, op, sc] of [[18, 0.9, 1.25], [2, 1.0, 1.0]]) {
    const c = Object.assign(document.createElement("canvas"), { width: 140 * id.length, height: 240 }), x = c.getContext("2d");
    x.filter = `blur(${blur}px)`; x.font = FI(800, 150); x.fillStyle = blur > 5 ? GLOW[k] : "#ffffff"; x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(id, c.width / 2, 128);
    if (blur <= 5) { x.filter = "blur(6px)"; x.globalCompositeOperation = "destination-over"; x.fillStyle = GLOW[k]; x.fillText(id, c.width / 2, 128); }
    const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
    const pw = Math.min(w - 0.3, 0.46 * id.length);
    const nm = new THREE.Mesh(new THREE.PlaneGeometry(pw * sc, pw * sc * 240 / c.width), new THREE.MeshBasicMaterial({ map: t, transparent: true, opacity: op, blending: THREE.AdditiveBlending, depthTest: false, depthWrite: false, toneMapped: false }));
    nm.position.set(0, -0.3, 0.2); nm.renderOrder = 5; g.add(nm);
  }
  const pl = new THREE.PointLight(GLOW[k], 6, 4.5, 1.4); pl.position.set(0, -0.1, 0); g.add(pl);
  pieces.push({ g, w, x: x0 + w / 2, k }); x0 += w + GAP;
});
// the light blade in gap 1 (just cut) and a faint trace in gap 2
const g1 = pieces[0].x + pieces[0].w / 2 + GAP / 2, g2 = pieces[1].x + pieces[1].w / 2 + GAP / 2;
function glowTex() { const c = Object.assign(document.createElement("canvas"), { width: 128, height: 8 }), x = c.getContext("2d"), gr = x.createLinearGradient(0, 0, 128, 0); gr.addColorStop(0, "rgba(160,220,255,0)"); gr.addColorStop(0.5, "rgba(220,245,255,1)"); gr.addColorStop(1, "rgba(160,220,255,0)"); x.fillStyle = gr; x.fillRect(0, 0, 128, 8); return new THREE.CanvasTexture(c); }
const add = { transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false, side: THREE.DoubleSide };
for (const [gx, a, ht] of [[g1, 1, 3.2], [g2, 0.28, 2.0]]) {
  const core = new THREE.Mesh(new THREE.PlaneGeometry(0.035, ht), new THREE.MeshBasicMaterial({ color: "#ffffff", opacity: a, ...add })); core.position.set(gx, ht / 2, 0.0); core.rotation.y = Math.PI / 2 * 0; scene.add(core);
  const halo = new THREE.Mesh(new THREE.PlaneGeometry(0.7, ht), new THREE.MeshBasicMaterial({ map: glowTex(), opacity: 0.55 * a, ...add })); halo.position.set(gx, ht / 2, 0.01); scene.add(halo);
  const side = new THREE.Mesh(new THREE.PlaneGeometry(1.6, ht), new THREE.MeshBasicMaterial({ map: glowTex(), opacity: 0.22 * a, ...add })); side.position.set(gx, ht / 2, 0); side.rotation.y = Math.PI / 2; side.scale.x = 1; scene.add(side);
  const slit = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 2.4), new THREE.MeshBasicMaterial({ map: glowTex(), opacity: 0.8 * a, ...add })); slit.rotation.x = -Math.PI / 2; slit.position.set(gx, 0.005, 0); scene.add(slit);
}
// a few glass chips from the cut
const R0 = mulberry(5), chipM = new THREE.MeshPhysicalMaterial({ color: "#CFE6FF", transmission: 1, roughness: 0.08, thickness: 0.2, ior: 1.49, emissive: "#9fd4ff", emissiveIntensity: 0.4 });
for (let i = 0; i < 7; i++) { const m = new THREE.Mesh(new THREE.TetrahedronGeometry(0.06 + R0() * 0.06), chipM); m.position.set(g1 + (R0() - 0.5) * 0.9, 0.4 + R0() * 1.4, 0.3 + R0() * 0.6); m.rotation.set(R0() * 6, R0() * 6, 0); m.castShadow = true; scene.add(m); }

// camera: 3/4, fitted so the row fills the width
const cam = new THREE.PerspectiveCamera(32, W / H, 0.1, 200), tgt = new THREE.Vector3(0.1, -0.2, 0), dir = new THREE.Vector3(0.32, 0.36, 1).normalize();
let dist = 20; const pts = []; for (const x of [-total / 2, total / 2]) for (const y of [0, HGT + 0.6]) for (const z of [-D / 2, D / 2]) pts.push(new THREE.Vector3(x, y, z));
for (let it = 0; it < 5; it++) { cam.position.copy(tgt).addScaledVector(dir, dist); cam.lookAt(tgt); cam.updateMatrixWorld(true); cam.updateProjectionMatrix(); let mx = 0; for (const p of pts) mx = Math.max(mx, Math.abs(p.clone().project(cam).x)); dist *= mx / 0.9; }
cam.position.copy(tgt).addScaledVector(dir, dist); cam.lookAt(tgt); cam.updateMatrixWorld(true);
R.render(scene, cam);
const proj = (v) => { const p = v.clone().project(cam); return { x: (p.x + 1) / 2 * W, y: (1 - p.y) / 2 * H }; };

// ---- 2D layer ----
const ctx = document.getElementById("c").getContext("2d");
ctx.drawImage(glc, 0, 0);
{ ctx.save(); ctx.globalCompositeOperation = "screen"; const gr = ctx.createRadialGradient(540, 860, 40, 540, 860, 760); gr.addColorStop(0, "rgba(90,120,180,.35)"); gr.addColorStop(1, "rgba(0,0,0,0)"); ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H); ctx.restore(); }
const INK = "#F2F5FA", ACC = "#6FB1FF";
function glassPill(x, y, w, h, r) {   // frosted panel: blur what is behind it
  ctx.save(); rr(ctx, x, y, w, h, r); ctx.clip(); ctx.filter = "blur(16px)"; ctx.drawImage(glc, 0, 0); ctx.filter = "none";
  ctx.fillStyle = "rgba(255,255,255,.10)"; ctx.fillRect(x, y, w, h); ctx.restore();
  ctx.save(); rr(ctx, x, y, w, h, r); ctx.lineWidth = 2; ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.stroke(); ctx.restore();
  ctx.save(); ctx.globalCompositeOperation = "multiply";  ctx.restore();
}
rich(ctx, COPY.head, 540, 300, F(900, 88), INK, ACC);
// tool label at the top of the blade
{ const p = proj(new THREE.Vector3(g1, 3.25, 0)), s = COPY.tool, w = tw(ctx, s, F(700, 36)) + 48; glassPill(p.x - w / 2, p.y - 70, w, 62, 31); txt(ctx, s, p.x, p.y - 38, { font: F(700, 36), color: INK }); }
// leader lines to the glowing numbers
const lab = { x: 540, y: 1130 };
pieces.forEach(({ g, k }) => { const p = proj(new THREE.Vector3(0, -0.3, 0.2).applyMatrix4(g.matrixWorld)); ctx.save(); ctx.strokeStyle = GLOW[k]; ctx.globalAlpha = 0.7; ctx.lineWidth = 3; ctx.setLineDash([2, 8]); ctx.lineCap = "round"; ctx.beginPath(); ctx.moveTo(p.x, p.y + 30); ctx.lineTo(lab.x + (p.x - 540) * 0.45, lab.y - 34); ctx.stroke(); ctx.restore(); ctx.fillStyle = GLOW[k]; ctx.beginPath(); ctx.arc(p.x, p.y + 30, 6, 0, 7); ctx.fill(); });
{ const s = COPY.aiSees + "：积木里面亮着的编号", w = tw(ctx, s, F(700, 36)) + 56; glassPill(540 - w / 2, lab.y - 34, w, 68, 34); txt(ctx, s, 540, lab.y + 1, { font: F(700, 36), color: INK }); }
txt(ctx, "我们看到的：表面刻的字母", 540, 1212, { font: F(700, 32), color: "rgba(242,245,250,.75)" });
txt(ctx, COPY.src + " · 光刃为示意", 540, 1262, { font: F(500, 30), color: "rgba(242,245,250,.55)" });
{ const s = COPY.cap, w = tw(ctx, s, F(700, 52)) + 64; glassPill(525 - w / 2, 1300, w, 92, 30); txt(ctx, s, 525, 1347, { font: F(700, 52), color: INK }); }
window.ready = true;
</script></body></html>
