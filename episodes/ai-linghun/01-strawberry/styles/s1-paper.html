<!doctype html>
<html><head><meta charset="utf-8"><title>样张 1 · 剪纸</title>
<style>
@font-face { font-family: NS; src: url(/assets/fonts/NotoSansSC-500.woff); font-weight: 500; }
@font-face { font-family: NS; src: url(/assets/fonts/NotoSansSC-700.woff); font-weight: 700; }
@font-face { font-family: NS; src: url(/assets/fonts/NotoSansSC-900.woff); font-weight: 900; }
@font-face { font-family: IN; src: url(/assets/fonts/Inter-var.woff); font-weight: 100 900; }
html, body { margin: 0; background: #000; } canvas { display: block; }
</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
// Style 1 · paper cut. Layered card with grain, cut / torn edges and soft shadows between layers.
// The word is a printed paper strip mounted on coloured card "bricks" (punched dots = studs); scissors did the cut;
// the AI's view = the back of each card, rubber-stamped with the number.
import { W, H, COPY, F, FI, fonts, tw, mulberry } from "./common.mjs";
await fonts();
const ctx = document.getElementById("c").getContext("2d");
const R = mulberry(11);
const INK = "#2A2420", BLUE = "#2F5DA8";

// ---- grain texture (reused as a multiply pattern on every sheet) ----
const grain = Object.assign(document.createElement("canvas"), { width: 256, height: 256 });
{ const g = grain.getContext("2d"), d = g.createImageData(256, 256); for (let i = 0; i < d.data.length; i += 4) { const v = 235 + Math.floor(R() * 20); d.data[i] = v; d.data[i + 1] = v - 2; d.data[i + 2] = v - 6; d.data[i + 3] = 255; } g.putImageData(d, 0, 0);
  g.strokeStyle = "rgba(120,90,50,.10)"; g.lineWidth = 1; for (let i = 0; i < 90; i++) { const x = R() * 256, y = R() * 256; g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + R() * 20 - 10, y + R() * 20 - 10, x + R() * 30 - 15, y + R() * 30 - 15); g.stroke(); } }
const GP = ctx.createPattern(grain, "repeat");
function withGrain(path, k = 1) { ctx.save(); ctx.clip(path); ctx.globalCompositeOperation = "multiply"; ctx.globalAlpha = k; ctx.fillStyle = GP; ctx.fillRect(0, 0, W, H); ctx.restore(); }
// a sheet of paper: shadow (lifted by `lift` px), fill, grain, a faint light rim on the cut edge
function sheet(path, fill, lift = 8, o = {}) {
  ctx.save(); ctx.shadowColor = `rgba(70,45,20,${o.sa ?? 0.32})`; ctx.shadowBlur = lift * 2.4; ctx.shadowOffsetX = lift * 0.35; ctx.shadowOffsetY = lift * 0.9;
  ctx.fillStyle = fill; ctx.fill(path); ctx.restore();
  withGrain(path, o.grain ?? 0.9);
  ctx.save(); ctx.clip(path); ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.lineWidth = 3; ctx.stroke(path); ctx.restore();
}
// path helpers: rectangles with slightly wobbly (scissor-cut) or torn edges
function edge(p, x0, y0, x1, y1, amp, step) { const n = Math.max(2, Math.round(Math.hypot(x1 - x0, y1 - y0) / step)); for (let i = 1; i <= n; i++) { const t = i / n, j = i === n ? 0 : (R() - 0.5) * amp; p.lineTo(x0 + (x1 - x0) * t + (y1 - y0 === 0 ? 0 : j), y0 + (y1 - y0) * t + (x1 - x0 === 0 ? 0 : j)); } }
function card(x, y, w, h, o = {}) { const p = new Path2D(), a = o.amp ?? 1.6, s = o.step ?? 18; p.moveTo(x, y); edge(p, x, y, x + w, y, a, s); edge(p, x + w, y, x + w, y + h, o.cutR ?? a, s / 2); edge(p, x + w, y + h, x, y + h, a, s); edge(p, x, y + h, x, y, o.cutL ?? a, s / 2); p.closePath(); return p; }
function rot(cx, cy, a, fn) { ctx.save(); ctx.translate(cx, cy); ctx.rotate(a); ctx.translate(-cx, -cy); fn(); ctx.restore(); }
function tape(x, y, w, a) { rot(x, y, a, () => { const p = card(x - w / 2, y - 18, w, 36, { amp: 0, cutL: 7, cutR: 7, step: 6 }); ctx.fillStyle = "rgba(236,224,190,.72)"; ctx.fill(p); ctx.strokeStyle = "rgba(160,140,100,.25)"; ctx.lineWidth = 1; ctx.stroke(p); }); }

// ---- background: paper, two layers of torn paper hills at the bottom, a cloud ----
ctx.fillStyle = "#EDE2CC"; ctx.fillRect(0, 0, W, H); withGrain(new Path2D(`M0 0H${W}V${H}H0Z`), 1);
{ const v = ctx.createRadialGradient(540, 900, 300, 540, 900, 1250); v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(90,60,30,.22)"); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H); }
function hill(y0, amp, col, lift) { const p = new Path2D(); p.moveTo(-20, H + 20); p.lineTo(-20, y0); for (let x = -20; x <= W + 20; x += 12) p.lineTo(x, y0 - amp * Math.sin(x / 210 + y0) - (R() - 0.5) * 6); p.lineTo(W + 20, H + 20); p.closePath(); sheet(p, col, lift, { sa: 0.25 }); }
hill(1500, 40, "#9CC3B4", 10); hill(1600, 30, "#6FA394", 12); hill(1720, 24, "#4E8576", 14);
{ const p = new Path2D(); for (const [cx, cy, r] of [[860, 560, 46], [910, 540, 60], [970, 566, 42]]) p.arc(cx, cy, r, 0, 7); sheet(p, "#F8F3E8", 6, { sa: 0.2 }); }

// ---- headline on a taped paper strip ----
rot(540, 300, -0.025, () => {
  const s1 = "AI 怎么", s2 = "读", s3 = "字？", f = F(900, 86), w = tw(ctx, s1 + s2 + s3, f) + 90;
  sheet(card(540 - w / 2, 236, w, 128, { amp: 1.2 }), "#FBF7EE", 7);
  ctx.save(); ctx.font = f; ctx.textBaseline = "middle"; let x = 540 - tw(ctx, s1 + s2 + s3, f) / 2;
  for (const [s, c] of [[s1, INK], [s2, BLUE], [s3, INK]]) { ctx.fillStyle = c; ctx.fillText(s, x, 304); x += ctx.measureText(s).width; } ctx.restore();
  tape(540 - w / 2 + 10, 246, 110, -0.6); tape(540 + w / 2 - 10, 352, 110, -0.6);
});

// ---- the three pieces: printed strip on a coloured card, punched-dot studs ----
const U = 84, GAP = 44, X0 = (W - (10 * U + 2 * GAP)) / 2, PY = 820, SH = 104;
const CARD = ["#5B86C9", "#E5AE45", "#E68AAE"], CARD_D = ["#41689F", "#B9852A", "#B9607F"];
let x = X0; const pcs = [];
COPY.pieces.forEach(([s, id], k) => { const w = s.length * U; pcs.push({ s, id, x, w, k, a: [-0.035, 0.05, -0.02][k], dy: [6, -22, 0][k] }); x += w + GAP; });
for (const { s, x, w, k, a, dy } of pcs) {
  const cx = x + w / 2, cy = PY + dy;
  rot(cx, cy, a, () => {
    for (let u = 0; u < s.length; u++) { const p = new Path2D(); p.ellipse(x + u * U + U / 2, cy - SH / 2 - 10, 24, 15, 0, 0, 7); sheet(p, CARD_D[k], 4, { sa: 0.25 }); const q = new Path2D(); q.ellipse(x + u * U + U / 2, cy - SH / 2 - 15, 24, 14, 0, 0, 7); sheet(q, CARD[k], 3, { sa: 0.15 }); }
    sheet(card(x - 12, cy - SH / 2 - 4, w + 24, SH + 22, { amp: 1.4, cutL: k > 0 ? 4 : 1.4, cutR: k < 2 ? 4 : 1.4 }), CARD[k], 12);
    sheet(card(x, cy - SH / 2 + 8, w, SH - 20, { amp: 0.8, cutL: k > 0 ? 5 : 0.8, cutR: k < 2 ? 5 : 0.8, step: 10 }), "#FCFAF4", 4, { sa: 0.22 });
    ctx.save(); ctx.font = FI(800, 66); ctx.fillStyle = INK; ctx.textAlign = "center"; ctx.textBaseline = "middle"; [...s].forEach((ch, i) => ctx.fillText(ch, x + i * U + U / 2, cy - 4)); ctx.restore();
  });
}
// paper snippets from the cuts
const gap1 = pcs[0].x + pcs[0].w + GAP / 2, gap2 = pcs[1].x + pcs[1].w + GAP / 2;
for (const [gx, n] of [[gap1, 5], [gap2, 4]]) for (let i = 0; i < n; i++) { const sx = gx + (R() - 0.5) * 60, sy = PY + 80 + R() * 70; rot(sx, sy, R() * 3, () => sheet(card(sx - 5, sy - 13, 10, 26, { amp: 1, step: 6 }), R() < 0.5 ? "#FCFAF4" : CARD[R() < 0.5 ? 0 : 1], 3, { sa: 0.2 })); }

// ---- scissors, blades down into gap 1 ----
{
  const tipX = gap1 + 2, tipY = PY + 40, ang = -0.35;
  rot(tipX, tipY, ang, () => {
    // two blades, slightly open
    for (const [d, col] of [[-1, "#B7BEC8"], [1, "#D5DAE1"]]) { const p = new Path2D(); p.moveTo(tipX + d * 3, tipY); p.lineTo(tipX + d * 34, tipY - 230); p.lineTo(tipX + d * 4, tipY - 236); p.closePath(); sheet(p, col, 7, { sa: 0.28 }); }
    // handles (loops) — even-odd rings
    for (const [cx, cy, col] of [[tipX - 70, tipY - 330, "#3E8E8A"], [tipX + 62, tipY - 322, "#2F6F6C"]]) { const p = new Path2D(); p.ellipse(cx, cy, 64, 46, 0.5, 0, 7); p.ellipse(cx, cy, 38, 24, 0.5, 0, 7); ctx.save(); ctx.shadowColor = "rgba(70,45,20,.32)"; ctx.shadowBlur = 18; ctx.shadowOffsetY = 7; ctx.fillStyle = col; ctx.fill(p, "evenodd"); ctx.restore(); ctx.save(); ctx.clip(p, "evenodd"); ctx.globalCompositeOperation = "multiply"; ctx.fillStyle = GP; ctx.fillRect(0, 0, W, H); ctx.restore(); }
    for (const [x0, x1, col] of [[tipX - 20, tipX - 52, "#3E8E8A"], [tipX + 20, tipX + 44, "#2F6F6C"]]) { const p = card(Math.min(x0, x1) - 4, tipY - 300, 30, 74, { amp: 0.6 }); sheet(p, col, 5, { sa: 0.2 }); }
    const pv = new Path2D(); pv.arc(tipX, tipY - 236, 12, 0, 7); sheet(pv, "#C9A24A", 3);
  });
}
{ ctx.save(); ctx.strokeStyle = "rgba(90,70,50,.75)"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(318, 520); ctx.quadraticCurveTo(400, 560, gap1 + 250 - 150, PY - 300); ctx.stroke(); ctx.restore(); }
{ // the tag itself (kept level so it reads)
  const tx = gap1 + 250, ty = PY - 300, s = COPY.tool, f = F(900, 36), w = tw(ctx, s, f) + 70;
  rot(tx, ty, 0.04, () => { const p = new Path2D(); p.moveTo(tx - w / 2 + 26, ty - 34); p.lineTo(tx + w / 2, ty - 34); p.lineTo(tx + w / 2, ty + 34); p.lineTo(tx - w / 2 + 26, ty + 34); p.lineTo(tx - w / 2, ty); p.closePath(); sheet(p, "#D2AE74", 6);
    const h = new Path2D(); h.arc(tx - w / 2 + 24, ty, 7, 0, 7); ctx.fillStyle = "#EDE2CC"; ctx.fill(h);
    ctx.save(); ctx.font = f; ctx.fillStyle = INK; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(s, tx + 12, ty + 2); ctx.restore(); });
}

// ---- what the AI sees: the backs of the cards, rubber-stamped ----
function stamp(s, cx, cy, col, a) {
  const S = Object.assign(document.createElement("canvas"), { width: 360, height: 130 }), c = S.getContext("2d");
  c.font = FI(800, 60); const w = Math.min(330, c.measureText(s).width + 50);
  c.strokeStyle = col; c.lineWidth = 6; c.beginPath(); c.roundRect(180 - w / 2, 18, w, 94, 16); c.stroke(); c.lineWidth = 2; c.beginPath(); c.roundRect(180 - w / 2 + 9, 27, w - 18, 76, 10); c.stroke();
  c.fillStyle = col; c.textAlign = "center"; c.textBaseline = "middle"; c.fillText(s, 180, 68);
  c.globalCompositeOperation = "destination-out"; for (let i = 0; i < 900; i++) { c.fillStyle = `rgba(0,0,0,${0.3 + R() * 0.7})`; c.fillRect(R() * 360, R() * 130, 1 + R() * 3, 1 + R() * 2); }
  rot(cx, cy, a, () => { ctx.save(); ctx.globalAlpha = 0.88; ctx.globalCompositeOperation = "multiply"; ctx.drawImage(S, cx - 180, cy - 65); ctx.restore(); });
}
{ const s = COPY.aiSees, f = F(900, 38), w = tw(ctx, s, f) + 60; sheet(card(540 - w / 2, 966, w, 64, { amp: 1 }), "#FBF7EE", 5); ctx.save(); ctx.font = f; ctx.fillStyle = INK; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(s, 540, 1000); ctx.restore(); }
for (const { x, w, k, id } of pcs) {
  const cx = x + w / 2, cy = 1112, bw = Math.max(w - 20, 200), a = [0.03, -0.04, 0.02][k];
  rot(cx, cy, a, () => { sheet(card(cx - bw / 2, cy - 54, bw, 108, { amp: 1.4 }), "#F4EEE0", 9); ctx.save(); ctx.fillStyle = CARD[k]; ctx.globalAlpha = 0.9; ctx.fillRect(cx - bw / 2 + 2, cy - 52, bw - 4, 10); ctx.restore(); });
  stamp(id, cx, cy + 4, BLUE, a - 0.05);
  // a little paper arrow from the piece down to its back
  const ay = 905; rot(cx, ay + 18, 0, () => { const p = new Path2D(); p.moveTo(cx - 9, ay); p.lineTo(cx + 9, ay); p.lineTo(cx + 9, ay + 22); p.lineTo(cx + 20, ay + 22); p.lineTo(cx, ay + 42); p.lineTo(cx - 20, ay + 22); p.lineTo(cx - 9, ay + 22); p.closePath(); sheet(p, CARD_D[k], 3, { sa: 0.2 }); });
}
ctx.save(); ctx.font = F(700, 32); ctx.fillStyle = "rgba(42,36,32,.75)"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(COPY.src + " · 剪刀为示意", 540, 1222); ctx.restore();

// ---- caption on a taped strip ----
rot(525, 1347, 0.012, () => { const f = F(700, 52), w = tw(ctx, COPY.cap, f) + 70; sheet(card(525 - w / 2, 1300, w, 94, { amp: 1.2 }), "#FFFDF7", 7); ctx.save(); ctx.font = f; ctx.fillStyle = INK; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(COPY.cap, 525, 1349); ctx.restore(); tape(525 + w / 2 - 8, 1306, 90, 0.5); });
window.ready = true;
</script></body></html>
